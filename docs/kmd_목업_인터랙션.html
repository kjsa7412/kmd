<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kmd 목업 인터랙션</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f7;--surface-3:#e6eaf0;--border:#e2e6ed;--border-strong:#c9d1dd;
  --text:#11151c;--text-2:#515a68;--text-3:#858e9d;--accent:#3358e6;--accent-bg:#e9eeff;--accent-line:#c3d0fb;
  --danger:#cb3a2c;--danger-bg:#fdeceb;--warn:#8c5c00;--warn-bg:#fcf3e0;--pending:#6247c4;--pending-bg:#efedfd;
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);
  --shadow-2:0 2px 6px -1px rgba(15,23,42,.08),0 14px 32px -8px rgba(15,23,42,.18);
  --font:Pretendard,-apple-system,"Segoe UI",system-ui,"Malgun Gothic",sans-serif;
  --mono:Consolas,"Cascadia Mono",D2Coding,"Malgun Gothic",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe3ea;color:var(--text);font:13px/1.55 var(--font)}
button,input,textarea,select{font:inherit}
a{color:var(--accent);cursor:pointer}

/* ── 목업 조종판(앱 밖) ── */
.ctl{position:sticky;top:0;z-index:50;background:#1b2130;color:#cfd6e4;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:7px 16px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ctl .ttl{color:#fff;font-size:12.5px;white-space:nowrap}
.ctl .ttl small{color:#8fa6ff;font-weight:400;margin-left:4px}
.ctl .grp{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.ctl .lb{color:#8f9bb3;margin-right:2px;white-space:nowrap}
.ctl button{background:#2a3246;border:1px solid #3a4560;color:#cfd6e4;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
.ctl button:hover{background:#343e57}
.ctl button.on{background:#3358e6;border-color:#3358e6;color:#fff}
.ctl label{display:inline-flex;align-items:center;gap:4px;background:#2a3246;border:1px solid #3a4560;border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.ctl label.on{background:#5a4210;border-color:#a07a24;color:#ffe2a6}
.ctl input{margin:0;accent-color:#f0c060}
.ctl .rs{background:transparent;border-color:#5a6680}
.stage{padding:16px}

/* 아이콘 기본 크기(구체적인 규칙이 이긴다) */
:where(.app) svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
.search span{white-space:nowrap}
/* ── 앱 프레임 ── */
.app{max-width:1240px;margin:0 auto;background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.18);display:flex;min-height:calc(100vh - 90px);position:relative}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.body{flex:1;display:flex;min-height:0;min-width:0}
.main{flex:1;padding:18px 22px;overflow:auto;min-width:0}
.aside{width:300px;flex:none;border-left:1px solid var(--border);background:var(--surface);padding:14px;overflow:auto}
.aside h4{margin:2px 0 10px;font-size:13px}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px}
.side.dim .nav{opacity:.45;pointer-events:none}
.sb-top{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.logo.me{background:#11151c}
.brand{font-weight:700;font-size:15px}
.where{font-size:11px;color:var(--text-3);margin:-6px 6px 10px}
.sb-repo{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;position:relative;background:var(--surface)}
.sb-repo:hover{background:var(--surface-2)}
.sb-repo .rk{font:700 10.5px var(--mono);background:var(--accent-bg);color:var(--accent);border-radius:5px;padding:2px 5px;white-space:nowrap}
.sb-repo .rn{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-repo .rn small{display:block;font:400 10.5px var(--font);color:var(--text-3)}
.sb-repo .rc{color:var(--text-3)}
.kmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-2);padding:6px;z-index:9}
.kmenu .mi{padding:6px 8px;border-radius:6px;display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}
.kmenu .mi:hover{background:var(--surface-2)}
.sb-g{font-size:11.5px;color:var(--text-3);margin:12px 8px 4px}
.sb-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
.sb-i:hover{background:var(--surface-2)}
.sb-i.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sb-i svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--text-2)}
.sb-i.on svg{color:var(--accent)}
.sb-i .bd{margin-left:auto;background:var(--pending-bg);color:var(--pending);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.sb-i.deco{cursor:default;color:var(--text-2)}
.sb-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:8px}
.sb-me{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px}
.sb-me .av{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.sb-me small{color:var(--text-3)}
.hdr{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.crumb{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--text);font-weight:600}
.search{margin-left:auto;flex:0 1 220px;min-width:110px;height:30px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;padding:0 10px;color:var(--text-3);font-size:12px;cursor:text;background:var(--surface)}
.search:hover{border-color:var(--border-strong)}
.band{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:12px;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text-2);flex-wrap:wrap;row-gap:4px}
.band .who{font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap}
.band .who i{width:8px;height:8px;border-radius:50%;background:#11151c;display:inline-block}
.band.team .who i{background:var(--accent)}
.band .out{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.status{height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:11.5px;color:var(--text-2);background:var(--surface);border-top:1px solid var(--border)}
.status .r{margin-left:auto}

/* ── 부품 ── */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;vertical-align:1px}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-pend{background:var(--pending-bg);color:var(--pending)}
.c-mute{background:var(--surface-3);color:var(--text-2)}
.c-acc{background:var(--accent-bg);color:var(--accent)}
.c-danger{background:var(--danger-bg);color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:#2a4bd0}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:14px}
.card .ch{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;flex-wrap:wrap}
.card .ch small{font-weight:400;color:var(--text-3)}
.card .ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card .cb{padding:12px 14px}
.card .cf{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);flex-wrap:wrap}
.row{display:flex;align-items:center;gap:8px}
.r{margin-left:auto}
.muted{color:var(--text-3)}
.small{font-size:11.5px}
.mono{font-family:var(--mono)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px}
.kv>span:nth-child(odd){color:var(--text-3)}
.kv small{display:block;color:var(--text-3);font-size:11.5px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:middle}
table.t th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:12px}
table.t td small{display:block;color:var(--text-3);font-size:11.5px;font-weight:400}
code{font:12px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--text)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-2px 0 12px}
.tabs span{padding:7px 12px;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent}
.tabs span.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .ord{margin-left:auto;font-size:12px;color:var(--text-3);border-bottom:0}
.field{margin-bottom:12px}
.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:3px}
.inp{width:100%;min-height:32px;border:1px solid var(--border-strong);border-radius:7px;padding:5px 10px;font-size:12.5px;background:#fff;color:var(--text)}
.inp:focus{outline:2px solid var(--accent-line);border-color:var(--accent)}
.inp.af{background:#e8f0fe;border-color:#b9cdf6;font-family:var(--mono)}
.inp.mono{font-family:var(--mono)}
.callout{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:8px;padding:9px 12px;font-size:12.5px;color:#22389c;margin:8px 0}
.callout.warn{background:var(--warn-bg);border-color:#ecd39c;color:var(--warn)}
.callout.danger{background:var(--danger-bg);border-color:#efb7b1;color:var(--danger)}
.callout.pend{background:var(--pending-bg);border-color:#d9d2fb;color:var(--pending)}
.callout.gray{background:var(--surface-2);border-color:var(--border);color:var(--text-2)}
.stop{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.stop i{width:8px;height:8px;border-radius:50%;background:#d39a2c;flex:none}
.stop.gray i{background:var(--text-3)}
.stop .r{font-size:11.5px;opacity:.85;white-space:nowrap}
.paper{border:1px solid var(--border);border-radius:10px;padding:16px 20px;background:#fff}
.paper h1{font-size:20px;margin:0 0 6px}
.paper h2{font-size:16px;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.paper p{margin:6px 0;color:#262c36}
.path{font:11.5px var(--mono);color:var(--text-3);background:var(--surface-2);padding:5px 10px;border-radius:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.path .r{font-family:var(--font)}
.big{font-size:20px;font-weight:700;margin:2px 0 4px}
.lead{color:var(--text-2);margin:0 0 14px}
.kt{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;white-space:nowrap}
.kt.me{background:#11151c;color:#fff}
.kt.team{background:var(--accent-bg);color:var(--accent)}
.kt.role{background:var(--surface);color:var(--text-2);border:1px solid var(--border-strong);font-weight:500}
.kt.src{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-2);font-weight:500}
.kn{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px;white-space:nowrap}
.kn.none{color:var(--text-3);border-style:dashed}
.plain{list-style:none;margin:0;padding:0}
.plain li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--border);font-size:12.5px}
.plain li:first-child{border-top:0}
.kebab{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-2);font-size:16px;line-height:1;cursor:pointer;display:inline-grid;place-items:center;flex:none;position:relative}
.kebab:hover,.kebab.on{background:var(--surface-2);border-color:var(--border)}
.menu{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-2);padding:6px;min-width:220px;font-size:12.5px;text-align:left;color:var(--text);font-weight:400;line-height:1.5}
.menu .mi{padding:7px 10px;border-radius:6px;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi small{margin-left:auto;color:var(--text-3);font-size:11px}
.menu .mi.on{color:var(--accent);font-weight:600}
.menu .sep{border-top:1px solid var(--border);margin:4px 2px}
.menu .gray{font-size:11.5px;color:var(--text-3);padding:6px 10px 4px;white-space:normal;max-width:280px}
.menu input[type=time]{border:1px solid var(--border-strong);border-radius:5px;padding:0 4px;font:12px var(--mono)}
details.more{border-top:1px dashed var(--border-strong);margin-top:12px;padding-top:8px}
details.more>summary{cursor:pointer;color:var(--text-3);font-size:12px;list-style:none}
details.more>summary::before{content:"▸ "}
details.more[open]>summary::before{content:"▾ "}
details.more>summary::-webkit-details-marker{display:none}
details.more>.in{padding:8px 0 2px;font-size:12.5px;color:var(--text-2)}
.sw{display:inline-block;width:34px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;flex:none;vertical-align:middle;cursor:pointer;border:0;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-1);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:16px}
.drop{border:2px dashed var(--border-strong);border-radius:12px;padding:18px 16px;text-align:center;color:var(--text-2);background:var(--surface);font-size:12px;transition:background .1s}
.drop.over{background:var(--accent-bg);border-color:var(--accent)}
.drop b{display:block;font-size:13.5px;color:var(--text);margin-bottom:4px}
.drop .lks{margin-top:6px;font-size:12px}
.drop .lks label{color:var(--accent);font-weight:600;cursor:pointer}
.drop input{display:none}
.lk{color:var(--accent);cursor:pointer;font-weight:600}
.lk.q{color:var(--text-3);font-weight:500}
.gl{font-size:11.5px;color:var(--text-3);margin:8px 2px 0;line-height:1.7}
.hint{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.7}

/* 토스트 · 대화 상자 */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#11151c;color:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-2);z-index:60;max-width:calc(100vw - 32px)}
.toast a{color:#9fb4ff;font-weight:600}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.32);display:grid;place-items:center;z-index:30}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-2);width:min(520px,92%);overflow:hidden}
.win .tb{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2)}
.win .tb .logo{width:18px;height:18px;font-size:10px;border-radius:4px}
.win .tb b{color:var(--text)}
.win .tb .x{margin-left:auto;border:0;background:none;font-size:16px;color:var(--text-3);cursor:pointer}
.win .wb{padding:14px 16px}
.win .ask{font-size:14.5px;font-weight:700;line-height:1.45;margin:0 0 10px}
.win .ask b{color:var(--accent)}
.win .what{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:12.5px}
.win .what .p{font:12px var(--mono);color:var(--text-2)}
.win .only{margin:10px 0 0;color:var(--text-2);font-size:12.5px}
.win .wf{display:flex;justify-content:flex-end;gap:8px;padding:9px 16px;border-top:1px solid var(--border)}

/* 들어가기 */
.gatewrap{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.gate{width:min(450px,100%)}
.gate .cb{padding:24px 26px 16px}
.gate .mk{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;margin:0 0 12px}
.gate .mk svg{width:20px;height:20px;stroke:var(--text-2);fill:none;stroke-width:1.7}
.gate .btn.pri{width:100%;justify-content:center;height:38px;font-size:13px}
.gate .links{margin-top:14px;padding-top:10px;border-top:1px dashed var(--border-strong);font-size:12px;color:var(--text-3)}

/* 지식 목록 */
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.top .acts{margin-left:auto;display:flex;gap:8px;margin-top:4px}
.krow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);cursor:pointer}
.krow:first-child{border-top:0}
.krow:hover{background:#fafbfd}
.krow .nm{font-weight:700;width:250px;flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;min-width:0}
.krow .nm small{flex-basis:100%;font:400 11px var(--mono);color:var(--text-3)}
.krow .meta{color:var(--text-3);font-size:12px;flex:1;min-width:0}
.krow .rr{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.krow .dst{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.krow.dim{opacity:.42}
.krow.new{animation:flash 1.6s}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
.tl{display:flex;align-items:center;gap:16px;margin:2px 2px 0;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.tl a{font-weight:600}

/* 문서 목록 */
.wait{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--pending);background:var(--pending-bg);border:1px solid #d9d2fb;border-radius:8px;padding:7px 12px;margin:0 0 10px;flex-wrap:wrap}
.wait i{width:7px;height:7px;border-radius:50%;background:var(--pending);flex:none}
.dl li{padding:7px 2px;cursor:pointer}
.dl li:hover{background:#fafbfd}
.dl li .di{width:16px;height:16px;flex:none;fill:none;stroke:var(--text-3);stroke-width:1.6;stroke-linejoin:round}
.dl li .nm{flex:1;min-width:0;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dl li .nm small{color:var(--text-3);font-weight:400;font-size:11.5px}
.dl li .chip{font-size:10.5px;padding:0 6px}
.dl li .when{width:84px;flex:none;color:var(--text-2);font-size:12px;text-align:right}
.dl li .when.td{color:var(--accent)}
.dl li.more{color:var(--accent);font-size:12px;justify-content:center;font-weight:600}

/* 읽기 · 고치기 */
.ttl{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ttl .path{flex:1;min-width:0}
.found{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text-2);margin:0 0 10px;flex-wrap:wrap}
.found b{color:var(--text)}
.found a{margin-left:auto;white-space:nowrap}

function scopeKns(){const k=S.route.kn; const vk=visibleKns().filter(x=>!pcBlocked(x)); if(k&&k!=='*'&&vk.includes(k)&&['docs','tidy','members'].includes(S.route.scr)) return [k]; return vk;}
function doSearch(q){
 q=String(q||'').trim(); if(!q) return null;
 const nq=norm(q), ks=scopeKns(), all=[];
 ks.forEach(k=>docsOf(k).forEach(d=>d.secs.forEach(s=>all.push({k,d,s}))));
 const exact=all.filter(x=>norm(x.s.h)===nq||(norm(x.d.title)===nq&&x.d.secs[0]===x.s));
 if(exact.length) return {mode:'exact',hits:exact,ks};
 const toks=q.split(/\s+/).filter(t=>t.length>=1);
 // 낱말의 절반 이상이 든 글만 — 「배포」 하나만 맞은 글은 비슷한 글이 아니다
 const need=Math.ceil(toks.length/2);
 const sc=all.map(x=>{let v=0,m=0; const hay=x.s.h+' '+x.s.b;
  const al=(x.s.alias||[]).some(a=>norm(a)===nq); if(al) v+=100;
  if(norm(hay+x.d.title).includes(nq)) v+=30;
  toks.forEach(t=>{if(hay.includes(t)){v+=10;m++;} if(x.s.h.includes(t)) v+=5;});
  return Object.assign({v,ok:al||v>=30||m>=need},x);}).filter(x=>x.v>0&&x.ok).sort((a,b)=>b.v-a.v);
 if(sc.length) return {mode:'sim',hits:sc,ks,toks};
 return {mode:'none',ks};
}
function snip(b,toks){let t=String(b).replace(/`/g,''); let h=esc(t); (toks||[]).forEach(x=>{if(!x) return; h=h.split(esc(x)).join('<mark>'+esc(x)+'</mark>');}); return h;}
function palHtml(){
 const ks=scopeKns(); const where=ks.length===1?KN(ks[0]).name+'에서':'지식 전체에서';
 return `<div class="pscrim" data-a="palClose" data-self="1"><div class="pal" data-t="pal"><div class="pin">${svg('search')}<input id="palIn" data-in="pal" data-t="palIn" value="${esc(S.pal.q||'')}" placeholder="찾기" autocomplete="off"><span class="r">${esc(where)} · Esc</span></div><div id="palBody">${palBody()}</div></div></div>`;
}
function palBody(){
 const q=S.pal.q||''; const r=doSearch(q);
 let body='';
 if(!r) body='<div class="tip">문서의 항목 이름이나 낱말을 친다 — 예: 헬스 체크 · 상태 점검</div>';
 else if(r.mode==='none') body=`<div class="empty" data-t="none"><b>이 말로는 못 찾았다 — 없다는 뜻은 아니다</b>다른 이름이나 문서 목록으로<br><a data-a="palDocs">문서 목록 ›</a><a data-a="palClear">다른 말로 다시 ›</a></div>`;
 else {
  const hit=(x,i)=>{const n=KN(x.k); const tags=(x.s.by&&/kmd/.test(x.s.by)?`<span class="tg kmd">kmd 가 정리</span>`:'')+((x.s.alias||[]).some(a=>norm(a)===norm(q))?'<span class="tg nm">다른 이름</span>':'')+(x.s.auto?'<span class="tg">저절로 채우는 표</span>':'');
   return `<div class="hit${i===0?' sel':''}" data-a="openHit" data-k="${x.k}" data-d="${esc(x.d.id)}" data-h="${esc(x.s.h)}" data-t="hit"><div class="ht"><b>${esc(x.d.title)} › ${esc(x.s.h)}</b>${tags}<span class="r">${esc(n.name)}</span></div><div class="tx">${snip(x.s.b,r.mode==='sim'?r.toks:[q])}</div></div>`;};
  if(r.mode==='exact') body=`<div class="g" data-t="gExact">문서의 항목</div>${r.hits.map(hit).join('')}`;
  else { const N=r.hits.length, more=S.pal.more; const sh=more?r.hits:r.hits.slice(0,5);
   body=`<div class="g" data-t="gSim">딱 맞는 항목이 없어 비슷한 글에서 찾았다</div>${sh.map(hit).join('')}<div class="ft" data-t="simCount">비슷한 글 ${N}개${N>5?(more?' — 모두 보인다':` — 5개 · <a data-a="palMore" data-t="palMore">${N-5}개 더 보기</a>`):''}</div>`; }
 }
 return body;
}

function everyTxt(e){return e.t==='hourly'?'1시간마다':e.t==='daily'?'매일 '+e.at:e.t==='weekly'?'매주 월':'바뀔 때만';}
function nextTxt(e){const m=nowMin(); if(e.t==='hourly') return hhmm((Math.floor(m/60)+1)*60); if(e.t==='daily'){const [h,mi]=e.at.split(':').map(Number);return (h*60+mi>m?'오늘 ':'내일 ')+e.at;} if(e.t==='weekly') return '10-26(월) 06:00'; return '바뀌면 바로';}
function canEditSrc(){const p=P(); return p.where==='pc'||p.admin;}

function parseSrc(t){
 t=String(t||'').trim(); if(!t) return null;
 const kmatch=s=>{s=s.toLowerCase(); if(P().where==='pc') return S.route.kn&&S.route.kn!=='*'&&KN(S.route.kn).type==='pc'?S.route.kn:'bn'; if(/gdi/.test(s)) return 'gdi'; if(/dpms/.test(s)) return 'dpms'; return S.route.kn&&S.route.kn!=='*'&&KN(S.route.kn).type==='team'?S.route.kn:'dpms';};
 const why=(s,k)=>(/gdi|dpms/i.test(s)&&P().where==='team'?'이름이 맞아서':'가장 최근에 연 지식이라서');
 let m;
 if((m=t.match(/^(postgres(?:ql)?|mysql|oracle|mssql|sqlserver):\/\/[^/]*\/([^?\s/]+)/i))){const nm=m[2]; const k=kmatch(nm); return {kind:'DB',name:nm+' DB',kn:k,doc:'테이블정의서',every:{t:'daily',at:'06:00'},what:'저절로 채우는 표 · 테이블마다',why:why(nm,k)};}
 if(/^(git@|https?:\/\/|ssh:\/\/).+\.git$/i.test(t)||/^git@/i.test(t)){const nm=t.replace(/\.git$/i,'').split(/[\/:]/).pop(); const k=kmatch(nm); return {kind:'코드',name:nm+' 코드',kn:k,doc:'꾸러미 판',every:{t:'hourly'},what:'꾸러미 판 표(package.json · pom.xml 에서)',why:why(nm,k)};}
 if(/^[A-Za-z]:\\/.test(t)||/^\/[^\s]+/.test(t)){const nm=t.replace(/[\\\/]+$/,'').split(/[\\\/]/).pop(); const k=kmatch(nm); return {kind:'코드 폴더',name:nm+' 코드 폴더',kn:k,doc:'꾸러미 판',every:{t:'hourly'},what:'꾸러미 판 표(폴더 안의 package.json · pom.xml 에서)',why:why(nm,k),local:/^[A-Za-z]:\\/.test(t)};}
 return {bad:true};
}

function rowHtml(row,runId){

function runHtml(run){

 const done=put.length+chg.length;
 const grp=(t,small,rows)=>rows.length?`<div class="sub">${t} ${rows.length} <small>${small}</small></div><ul class="plain tl2">${rows.map(r=>rowHtml(r,run.id)).join('')}</ul>`:'';

 return `<div class="card" data-t="run" data-id="${run.id}" style="overflow:visible"><div class="ch2" data-a="toggleRun" data-id="${run.id}"><b>${esc(run.tm)} ${run.auto?'kmd 가 ':''}정리한 것 ${done}</b><small>${run.total?'받은 것 '+run.total+' 중 · ':''}건마다 따로 저장 · 되돌리기는 줄마다 ⋯ 안에</small><span class="r">${open?'접기':'펼치기'}</span></div>
  ${open?grp('넣은 것','숫자 · 이름 모두 확인 ✓',put)+grp('값이 바뀐 것','쓴 사람에게 알렸다 — 오늘 바뀐 것 맨 위',chg)+grp('그대로 둔 것','문서 옆에 같이 읽힌다 · 다음 정리 때 다시',keep):''}</div>`;
}
function viewTidy(){

  <p class="lead">받은 기록은 kmd 가 정해진 시간에 바로 문서에 넣는다. 기다리기 싫으면 지금 정리.</p>

  <details class="more"><summary>자세히</summary><div class="in">kmd 의 검사(값 · 이름 대조 · 크기 · 표지)를 못 넘은 글은 넣지 않고 그대로 둔다 — 문서 옆에 같이 읽히고 다음 정리 때 다시 해 본다. 이름 바꾸기 · 합치기 · 없애기는 넣지 않는다 — 제안 한 줄로만 선다.</div></details></div>`};
}
function runTidy(k,from){
 if(S.tidyRun) return;
 const ib=S.inbox[k]||[]; if(!ib.length){toast('받은 것이 없다 — 정리할 것이 없다');return;}
 let todo=ib.slice(), rest=[];
 if(S.cond.loginRest){const puts=ib.filter(i=>i.kind==='put').slice(0,2); rest=ib.filter(i=>!puts.includes(i)); todo=puts;}
 if(!todo.length){S.tidyMsg[k]={cls:'warn',t:'규칙으로 되는 것이 없었다 — 0건 · 나머지는 로그인이 돌아오면'};render();return;}
 S.tidyRun={kn:k,i:1,n:todo.length}; S.tidyMsg[k]=null; render();
 const step=()=>{
  if(!S.tidyRun) return;
  if(S.tidyRun.i<S.tidyRun.n){S.tidyRun.i++; render(); setTimeout(step,1100); return;}
  // 끝 — 넣기
  bump(); const tm=now();
  const rows=todo.map(i=>{const r=Object.assign({},clone(i),{id:uid(),src:i}); r.small=(i.small||'')+' · '+i.tm; if(i.kind!=='keep'){applyEff(i.eff); r.applied=true;}
   // 쓴 사람에게
   const pk=whoKey(i.who);
   if(pk){ if(i.kind==='changed') addToday(pk,{tm,kt:'team',yl:true,b:'kmd 가 정리하며 값을 바꿨다 — '+KN(k).name+' › '+i.target+' · '+i.vfrom+' → '+i.vto,small:'내 기록에서('+i.tm+') — 되돌릴 수 있다',eff:i.eff,applied:true,link:r.id,go:i.eff&&i.eff.type!=='newdoc'?{kn:k,doc:i.eff.doc,hl:i.eff.sec}:null});
     else if(i.kind==='put') addToday(pk,{tm,kt:'team',dot:'acc',text:'kmd 가 정리했다 — '+KN(k).name+' › '+i.target,small:'내 기록에서('+i.tm+')',eff:i.eff,applied:true,link:r.id,go:i.eff?{kn:k,doc:i.eff.doc,hl:i.eff.sec||null}:null}); }
   return r;});
  rows.forEach(r=>{const d=r.eff&&findDoc(k,r.eff.doc); if(d){d.chip='새로 바뀜';}});
  S.inbox[k]=rest; S.pending=S.pending.filter(x=>rest.some(i=>i.id===x.id)||x.kn!==k);
  (S.runs[k]=S.runs[k]||[]).forEach(r=>r.open=false);
  S.runs[k].unshift({id:uid(),tm:'방금 '+tm,rows,open:true});
  KN(k).lastTidy='방금 '+tm+' 정리 — '+rows.filter(r=>r.kind!=='keep').length+'건 넣음';
  S.tidyMsg[k]=S.cond.loginRest?{cls:'warn',t:'규칙으로 되는 것만 넣었다 — '+rows.length+'건 · 나머지는 로그인이 돌아오면'}:null;
  S.tidyRun=null; render();
  if(from==='toast'||S.route.scr!=='tidy') toast('정리했다 — '+rows.length+'건을 '+esc(KN(k).name)+'에 넣었다'+(S.cond.loginRest?' · 규칙으로 되는 것만':''));
 };
 setTimeout(step,1100);
}
function findRow(id){for(const k in S.runs) for(const run of S.runs[k]) for(const r of run.rows) if(r.id===id) return {k,run,r}; return null;}

function parseAdd(t){
 t=String(t||'').trim(); if(!t) return null;
 const p=P();
 if(/^(postgres(ql)?|mysql|oracle|mssql):\/\//i.test(t)||/\.git$/i.test(t)||/^git@/i.test(t)) return {kind:'src'};
 let m;
 if((m=t.match(/^https?:\/\/kmd\.team\.local\/r\/([^\/\s?#]+)/i))){const id=m[1].replace(/_wiki$/,'').toLowerCase(); const k=S.kns[id]&&S.kns[id].type==='team'?id:null; return {kind:'team',k,slug:m[1]};}
 if(/^[A-Za-z]:\\/.test(t)){const nm=t.replace(/[\\]+$/,'').split('\\').pop()||t; return {kind:'folder',path:t,name:nm};}
 if(/^https?:\/\//i.test(t)) return {kind:'bad'};
 return {kind:'new',name:t};
}

function extOf(n){const m=String(n).toLowerCase().match(/\.([a-z0-9]+)$/); return m?m[1]:'';}
function baseOf(n){return String(n).split(/[\\\/]/).pop().replace(/\.[^.]+$/,'');}
function classify(n){const e=extOf(n),pc=P().where==='pc'; if(DOCX.includes(e)||(pc&&PCONLY.includes(e))) return 'doc'; if(IMG.includes(e)||(!pc&&PCONLY.includes(e))) return 'att'; return 'skip';}

 });

     addToday(personKey(),{tm:now(),kt:teamKn?'team':'me',dot:'acc',text:f.name+' 를 문서로 — '+tName,small:'원본은 첨부로 두었다',go:teamKn?null:{kn:tKn,doc:d.id}});}
   else if(c==='att'&&PCONLY.includes(e)){row.title=f.name+' → '+tName+' › '+b; row.msg='원본은 첨부로 두었다 — 내 PC 프로그램이 있는 PC 에서 바꾼다'; row.cls='bad';}

 });

function readEntries(entry,path,out){
 return new Promise(res=>{
  if(entry.isFile){entry.file(f=>{f._rel=path+f.name; out.push(f); res();},()=>res());}
  else if(entry.isDirectory){const rd=entry.createReader(); const all=[]; const next=()=>rd.readEntries(es=>{ if(!es.length){Promise.all(all.map(e=>readEntries(e,path+entry.name+'/',out))).then(res);} else {all.push(...es); next();}},()=>res()); next();}
  else res();
 });
}

// ───────────── 이벤트 ─────────────
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-a]');
 if(!el){ if(S.menu&&!ev.target.closest('.menu')){S.menu=null; render();} return;}
 if(el.dataset.self&&ev.target!==el) return;
 const f=ACT[el.dataset.a]; if(!f) return;
 if(el.tagName==='A') ev.preventDefault();
 if(S.menu&&!['menu','kmenu','setEvery','pickKn'].includes(el.dataset.a)&&!ev.target.closest('.menu')) S.menu=null;
 f(el,ev);
});
document.addEventListener('submit',ev=>{
 const f=ev.target; if(f.dataset.f!=='login') return; ev.preventDefault();
 const id=$('#lgId').value.trim(), pw=$('#lgPw').value;
 if(!id||!pw){S.pwErr=true; render(); return;}
 S.pwErr=false; S.logged[S.persona]=true; go({scr:'home',kn:'*'});
});
document.addEventListener('input',ev=>{
 const t=ev.target; const k=t.dataset&&t.dataset.in; if(!k) return;
 // 칸은 다시 그리지 않는다(한글 입력이 끊기지 않게) — 결과 자리만 바꾼다
 if(k==='pal'){S.pal.q=t.value; S.pal.more=false; $('#palBody').innerHTML=palBody();}
 if(k==='src'){S.srcDraft=t.value; const h=srcHeard(); $('#srcHeardBox').innerHTML=h.heard; $('#srcBtnBox').innerHTML=h.btn;}
 if(k==='add'){S.addDraft=t.value; const h=addHeard(); $('#addHeardBox').innerHTML=h.heard; $('#addBtnBox').innerHTML=h.btn; const m=$('[data-t=addMsg]'); if(m){S.addMsg=null; m.remove();}}
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.id==='fileIn'||t.id==='dirIn'){takeFiles(t.files); return;}
 if(t.id==='evAt'){const m=S.menu&&S.menu.split(':')[1]; const s=S.sources.find(x=>x.id===m); if(s){s.every={t:'daily',at:t.value||'06:00'}; S.menu=null; toast(esc(s.name)+' — 이제 매일 '+s.every.at+' 가져온다'); render();}}
 if(t.dataset&&t.dataset.c){S.cond[t.dataset.c]=t.checked; onCond(t.dataset.c,t.checked); render();}
});
document.addEventListener('keydown',ev=>{
 if((ev.ctrlKey||ev.metaKey)&&(ev.key==='k'||ev.key==='K')){ if(isTeam()&&!S.logged[S.persona]) return; ev.preventDefault(); S.pal={q:'',more:false}; render(); return;}
 if(ev.key==='Escape'){ if(S.pal){S.pal=null; render();} else if(S.modal){S.modal=null; render();} else if(S.menu){S.menu=null; render();} }
 if(ev.key==='Enter'&&ev.target.id==='palIn'){const h=$('#app .hit'); if(h) h.click();}
 if(ev.key==='Enter'&&ev.target.id==='addIn'){const b=$('[data-t=addBtn]'); if(b&&!b.disabled) b.click();}
});
document.addEventListener('dragover',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(d){ev.preventDefault(); d.classList.add('over');}});
document.addEventListener('dragleave',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(d) d.classList.remove('over');});
document.addEventListener('drop',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(!d) return; ev.preventDefault(); d.classList.remove('over');
 const items=ev.dataTransfer.items; const ents=items?[...items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean):[];
 if(ents.some(e=>e.isDirectory)){const out=[]; Promise.all(ents.map(e=>readEntries(e,'',out))).then(()=>takeFiles(out));}
 else takeFiles(ev.dataTransfer.files);
});
function onCond(c,on){
 if(c==='serverDown'&&!on&&S.sendWait){const w=S.sendWait; setTimeout(()=>finishSend(w.items,w.tm),600);}
}
document.querySelectorAll('#ctl [data-p]').forEach(b=>b.addEventListener('click',()=>{S.persona=b.dataset.p; S.pal=null; S.modal=null; S.menu=null; S.edit=null; S.pwErr=false; S.addMsg=null; S.route={scr:'home',kn:'*',doc:null,hl:null,q:null}; render();}));
$('#reset').addEventListener('click',()=>{S=makeState(); T0=Date.now(); $('#toastHost').innerHTML=''; render();});
setInterval(()=>{const s=$('#app .status .r'); if(s) s.textContent='kmd v1.13 · 10-22(목) '+now();},15000);
render();
</script>
