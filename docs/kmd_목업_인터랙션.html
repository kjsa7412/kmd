<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kmd 목업 인터랙션</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f7;--surface-3:#e6eaf0;--border:#e2e6ed;--border-strong:#c9d1dd;
  --text:#11151c;--text-2:#515a68;--text-3:#858e9d;--accent:#3358e6;--accent-bg:#e9eeff;--accent-line:#c3d0fb;
  --danger:#cb3a2c;--danger-bg:#fdeceb;--warn:#8c5c00;--warn-bg:#fcf3e0;--pending:#6247c4;--pending-bg:#efedfd;
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);
  --shadow-2:0 2px 6px -1px rgba(15,23,42,.08),0 14px 32px -8px rgba(15,23,42,.18);
  --font:Pretendard,-apple-system,"Segoe UI",system-ui,"Malgun Gothic",sans-serif;
  --mono:Consolas,"Cascadia Mono",D2Coding,"Malgun Gothic",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe3ea;color:var(--text);font:13px/1.55 var(--font)}
button,input,textarea,select{font:inherit}
a{color:var(--accent);cursor:pointer}

/* ── 목업 조종판(앱 밖) ── */
.ctl{position:sticky;top:0;z-index:50;background:#1b2130;color:#cfd6e4;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:7px 16px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ctl .ttl{color:#fff;font-size:12.5px;white-space:nowrap}
.ctl .ttl small{color:#8fa6ff;font-weight:400;margin-left:4px}
.ctl .grp{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.ctl .lb{color:#8f9bb3;margin-right:2px;white-space:nowrap}
.ctl button{background:#2a3246;border:1px solid #3a4560;color:#cfd6e4;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
.ctl button:hover{background:#343e57}
.ctl button.on{background:#3358e6;border-color:#3358e6;color:#fff}
.ctl label{display:inline-flex;align-items:center;gap:4px;background:#2a3246;border:1px solid #3a4560;border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.ctl label.on{background:#5a4210;border-color:#a07a24;color:#ffe2a6}
.ctl input{margin:0;accent-color:#f0c060}
.ctl .rs{background:transparent;border-color:#5a6680}
.stage{padding:16px}

/* 아이콘 기본 크기(구체적인 규칙이 이긴다) */
:where(.app) svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
.search span{white-space:nowrap}
/* ── 앱 프레임 ── */
.app{max-width:1240px;margin:0 auto;background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.18);display:flex;min-height:calc(100vh - 90px);position:relative}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.body{flex:1;display:flex;min-height:0;min-width:0}
.main{flex:1;padding:18px 22px;overflow:auto;min-width:0}
.aside{width:300px;flex:none;border-left:1px solid var(--border);background:var(--surface);padding:14px;overflow:auto}
.aside h4{margin:2px 0 10px;font-size:13px}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px}
.side.dim .nav{opacity:.45;pointer-events:none}
.sb-top{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.logo.me{background:#11151c}
.brand{font-weight:700;font-size:15px}
.where{font-size:11px;color:var(--text-3);margin:-6px 6px 10px}
.sb-repo{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;position:relative;background:var(--surface)}
.sb-repo:hover{background:var(--surface-2)}
.sb-repo .rk{font:700 10.5px var(--mono);background:var(--accent-bg);color:var(--accent);border-radius:5px;padding:2px 5px;white-space:nowrap}
.sb-repo .rn{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-repo .rn small{display:block;font:400 10.5px var(--font);color:var(--text-3)}
.sb-repo .rc{color:var(--text-3)}
.kmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-2);padding:6px;z-index:9}
.kmenu .mi{padding:6px 8px;border-radius:6px;display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}
.kmenu .mi:hover{background:var(--surface-2)}
.sb-g{font-size:11.5px;color:var(--text-3);margin:12px 8px 4px}
.sb-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
.sb-i:hover{background:var(--surface-2)}
.sb-i.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sb-i svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--text-2)}
.sb-i.on svg{color:var(--accent)}
.sb-i .bd{margin-left:auto;background:var(--pending-bg);color:var(--pending);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.sb-i.deco{cursor:default;color:var(--text-2)}
.sb-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:8px}
.sb-me{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px}
.sb-me .av{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.sb-me small{color:var(--text-3)}
.hdr{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.crumb{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--text);font-weight:600}
.search{margin-left:auto;flex:0 1 220px;min-width:110px;height:30px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;padding:0 10px;color:var(--text-3);font-size:12px;cursor:text;background:var(--surface)}
.search:hover{border-color:var(--border-strong)}
.band{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:12px;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text-2);flex-wrap:wrap;row-gap:4px}
.band .who{font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap}
.band .who i{width:8px;height:8px;border-radius:50%;background:#11151c;display:inline-block}
.band.team .who i{background:var(--accent)}
.band .out{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.status{height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:11.5px;color:var(--text-2);background:var(--surface);border-top:1px solid var(--border)}
.status .r{margin-left:auto}

/* ── 부품 ── */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;vertical-align:1px}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-pend{background:var(--pending-bg);color:var(--pending)}
.c-mute{background:var(--surface-3);color:var(--text-2)}
.c-acc{background:var(--accent-bg);color:var(--accent)}
.c-danger{background:var(--danger-bg);color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:#2a4bd0}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:14px}
.card .ch{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;flex-wrap:wrap}
.card .ch small{font-weight:400;color:var(--text-3)}
.card .ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card .cb{padding:12px 14px}
.card .cf{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);flex-wrap:wrap}
.row{display:flex;align-items:center;gap:8px}
.r{margin-left:auto}
.muted{color:var(--text-3)}
.small{font-size:11.5px}
.mono{font-family:var(--mono)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px}
.kv>span:nth-child(odd){color:var(--text-3)}
.kv small{display:block;color:var(--text-3);font-size:11.5px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:middle}
table.t th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:12px}
table.t td small{display:block;color:var(--text-3);font-size:11.5px;font-weight:400}
code{font:12px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--text)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-2px 0 12px}
.tabs span{padding:7px 12px;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent}
.tabs span.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .ord{margin-left:auto;font-size:12px;color:var(--text-3);border-bottom:0}
.field{margin-bottom:12px}
.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:3px}
.inp{width:100%;min-height:32px;border:1px solid var(--border-strong);border-radius:7px;padding:5px 10px;font-size:12.5px;background:#fff;color:var(--text)}
.inp:focus{outline:2px solid var(--accent-line);border-color:var(--accent)}
.inp.af{background:#e8f0fe;border-color:#b9cdf6;font-family:var(--mono)}
.inp.mono{font-family:var(--mono)}
.callout{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:8px;padding:9px 12px;font-size:12.5px;color:#22389c;margin:8px 0}
.callout.warn{background:var(--warn-bg);border-color:#ecd39c;color:var(--warn)}
.callout.danger{background:var(--danger-bg);border-color:#efb7b1;color:var(--danger)}
.callout.pend{background:var(--pending-bg);border-color:#d9d2fb;color:var(--pending)}
.callout.gray{background:var(--surface-2);border-color:var(--border);color:var(--text-2)}
.stop{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.stop i{width:8px;height:8px;border-radius:50%;background:#d39a2c;flex:none}
.stop.gray i{background:var(--text-3)}
.stop .r{font-size:11.5px;opacity:.85;white-space:nowrap}
.paper{border:1px solid var(--border);border-radius:10px;padding:16px 20px;background:#fff}
.paper h1{font-size:20px;margin:0 0 6px}
.paper h2{font-size:16px;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.paper p{margin:6px 0;color:#262c36}
.path{font:11.5px var(--mono);color:var(--text-3);background:var(--surface-2);padding:5px 10px;border-radius:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.path .r{font-family:var(--font)}
.big{font-size:20px;font-weight:700;margin:2px 0 4px}
.lead{color:var(--text-2);margin:0 0 14px}
.kt{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;white-space:nowrap}
.kt.me{background:#11151c;color:#fff}
.kt.team{background:var(--accent-bg);color:var(--accent)}
.kt.role{background:var(--surface);color:var(--text-2);border:1px solid var(--border-strong);font-weight:500}
.kt.src{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-2);font-weight:500}
.kn{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px;white-space:nowrap}
.kn.none{color:var(--text-3);border-style:dashed}
.plain{list-style:none;margin:0;padding:0}
.plain li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--border);font-size:12.5px}
.plain li:first-child{border-top:0}
.kebab{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-2);font-size:16px;line-height:1;cursor:pointer;display:inline-grid;place-items:center;flex:none;position:relative}
.kebab:hover,.kebab.on{background:var(--surface-2);border-color:var(--border)}
.menu{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-2);padding:6px;min-width:220px;font-size:12.5px;text-align:left;color:var(--text);font-weight:400;line-height:1.5}
.menu .mi{padding:7px 10px;border-radius:6px;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi small{margin-left:auto;color:var(--text-3);font-size:11px}
.menu .mi.on{color:var(--accent);font-weight:600}
.menu .sep{border-top:1px solid var(--border);margin:4px 2px}
.menu .gray{font-size:11.5px;color:var(--text-3);padding:6px 10px 4px;white-space:normal;max-width:280px}
.menu input[type=time]{border:1px solid var(--border-strong);border-radius:5px;padding:0 4px;font:12px var(--mono)}
details.more{border-top:1px dashed var(--border-strong);margin-top:12px;padding-top:8px}
details.more>summary{cursor:pointer;color:var(--text-3);font-size:12px;list-style:none}
details.more>summary::before{content:"▸ "}
details.more[open]>summary::before{content:"▾ "}
details.more>summary::-webkit-details-marker{display:none}
details.more>.in{padding:8px 0 2px;font-size:12.5px;color:var(--text-2)}
.sw{display:inline-block;width:34px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;flex:none;vertical-align:middle;cursor:pointer;border:0;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-1);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:16px}
.drop{border:2px dashed var(--border-strong);border-radius:12px;padding:18px 16px;text-align:center;color:var(--text-2);background:var(--surface);font-size:12px;transition:background .1s}
.drop.over{background:var(--accent-bg);border-color:var(--accent)}
.drop b{display:block;font-size:13.5px;color:var(--text);margin-bottom:4px}
.drop .lks{margin-top:6px;font-size:12px}
.drop .lks label{color:var(--accent);font-weight:600;cursor:pointer}
.drop input{display:none}
.lk{color:var(--accent);cursor:pointer;font-weight:600}
.lk.q{color:var(--text-3);font-weight:500}
.gl{font-size:11.5px;color:var(--text-3);margin:8px 2px 0;line-height:1.7}
.hint{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.7}

/* 토스트 · 대화 상자 */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#11151c;color:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-2);z-index:60;max-width:calc(100vw - 32px)}
.toast a{color:#9fb4ff;font-weight:600}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.32);display:grid;place-items:center;z-index:30}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-2);width:min(520px,92%);overflow:hidden}
.win .tb{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2)}
.win .tb .logo{width:18px;height:18px;font-size:10px;border-radius:4px}
.win .tb b{color:var(--text)}
.win .tb .x{margin-left:auto;border:0;background:none;font-size:16px;color:var(--text-3);cursor:pointer}
.win .wb{padding:14px 16px}
.win .ask{font-size:14.5px;font-weight:700;line-height:1.45;margin:0 0 10px}
.win .ask b{color:var(--accent)}
.win .what{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:12.5px}
.win .what .p{font:12px var(--mono);color:var(--text-2)}
.win .only{margin:10px 0 0;color:var(--text-2);font-size:12.5px}
.win .wf{display:flex;justify-content:flex-end;gap:8px;padding:9px 16px;border-top:1px solid var(--border)}

/* 들어가기 */
.gatewrap{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.gate{width:min(450px,100%)}
.gate .cb{padding:24px 26px 16px}
.gate .mk{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;margin:0 0 12px}
.gate .mk svg{width:20px;height:20px;stroke:var(--text-2);fill:none;stroke-width:1.7}
.gate .btn.pri{width:100%;justify-content:center;height:38px;font-size:13px}
.gate .links{margin-top:14px;padding-top:10px;border-top:1px dashed var(--border-strong);font-size:12px;color:var(--text-3)}

/* 지식 목록 */
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.top .acts{margin-left:auto;display:flex;gap:8px;margin-top:4px}
.krow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);cursor:pointer}
.krow:first-child{border-top:0}
.krow:hover{background:#fafbfd}
.krow .nm{font-weight:700;width:250px;flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;min-width:0}
.krow .nm small{flex-basis:100%;font:400 11px var(--mono);color:var(--text-3)}
.krow .meta{color:var(--text-3);font-size:12px;flex:1;min-width:0}
.krow .rr{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.krow .dst{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.krow.dim{opacity:.42}
.krow.new{animation:flash 1.6s}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
.tl{display:flex;align-items:center;gap:16px;margin:2px 2px 0;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.tl a{font-weight:600}

/* 문서 목록 */
.wait{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--pending);background:var(--pending-bg);border:1px solid #d9d2fb;border-radius:8px;padding:7px 12px;margin:0 0 10px;flex-wrap:wrap}
.wait i{width:7px;height:7px;border-radius:50%;background:var(--pending);flex:none}
.dl li{padding:7px 2px;cursor:pointer}
.dl li:hover{background:#fafbfd}
.dl li .di{width:16px;height:16px;flex:none;fill:none;stroke:var(--text-3);stroke-width:1.6;stroke-linejoin:round}
.dl li .nm{flex:1;min-width:0;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dl li .nm small{color:var(--text-3);font-weight:400;font-size:11.5px}
.dl li .chip{font-size:10.5px;padding:0 6px}
.dl li .when{width:84px;flex:none;color:var(--text-2);font-size:12px;text-align:right}
.dl li .when.td{color:var(--accent)}
.dl li.more{color:var(--accent);font-size:12px;justify-content:center;font-weight:600}

/* 읽기 · 고치기 */
.ttl{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ttl .path{flex:1;min-width:0}
.found{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text-2);margin:0 0 10px;flex-wrap:wrap}
.found b{color:var(--text)}
.found a{margin-left:auto;white-space:nowrap}
.lit{position:relative;background:#eef3fc;border-radius:6px;padding:4px 10px;margin:0 -10px}
.lit .tag{position:absolute;right:8px;top:-9px;font-size:10.5px;background:#fff;border:1px solid #c9d6f3;color:var(--text-2);border-radius:999px;padding:0 7px}
.hc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 2px;font-size:11.5px;color:var(--text-3)}
.hchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);border-radius:999px;padding:1px 9px;font-size:11.5px;white-space:nowrap}
.hchip.tidy{color:var(--warn);border-color:#ecd39c;background:#fff;font-weight:600}
.penrec{display:flex;gap:6px;align-items:flex-start;margin:6px 0;padding:6px 9px;border-radius:7px;background:var(--pending-bg);color:var(--pending);font-size:12px}
.penrec i{width:6px;height:6px;border-radius:50%;background:var(--pending);flex:none;margin-top:6px}
.auto{border:1.5px solid var(--border-strong);border-radius:8px;margin:8px 0;overflow:hidden;background:#fff}
.auto .ah{display:block;padding:5px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-2)}
.auto .ah b{color:var(--text)}
.auto table.t{margin:0}
.auto table.t td,.auto table.t th{padding:4px 10px}
.auto .lkl{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11.5px;color:var(--text-2);border-top:1px dashed var(--border-strong);background:var(--surface-3)}
.auto.lock{background:var(--surface-2);user-select:none}
.auto.lock table.t td{color:var(--text-3);background:var(--surface-2)}
.auto td.chg{background:var(--accent-bg)!important;color:var(--accent)!important;font-weight:600}
.ed{border:1px solid var(--accent-line);border-radius:10px;padding:10px 12px;margin:8px 0 4px;background:#fbfcff}
.ed .lbl{font-size:12px;color:var(--text-3);margin:0 0 6px}
.ed .lbl b{color:var(--accent)}
.toolbar{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;background:var(--surface-2)}
.toolbar span{font-size:11.5px;padding:2px 8px;border-radius:5px;color:var(--text-2)}
.ed textarea{width:100%;min-height:300px;border:1px solid var(--border-strong);border-radius:0 0 8px 8px;padding:10px 12px;font:13px/1.7 var(--font);resize:vertical;background:#fff}
.ed .lockh{font-size:11.5px;color:var(--text-3);margin:10px 0 2px}

/* 찾기 */
.pscrim{position:absolute;inset:0;background:rgba(15,23,42,.16);z-index:30;display:flex;justify-content:center;align-items:flex-start;padding:52px 16px 16px}
.pal{width:min(682px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 18px 48px rgba(15,23,42,.28);font-size:12.5px}
.pal .pin{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.pal .pin svg{width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:1.8;flex:none}
.pal .pin input{flex:1;border:0;outline:0;font-size:14px;padding:4px 0;min-width:0;background:transparent}
.pal .pin .r{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.pal .g{padding:10px 14px 4px;font-size:12px;font-weight:700;color:var(--text-2)}
.pal .hit{margin:4px 10px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);cursor:pointer}
.pal .hit:hover,.pal .hit.sel{border-color:var(--accent-line);background:#f7f9ff}
.pal .ht{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pal .ht b{font-weight:700}
.pal .ht .r{margin-left:auto;font-size:11px;color:var(--text-3)}
.tg{font-size:10.5px;font-weight:600;border-radius:5px;padding:0 6px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.tg.kmd{background:transparent;border:1px solid var(--text-3);color:var(--text);padding:0 5px}
.tg.nm{background:transparent;border:1px dashed var(--border-strong);color:var(--text-2);padding:0 5px}
.pal .tx{margin-top:4px;font-size:12px;color:#262c36;line-height:1.6}
.pal mark{background:#fff1b8;color:inherit;border-radius:3px;padding:0 1px}
.pal .ft{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-2);margin-top:6px}
.pal .empty{margin:12px 14px;padding:12px 14px;border-radius:8px;background:var(--surface-2);color:var(--text-2);font-size:12px;line-height:1.7}
.pal .empty b{display:block;color:var(--text);font-size:13px}
.pal .empty a{font-weight:600;margin-right:12px}
.pal .tip{padding:12px 14px;color:var(--text-3);font-size:12px}

/* 오늘 바뀐 것 */
.feed{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:14px}
.feed .fh{padding:9px 14px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.feed .fh small{font-weight:400;color:var(--text-3)}
.fi{border-top:1px solid var(--border);font-size:12.5px}
.feed .fh+.fi{border-top:0}
.fi .ln{display:flex;align-items:center;gap:10px;padding:9px 14px}
.fi .tm{font:11.5px/1.35 var(--mono);color:var(--text-3);width:44px;flex:none}
.fi .dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none}
.fi .dot.acc{background:var(--accent)}.fi .dot.pend{background:var(--pending)}.fi .dot.warn{background:#d39a2c}.fi .dot.bad{background:var(--danger)}
.fi .tx{flex:1;min-width:0}
.fi .tx small{display:block;color:var(--text-3);font-size:11.5px}
.fi .tx .kt{margin-right:3px;vertical-align:1px}
.fi .act{margin-left:auto;font-size:12px;color:var(--accent);white-space:nowrap;cursor:pointer;font-weight:600}
.fi.yl .tx b{color:var(--warn);font-weight:700}
.fi.yl .tm{color:var(--warn)}
.fi.done .tx b{color:var(--text-3)}
.fi ul.sub{list-style:none;margin:3px 0 0;padding:0}
.fi ul.sub li{padding-left:12px;font-size:12px;color:var(--text-2);position:relative}
.fi ul.sub li::before{content:"·";position:absolute;left:3px}
.fi .open{padding:2px 14px 12px 78px}
.diff{border:1px solid var(--border);border-radius:8px;font:12px/1.7 var(--font);overflow:hidden;background:#fff;margin:6px 0}
.diff .fh{background:var(--surface-2);padding:5px 10px;font:600 12px var(--font);color:var(--text-2);border-bottom:1px solid var(--border)}
.diff .ln2{padding:0 10px;white-space:pre-wrap}
.diff .ln2::before{content:" ";display:inline-block;width:14px;color:var(--text-3)}
.diff .add{background:var(--accent-bg)}
.diff .add::before{content:"+";color:var(--accent)}
.diff .del{background:var(--surface-2);color:var(--text-3);text-decoration:line-through}
.diff .del::before{content:"−"}

/* 정리 */
.go{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--accent-line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-1);margin:0 0 12px;flex-wrap:wrap}
.go .tx{font-size:12.5px;color:var(--text-2);flex:1;min-width:0}
.go .tx b{color:var(--text)}
.go .tx small{display:block;color:var(--text-3);font-size:11.5px}
.prog{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:12.5px}
.prog i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ch2{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;flex-wrap:wrap}
.ch2 small{font-weight:400;color:var(--text-3);font-size:11.5px}
.ch2 .r{color:var(--text-3);font-size:12px}
.sub{display:flex;gap:8px;align-items:baseline;padding:9px 14px 2px;border-top:1px solid var(--border);font-weight:700;font-size:12.5px}
.sub.first{border-top:0}
.sub small{font-weight:400;color:var(--text-3);font-size:11.5px}
.tl2 li{gap:8px;padding:8px 14px;flex-wrap:wrap}
.tl2 li .k{width:44px;flex:none;color:var(--text-3);font-size:12px}
.tl2 li .nm{font-weight:600;min-width:0;flex:1}
.tl2 li .nm small{display:block;font-weight:400;color:var(--text-3);font-size:11.5px}
.tl2 li.yl{background:var(--warn-bg);box-shadow:inset 3px 0 0 #d39a2c}
.tl2 li.yl .nm small{color:var(--warn)}
.tl2 li.dim .nm{color:var(--text-2);font-weight:500}
.tl2 li.rv .nm{color:var(--text-3);text-decoration:line-through}
.tl2 li .cmp{flex-basis:100%;padding-left:52px}
.to{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);background:var(--accent-bg);border-radius:6px;padding:2px 8px;white-space:nowrap;flex:none;font-weight:600}
.to.mute{color:var(--text-3);background:var(--surface-2);font-weight:500}

/* 사람 · 설정 · 관리 */
.av2{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none}
.av2.k{border-radius:7px;background:var(--accent);color:#fff}
.av2.all{background:var(--accent-bg);color:var(--accent)}
.pl li{align-items:flex-start;padding:10px 14px}
.pl li .nm{flex:1;min-width:0;font-weight:600}
.pl li .nm small{display:block;font-weight:400;color:var(--text-3);font-size:11.5px}
.pk{border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px 10px;background:var(--surface);font-size:12px;margin:0 14px 12px}
.pk .o{display:flex;align-items:center;gap:8px;padding:6px;border-top:1px solid var(--border);cursor:pointer;border-radius:6px}
.pk .o:hover{background:var(--accent-bg)}
.pk .o.off{color:var(--text-3);cursor:default}
.pk .o.off:hover{background:none}
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.set:first-child{border-top:0}
.set .tx{flex:1;min-width:0}
.set .tx b{display:block;font-weight:600}
.set .tx small{color:var(--text-3);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.pl li.hot{background:var(--warn-bg);box-shadow:inset 3px 0 0 #d39a2c}
.pl li .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:var(--border-strong)}
.pl li .dot.warn{background:#d39a2c}
.pl li .dot.pu{background:var(--pending)}
.pl li .tx{flex:1;min-width:0}
.pl li .tx b{font-weight:600}
.pl li .tx small{display:block;color:var(--text-3);font-size:11.5px}

/* 자료 가져오기 */
.paste{display:flex;gap:8px;align-items:center}
.paste .inp{flex:1}
.heard{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-top:8px;background:var(--surface);border:1px solid var(--accent-line);border-left:3px solid var(--accent)}
.heard.bad{border-color:var(--border);border-left-color:var(--text-3);color:var(--text-2)}
.heard .sub2{display:block;color:var(--text-3);font-size:11.5px;margin-top:2px}
.heard b{font-weight:700}
td.go2{text-align:right;white-space:nowrap}
.ev{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;position:relative}
.ev .kebab{width:22px;height:22px}
.st2{font-size:12px;border-radius:7px;padding:2px 8px;display:inline-block}
.st2.run{background:var(--accent-bg);color:var(--accent)}
.st2.ok{background:var(--surface-2);color:var(--text-2)}
.rh{font-weight:700;font-size:12.5px;margin:14px 2px 2px}
.rec li{align-items:flex-start}
.rec li .tm{font:11.5px var(--mono);color:var(--text-3);width:40px;flex:none;padding-top:1px}
.rec li .tx{flex:1;min-width:0}
.rec li .tx small{display:block;color:var(--text-3);font-size:11.5px}
.rec li.bad .tx small{color:var(--warn)}
.rec li.run .tx small{color:var(--accent)}

/* ── v0.7 리본 · 보는 법 셋 ── */
.ribbon{width:52px;flex:none;background:#eceff4;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;gap:4px}
.ribbon.dim{opacity:.45;pointer-events:none}
.rb{width:44px;padding:6px 0 4px;border-radius:9px;border:0;background:none;color:var(--text-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px}
.app .rb svg{width:19px;height:19px}
.rb:hover{background:var(--surface-3)}
.rb.on{background:var(--accent-bg);color:var(--accent);font-weight:700}
.ribbon .sp{flex:1}
.side{width:248px}
.lp{flex:1 1 auto;min-height:0;overflow:auto;margin:8px -4px 0;border-top:1px solid var(--border);padding:8px 2px 0}
.lh{font-size:11.5px;color:var(--text-3);margin:0 6px 6px;font-weight:600}
.tf{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--text-2);font-weight:700;font-size:12px;user-select:none}
.tf:hover{background:var(--surface-2)}
.tf .ar{width:10px;color:var(--text-3);font-size:10px}
.tf small{font-weight:400;color:var(--text-3)}
.tf .cnt{margin-left:auto;font-weight:400;color:var(--text-3);font-size:11px}
.tn{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 21px;border-radius:6px;cursor:pointer;white-space:nowrap;font-size:12.5px;min-width:0}
.tn:hover{background:var(--surface-2)}
.tn.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.app .tn svg{width:13px;height:13px;color:var(--text-3)}
.tn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tn .dt{font:10.5px var(--mono);color:var(--text-3);flex:none}
.tn .rc,.alr .rc{font-size:10.5px;color:var(--text-3);background:var(--surface-2);border-radius:999px;padding:0 6px;flex:none}
.tn .nd{font-size:10px;color:var(--text-3);border:1px dashed var(--border-strong);border-radius:4px;padding:0 4px;flex:none}
.tn.more{color:var(--accent);font-weight:600}
.tn.nc{cursor:default;font-size:11.5px}
.pd{width:7px;height:7px;border-radius:50%;background:var(--pending);flex:none;display:inline-block}
.nw{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;display:inline-block}
.fcs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 2px 8px}
.fc{font-size:11px;border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;cursor:pointer;color:var(--text-2);background:var(--surface);user-select:none}
.fc.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lp .inp{min-height:28px;font-size:12px}
.ig{font-size:11.5px;color:var(--text-2);font-weight:700;margin:6px 6px 4px}
.empty2{margin:8px 4px;padding:9px 10px;border-radius:8px;background:var(--surface-2);color:var(--text-2);font-size:11.5px;line-height:1.6}
.empty2 b{display:block;color:var(--text);font-size:12px}
.hist{display:flex;gap:2px;flex:none}
.hb{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font-size:15px;line-height:1;padding:0}
.hb[disabled]{opacity:.35;cursor:default}
.qbtn{margin-left:auto;height:30px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--text-2);cursor:pointer;white-space:nowrap;background:var(--surface);flex:none}
.qbtn:hover{border-color:var(--border-strong)}
.qbtn+.search{margin-left:0}
kbd{font:10.5px var(--mono);color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--surface-2)}
.center{flex:1;min-width:0;display:flex;flex-direction:column}
.tabbar{display:flex;align-items:flex-end;gap:6px;padding:6px 8px 0 10px;background:var(--surface-2);border-bottom:1px solid var(--border);min-height:37px;flex:none;position:relative;z-index:5}
.tabs-s{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:thin}
.tb1{display:flex;align-items:center;gap:6px;max-width:190px;padding:5px 5px 6px 10px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;font-size:12px;color:var(--text-2);cursor:pointer;white-space:nowrap;flex:none;position:relative;top:1px}
.tb1:hover{background:var(--surface-3)}
.tb1 .nm{overflow:hidden;text-overflow:ellipsis}
.tb1.on{background:var(--bg);border-color:var(--border);color:var(--text);font-weight:600}
.tb1.rt{box-shadow:inset 0 2px 0 var(--pending)}
.app .tb1 svg{width:12px;height:12px;color:var(--text-3)}
.tb1 .x{border:0;background:none;color:var(--text-3);cursor:pointer;font-size:14px;line-height:1;padding:0 3px;border-radius:4px}
.tb1 .x:hover{background:var(--surface-3);color:var(--text)}
.tadd{border:0;background:none;color:var(--text-3);font-size:16px;cursor:pointer;padding:2px 8px 6px;flex:none}
.tabbar .kebab{margin:0 0 4px auto}
.tabbar .none{font-size:11.5px;color:var(--text-3);padding:0 0 9px}
.panes{flex:1;display:flex;min-height:0;min-width:0}
.panes .main{flex:1 1 0}
.panes .main.rp{border-left:2px solid var(--pending-bg);background:#fbfbfe}
.rph{display:flex;align-items:center;gap:8px;margin:-6px 0 8px;font-size:11.5px;color:var(--pending)}
.docw{max-width:820px}
.dlinks{margin-top:14px;padding-top:8px;border-top:1px dashed var(--border-strong);font-size:12px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dlink{color:var(--accent);cursor:pointer;font-weight:600}
.ilink{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.paper h2 .hn{margin-left:auto;font-size:11px;font-weight:500;color:var(--text-3);border:1px solid var(--border);border-radius:999px;padding:0 8px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.paper h2 .hn:hover{color:var(--accent);border-color:var(--accent-line)}
.paper h2.flash{animation:flash 1.4s}
.attph{border:1px dashed var(--border-strong);border-radius:10px;padding:40px;text-align:center;color:var(--text-3);margin-top:10px}
.ap{margin-bottom:16px}
.ap h4{display:flex;align-items:baseline;gap:6px;margin:0 0 6px;font-size:12.5px}
.ap h4 small{font-weight:400;color:var(--text-3);font-size:11px}
.olr{padding:3px 8px;border-radius:0 6px 6px 0;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:6px;border-left:2px solid var(--border)}
.olr:hover{background:var(--surface-2);border-left-color:var(--accent)}
.bg{font-size:11.5px;color:var(--text-2);margin:8px 0 2px;font-weight:600}
.bg small{font-weight:400;color:var(--text-3)}
.alr{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:12px;min-width:0}
.alr:hover{background:var(--surface-2)}
.alr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alr .nm small{color:var(--text-3);margin-left:4px}
.alr .dt{font:10.5px var(--mono);color:var(--text-3);flex:none;width:34px}
.app .alr svg{width:12px;height:12px;color:var(--text-3)}
.alr.muted{cursor:default}
details.nb{border:1px solid var(--border);border-radius:10px;padding:6px 10px}
details.nb>summary{cursor:pointer;font-weight:700;font-size:12.5px;list-style:none}
details.nb>summary::before{content:"▸ ";color:var(--text-3)}
details.nb[open]>summary::before{content:"▾ "}
details.nb>summary::-webkit-details-marker{display:none}
details.nb summary small{font-weight:400;color:var(--text-3)}
svg.mini{width:100%;height:150px;display:block;cursor:pointer;margin-top:6px;background:#fbfcfe;border-radius:8px;stroke:none}
svg.mini line{stroke:#c9d1dd;stroke-width:1}
svg.mini text{fill:var(--text-2);font-size:9px;stroke:none}
svg.mini text.c{fill:var(--text);font-weight:700;font-size:10px}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.ih h1{font-size:21px;margin:0}

// ── 문서 목록 · 읽기 · 고치기 ──
function pickKn(){let k=S.route.kn; const vk=visibleKns(); if(!k||k==='*'||!vk.includes(k)){k=vk.includes(S.lastKn[S.persona])?S.lastKn[S.persona]:vk[0]; S.route.kn=k;} return k;}
function myPendingIn(k,docId){return S.pending.filter(x=>x.kn===k&&(!docId||x.doc===docId)&&(S.inbox[k]||[]).some(i=>i.id===x.id))}
// ── 항목 · 기록(가운데 자료) ──
function kindGuess(n,s){ if(s.auto||/테이블|표/.test(n)) return '테이블'; if(/화면|메뉴|흐름/.test(n)) return '화면'; if(/API|인터페이스|^\//.test(n)) return 'API'; if(/용어|코드|규칙|이름/.test(n)) return '용어'; return '절차'; }
function itemsOf(k){return memo('items:'+k,()=>{
 const def=IDEF[k], out=[];
 if(def){ def.forEach(([kind,name,doc,sec,alias])=>{ if(doc&&!findDoc(k,doc)) doc=null; out.push({kind,name,doc,sec:doc?sec:null,alias:alias||[]}); });
  if(k==='dpms') TABLES.forEach(n=>out.push({kind:'테이블',name:n,doc:null,sec:null,alias:[],table:true})); }
 else docsOf(k).forEach(d=>d.secs.forEach(s=>{const name=(s.h==='개요'||s.h==='내용'||s.h==='머리말')?d.title:s.h; if(out.some(x=>x.name===name)) return; out.push({kind:kindGuess(name,s),name,doc:d.id,sec:s.h,alias:[]});}));
 return out;});}
function itemByName(k,n){return memo('ibn:'+k,()=>{const m={}; itemsOf(k).forEach(i=>m[i.name]=i); return m;})[n]||null}
function itemOfSec(k,doc,h){return itemsOf(k).find(i=>i.doc===doc&&i.sec===h)||null}
function secOfItem(k,i){return i&&i.doc?findSec(k,i.doc,i.sec):null}
function aliasOf(k,i){const s=secOfItem(k,i); return [...new Set([...(i.alias||[]),...((s&&s.alias)||[])])]}
function recordsOf(k){return memo('recs:'+k,()=>{
 const pend=(S.inbox[k]||[]).map(i=>({id:i.id,date:'10-22',tm:i.tm,who:i.who,title:i.title,body:i.small||'',touches:i.touches||null,target:i.target,eff:i.eff,state:'pend'}));
 const st=(S.recs[k]||[]).map(r=>Object.assign({state:'in'},r)).sort((a,b)=>b.date.localeCompare(a.date));
 return pend.concat(st);});}
function recById(k,id){return recordsOf(k).find(r=>r.id===id)||null}
function recItems(k,r){
 if(r.touches) return r.touches.map(n=>itemByName(k,n)).filter(Boolean);
 const out=[]; const [dt,sh]=String(r.target||'').split(' › '); const d=docsOf(k).find(x=>x.title===dt);
 if(d&&sh){const i=itemOfSec(k,d.id,sh); if(i) out.push(i);}
 if(!out.length&&r.eff&&r.eff.sec){const i=itemOfSec(k,r.eff.doc,r.eff.sec); if(i) out.push(i);}
 return out;}
function recIndex(k){return memo('ridx:'+k,()=>{const m={}; recordsOf(k).forEach(r=>recItems(k,r).forEach(i=>{(m[i.name]=m[i.name]||[]).push(r)})); return m;})}
function recsOfItem(k,i){return (i&&recIndex(k)[i.name])||[]}
function itemPend(k,i){return recsOfItem(k,i).filter(r=>r.state==='pend')}
function usesOf(k,it){return memo('uses:'+k+':'+it.name,()=>{const keys=[it.name,...aliasOf(k,it)].filter(x=>x.length>=2); return itemsOf(k).filter(u=>!u.table&&u!==it).filter(u=>{const s=secOfItem(k,u); return s&&keys.some(x=>s.b.includes(x));});})}
function coItems(k,it){const c={}; recsOfItem(k,it).forEach(r=>recItems(k,r).forEach(o=>{if(o!==it) c[o.name]=(c[o.name]||0)+1;})); return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({it:itemByName(k,n),n:v}));}
function firstLine(k,i){const s=secOfItem(k,i); if(s) return String(s.b).split('\n')[0].replace(/`/g,''); const rs=recsOfItem(k,i); return rs.length?rs[0].title:'아직 글이 없다';}
function docPendSet(k){return memo('pds:'+k,()=>{const s=new Set(); recordsOf(k).filter(r=>r.state==='pend').forEach(r=>recItems(k,r).forEach(i=>i.doc&&s.add(i.doc))); S.pending.filter(x=>x.kn===k).forEach(x=>s.add(x.doc)); return s;})}
function backlinks(k,d){return memo('bl:'+k+':'+d.id,()=>{
 const its=itemsOf(k).filter(i=>i.doc===d.id);
 const recs=recordsOf(k).filter(r=>recItems(k,r).some(i=>i.doc===d.id));
 const L=S.links[k]||{}; const linkers=Object.keys(L).filter(a=>L[a].includes(d.id)).map(a=>findDoc(k,a)).filter(Boolean);
 const keys=[d.title,...its.map(i=>i.name),...its.flatMap(i=>aliasOf(k,i))].filter(x=>x&&x.length>=2);
 const ments=[]; docsOf(k).forEach(o=>{ if(o.id===d.id||linkers.includes(o)) return; const s=o.secs.find(s=>keys.some(x=>(s.h+' '+s.b).includes(x))); if(s) ments.push({d:o,h:s.h,x:keys.find(x=>(s.h+' '+s.b).includes(x))}); });
 return {recs,linkers,ments};});}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
function linkify(h,k,self){
 const m=memo('lmap:'+k,()=>{const map={}; itemsOf(k).forEach(i=>{if(i.table) return; if(!map[i.name]) map[i.name]=i.name; aliasOf(k,i).forEach(a=>{if(!map[a]) map[a]=i.name;});}); return map;});
 const keys=Object.keys(m).filter(x=>x.length>=2&&x!==self&&m[x]!==self).sort((a,b)=>b.length-a.length);
 if(!keys.length) return h;
 const re=new RegExp(keys.map(reEsc).join('|'),'g');
 return h.split(/(<[^>]+>)/).map(p=>p.charAt(0)==='<'?p:p.replace(re,x=>`<span class="ilink" data-a="openItem" data-k="${k}" data-n="${esc(m[x])}" data-pv="item|${k}|${esc(m[x])}">${x}</span>`)).join('');
}

// ── 탭 · 나누기 · 이전/다음 ──
function activeTab(){return S.tabs.find(t=>t.id===S.active)||null}
function tabOf(id){return S.tabs.find(t=>t.id===id)||null}
function isAct(kind,k,ref){const t=activeTab(); return !!t&&t.kind===kind&&t.kn===k&&t.ref===ref}
function openTab(t,o){o=o||{};
 let ex=S.tabs.find(x=>x.kind===t.kind&&x.kn===t.kn&&x.ref===t.ref);
 if(ex){ex.hl=t.hl||null; ex.q=t.q||null;}
 else {ex=Object.assign({hl:null,q:null},t,{id:uid()}); const i=S.tabs.findIndex(x=>x.id===S.active); S.tabs.splice(i<0?S.tabs.length:i+1,0,ex);}
 S.active=ex.id; if(S.split===ex.id) S.split=null; S.edit=null; S.route.kn=t.kn; S.lastKn[S.persona]=t.kn;
 if(o.view) S.route.scr=o.view; else if(!['docs','items'].includes(S.route.scr)) S.route.scr=t.kind==='item'?'items':'docs';
 if(!o.noHist) pushHist();
 return ex;}
function tabTitle(t){ if(t.kind==='doc') return docTitle(t.kn,t.ref); if(t.kind==='rec'){const r=recById(t.kn,t.ref); return r?r.title.split(' — ')[0]:'기록';} return t.ref; }
function tabIcon(t){return t.kind==='doc'?svg('doc'):t.kind==='item'?svg('tag'):t.kind==='att'?svg('clip'):'<i class="pd"></i>'}
function closeTab(id){const i=S.tabs.findIndex(t=>t.id===id); if(i<0) return; S.tabs.splice(i,1);
 if(S.split===id) S.split=null;
 if(S.active===id){const n=S.tabs[i]||S.tabs[i-1]; S.active=n?n.id:null; if(n) S.route.kn=n.kn;}
 if(S.split===S.active) S.split=null;
 if(S.edit&&S.edit.tab===id) S.edit=null;
 pushHist();}
function toggleSplit(){ S.menu=null;
 if(S.split){S.split=null; render(); return;}
 const a=activeTab(), others=S.tabs.filter(t=>t.id!==S.active);
 if(!a||!others.length){toast('탭이 둘 있어야 나란히 본다 — Ctrl O 로 하나 더 연다'); render(); return;}
 const i=S.tabs.indexOf(a); const o=(S.tabs[i-1]&&S.tabs[i-1].id!==S.active)?S.tabs[i-1]:others[others.length-1];
 S.split=o.id; if(!['docs','items'].includes(S.route.scr)) S.route.scr=a.kind==='item'?'items':'docs'; S.edit=null; render();}
function snap(){const t=['docs','items'].includes(S.route.scr)?activeTab():null; return {scr:S.route.scr,kn:S.route.kn,tab:t?{kind:t.kind,kn:t.kn,ref:t.ref}:null};}
function pushHist(){const s=snap(), c=S.hist[S.hpos]; if(c&&JSON.stringify(c)===JSON.stringify(s)) return; S.hist=S.hist.slice(0,S.hpos+1); S.hist.push(s); if(S.hist.length>80) S.hist.shift(); S.hpos=S.hist.length-1;}
function histGo(d){const i=S.hpos+d; if(i<0||i>=S.hist.length) return; S.hpos=i; const s=S.hist[i];
 S.route={scr:s.scr,kn:s.kn,q:null}; S.menu=null; S.edit=null; S.pal=null; S.qo=null; S.cmd=null;
 if(s.tab) openTab(Object.assign({},s.tab),{noHist:true,view:s.scr});
 render(); scrollTopMain();}
function tabbarHtml(){

 const tabs=S.tabs.map(t=>`<div class="tb1${t.id===S.active&&!g?' on':''}${t.id===S.split&&!g?' rt':''}" data-a="actTab" data-id="${t.id}" data-t="tab" data-name="${esc(tabTitle(t))}" title="${esc(KN(t.kn).name+' › '+tabTitle(t))}${t.id===S.split?' — 오른쪽에 나란히':''}">${tabIcon(t)}<span class="nm">${esc(tabTitle(t))}</span><button class="x" data-a="closeTab" data-id="${t.id}" data-t="tabX" title="닫기">×</button></div>`).join('');
 const menu=S.menu==='tabs'?`<div class="menu" style="right:0;top:28px" data-t="tabMenu"><div class="mi" data-a="splitToggle" data-t="splitBtn">${S.split?'나누기 닫기':'나누어 보기'}<small>Ctrl \\</small></div><div class="mi" data-a="openQo">빨리 열기<small>Ctrl O · Ctrl T</small></div><div class="sep"></div><div class="mi" data-a="closeOthers" data-t="closeOthers">다른 탭 모두 닫기</div></div>`:'';
 return `<div class="tabbar" data-t="tabbar"><div class="tabs-s">${tabs||'<span class="none">열린 탭이 없다 — 왼쪽에서 열거나 Ctrl O</span>'}</div><button class="tadd" data-a="openQo" data-t="tabAdd" title="빨리 열기 (Ctrl O · Ctrl T)">+</button><button class="kebab${S.menu==='tabs'?' on':''}" data-a="menu" data-m="tabs" data-t="tabKebab" title="나누어 보기 · 탭">⋯${menu}</button></div>`;

  <div class="callout gray" data-t="docsEmpty">왼쪽 나무에서 문서나 기록을 연다 — 여러 개를 탭으로 띄우고, <b>Ctrl \\</b> 로 둘을 나란히 본다. 이름으로 바로 열려면 <b>Ctrl O</b>.</div>

function treeHtml(k){
 const n=KN(k), ds=docsOf(k), fk=f=>!!S.fold[k+':'+f], pds=docPendSet(k);
 const all=S.route.all, list=all?ds:ds.slice(0,11);
 const head=(f,l,cnt,extra)=>`<div class="tf" data-a="fold" data-f="${f}" data-t="fold-${f}"><span class="ar">${fk(f)?'▸':'▾'}</span>${l}${extra||''}<span class="cnt">${cnt}</span></div>`;
 let h=`<div class="tree" data-t="tree"><div class="lh">${esc(n.name)}</div>`+head('docs','문서',ds.length);
 if(!fk('docs')) h+=list.map(d=>`<div class="tn${isAct('doc',k,d.id)?' on':''}" data-a="openDoc" data-k="${k}" data-d="${esc(d.id)}" data-t="doc" data-name="${esc(d.title)}" data-pv="doc|${k}|${esc(d.id)}">${svg('doc')}<span class="nm">${esc(d.title)}</span>${pds.has(d.id)?'<i class="pd" title="아직 문서에 안 넣은 기록이 있다"></i>':''}${d.chip?'<i class="nw" title="새로 바뀜"></i>':''}</div>`).join('')+(!all&&ds.length>11?`<div class="tn more" data-a="allDocs" data-t="moreDocs">${ds.length-11}개 더</div>`:'');

function miniGraph(k,c){

function scopeKns(){const k=S.route.kn; const vk=visibleKns().filter(x=>!pcBlocked(x)); if(k&&k!=='*'&&vk.includes(k)&&KNSCR.includes(S.route.scr)) return [k]; return vk;}
function doSearch(q){
 q=String(q||'').trim(); if(!q) return null;
 const nq=norm(q), ks=scopeKns(), all=[];
 ks.forEach(k=>docsOf(k).forEach(d=>d.secs.forEach(s=>all.push({k,d,s}))));
 const exact=all.filter(x=>norm(x.s.h)===nq||(norm(x.d.title)===nq&&x.d.secs[0]===x.s));
 if(exact.length) return {mode:'exact',hits:exact,ks};
 const toks=q.split(/\s+/).filter(t=>t.length>=1);
 // 낱말의 절반 이상이 든 글만 — 「배포」 하나만 맞은 글은 비슷한 글이 아니다
 const need=Math.ceil(toks.length/2);
 const sc=all.map(x=>{let v=0,m=0; const hay=x.s.h+' '+x.s.b;
  const al=(x.s.alias||[]).some(a=>norm(a)===nq); if(al) v+=100;
  if(norm(hay+x.d.title).includes(nq)) v+=30;
  toks.forEach(t=>{if(hay.includes(t)){v+=10;m++;} if(x.s.h.includes(t)) v+=5;});
  return Object.assign({v,ok:al||v>=30||m>=need},x);}).filter(x=>x.v>0&&x.ok).sort((a,b)=>b.v-a.v);

}

   const pk=whoKey(i.who);
   if(pk){ if(i.kind==='changed') addToday(pk,{tm,kt:'team',yl:true,b:'kmd 가 정리하며 값을 바꿨다 — '+KN(k).name+' › '+i.target+' · '+i.vfrom+' → '+i.vto,small:'내 기록에서('+i.tm+') — 되돌릴 수 있다',eff:i.eff,applied:true,link:r.id,go:i.eff&&i.eff.type!=='newdoc'?{kn:k,doc:i.eff.doc,hl:i.eff.sec}:null});
     else if(i.kind==='put') addToday(pk,{tm,kt:'team',dot:'acc',text:'kmd 가 정리했다 — '+KN(k).name+' › '+i.target,small:'내 기록에서('+i.tm+')',eff:i.eff,applied:true,link:r.id,go:i.eff?{kn:k,doc:i.eff.doc,hl:i.eff.sec||null}:null}); }
   return r;});
  rows.forEach(r=>{const d=r.eff&&findDoc(k,r.eff.doc); if(d){d.chip='새로 바뀜';}});
  // 넣은 기록은 「기록」 나무와 항목의 지난 기록으로
  rows.forEach(r=>{const s=r.src; (S.recs[k]=S.recs[k]||[]).unshift({id:s.id,date:'10-22',tm,who:s.who,title:s.title,body:(s.small||'')+' · '+s.tm+' 에 남김 — '+tm+' 정리 때 문서에',touches:s.touches||null,target:s.target,eff:s.eff});});
  S.inbox[k]=rest; S.pending=S.pending.filter(x=>rest.some(i=>i.id===x.id)||x.kn!==k);
  (S.runs[k]=S.runs[k]||[]).forEach(r=>r.open=false);
  S.runs[k].unshift({id:uid(),tm:'방금 '+tm,rows,open:true});
  KN(k).lastTidy='방금 '+tm+' 정리 — '+rows.filter(r=>r.kind!=='keep').length+'건 넣음';
  S.tidyMsg[k]=S.cond.loginRest?{cls:'warn',t:'규칙으로 되는 것만 넣었다 — '+rows.length+'건 · 나머지는 로그인이 돌아오면'}:null;
  S.tidyRun=null; render();
  if(from==='toast'||S.route.scr!=='tidy') toast('정리했다 — '+rows.length+'건을 '+esc(KN(k).name)+'에 넣었다'+(S.cond.loginRest?' · 규칙으로 되는 것만':''));
 };
 setTimeout(step,1100);
}

function parseAdd(t){
 t=String(t||'').trim(); if(!t) return null;
 const p=P();
 if(/^(postgres(ql)?|mysql|oracle|mssql):\/\//i.test(t)||/\.git$/i.test(t)||/^git@/i.test(t)) return {kind:'src'};
 let m;
 if((m=t.match(/^https?:\/\/kmd\.team\.local\/r\/([^\/\s?#]+)/i))){const id=m[1].replace(/_wiki$/,'').toLowerCase(); const k=S.kns[id]&&S.kns[id].type==='team'?id:null; return {kind:'team',k,slug:m[1]};}
 if(/^[A-Za-z]:\\/.test(t)){const nm=t.replace(/[\\]+$/,'').split('\\').pop()||t; return {kind:'folder',path:t,name:nm};}
 if(/^https?:\/\//i.test(t)) return {kind:'bad'};
 return {kind:'new',name:t};
}

function saveDoc(){
 const k=S.edit.kn,d=findDoc(k,S.edit.doc); const txt=$('#edTx').value;
 // 글을 항목으로 다시 가른다
 const parts=[]; let cur=null;
 txt.split('\n').forEach(line=>{const m=line.match(/^##\s+(.+)$/); if(m){cur={h:m[1].trim(),b:[]}; parts.push(cur);} else { if(!cur){cur={h:'머리말',b:[]}; parts.push(cur);} cur.b.push(line);} });
 const oldMap={}; d.secs.forEach(s=>oldMap[s.h]=s);
 let newSecs=parts.map(p=>{const b=p.b.join('\n').replace(/^\n+|\n+$/g,''); const o=oldMap[p.h]; const s=o&&!o.auto?Object.assign(clone(o),{b}):{h:p.h,b}; if(o&&o.b!==b){delete s.by; delete s.tidy;} return s;});
 d.secs.forEach((s,i)=>{if(s.auto) newSecs.splice(Math.min(i,newSecs.length),0,clone(s));});
 const changed=newSecs.filter(s=>!s.auto&&(!oldMap[s.h]||oldMap[s.h].b!==s.b)).map(s=>s.h);
 S.edit=null;
 if(!changed.length){toast('바뀐 글이 없다 — 그대로 두었다'); render(); return;}
 bump(); const tm=now(); const before=clone(d.secs);
 const direct=isMine(k)||roleIn(k)==='주인';
 if(direct){
  newSecs.forEach(s=>{if(changed.includes(s.h)) s.by=tm+' 화면에서 고침 — 저장';});
  d.secs=newSecs; d.when='오늘 '+tm;
  addToday(personKey(),{tm,kt:isMine(k)?'me':'team',dot:'acc',text:'화면에서 고침 — '+KN(k).name+' › '+d.title+' 「'+changed.join(' · ')+'」',small:'저장했다 — 문서에도 넣었다',go:{kn:k,doc:d.id,hl:changed[0]}});
  // 보낼 곳이 있는 내 지식이면 보낼 것에 모인다
  const n=KN(k);
  if(n.type==='pc'&&n.dest&&n.dest.length&&!S.sendq.some(q=>q.docKey===k+'/'+d.id&&q.on)){
   const eff={type:'newdoc',kn:'dpms',doc:d.title+'-'+n.name,title:d.title+'('+n.name+')',secs:clone(newSecs.filter(s=>!s.auto))};
   S.sendq.push({id:uid(),docKey:k+'/'+d.id,title:d.title+' — '+changed.join(' · '),from:n.name,when:'오늘 '+tm,to:'고친 것 → DPMS',on:true,item:{who:'김',title:d.title+' — '+changed.join(' · '),small:n.name+'에서 보냄',kind:'put',target:d.title+'('+n.name+')',eff}});
  }
  toast('저장했다 — 문서에도 넣었다');
 } else {
  const id=uid(); const preview={}; newSecs.forEach(s=>{if(changed.includes(s.h)) preview[s.h]=s.b.slice(0,40)+(s.b.length>40?'…':'');});
  MEMO={}; const touches=changed.map(h=>{const it=itemOfSec(k,d.id,h); return it&&it.name;}).filter(Boolean);
  const item={id,who:P().who,tm,title:d.title+' › '+changed.join(' · ')+' 고침',small:'팀 화면에서 남긴 기록',kind:'put',target:d.title+' › '+changed[0],touches,eff:{type:'secs',kn:k,doc:d.id,before,after:newSecs}};
  (S.inbox[k]=S.inbox[k]||[]).push(item);
  S.pending.push({id,kn:k,doc:d.id,tm,secs:changed,preview});
  addToday(personKey(),{tm,kt:'team',dot:'pend',text:KN(k).name+'에 기록 — '+d.title+' 「'+changed.join(' · ')+'」',small:'오늘 밤 '+KN(k).tidyAt+' 정리 때 문서에',go:{kn:k,doc:d.id,hl:changed[0]}});
  toast('기록했다 — 오늘 밤 '+KN(k).tidyAt+' 정리 때 문서에 들어간다 · 바로 넣으려면 <a data-a="tidyNow" data-k="'+k+'" data-t="toastTidy">지금 정리</a>',7000);
 }
 render();
}
function fetchSrc(id){
 const s=S.sources.find(x=>x.id===id); if(!s||s.run==='run') return;
 s.run='run'; render();
 setTimeout(()=>{bump(); const tm=now(); const a=S.autos[s.auto]; let msg;
  if(a&&s.changesLeft>0){ s.changesLeft--; const r=a.rows.length-1; const v=a.rows[r]; const ci=v.length-1; v[ci]=bumpVer(v[ci]); a.chg=[r,ci]; msg='가져왔다 — 바뀐 표 1 · '+tm; s.lastNote='바뀐 표 1';
   const d=docsOf(s.kn).find(x=>x.title===s.doc); if(d){d.chip='새로 바뀜'; d.when='오늘 '+tm;}
   addToday(personKey(),{tm,kt:'team',dot:'acc',text:s.name+'에서 바뀐 표 1 — '+KN(s.kn).name+' › '+s.doc,small:'저절로 채우는 표 · 지금 가져오기',go:d?{kn:s.kn,doc:d.id}:null}); }
  else {msg='가져왔다 — 그대로 · '+tm; s.lastNote='그대로';}
  if(a) a.checked='오늘 '+tm;
  s.last='오늘 '+tm; s.run=msg; render();},1500);
}
function bumpVer(v){const m=String(v).match(/^(.*?)(\d+)$/); return m?m[1]+(Number(m[2])+1):v+'.1';}

}

// ── 파일 · 폴더 넣기 ──
const DOCX=['md','docx','pptx','xlsx'], IMG=['png','jpg','jpeg','gif','svg','webp','bmp'], PCONLY=['hwpx','pdf','hwp'];
function extOf(n){const m=String(n).toLowerCase().match(/\.([a-z0-9]+)$/); return m?m[1]:'';}
function baseOf(n){return String(n).split(/[\\\/]/).pop().replace(/\.[^.]+$/,'');}
function classify(n){const e=extOf(n),pc=P().where==='pc'; if(DOCX.includes(e)||(pc&&PCONLY.includes(e))) return 'doc'; if(IMG.includes(e)||(!pc&&PCONLY.includes(e))) return 'att'; return 'skip';}
function takeFiles(files){
 files=[...files]; if(!files.length) return;
 const scope=srcScope(); const groups={}; const singles=[];
 files.forEach(f=>{const rp=f.webkitRelativePath||f._rel||''; if(rp&&rp.includes('/')){const top=rp.split('/')[0]; (groups[top]=groups[top]||[]).push(f);} else singles.push(f);});
 const tKn=ensureInbox(), tName=KN(tKn).name, teamKn=KN(tKn).type==='team';
 bump(); const tm=now();
 Object.keys(groups).forEach(top=>{
  const fs=groups[top]; const row={tm,title:top+' 폴더 → '+tName+' › '+top,msg:'바꾸는 중…',cls:'run'}; S.imports[scope].unshift(row);
  setTimeout(()=>{let dn=0,at=0,sk=0; fs.forEach(f=>{const c=classify(f.name); if(c==='doc'){dn++; const rel=(f.webkitRelativePath||f._rel).split('/'); addImportedDoc(tKn,rel.slice(0,-1).join(' › ')+' › '+baseOf(f.name),f.name);} else if(c==='att') at++; else sk++;});
   row.msg=top+' 폴더 — 문서 '+dn+' · 첨부 '+at+' · 넣지 않은 파일 '+sk; row.cls=sk?'bad':''; row.title=top+' 폴더 → '+tName+' › '+top;
   addToday(personKey(),{tm:now(),kt:teamKn?'team':'me',dot:'acc',text:top+' 폴더를 '+tName+'에 넣었다',small:row.msg}); render();},1000);
 });
 singles.forEach((f,i)=>{
  const row={tm,title:f.name,msg:'바꾸는 중…',cls:'run'}; S.imports[scope].unshift(row);
  setTimeout(()=>{const c=classify(f.name),e=extOf(f.name),b=baseOf(f.name);
   if(c==='doc'){const d=addImportedDoc(tKn,b,f.name); row.title=f.name+' → '+tName+' › '+b; row.msg=teamKn?'기록이 됐다 — '+tName+' › '+b+' · 다음 정리 때 문서에':'문서가 됐다 — '+tName+' › '+b; row.cls=''; row.go=teamKn?null:{kn:tKn,doc:d.id};
     addToday(personKey(),{tm:now(),kt:teamKn?'team':'me',dot:'acc',text:f.name+' 를 문서로 — '+tName,small:'원본은 첨부로 두었다',go:teamKn?null:{kn:tKn,doc:d.id}});}
   else if(c==='att'&&PCONLY.includes(e)){row.title=f.name+' → '+tName+' › '+b; row.msg='원본은 첨부로 두었다 — 내 PC 프로그램이 있는 PC 에서 바꾼다'; row.cls='bad';}
   else if(c==='att'){row.msg='그림은 첨부로 두었다 — '+tName; row.cls='';}
   else {row.msg='넣지 않은 파일 — 읽지 못하는 종류(.'+(e||'?')+')'; row.cls='bad';}
   render();},800+i*250);
 });
 render();
}
function addImportedDoc(k,title,fname){
 const id=title; let d=findDoc(k,id);
 if(!d){d=doc(id,title,'방금',[sec('내용',fname+' 에서 바꾼 글 — 목업이라 내용은 비워 둔다. 원본은 첨부로 두었다.')],{chip:'새로 바뀜'});
  if(KN(k).type==='team'){(S.inbox[k]=S.inbox[k]||[]).push({id:uid(),who:P().who,tm:now(),title:fname+' — 넣은 파일',small:'자료 가져오기',kind:'put',target:title+'(새 문서)',eff:{type:'newdoc',kn:k,doc:id,title,secs:clone(d.secs)}});}
  else docsOf(k).unshift(d);}
 return d;
}
function readEntries(entry,path,out){
 return new Promise(res=>{
  if(entry.isFile){entry.file(f=>{f._rel=path+f.name; out.push(f); res();},()=>res());}
  else if(entry.isDirectory){const rd=entry.createReader(); const all=[]; const next=()=>rd.readEntries(es=>{ if(!es.length){Promise.all(all.map(e=>readEntries(e,path+entry.name+'/',out))).then(res);} else {all.push(...es); next();}},()=>res()); next();}
  else res();
 });
}

// ───────────── 이벤트 ─────────────
document.addEventListener('click',ev=>{
 MEMO={};
 const el=ev.target.closest('[data-a]');
 if(!el){ if(S.menu&&!ev.target.closest('.menu')){S.menu=null; render();} return;}
 if(el.dataset.self&&ev.target!==el) return;
 const f=ACT[el.dataset.a]; if(!f) return;
 if(el.tagName==='A') ev.preventDefault();
 if(S.menu&&!['menu','kmenu','setEvery','pickKn'].includes(el.dataset.a)&&!ev.target.closest('.menu')) S.menu=null;
 f(el,ev);
});
document.addEventListener('submit',ev=>{
 const f=ev.target; if(f.dataset.f!=='login') return; ev.preventDefault();
 const id=$('#lgId').value.trim(), pw=$('#lgPw').value;
 if(!id||!pw){S.pwErr=true; render(); return;}
 S.pwErr=false; S.logged[S.persona]=true; go({scr:'home',kn:'*'});
});
document.addEventListener('input',ev=>{
 const t=ev.target; const k=t.dataset&&t.dataset.in; if(!k) return;
 // 칸은 다시 그리지 않는다(한글 입력이 끊기지 않게) — 결과 자리만 바꾼다
 if(k==='pal'){S.pal.q=t.value; S.pal.more=false; $('#palBody').innerHTML=palBody();}
 if(k==='src'){S.srcDraft=t.value; const h=srcHeard(); $('#srcHeardBox').innerHTML=h.heard; $('#srcBtnBox').innerHTML=h.btn;}
 if(k==='add'){S.addDraft=t.value; const h=addHeard(); $('#addHeardBox').innerHTML=h.heard; $('#addBtnBox').innerHTML=h.btn; const m=$('[data-t=addMsg]'); if(m){S.addMsg=null; m.remove();}}
 MEMO={};
 if(k==='itemQ'){S.iq=t.value; $('#itemListBody').innerHTML=itemListBody(S.route.kn);}
 if(k==='gQ'){S.g.f.q=t.value; gHighlight();}
 if(k==='qo'){S.qo.q=t.value; S.qo.sel=0; $('#qoBody').innerHTML=qoBody();}
 if(k==='cmd'){S.cmd.q=t.value; S.cmd.sel=0; $('#cmdBody').innerHTML=cmdBody();}
 if(k==='ag'){S.agent.draft=t.value; $('#agBtnBox').innerHTML=agBtn();}
 if(k==='admCode'){S.admClaude.code=t.value; $('#admDoneBox').innerHTML=admDoneBtn();}
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.id==='fileIn'||t.id==='dirIn'){takeFiles(t.files); return;}
 if(t.id==='evAt'){const m=S.menu&&S.menu.split(':')[1]; const s=S.sources.find(x=>x.id===m); if(s){s.every={t:'daily',at:t.value||'06:00'}; S.menu=null; toast(esc(s.name)+' — 이제 매일 '+s.every.at+' 가져온다'); render();}}
 if(t.dataset&&t.dataset.c){S.cond[t.dataset.c]=t.checked; onCond(t.dataset.c,t.checked); render();}
});
function listKeys(ev,st,bodyId,bodyFn,pick){
 if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault(); const n=(st.list||[]).length; if(n){st.sel=(st.sel+(ev.key==='ArrowDown'?1:-1)+n)%n; $('#'+bodyId).innerHTML=bodyFn(); const s=$('#'+bodyId+' .qr.sel'); if(s) s.scrollIntoView({block:'nearest'});} return true;}
 if(ev.key==='Enter'){ev.preventDefault(); pick(st.sel); return true;}
 return false;}
document.addEventListener('keydown',ev=>{
 MEMO={};
 const ctrl=ev.ctrlKey||ev.metaKey, low=String(ev.key).toLowerCase(), code=ev.code, locked=isTeam()&&!S.logged[S.persona]||(P().key==='kimPc'&&S.cond.pcOff);
 if(S.qo&&ev.target.id==='qoIn'&&listKeys(ev,S.qo,'qoBody',qoBody,qoPick)) return;
 if(S.cmd&&ev.target.id==='cmdIn'&&listKeys(ev,S.cmd,'cmdBody',cmdBody,cmdPick)) return;
 if(ctrl&&!ev.altKey&&!locked){
  if(low==='k'||code==='KeyK'){ev.preventDefault(); S.qo=null; S.cmd=null; S.pal={q:'',more:false}; render(); return;}
  if(low==='o'||low==='t'||code==='KeyO'||code==='KeyT'){ev.preventDefault(); openQo(); return;}
  if(low==='p'||code==='KeyP'){ev.preventDefault(); openCmd(); return;}
  if(ev.key==='\\'||code==='Backslash'){ev.preventDefault(); toggleSplit(); return;}
 }
 if(ev.altKey&&!ctrl&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&!locked&&!/^(TEXTAREA|INPUT)$/.test(ev.target.tagName)){ev.preventDefault(); histGo(ev.key==='ArrowLeft'?-1:1); return;}
 if(ev.key==='Escape'){ if(S.qo){S.qo=null; render();} else if(S.cmd){S.cmd=null; render();} else if(S.pal){S.pal=null; render();} else if(S.modal){S.modal=null; render();} else if(S.menu){S.menu=null; render();} }
 if(ev.key==='Enter'&&ev.target.id==='palIn'){const h=$('#app .hit'); if(h) h.click();}
 if(ev.key==='Enter'&&ev.target.id==='addIn'){const b=$('[data-t=addBtn]'); if(b&&!b.disabled) b.click();}
 if(ev.key==='Enter'&&ev.target.id==='agIn'){ev.preventDefault(); agentAdd();}
 if(ev.key==='Enter'&&ev.target.id==='admCodeIn'){const b=$('[data-t=admDone]'); if(b&&!b.disabled) b.click();}
 if(ev.key==='Enter'&&ev.target.id==='admPw'){const b=$('[data-t=admPwOk]'); if(b) b.click();}
});
// 그래프 — 점 끌기 · 빈 곳 끌어 옮기기 · 휠 확대
let GD=null;
function svgPt(sv,ev,inner){const pt=sv.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; return pt.matrixTransform((inner||sv).getScreenCTM().inverse());}
document.addEventListener('pointerdown',ev=>{const sv=ev.target.closest&&ev.target.closest('#gsvg'); if(!sv||ev.button!==0) return; const nd=ev.target.closest('[data-node]'); GD={sv,node:nd?nd.dataset.node:null,sx:ev.clientX,sy:ev.clientY,moved:false,vx:S.g.view.x,vy:S.g.view.y}; if(!nd) sv.style.cursor='grabbing'; ev.preventDefault();});
document.addEventListener('pointermove',ev=>{ if(!GD) return; const dx=ev.clientX-GD.sx, dy=ev.clientY-GD.sy; if(!GD.moved&&Math.hypot(dx,dy)<4) return; GD.moved=true;
 if(GD.node){const p=svgPt(GD.sv,ev,$('#gview')), q=S.g.pos[GD.node]; if(q){q.x=p.x; q.y=p.y; q.fx=true;} simTick(CURG,0.3,GD.node); paintGraph();}
 else {const m=GD.sv.getScreenCTM(); S.g.view.x=GD.vx+dx/m.a; S.g.view.y=GD.vy+dy/m.d; applyView();}});
document.addEventListener('pointerup',()=>{ if(!GD) return; const g=GD; GD=null; g.sv.style.cursor=''; if(g.moved){ if(g.node) relax(g.node); return;} if(g.node) gClick(g.node);});
document.addEventListener('wheel',ev=>{const sv=ev.target.closest&&ev.target.closest('#gsvg'); if(!sv) return; ev.preventDefault(); zoomAt(svgPt(sv,ev),Math.exp(-ev.deltaY*0.0015));},{passive:false});
// 미리보기 카드
document.addEventListener('mouseover',ev=>{const el=ev.target.closest&&ev.target.closest('[data-pv]'); if(!el) return; if(ev.relatedTarget&&el.contains(ev.relatedTarget)) return; clearTimeout(pvT); pvT=setTimeout(()=>showPv(el),250);});
document.addEventListener('mouseout',ev=>{const el=ev.target.closest&&ev.target.closest('[data-pv]'); if(!el) return; if(ev.relatedTarget&&el.contains(ev.relatedTarget)) return; hidePv();});
document.addEventListener('dragover',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(d){ev.preventDefault(); d.classList.add('over');}});
document.addEventListener('dragleave',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(d) d.classList.remove('over');});
document.addEventListener('drop',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(!d) return; ev.preventDefault(); d.classList.remove('over');
 const items=ev.dataTransfer.items; const ents=items?[...items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean):[];
 if(ents.some(e=>e.isDirectory)){const out=[]; Promise.all(ents.map(e=>readEntries(e,'',out))).then(()=>takeFiles(out));}
 else takeFiles(ev.dataTransfer.files);
});
function onCond(c,on){
 if(c==='serverDown'&&!on&&S.sendWait){const w=S.sendWait; setTimeout(()=>finishSend(w.items,w.tm),600);}
}
document.querySelectorAll('#ctl [data-p]').forEach(b=>b.addEventListener('click',()=>{S.persona=b.dataset.p; S.pal=null; S.modal=null; S.menu=null; S.edit=null; S.pwErr=false; S.addMsg=null; S.qo=null; S.cmd=null;
 S.tabs=[]; S.active=null; S.split=null; S.hist=[]; S.hpos=-1; S.g.sel=null; S.g.f.depth=0; S.setTab='gen'; S.admClaude={step:null}; S.agent.adding=false; S.agent.msg=null;
 S.route={scr:'home',kn:'*',q:null}; pushHist(); render();}));
$('#reset').addEventListener('click',()=>{S=makeState(); T0=Date.now(); $('#toastHost').innerHTML=''; pushHist(); render();});
setInterval(()=>{const s=$('#app .status .r'); if(s) s.textContent='kmd v1.13 · 10-22(목) '+now();},15000);
pushHist(); render();
</script>
