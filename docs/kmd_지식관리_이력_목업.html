<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식 관리 이력 목업</title>
<style>
/* 토큰 · 부품은 app/kmd.css 와 같은 값: 목업에서 새로 생긴 것만 아래 「새 부품」 */
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f7;--surface-3:#e6eaf0;--border:#e2e6ed;--border-strong:#c9d1dd;
  --text:#11151c;--text-2:#515a68;--text-3:#858e9d;--accent:#3358e6;--accent-bg:#e9eeff;--accent-line:#c3d0fb;
  --danger:#cb3a2c;--danger-bg:#fdeceb;--warn:#8c5c00;--warn-bg:#fcf3e0;--pending:#6247c4;--pending-bg:#efedfd;
  --ok:#2e9b5b;--ok-bg:#e6f5ec;
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);
  --shadow-2:0 2px 6px -1px rgba(15,23,42,.08),0 14px 32px -8px rgba(15,23,42,.18);
  --font:Pretendard,-apple-system,"Segoe UI",system-ui,"Malgun Gothic",sans-serif;
  --mono:Consolas,"Cascadia Mono",D2Coding,"Malgun Gothic",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe3ea;color:var(--text);font:13px/1.55 var(--font)}
button,input,select{font:inherit}
a{color:var(--accent);cursor:pointer}
svg.i{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}

/* ── 목업 조종판(목업 밖) ── */
.mframe{display:flex;min-height:100vh}
.mnav{width:250px;flex:none;background:#1b2130;color:#cfd6e4;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.mnav h1{font-size:14px;margin:0 6px 4px;color:#fff}
.mnav p{margin:0 6px 12px;font-size:11.5px;color:#8f9bb3}
.mnav .g{font-size:11px;color:#6f7a90;margin:16px 6px 6px;text-transform:none}
.mnav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:6px 10px;border-radius:6px;font-size:12.5px;cursor:pointer}
.mnav button:hover{background:#2a3246}
.mnav button.on{background:#3358e6;color:#fff}
.mnav button small{display:block;color:#7f8aa1;font-size:11px}
.mnav button.on small{color:#dfe6ff}
.mstage{flex:1;min-width:0;padding:20px}

/* ── 앱 프레임 · 부품(kmd.css 와 같다) ── */
.app{max-width:1360px;margin:0 auto;background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.18);display:flex;min-height:calc(100vh - 40px)}
.side{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px}
.sb-top{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
.logo{width:22px;height:22px;border-radius:6px;background:#11151c;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.brand{font-weight:700;font-size:15px}
.busy{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);font-weight:600}
.busy i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sb-repo{border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.sb-repo .rk{font:700 10.5px var(--mono);background:var(--accent-bg);color:var(--accent);border-radius:5px;padding:2px 5px}
.sb-repo small{display:block;font-size:10.5px;color:var(--text-3)}
.sb-g{font-size:11.5px;color:var(--text-3);margin:12px 8px 4px}
.sb-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text)}
.sb-i.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sb-i .bd{margin-left:auto;background:var(--pending-bg);color:var(--pending);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.sb-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.crumb{font-size:13px;color:var(--text-3)}.crumb b{color:var(--text)}
.band{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:12px;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text-2)}
.band b{color:var(--text)}
.main{flex:1;padding:18px 22px;overflow:auto;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-warn{background:var(--warn-bg);color:var(--warn)}.c-pend{background:var(--pending-bg);color:var(--pending)}.c-mute{background:var(--surface-3);color:var(--text-2)}
.c-acc{background:var(--accent-bg);color:var(--accent)}.c-danger{background:var(--danger-bg);color:var(--danger)}.c-ok{background:var(--ok-bg);color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.pri:hover{background:#2a4bd0}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--surface-2)}
.btn.dz{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:14px}
.big{font-size:20px;font-weight:700;margin:0 0 4px}
.lead{color:var(--text-2);margin:0}
.pg-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.pg-h .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:0 0 14px}
.tabs span{padding:8px 14px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs span.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs span em{font-style:normal;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-2);border-radius:999px;padding:0 6px}
.tabs span.on em{background:var(--accent-bg);color:var(--accent)}
.tabs span em.w{background:var(--warn-bg);color:var(--warn)}
.term{background:#0f141c;color:#d7dde8;border-radius:10px;font:12px/1.6 var(--mono);padding:10px 12px;height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.term .say{color:#e8ecf3}.term .tool{color:#8fb0ff}.term .ok{color:#7fd69a}.term .err{color:#ff8f86}.term .sys,.term .cost{color:#7d8696}
.term .tm{color:#5c6574;margin-right:8px}
.term .sg{display:inline-block;min-width:44px;color:#5c6574;margin-right:6px}
.term .cur::after{content:'▍';color:#8fb0ff;animation:blink 1s steps(2) infinite}
.inp{min-height:28px;border:1px solid var(--border-strong);border-radius:7px;padding:3px 8px;font-size:12px;background:#fff}
.gl{font-size:11.5px;color:var(--text-3);margin:8px 2px 0;line-height:1.7}
.slist{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border)}
.srow:first-child{border-top:0}
.srow .si{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-2)}
.srow .sn{min-width:0;flex:1 1 220px}.srow .sn b{display:block}.srow .sn small,.srow .sc small{display:block;color:var(--text-3);font-size:11.5px}
.srow .sc{flex:0 1 230px;font-size:12px;color:var(--text-2)}
.srow .sa{flex:none;display:flex;gap:6px}


/* ── 새 부품 ── */
.kt{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;flex:none}
.kt.me{background:var(--pending-bg);color:var(--pending)}.kt.team{background:var(--accent-bg);color:var(--accent)}
.mnav .q{margin:18px 6px 0;padding:10px;border:1px solid #333c52;border-radius:8px;font-size:11.5px;color:#b9c2d6;line-height:1.6}
.mnav .q b{color:#fff;display:block;margin-bottom:4px}
.mnav .q ul{margin:0;padding-left:16px}
.ch{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700}
.ch small{font-weight:400;color:var(--text-3);font-size:11.5px}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center;font-weight:400}
.cb{padding:10px 14px}
.cf{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 12px 12px;flex-wrap:wrap}
.muted{color:var(--text-3)}.small{font-size:11.5px}
.wrap{max-width:980px}
/* 보내는 길: 보내는 지식 → 받는 지식(개인 지식마다 하나로 묶였다) */
.route{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.rbox{flex:1 1 260px;min-width:0;padding:12px 14px;position:relative}
.rbox+.rbox{border-left:1px solid var(--border)}
.rbox .lb{font-size:11.5px;color:var(--text-3);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.rbox .nm{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.rbox .sub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.rbox.pick{cursor:pointer}.rbox.pick:hover{background:var(--surface-2)}
.rbox.todo{background:repeating-linear-gradient(135deg,#fff,#fff 8px,#f7f8fb 8px,#f7f8fb 16px)}
.rarr{flex:none;width:44px;display:grid;place-items:center;color:var(--accent);border-left:1px solid var(--border)}
.rarr svg{width:22px;height:22px}
.rarr+.rbox{border-left:0}
.rinfo{padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-2);background:var(--surface-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rinfo .r{margin-left:auto}
.pmenu{position:absolute;left:10px;top:calc(100% - 6px);z-index:5;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-2);min-width:320px;padding:6px}
.pmenu .mi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;font-size:12.5px;cursor:pointer}
.pmenu .mi:hover{background:var(--surface-2)}.pmenu .mi.on{background:var(--accent-bg)}
.pmenu .mi .to{margin-left:auto;color:var(--text-3);font-size:11.5px;display:flex;align-items:center;gap:4px}
.pmenu .sep{height:1px;background:var(--border);margin:4px 0}
.drow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--border);cursor:pointer}
.drow:first-child{border-top:0}
.drow:hover{background:var(--surface-2)}
.drow.on{background:#f5f7ff}
.drow.dim{cursor:default;color:var(--text-3)}.drow.dim:hover{background:none}
.drow input{margin:0;flex:none}
.drow .si{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-2)}
.drow .dn{flex:1;min-width:0}.drow .dn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow.dim .dn b{font-weight:400}
.drow .dn small{display:block;color:var(--text-3);font-size:11.5px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);font-size:11px;padding:2px 8px;cursor:pointer;color:var(--text-2)}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.seg button[disabled]{opacity:.4;cursor:default}
.tabs.in{margin:0;padding:0 8px;flex-wrap:wrap}
.tabs.in span{white-space:nowrap}
.tabs.in span.off{color:var(--text-3);cursor:default}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tbar .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.dlist{max-height:360px;overflow:auto}
.trow{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;cursor:pointer}
.trow:hover{border-color:var(--border-strong)}
.trow.on{border-color:var(--accent);background:var(--accent-bg)}
.trow input{margin:3px 0 0}
.trow .tn2{flex:1;min-width:0}.trow .tn2 b{display:block}.trow .tn2 small{display:block;color:var(--text-3);font-size:11.5px}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.mini svg{color:var(--accent)}
.sum{list-style:none;margin:0;padding:0}
.sum li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.sum li span{flex:1;min-width:0}
.callout{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:9px;font-size:12px;margin-bottom:12px}
.callout.gray{background:var(--surface-2);color:var(--text-2)}
.callout.ok{background:var(--ok-bg);color:#1d6b3e}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.feed .fi{display:flex;gap:10px;padding:8px 14px;border-top:1px solid var(--border);font-size:12px}
.feed .fi:first-child{border-top:0}
.feed .tm{color:var(--text-3);font-family:var(--mono);width:84px;flex:none}
.feed small{display:block;color:var(--text-3)}
.empty{padding:28px 14px;text-align:center;color:var(--text-2)}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);display:grid;place-items:center;z-index:10}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-2);width:560px;max-width:calc(100% - 24px)}
.mh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.mh small{font-weight:400;color:var(--text-3);margin-left:8px;font-size:11.5px}
.mh .xx{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--text-3)}
.mb{padding:14px 16px}.mf{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--border)}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:4px}
.field .inp{width:100%}
.seg.big button{font-size:12.5px;padding:6px 14px}
.bigroute{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);margin-bottom:12px}
.bigroute .e{flex:1;min-width:0}.bigroute .e small{display:block;color:var(--text-3);font-size:11.5px}.bigroute .e b{font-size:15px}
.bigroute svg{width:20px;height:20px;color:var(--accent)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp .side{min-height:420px;border:1px solid var(--border);border-radius:12px}
.note{font-size:12px;color:var(--text-2);background:var(--warn-bg);border-radius:8px;padding:8px 10px;margin-top:10px}
/* ── 이 목업의 새 부품 ── */
.ch{white-space:nowrap}.ch>small{white-space:normal;flex:1;min-width:0}
.sb-i{cursor:pointer}
.sb-i:hover{background:var(--surface-2)}
.sb-i.on:hover{background:var(--accent-bg)}
.sb-i.off{color:var(--text-3);text-decoration:line-through;cursor:default}
.sb-mg{margin-top:auto;border-top:1px solid var(--border);padding-top:6px}
.sb-g .kt{margin-left:4px}
.sb-know .lst{margin:6px 0 0}
.sb-know .lst div{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font-size:12.5px;cursor:pointer}
.sb-know .lst div:hover{background:var(--surface-2)}
.sb-know .lst div.on{background:var(--surface-3);font-weight:600}
.sb-know .lh{font-size:11px;color:var(--text-3);margin:10px 8px 2px}
.kt.pc{background:#e8f6ee;color:#1d6b3e}.kt.gone{background:var(--surface-3);color:var(--text-3)}.kt.adm{background:#11151c;color:#fff}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:6px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);padding:12px 14px;min-height:92px;cursor:pointer}
.kcard b{display:block;font-size:14px;margin-bottom:6px}
.kcard small{color:var(--text-3);font-size:11.5px;display:flex;gap:6px;align-items:center}
.kcard.add{border-style:dashed;box-shadow:none;background:none;display:grid;place-items:center;color:var(--text-2);text-align:center}
.kcard.add .pl{font-size:18px;display:block}
.kcard.dis{opacity:.55;cursor:default}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}
.sec-h b{font-size:15px}.sec-h small{color:var(--text-3);font-size:12px}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow-1)}
.fbar .fl{font-weight:700;display:flex;gap:6px;align-items:center}
.fbar .fp{font-family:var(--mono);background:var(--surface-2);border-radius:6px;padding:3px 8px;flex:1;min-width:200px}
.fbar small{flex-basis:100%;color:var(--text-3);font-size:11.5px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:12.5px}
.kv>span:nth-child(odd){color:var(--text-3)}
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.set:first-child{border-top:0}
.set .tx{flex:1;min-width:0}.set .tx b{display:block;font-weight:600}.set .tx small{display:block;color:var(--text-3);font-size:11.5px}
.sw{width:34px;height:20px;border-radius:999px;background:var(--surface-3);border:0;position:relative;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}.sw.on::after{left:17px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-weight:600;text-align:left;color:var(--text-3);font-size:11.5px;padding:6px 10px;border-bottom:1px solid var(--border)}
table.t td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:middle}
table.t tr:first-child td{border-top:0}
.rv h2{font-size:16px;margin:18px 0 8px}
.rv h2:first-child{margin-top:0}
.rv table.t td{vertical-align:top}
.rv .was{color:var(--text-3)}
.rv ol,.rv ul{margin:4px 0 8px;padding-left:20px}
.rv li{margin:3px 0}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.pill.cut{background:var(--danger-bg);color:var(--danger)}.pill.new{background:var(--ok-bg);color:var(--ok)}.pill.mv{background:var(--accent-bg);color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.g2,.cmp{grid-template-columns:1fr}}
.who-sw{display:flex;gap:6px;margin:6px 6px 0}
.who-sw button{flex:1;border:1px solid #333c52;background:none;color:#cfd6e4;border-radius:6px;padding:4px 0;font-size:11.5px;cursor:pointer}
.who-sw button.on{background:#3358e6;border-color:#3358e6;color:#fff}
.ro{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-2);margin-bottom:12px}
.agrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.agrow:first-child{border-top:0}

  const kinds = ['확인할 것', ...KINDS.filter((k) => !(pc && k === '받음'))].filter((k) => cnt((x) => pass(x, 'kind') && (k === '확인할 것' ? x.check : x.k === k && !x.check)))
  const chips = `<div class="tabs"><span class="${!S.kind ? 'on' : ''}" data-kind="">모든 갈래 <small class="muted">${cnt((x) => pass(x, 'kind'))}</small></span>${kinds.map((k) => `<span class="${S.kind === k ? 'on' : ''}" data-kind="${k}">${k} <small class="muted">${cnt((x) => pass(x, 'kind') && (k === '확인할 것' ? x.check : x.k === k && !x.check))}</small></span>`).join('')}</div>`
  const knSel = `<select class="inp" id="fKn"><option value="">지식 전체</option>${pc ? MINE.map((k) => `<option${S.kn === k.name ? ' selected' : ''}>${esc(k.name)}</option>`).join('') : `<optgroup label="팀 지식">${TEAM.map((k) => `<option${S.kn === k.name ? ' selected' : ''}>${esc(k.name)}</option>`).join('')}</optgroup><optgroup label="개인 지식 · 내 PC">${MINE.map((k) => `<option${S.kn === k.name ? ' selected' : ''}>${esc(k.name)}</option>`).join('')}</optgroup>`}</select>`
  const ppSel = `<select class="inp" id="fPp"><option value="">사람 모두</option><option value="me"${S.pp === 'me' ? ' selected' : ''}>나(${me()})</option><option value="kmd"${S.pp === 'kmd' ? ' selected' : ''}>kmd 가 한 일</option></select>`
  const days = []
  for (const x of flow) { const g = days[days.length - 1]; if (g && g.d === x.d) g.rows.push(x); else days.push({ d: x.d, rows: [x] }) }
  const dayLbl = (d) => (d === '오늘' ? '오늘 · 10-27(화)' : '어제 · 10-26(월)')
  const checkCard = checks.length ? `<div class="card"><div class="ch">확인할 것 <span class="chip c-warn">${checks.length}</span><small>kmd 가 정리하며 내 기록의 값을 바꿨다 · 팀 · 개인 모두 · 그 줄만 되돌릴 수 있다</small></div>${checks.map(hrow).join('')}</div>` : ''
  const flowCard = `<div class="card">${days.map((g) => `<div class="hday">${dayLbl(g.d)}<small>${g.rows.length}</small>${pc ? '' : `<small style="margin-left:auto">팀 ${g.rows.filter((x) => x.a === 'team').length} · 개인 ${g.rows.filter((x) => x.a === 'me').length}</small>`}</div>${g.rows.map(hrow).join('')}`).join('') || '<p class="muted" style="margin:12px 14px">거른 줄이 없다</p>'}<div class="cf small muted">줄을 누르면 펼친다 · 팀 줄은 팀 지식의 git · 개인 줄은 내 PC 지식의 git 에 남는다 · 나에게 온 줄은 7일 둔다</div></div>`
  const lead = pc ? '이 PC 의 지식에서 바뀐 것: 저장 · 가져오기 · 보내기 · kmd 가 문서에 넣은 것 · 편집기에서 고친 것.' : '팀 서버와 내 PC 의 이력을 한 흐름으로: 내가 저장 · 가져오기 · 보내기 한 것, kmd 가 가져오고 정리한 것, 보낸 기록이 팀에서 어디까지 갔는지. 내 값이 바뀐 줄은 맨 위 「확인할 것」 에.'
  const main = `<div style="max-width:1080px"><div class="pg-h"><div><div class="big">이력</div><p class="lead">${lead}</p></div></div>${srcs}${off}${tiles}
  <div class="fl2">${seg}${seg ? '<span style="width:1px;height:22px;background:var(--border-strong)"></span>' : ''}${chips}<span class="r">${knSel}${ppSel}</span></div>${checkCard}${flowCard}</div>`
  return frame('지식 관리 › <b>이력</b>', main)
}

// ───────────── 설정 · 팀 › 정리 ─────────────
function viewTidy() {
  const k = TEAM.find((x) => x.id === S.tdKn)
  const strip = `<div class="kstrip">${[...TEAM].sort((a, b) => b.pend - a.pend).map((x) => `<div class="kc${x.id === S.tdKn ? ' on' : ''}" data-td="${x.id}"><b>${esc(x.name)} ${x.pend ? `<span class="chip c-pend">받은 것 ${x.pend}</span>` : '<span class="chip c-mute">받은 것 없음</span>'}</b><small>정리 · ${esc(x.mode)}</small></div>`).join('')}</div>`
  const body = `<div class="pg-h"><div><div class="big">정리</div><p class="lead">팀 지식마다 받은 기록을 문서에 합친다. <b>정리할 팀 지식은 여기서 고른다</b>: 옆 메뉴에서 고른 지식과 따로.</p></div></div>
  <div class="anno"><b>바뀜</b><span>지금은 「정리: 고른 지식」 이라 옆 메뉴에서 개인 지식을 골라 두면 첫 팀 지식으로 바뀌거나(개인) 화면이 막힌다(내 PC). 이제 위 줄에서 고른다 · 처음은 받은 것이 가장 많은 지식.</span></div>
  ${strip}
  <div class="card"><div class="ch">${esc(k.name)} <small>정리 · ${esc(k.mode)} · 받은 것 ${k.pend}</small><span class="r">${admin() ? '<button class="btn pri sm">지금 정리</button>' : ''}</span></div><div class="cb"><div class="board">${['모으기', '자리 찾기', '글 쓰기', '검사', '넣기'].map((s, i) => `<div><b>${i + 1}. ${s}</b><span class="muted">${k.pend ? (i === 0 ? '받은 기록 ' + k.pend : '기다림') : '—'}</span></div>`).join('')}</div>
  <div class="tabs" style="margin-top:12px"><span class="on">받은 것 <em>${k.pend}</em></span><span>정리 일 줄</span><span>정리한 것</span></div><div class="ph">받은 것 · 정리 일 줄 · 정리한 것은 docs/kmd_정리_절차_목업.html 그대로</div></div></div>`
  return frame('설정 · 팀 › <b>정리</b>', mgWrap('team', 'tidy', body))
}
// ───────────── 설정 · 팀 › 가져오기 ─────────────
function viewImp() {
  const body = `<div class="pg-h"><div><div class="big">가져오기</div><p class="lead">들여오는 일은 모두 일 줄에 서서 차례로 돈다. <b>넣을 곳은 여기서 고른다</b>.</p></div></div>
  <div class="anno"><b>바뀜</b><span>지금은 넣을 곳을 고르지 않았으면 옆 메뉴에서 고른 지식이 넣을 곳이 되고, 내 PC 지식을 골라 두면 화면이 막힌다. 이제 넣을 곳은 이 고르기만 · 처음은 마지막에 넣은 곳.</span></div>
  <div class="card"><div class="cb" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>파일 · 폴더를 이 화면 어디든 끌어다 놓는다</b><span>넣을 곳 <select class="inp"><optgroup label="팀 지식">${TEAM.map((k) => `<option>${esc(k.name)}</option>`).join('')}</optgroup></select></span><span class="muted small">마지막에 넣은 곳: DPMS 지식</span></div></div>
  <div class="tabs"><span class="on">일 줄 <em>2</em></span><span>가져오는 곳 <em>4</em></span><span>끝난 일</span></div><div class="ph">일 줄 · 가져오는 곳 · 끝난 일은 지금 화면 그대로</div>`
  return frame('설정 · 팀 › <b>가져오기</b>', mgWrap('team', 'imp', body))
}
// ───────────── 설정 · 개인 › 지식 보내기 ─────────────
function viewSend() {
  const k = MINE.find((x) => x.id === S.sdKn)
  const strip = `<div class="kstrip">${MINE.map((x) => `<div class="kc${x.id === S.sdKn ? ' on' : ''}" data-sd="${x.id}"><b>${esc(x.name)} <span class="kt pc">개인</span>${x.unsent ? `<span class="chip c-pend">${x.unsent}</span>` : ''}</b><small>→ ${x.to ? esc(x.to) : '받는 지식 없음'}</small></div>`).join('')}</div>`
  const route = `<div class="card"><div class="route"><div class="rbox"><div class="lb">보내는 지식 <span class="kt pc">개인</span></div><div class="nm">${esc(k.name)}</div><div class="sub">내 PC · 나만 · 보내지 않은 기록 ${k.unsent}</div></div><div class="rarr">${svg('arrow')}</div><div class="rbox${k.to ? '' : ' todo'}"><div class="lb">받는 지식 <span class="kt team">팀</span></div><div class="nm">${k.to ? esc(k.to) : '<span class="muted">정하지 않음</span>'}</div><div class="sub">${k.to ? '팀 모두 본다 · 18:00 정리' : '받는 팀 지식을 하나 정한다'}</div></div></div></div>`
  const body = `<div class="pg-h"><div><div class="big">지식 보내기</div><p class="lead">내 개인 지식의 기록 · 문서를 묶인 팀 지식으로 보낸다. <b>보내는 지식은 여기서 고른다</b>.</p></div></div>
  <div class="anno"><b>바뀜</b><span>지금은 옆 메뉴에서 개인 지식을 바꾸면 보내는 지식도 따라 바뀐다. 이제 위 줄에서만 고른다 · 보낸 뒤에는 지식 관리 › 이력에서 정리까지 따라간다.</span></div>
  ${strip}${route}<div class="ph">기록 · 문서 고르기 · 보내기 확인은 docs/kmd_지식보내기_목업.html 그대로</div>`
  return frame('설정 · 개인 › <b>지식 보내기</b>', mgWrap('me', 'send', body))
}
function viewStub() {
  const [area, v] = S.setTab.split(':')
  const l = (mgItems(area).find((x) => x[0] === v) || [0, ''])[1]
  const body = `<div class="big">${esc(l)}</div><div class="ph" style="margin-top:12px">${esc(l)}: 지금 화면 그대로 · 고른 지식에 따르는 것이 없다</div>`
  return frame(`${area === 'team' ? '설정 · 팀' : '설정 · 개인'} › <b>${esc(l)}</b>`, mgWrap(area, v, body))
}

// ───────────── 그리기 ─────────────
function render() {
  document.getElementById('mnav').innerHTML = navHtml()
  const s = S.scene
  const v = s === 'review' ? `<div class="app" style="display:block;padding:22px">${viewReview()}</div>` : s === 'side' ? `<div class="app" style="display:block;padding:22px">${viewSide()}</div>` : s === 'tidy' ? viewTidy() : s === 'imp' ? viewImp() : s === 'send' ? viewSend() : s === 'stub' ? viewStub() : viewHist()
  document.getElementById('stage').innerHTML = v
}
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-go],[data-who],[data-cur],[data-mg],[data-set],[data-row],[data-ar],[data-kind],[data-tile],[data-td],[data-sd]')
  if (!t) return
  const d = t.dataset
  if (d.go) return go(d.go)
  if (d.who) { S.who = d.who; return render() }
  if (d.cur) { S.cur = d.cur; return render() } // 지식 관리 화면은 그대로
  if (d.mg) { if (d.mg === 'hist') return go(S.mode === 'pc' ? 'pcHist' : 'hist'); if (d.mg === 'team') return go('tidy'); return S.mode === 'pc' ? (S.setTab = 'me:gen', S.scene = 'stub', S.stubArea = 'me', render()) : go('send') }
  if (d.set) { const [a, v] = d.set.split(':'); if (v === 'tidy') return go('tidy'); if (v === 'imp') return go('imp'); if (v === 'send') return go('send'); S.setTab = d.set; S.stubArea = a; S.scene = 'stub'; return render() }
  if (d.row) { S.open = S.open === d.row ? null : d.row; return render() }
  if (d.ar !== undefined) { S.ar = d.ar; return render() }
  if (d.kind !== undefined) { S.kind = d.kind; return render() }
  if (d.tile) { S.ar = d.tile === 'team' || d.tile === 'me' ? d.tile : ''; S.kind = d.tile === 'check' ? '확인할 것' : d.tile === 'send' ? '보내기' : ''; S.kn = ''; return render() }
  if (d.td) { S.tdKn = d.td; return render() }
  if (d.sd) { S.sdKn = d.sd; return render() }
})
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'fKn') { S.kn = ev.target.value; render() }
  if (ev.target.id === 'fPp') { S.pp = ev.target.value; render() }
})
render()
</script>
</body>
</html>
