<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정리 절차 목업</title>
<style>
/* 토큰 · 부품은 app/kmd.css 와 같은 값 — 아래 「정리 목업 새 부품」 만 새로 */
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f7;--surface-3:#e6eaf0;--border:#e2e6ed;--border-strong:#c9d1dd;
  --text:#11151c;--text-2:#515a68;--text-3:#858e9d;--accent:#3358e6;--accent-bg:#e9eeff;--accent-line:#c3d0fb;
  --danger:#cb3a2c;--danger-bg:#fdeceb;--warn:#8c5c00;--warn-bg:#fcf3e0;--pending:#6247c4;--pending-bg:#efedfd;
  --ok:#2e9b5b;--ok-bg:#e6f5ec;
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);
  --shadow-2:0 2px 6px -1px rgba(15,23,42,.08),0 14px 32px -8px rgba(15,23,42,.18);
  --font:Pretendard,-apple-system,"Segoe UI",system-ui,"Malgun Gothic",sans-serif;
  --mono:Consolas,"Cascadia Mono",D2Coding,"Malgun Gothic",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe3ea;color:var(--text);font:13px/1.55 var(--font)}
button,input,select{font:inherit}
a{color:var(--accent);cursor:pointer}
svg.i{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}

/* ── 목업 조종판(목업 밖) ── */
.mframe{display:flex;min-height:100vh}
.mnav{width:250px;flex:none;background:#1b2130;color:#cfd6e4;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.mnav h1{font-size:14px;margin:0 6px 4px;color:#fff}
.mnav p{margin:0 6px 12px;font-size:11.5px;color:#8f9bb3}
.mnav .g{font-size:11px;color:#6f7a90;margin:16px 6px 6px;text-transform:none}
.mnav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:6px 10px;border-radius:6px;font-size:12.5px;cursor:pointer}
.mnav button:hover{background:#2a3246}
.mnav button.on{background:#3358e6;color:#fff}
.mnav button small{display:block;color:#7f8aa1;font-size:11px}
.mnav button.on small{color:#dfe6ff}
.mstage{flex:1;min-width:0;padding:20px}

/* ── 앱 프레임 · 부품(kmd.css 와 같다) ── */
.app{max-width:1360px;margin:0 auto;background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.18);display:flex;min-height:calc(100vh - 40px)}
.side{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px}
.sb-top{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
.logo{width:22px;height:22px;border-radius:6px;background:#11151c;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.brand{font-weight:700;font-size:15px}
.busy{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);font-weight:600}
.busy i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sb-repo{border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.sb-repo .rk{font:700 10.5px var(--mono);background:var(--accent-bg);color:var(--accent);border-radius:5px;padding:2px 5px}
.sb-repo small{display:block;font-size:10.5px;color:var(--text-3)}
.sb-g{font-size:11.5px;color:var(--text-3);margin:12px 8px 4px}
.sb-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text)}
.sb-i.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sb-i .bd{margin-left:auto;background:var(--pending-bg);color:var(--pending);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.sb-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.crumb{font-size:13px;color:var(--text-3)}.crumb b{color:var(--text)}
.band{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:12px;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text-2)}
.band b{color:var(--text)}
.main{flex:1;padding:18px 22px;overflow:auto;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-warn{background:var(--warn-bg);color:var(--warn)}.c-pend{background:var(--pending-bg);color:var(--pending)}.c-mute{background:var(--surface-3);color:var(--text-2)}
.c-acc{background:var(--accent-bg);color:var(--accent)}.c-danger{background:var(--danger-bg);color:var(--danger)}.c-ok{background:var(--ok-bg);color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.pri:hover{background:#2a4bd0}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--surface-2)}
.btn.dz{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:14px}
.big{font-size:20px;font-weight:700;margin:0 0 4px}
.lead{color:var(--text-2);margin:0}
.pg-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.pg-h .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:0 0 14px}
.tabs span{padding:8px 14px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs span.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs span em{font-style:normal;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-2);border-radius:999px;padding:0 6px}
.tabs span.on em{background:var(--accent-bg);color:var(--accent)}
.tabs span em.w{background:var(--warn-bg);color:var(--warn)}
.term{background:#0f141c;color:#d7dde8;border-radius:10px;font:12px/1.6 var(--mono);padding:10px 12px;height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.term .say{color:#e8ecf3}.term .tool{color:#8fb0ff}.term .ok{color:#7fd69a}.term .err{color:#ff8f86}.term .sys,.term .cost{color:#7d8696}
.term .tm{color:#5c6574;margin-right:8px}
.term .sg{display:inline-block;min-width:44px;color:#5c6574;margin-right:6px}
.term .cur::after{content:'▍';color:#8fb0ff;animation:blink 1s steps(2) infinite}
.inp{min-height:28px;border:1px solid var(--border-strong);border-radius:7px;padding:3px 8px;font-size:12px;background:#fff}
.gl{font-size:11.5px;color:var(--text-3);margin:8px 2px 0;line-height:1.7}
.slist{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border)}
.srow:first-child{border-top:0}
.srow .si{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-2)}
.srow .sn{min-width:0;flex:1 1 220px}.srow .sn b{display:block}.srow .sn small,.srow .sc small{display:block;color:var(--text-3);font-size:11.5px}
.srow .sc{flex:0 1 230px;font-size:12px;color:var(--text-2)}
.srow .sa{flex:none;display:flex;gap:6px}

/* ── 새 부품 ── */
/* 들이기 막대 — 끌어다 놓기는 화면 어디든 되고 이 막대는 한 줄 */
.dropbar{display:flex;align-items:center;gap:10px;border:2px dashed var(--border-strong);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:12.5px;color:var(--text-2);margin-bottom:12px;flex-wrap:wrap}
.dropbar b{color:var(--text)}
.dropbar .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.dropbar.over{background:var(--accent-bg);border-color:var(--accent)}
/* 일 줄 머리 — 갈래 거르기 · 동시에 도는 수 · 줄 멈춤 */
.qbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qf{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--text-2);display:flex;gap:5px;align-items:center}
.qf.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.qf b{font-weight:700}
.qbar .r{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-3)}
.lane{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--border);border-radius:7px;padding:2px 8px;background:var(--surface);color:var(--text-2)}
.lane i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}.lane i.on{background:var(--ok)}
.paused-band{display:flex;gap:10px;align-items:center;background:var(--warn-bg);border:1px solid #ecd39c;color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12.5px}
.paused-band .btn{margin-left:auto}
/* 두 칸 — 왼쪽 줄 · 오른쪽 자세히 */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
.qlist{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);overflow:hidden}
.qg{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface-2);border-top:1px solid var(--border);font-size:11.5px;font-weight:700;color:var(--text-2)}
.qg:first-child{border-top:0}
.qg small{font-weight:400;color:var(--text-3)}
.qg .r{margin-left:auto;font-weight:400}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--border);cursor:pointer;position:relative}
.qrow:hover{background:#fafbfd}
.qrow.sel{background:var(--accent-bg)}
.qrow.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.qrow .grip{color:var(--text-3);cursor:grab;width:10px;font-size:12px;letter-spacing:-2px;flex:none}
.qrow .ord{font:600 11px var(--mono);color:var(--text-3);width:14px;text-align:right;flex:none}
.qrow .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--text-2)}
.qrow .ic.file{background:#eef2ff;color:var(--accent)}.qrow .ic.git{background:#f2eefe;color:var(--pending)}.qrow .ic.docs{background:#eaf6ef;color:var(--ok)}.qrow .ic.db{background:#fdf3e2;color:var(--warn)}
.qrow .tx{min-width:0;flex:1}
.qrow .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tx small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .ac{display:flex;gap:4px;flex:none}
.qrow .el{font:11px var(--mono);color:var(--text-3);width:44px;text-align:right;flex:none}
.auto{font-size:10.5px;font-weight:700;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
/* 작은 단계 막대 — 네 칸 */
.mini{display:flex;gap:2px;flex:none;width:76px}
.mini i{flex:1;height:6px;border-radius:2px;background:var(--surface-3)}
.mini i.done{background:var(--ok)}.mini i.run{background:var(--accent);animation:blink 1.2s ease-in-out infinite}
.mini i.pause,.mini i.check{background:#d39a2c}.mini i.fail{background:var(--danger)}.mini i.cancel{background:var(--text-3)}
.mini-l{font-size:11px;color:var(--text-3);margin-top:3px;white-space:nowrap}
.qmore{padding:8px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);text-align:center}
/* 자세히 */
.det{position:sticky;top:0}
.det .dh{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.det .dh .t{min-width:0;flex:1}
.det .dh b{font-size:14.5px;display:block}
.det .dh small{color:var(--text-3);font-size:12px}
.det .ctl{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center}
.det .ctl .note{font-size:11.5px;color:var(--text-3);margin-left:auto}
.det .sec{padding:12px 14px;border-bottom:1px solid var(--border)}
.det .sec:last-child{border-bottom:0}
.det .sh{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.det .sh .r{margin-left:auto;font-weight:400}
.meta{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 12px;font-size:12px}
.meta dt{color:var(--text-3)}.meta dd{margin:0;color:var(--text)}
/* 흐름 그림 — 단계 상자와 화살표 */
.flow{display:flex;align-items:stretch;gap:0}
.st{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;padding:8px 9px;background:var(--surface);cursor:pointer;position:relative}
.st:hover{border-color:var(--border-strong)}
.st .n{font-size:10.5px;color:var(--text-3);font-weight:700;display:flex;justify-content:space-between}
.st .nm{font-weight:700;font-size:13px;margin:1px 0 4px}
.st ul{list-style:none;margin:0;padding:0;font-size:11px;color:var(--text-2)}
.st li{display:flex;gap:5px;align-items:baseline;line-height:1.5}
.st li::before{content:'○';color:var(--text-3);font-size:9px}
.st li.d::before{content:'✓';color:var(--ok);font-weight:700}
.st li.r::before{content:'●';color:var(--accent);animation:blink 1s infinite}
.st li.x::before{content:'✕';color:var(--danger);font-weight:700}
.st li.p::before{content:'Ⅱ';color:var(--warn);font-weight:700}
.st .tt{font:10.5px var(--mono);color:var(--text-3);margin-top:5px}
.st.done{border-color:#bfe3cc;background:#f6fbf8}.st.done .n{color:var(--ok)}
.st.run{border-color:var(--accent);background:#f7f9ff;box-shadow:0 0 0 3px var(--accent-bg)}.st.run .n{color:var(--accent)}
.st.pause,.st.check{border-color:#e6c27a;background:#fffbf2}.st.pause .n,.st.check .n{color:var(--warn)}
.st.fail{border-color:#efb7b1;background:#fff8f7}.st.fail .n{color:var(--danger)}
.st.cancel{opacity:.55}
.st.focus{outline:2px solid var(--text);outline-offset:1px}
.arr{flex:none;width:16px;display:grid;place-items:center;color:var(--border-strong);font-size:14px}
.arr.done{color:var(--ok)}
.callout{border-radius:8px;padding:9px 12px;font-size:12.5px;margin:0 0 10px;display:flex;gap:10px;align-items:flex-start}
.callout.warn{background:var(--warn-bg);border:1px solid #ecd39c;color:var(--warn)}
.callout.danger{background:var(--danger-bg);border:1px solid #efb7b1;color:var(--danger)}
.callout.gray{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.callout .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.tfil{display:flex;gap:2px;margin-left:auto}
.tfil span{font-size:11px;padding:1px 7px;border-radius:5px;cursor:pointer;color:var(--text-3);font-weight:400}
.tfil span.on{background:#0f141c;color:#fff}
.res{list-style:none;margin:0;padding:0;font-size:12px}
.res li{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px dashed var(--border)}
.res li:first-child{border-top:0}
.res li .k{width:46px;flex:none}
.res li a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.children{max-height:150px;overflow:auto;font-size:11.5px;border:1px solid var(--border);border-radius:8px}
.children div{display:flex;gap:8px;padding:4px 8px;border-top:1px solid var(--border);align-items:center}
.children div:first-child{border-top:0}
.children .mono{font-family:var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--text-3)}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
/* 끝난 일 표 */
table.done{width:100%;border-collapse:collapse;font-size:12.5px}
table.done th{text-align:left;font-weight:600;color:var(--text-3);font-size:11.5px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
table.done td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.done tr.day td{background:#fafbfd;font-weight:700;font-size:11.5px;color:var(--text-2);padding:5px 12px}
table.done td.m{font:11.5px var(--mono);color:var(--text-3);white-space:nowrap}
.pager{display:flex;gap:4px;justify-content:center;padding:10px;font-size:12px}
.pager span{padding:2px 8px;border-radius:5px;cursor:pointer;color:var(--text-2)}.pager span.on{background:var(--accent);color:#fff}
/* 창 */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);display:grid;place-items:center;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-2);width:min(460px,92vw)}
.modal .mh{padding:14px 16px 6px;font-weight:700;font-size:14.5px}
.modal .mb{padding:4px 16px 12px;font-size:12.5px;color:var(--text-2)}
.modal .mb ul{margin:8px 0;padding-left:18px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--border)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#11151c;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:60;box-shadow:var(--shadow-2)}

/* ── 검토안 ── */
.doc{max-width:980px;margin:0 auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:28px 36px;box-shadow:0 10px 30px rgba(15,23,42,.12)}
.doc h2{font-size:20px;margin:0 0 4px}
.doc h3{font-size:15px;margin:26px 0 8px;padding-top:14px;border-top:1px solid var(--border)}
.doc p,.doc li{color:var(--text-2);line-height:1.75}
.doc li b,.doc p b{color:var(--text)}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.doc th,.doc td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:var(--surface-2);font-weight:600}
.doc code{font:12px var(--mono);background:var(--surface-2);border-radius:4px;padding:0 4px}
.sm-flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;margin:8px 0}
.sm-flow span{border:1.5px solid var(--border-strong);border-radius:8px;padding:4px 10px;font-weight:600;background:#fff}
.sm-flow .a{border:0;color:var(--text-3);padding:0;font-weight:400;background:none}
.ask{background:var(--pending-bg);border:1px solid #d9d2fb;border-radius:10px;padding:10px 16px}
.ask li{color:var(--pending)}
@media (max-width:1100px){.qwrap{grid-template-columns:1fr}.det{position:static}.side{display:none}}
@media (max-width:760px){.mframe{flex-direction:column}.mnav{width:auto;height:auto;position:static}.mstage{padding:10px}.meta{grid-template-columns:auto 1fr}.flow{flex-direction:column}.arr{transform:rotate(90deg);height:14px;width:auto}}

/* ── 정리 목업 새 부품 ── */
/* 현황판 — 다섯 칸 같은 꼴 · 단계 이름 · 큰 수 · 단위 · 꼬리 칩 한 줄 · 설명은 칸에 올리면 툴팁 */
.proc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:14px}
.proc .ps{position:relative;padding:12px 14px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:2px;cursor:default;min-width:0}
.proc .ps:first-child{border-left:0}
.proc .ps:not(:last-child)::after{content:'›';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:18px;line-height:16px;text-align:center;background:var(--surface);color:var(--text-3);font-size:13px;z-index:1}
.proc .ps .hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-2)}
.proc .ps .hd .no{font:700 10.5px var(--mono);color:var(--text-3)}
.proc .ps .hd .qi{margin-left:auto;width:15px;height:15px;border-radius:50%;border:1px solid var(--border-strong);color:var(--text-3);font-size:10px;line-height:13px;text-align:center;font-weight:700}
.proc .ps .vl{display:flex;align-items:baseline;gap:6px}
.proc .ps .vl em{font-style:normal;font:700 22px/1.2 var(--mono);color:var(--text)}
.proc .ps .vl small{font-size:11.5px;color:var(--text-3)}
.proc .ps .ft{height:20px;display:flex;align-items:center}
.proc .ps.done .hd .no,.proc .ps.done .hd{color:var(--ok)}
.proc .ps.run{background:#f7f9ff;box-shadow:inset 0 -2px 0 var(--accent)}.proc .ps.run .hd{color:var(--accent)}.proc .ps.run .vl em{color:var(--accent)}
.proc .ps.warn .vl em{color:var(--warn)}
.proc .ps .tip{display:none;position:absolute;top:calc(100% + 6px);left:8px;width:260px;background:#11151c;color:#e8ecf3;font-size:11.5px;line-height:1.6;border-radius:8px;padding:8px 10px;box-shadow:var(--shadow-2);z-index:30;font-weight:400}
.proc .ps:last-child .tip,.proc .ps:nth-last-child(2) .tip{left:auto;right:8px}
.proc .ps:hover .tip{display:block}
.proc .ps:hover .qi{border-color:var(--accent);color:var(--accent)}
/* 받은 기록 그리드 — 머리 줄 하나 · 칸이 같은 자리에 선다 · 좁으면 두 줄로 */
.gl2{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:14px;container-type:inline-size}
.gr{display:grid;grid-template-columns:20px 28px 62px minmax(0,1fr) 92px 172px 100px 24px;gap:0 10px;align-items:center;padding:8px 14px;border-top:1px solid var(--border)}
.gl2.h .gr{grid-template-columns:28px minmax(0,1fr) 92px 172px 100px 24px}
.gr:hover{background:#fafbfd}
.gr.sel{background:var(--accent-bg)}
.gr.dim{opacity:.6}
.gr.chg{background:#fffbf2}
.gr.hd{border-top:0;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--text-3);padding:7px 14px;border-radius:12px 12px 0 0;position:sticky;top:0;z-index:4}
.gr.hd:hover{background:var(--surface-2)}
.gr > div{min-width:0}
.gr .c-tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .c-tx small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .c-to{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.gr .c-to .to{max-width:100%}
.gr .nil{color:var(--border-strong)}
.gh{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--border-strong);background:#fafbfd}
.gh .t{flex:1;min-width:0}.gh .t b{font-size:13px}.gh .t small{display:block;color:var(--text-3);font-size:11.5px}
.gh .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.gh.top{border-top:0;background:var(--surface);border-radius:12px;cursor:pointer}
.gh.top + .gr.hd{border-radius:0;border-top:1px solid var(--border)}
/* 트리 — 묶음 줄(사람 · 자리 · 결과) 아래 기록은 살짝 들여 쓰고 왼쪽에 잇는 줄 */
.gr.hd,.gr.it{padding-left:36px}
.gr.it{position:relative}
.gr.it::before{content:'';position:absolute;left:21px;top:0;bottom:0;border-left:1.5px solid var(--border-strong)}
.gr.it.last::before{bottom:50%}
.gr.it::after{content:'';position:absolute;left:21px;top:50%;width:8px;border-top:1.5px solid var(--border-strong)}
.gl2.h .gr.it::before,.gl2.h .gr.it::after{left:23px}
.gl2.h .gr{grid-template-columns:76px minmax(0,1fr) 84px minmax(120px,180px) 92px 24px}
.gl2.h .gr .c-av{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden}
.gl2.h .gr .c-tx .why{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-width:760px){
 .gl2:not(.h) .gr{display:flex;flex-wrap:wrap;gap:6px 10px}
 .gl2:not(.h) .gr.hd{display:none}
 .gl2:not(.h) .gr .c-ck{order:1}.gl2:not(.h) .gr .c-av{order:2}.gl2:not(.h) .gr .c-tx{order:3;flex:1 1 calc(100% - 110px)}.gl2:not(.h) .gr .c-mk{order:4}
 .gl2:not(.h) .gr .c-rt{order:5;margin-left:58px}.gl2:not(.h) .gr .c-vl{order:6}.gl2:not(.h) .gr .c-to{order:7}.gl2:not(.h) .gr .c-st{order:8}
 .gl2:not(.h) .gr .c-vl:has(.nil){display:none}
}
@container (max-width:480px){
 .gl2.h .gr{display:flex;flex-wrap:wrap;gap:6px 10px}
 .gl2.h .gr.hd{display:none}
 .gl2.h .gr .c-av{order:1}.gl2.h .gr .c-tx{order:2;flex:1 1 calc(100% - 140px)}.gl2.h .gr .c-mk{order:3}.gl2.h .gr .c-vl{order:4;margin-left:86px}.gl2.h .gr .c-to{order:5}.gl2.h .gr .c-st{order:6}.gl2.h .gr .c-vl:has(.nil){display:none}
}
.go{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--accent-line);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow-1)}
.go .tx{flex:1;min-width:0}.go .tx b{display:block}.go .tx small{color:var(--text-3);font-size:11.5px}
.go .prog{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--accent);font-weight:600}
.go .prog i{width:90px;height:6px;border-radius:3px;background:var(--accent-bg);position:relative;overflow:hidden}
.go .prog i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:44%;background:var(--accent);border-radius:3px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg span{padding:3px 10px;font-size:12px;cursor:pointer;color:var(--text-2);border-left:1px solid var(--border)}
.seg span:first-child{border-left:0}
.seg span.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.lbl{font-size:11.5px;color:var(--text-3)}
/* 들어온 길 표지 */
.rt{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;white-space:nowrap;flex:none}
.rt.sess{background:#eef2ff;color:var(--accent)}.rt.send{background:#f2eefe;color:var(--pending)}.rt.file{background:#eaf6ef;color:var(--ok)}.rt.code{background:#fdf3e2;color:var(--warn)}.rt.memo{background:var(--surface-3);color:var(--text-2)}
.rt svg.i{width:12px;height:12px}
/* 아바타 */
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:var(--surface-3);color:var(--text-2)}
.av.a1{background:#e3ebff;color:#2a4bd0}.av.a2{background:#f1e7ff;color:#7440c9}.av.a3{background:#e2f4ea;color:#23824b}.av.a4{background:#fdeedd;color:#9a5a00}.av.a5{background:#e6eaf0;color:#515a68}
.av.sm{width:20px;height:20px;font-size:10px}
.avs{display:flex}.avs .av{border:2px solid #fff;margin-left:-6px}.avs .av:first-child{margin-left:0}
/* 보낸 사람 카드 · 자리 카드 */
.pc{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:14px}
.pc .ph{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-radius:12px 12px 0 0;border-bottom:1px solid var(--border)}
.pc .ph .t{flex:1;min-width:0}.pc .ph .t b{font-size:13px}.pc .ph .t small{display:block;color:var(--text-3);font-size:11.5px}
.pc .ph .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pc .pf{padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);display:flex;gap:8px;align-items:center}
.ck{width:15px;height:15px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
.rr{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border);position:relative}
.rr:first-of-type{border-top:0}
.rr:hover{background:#fafbfd}
.rr.dim{opacity:.6}
.rr.sel{background:var(--accent-bg)}
.rr .tx{min-width:0;flex:1}
.rr .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .tx small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .who{font-size:12px;color:var(--text-2);width:40px;flex:none}
.to{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-bg);border-radius:6px;padding:2px 7px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;flex:none}
.to.none{color:var(--warn);background:var(--warn-bg)}
.to.off{color:var(--text-3);background:var(--surface-3)}
.vchg{font:600 11.5px var(--mono);color:var(--warn);white-space:nowrap;flex:none}
.why{font-size:11.5px;color:var(--warn);margin-top:2px;white-space:normal}
.kebab{width:24px;height:24px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--text-3);font-size:14px;flex:none;position:relative}
.kebab:hover,.kebab.on{background:var(--surface-2);color:var(--text)}
.pop{position:absolute;right:0;top:26px;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-2);min-width:200px;padding:4px;text-align:left}
.pop div{padding:6px 10px;border-radius:6px;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap}
.pop div small{display:block;color:var(--text-3);font-size:11px}
.pop div:hover{background:var(--surface-2)}
.pop .sep{height:1px;background:var(--border);padding:0;margin:4px 0}
.pop .g{color:var(--text-3);font-size:11px;cursor:default}.pop .g:hover{background:none}
/* 고른 것 띠 — 아래에 붙는다 */
.selbar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:#11151c;color:#fff;border-radius:10px;padding:8px 10px 8px 14px;margin-top:4px;box-shadow:var(--shadow-2);font-size:12.5px;z-index:5}
.selbar small{color:#9aa3b2}
.selbar .r{margin-left:auto;display:flex;gap:6px}
.selbar .btn.ghost{color:#cfd6e4}.selbar .btn.ghost:hover{background:#262d3b}
/* 결과 요약 */
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.diff{border:1px solid var(--border);border-radius:8px;font:12px/1.65 var(--mono);overflow:hidden}
.diff div{padding:1px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .h{background:var(--surface-2);color:var(--text-3);font-family:var(--font);font-size:11.5px;padding:4px 10px}
.diff .d{background:#fdeceb;color:#8f2a20}.diff .d::before{content:'− ';color:var(--danger)}
.diff .a{background:#e6f5ec;color:#1d6b3e}.diff .a::before{content:'+ ';color:var(--ok)}
.diff .c{color:var(--text-2)}.diff .c::before{content:'  '}
.diff .lg{color:var(--text-3);font-style:italic}
.feed{list-style:none;margin:0;padding:0;font-size:12px}
.feed li{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px dashed var(--border)}
.feed li:first-child{border-top:0}
.feed li .tx{flex:1;min-width:0}
.feed li .tx small{color:var(--text-3)}
.trow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer}
.trow.on{border-color:var(--accent);background:var(--accent-bg)}
.trow .tx{flex:1}.trow .tx small{display:block;color:var(--text-3);font-size:11.5px}
.who-band{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-2)}
.modal.w560{width:min(560px,92vw)}.modal.w760{width:min(760px,94vw)}
.modal .mh{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding-bottom:10px}
.modal .mh small{font-weight:400;color:var(--text-3);font-size:11.5px}
.modal .mh .x{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--text-3)}
.modal .mb{padding-top:12px}
.modal .mf .l{margin-right:auto;font-size:11.5px;color:var(--text-3);align-self:center}
.side .sb-i svg.i{color:var(--text-3)}
.side .sb-i.on svg.i{color:var(--accent)}
.sb-kn{font-size:11px;color:var(--text-3);padding:4px 10px 0}
@media (max-width:1100px){.proc .ps::after{display:none!important}}
@media (max-width:760px){.proc .ps{border-top:1px solid var(--border)}.pc .ph{flex-wrap:wrap}.go{flex-wrap:wrap}}
</style>

<script>

const IC = {

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

// ───────────── 데이터 ─────────────

// st: ok(자리 찾음) · again(지난 정리에서 둠 → 다시) · none(자리 못 찾음) · priv(정리 안 함)
const RECS = [
  { id: 'r1', who: 'lee', route: 'sess', kn: 'dpms', t: '카나리 비율 10% → 20%', at: '어제 13:13', to: ['배포절차 › 카나리'], st: 'ok', v: '10% → 20%', from: '세션 「배포 점검」' },

  return `<div class="gr hd"><div class="c-ck">${rs.length ? `<input type="checkbox" class="ck" data-a="selAll"${all ? ' checked' : ''} title="보이는 것 모두 고르기">` : ''}</div><div class="c-av">사람</div><div class="c-rt">들어온 길</div><div class="c-tx">기록</div><div class="c-vl">바뀌는 값</div><div class="c-to">넣을 자리</div><div class="c-st">상태</div><div class="c-mk"></div></div>`

   <div class="c-to">${toHtml(r)}</div>

function inboxWho() {

    const rs = v.filter((r) => r.who === w)

    const routes = Object.keys(ROUTE).map((k) => [k, rs.filter((r) => r.route === k).length]).filter(([, n]) => n)
    const kns = [...new Set(rs.map((r) => KNS[r.kn]))]
    const chg = rs.filter((r) => r.v).length, none = rs.filter((r) => r.st === 'none').length, again = rs.filter((r) => r.st === 'again').length
    return `<div class="gh">${sels.length ? `<input type="checkbox" class="ck" data-a="selWho" data-v="${w}"${all ? ' checked' : ''} title="${esc(P(w).n)} 의 기록 모두 고르기">` : '<span style="width:15px"></span>'}${av(w)}

function inboxSpot() {
  const v = visible()
  if (!v.length) return emptyBox()
  const spots = new Map()
  for (const r of v) if (r.st === 'ok' || r.st === 'again') for (const t of r.to) { if (!spots.has(t)) spots.set(t, []); spots.get(t).push(r) }
  const rest = v.filter((r) => r.st === 'none' || r.st === 'priv')
  const grp = (t, rs) => {
    const who = [...new Set(rs.map((r) => r.who))]
    const sels = rs.filter(canSel)
    const all = sels.length && sels.every((r) => M.sel.has(r.id))
    return `<div class="gh">${sels.length ? `<input type="checkbox" class="ck" data-a="selSpot" data-v="${esc(t)}"${all ? ' checked' : ''}>` : '<span style="width:15px"></span>'}<span class="av" style="border-radius:8px;background:var(--accent-bg);color:var(--accent)">${svg('doc')}</span>

function stIdx(s) { return s.st === 'done' ? 5 : s.st === 'run' ? s.at : s.st === 'check' ? 3 : 0 }
function mini(s) {
  return `<div class="mini" style="width:90px">${STG.map((_, i) => {
    const c = s.st === 'done' ? 'done' : s.st === 'run' ? (i < s.at ? 'done' : i === s.at ? 'run' : '') : s.st === 'check' ? (i < 3 ? 'done' : i === 3 ? 'check' : '') : ''
    return `<i class="${c}"></i>`
  }).join('')}</div>`
}
function spotChip(s) {
  if (s.st === 'done') return s.res === 'chg' ? '<span class="chip c-warn">넣음 · 값 바뀜</span>' : '<span class="chip c-ok">넣음</span>'
  if (s.st === 'run') return `<span class="chip c-acc">${STG[s.at]} 중</span>`
  if (s.st === 'check') return '<span class="chip c-warn">둠 · 사람이 볼 것</span>'
  return '<span class="chip c-mute">기다림</span>'
}
function runRow(s, i) {

   <div>${mini(s)}<div class="mini-l">${s.st === 'wait' ? '차례 기다림' : s.st === 'done' ? '다섯 단계 끝' : `${stIdx(s) + 1} ${STG[Math.min(stIdx(s), 4)]}`}</div></div>
   <span class="el">${s.el || ''}</span>${spotChip(s)}</div>`
}

    const st = c === 'done' ? '끝남' : c === 'run' ? '도는 중' : c === 'check' ? '못 넘음' : '기다림'
    const li = STG_D[i].map((d, j) => `<li class="${c === 'done' ? 'd' : c === 'run' ? (j === 0 ? 'r' : '') : c === 'check' ? (j === 2 ? 'x' : j < 2 ? 'd' : '') : ''}">${d}</li>`).join('')
    return `${i ? `<span class="arr${c === 'done' || c === 'run' || c === 'check' ? ' done' : ''}">›</span>` : ''}<div class="st ${c}${M.tfil === String(i) ? ' focus' : ''}" data-a="tfil" data-v="${i}"><div class="n"><span>${i + 1}</span><span>${st}</span></div><div class="nm">${nm}</div><ul>${li}</ul></div>`
  }).join('')
}

      return `<div class="gh">${av(w, true)}<div class="t"><b>${esc(P(w).n)}</b> <span class="lbl">${[c('put') ? `넣음 ${c('put')}` : '', c('chg') ? `값 바뀜 ${c('chg')}` : '', c('left') ? `둠 ${c('left')}` : ''].filter(Boolean).join(' · ')}</span></div></div>${rr.map(({ r, i }, j) => histRow(h, r, i, j === rr.length - 1)).join('')}`
    }).join('')
  } else {
    body = [['put', '넣은 것', '숫자 · 이름 모두 확인'], ['chg', '값이 바뀐 것', '쓴 사람에게 알렸다'], ['left', '그대로 둔 것', '다음 정리 때 다시']].map(([k, t, s]) => {
      const rr = rows.filter(({ r }) => r.k === k)
      return rr.length ? `<div class="gh"><div class="t"><b>${t} ${rr.length}</b> <span class="lbl">${s}</span></div></div>${rr.map(({ r, i }, j) => histRow(h, r, i, j === rr.length - 1)).join('')}` : ''
    }).join('')
  }
  return `<div class="gl2 h"><div class="gh top" data-a="hopen" data-v="${h.id}"><div class="t"><b>${esc(h.at)} · ${esc(h.by)}</b><small>${esc(KNS[h.kn])} · 보낸 사람 ${new Set(h.rows.map((r) => r.who)).size} · 자리마다 따로 저장 · 되돌리기는 줄마다 ⋯</small></div>
   <span class="r">${n('put') ? `<span class="chip c-ok">넣음 ${n('put')}</span>` : ''}${n('chg') ? `<span class="chip c-warn">값 바뀜 ${n('chg')}</span>` : ''}${n('left') ? `<span class="chip c-warn">둠 ${n('left')}</span>` : ''}<span class="lbl">${open ? '접기' : '펼치기'}</span></span></div>${open ? (body ? HIST_HEAD + body : '<div class="empty">이 정리에 내 기록이 없다</div>') : ''}</div>`
}

     <div class="mf"><span class="l">고르지 않으면 정리 때 Claude 가 후보에서 고른다</span><button class="btn ghost" data-a="close">취소</button><button class="btn pri" data-a="pickDone" data-v="${r.id}">이 자리로 정하기</button></div></div></div>`

// ───────────── 그리기 ─────────────
function screen() {
  if (M.view === 'doc') return docView()
  let body = head() + proc() + goBox() + tabs()
  if (M.view === 'empty') body = head() + proc().replace(/<em>\d+<\/em>/g, '<em>0</em>') + `<div class="go"><span class="tx"><b>다음 정리 내일 02:30 · 정리할 것 0</b><small>받은 기록이 없다</small></span><button class="btn pri" disabled>모두 지금 정리</button></div>` + tabs() + emptyBox()
  else if (M.tab === 'inbox') body += inboxBar() + (M.group === 'who' ? inboxWho() : inboxSpot()) + selBar()
  else if (M.tab === 'run') body += runTab()
  else body += histTab()
  return frame(`<div style="max-width:1100px">${body}</div>`)
}
function render() {
  document.getElementById('mnav').innerHTML = nav()
  document.getElementById('stage').innerHTML = screen() + modal() + (M.toast ? `<div class="toast">${M.toast}</div>` : '')
}
function toast(t) { M.toast = t; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { M.toast = null; render() }, 3000) }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]')
  if (!el) { if (M.menu) { M.menu = null; render() } return }
  if (el.dataset.self && e.target !== el) return
  const a = el.dataset.a, v = el.dataset.v
  if (a !== 'menu' && !el.closest('.pop')) M.menu = null
  switch (a) {
    case 'go': M.view = v; if (el.dataset.tab) M.tab = el.dataset.tab; if (el.dataset.g) M.group = el.dataset.g; if (M.tab === 'run' || M.tab === 'hist') M.running = M.tab === 'run' ? true : M.running; break
    case 'viewer': M.viewer = v; M.sel.clear(); break
    case 'tab': M.tab = v; if (M.view === 'empty') M.view = 'scr'; break
    case 'kn': M.kn = v; break
    case 'group': M.group = v; break
    case 'hgroup': M.hgroup = v; break
    case 'mine': M.mine = v === '1'; break
    case 'menu': M.menu = M.menu === el.dataset.m ? null : el.dataset.m; e.stopPropagation(); break
    case 'mode': M.mode = v; M.menu = null; break
    case 'sel': M.sel.has(v) ? M.sel.delete(v) : M.sel.add(v); break
    case 'selWho': case 'selSpot': {
      const rs = visible().filter(canSel).filter((r) => (a === 'selWho' ? r.who === v : r.to.includes(v)))
      const all = rs.every((r) => M.sel.has(r.id))
      rs.forEach((r) => (all ? M.sel.delete(r.id) : M.sel.add(r.id)))
      break
    }
    case 'selAll': { const rs = visible().filter(canSel); const all = rs.every((r) => M.sel.has(r.id)); rs.forEach((r) => (all ? M.sel.delete(r.id) : M.sel.add(r.id))); break }
    case 'clearSel': M.sel.clear(); break
    case 'tidySel': case 'tidyAll': M.sel.clear(); M.running = true; M.tab = 'run'; M.view = 'scr'; render(); toast('정리를 시작했다 · 자리마다 따로 넣는다'); return
    case 'spot': M.spot = v; M.tfil = 'all'; break
    case 'tfil': M.tfil = M.tfil === v ? 'all' : v; e.stopPropagation(); break
    case 'pick': M.modal = ['pick', v]; M.pickOn = null; break
    case 'pickOn': M.pickOn = v; break
    case 'pickDone': { const r = RECS.find((x) => x.id === v); r.to = [M.pickOn]; r.st = 'ok'; M.modal = null; render(); toast(`자리를 정했다 · ${esc(M.pickOn)}`); return }
    case 'why': M.modal = ['why', v]; break
    case 'cmp': M.modal = ['cmp', v]; break
    case 'undo': M.modal = null; render(); toast('되돌렸다 · 그 기록은 다시 받은 것으로 · 다음 정리 때 다시'); return
    case 'hopen': M['ho:' + v] = !(M['ho:' + v] ?? v === HIST[0].id); break
    case 'close': M.modal = null; break
  }
  render()
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { M.modal = null; M.menu = null; render() } })
render()
</script>
</body>
</html>
