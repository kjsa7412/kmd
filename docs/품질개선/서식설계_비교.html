트웨이운영설계서","kind":"사람이 쓴 설계서","best":"A","why":"머리의 장부 값(설치: · 설정: · 서비스로그:)을 지키고 장 번호만 뗐다. 잘린 행은 메모에만 두었다. B · D 는 머리 값을 바꿨고, C 는 참고 키가 어긋나 개정 이력을 잃는다. A 의 흠: 개정 7줄이 본문에 남았고 그 줄이 걷은 장 번호를 가리킨다.","views":[{"k":"src","l":"원본","t":"# 게이트웨이운영설계서\n\n연계 게이트웨이를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한 문서다. 원격 작업이 불가해 설치 · 패치 · 장애 대응은 현장 방문으로 한다.\n\n## 개요: 게이트웨이 운영 설계서의 판 · 상태 · 근거 (DPMS_3.3.4)\n\n| | |\n|---|---|\n| 사업 | 배수펌프장 통합운영관리시스템(DPMS) 구축 |\n| WBS | 3.3.4 게이트웨이 운영 설계 |\n| 작성 | DPMS 개발 (세정아이앤씨) 사경진 과장 |\n| 기준일 | 2026-10-18 |\n| 판 | v0.1 (2026-10-15). 설치 패키지 구현(`dpms_gateway/dist`)을 기준으로 처음 씀 |\n| 개정 | 2026-10-15 작성 사경진 과장. TermFlow 표준 용어로 테이블 · 컬럼 이름 재설계 반영 (3.4_설계_DPMS웹설계\\작업문서\\TermFlow재설계). 게이트웨이 DB 표 이름(`gt_*`)과 9절 조회 예의 칸 이름을 바꿈 |\n| 개정 | 2026-10-16 작성 사경진 과장. TermFlow 테이블 설계 가이드 적용 (코드 컬럼 · 감사 컬럼 · 코드값). 보존 정리 표의 명령 상태 값을 새 값(`RJCT_GW` · `DLVR_UNKN`)으로, 9절 접속 기록 조회 예를 문자 코드 비교(`rpns_cd IN ('211', …)`)로 바꿈. 모든 게이트웨이 표에 표준 감사 컬럼이 붙었다 |\n| 개정 | 2026-10-16 작성 사경진 과장. 게이트웨이 뷰어(UI/UX 검토 UXR-G-17). 9절에 뷰어(`http://127.0.0.1:18444/viewer/`)로 보는 점검 항목 · 보안 경계를 더했다 |\n| 개정 | 2026-10-16 작성 사경진 과장. 뷰어 진단 번들(UXR-G-11). 9절 반출: 뷰어 개요 [진단 번들] zip 하나. 명령줄 `gw diag` 는 아직 구현 전 |\n| 개정 | 2026-10-18 작성 사경진 과장. 망 구간 담당 정정: 게이트웨이 설치 PC · OS · PostgreSQL 은 나산전기산업(망연계 장비 전까지의 네트워크 · 서버), i-oneNet 정책은 DID 외주 (10절 #3). 근거 PLC 연계 요구사항정의서 v0.2 5장. 기준정보 운영 중 반영(다시 읽기 · 개소 사용 중지 · 기준정보 해시) 코드에 맞춤: 4.1 · 5절 반영 순서(6단계 다시 읽기), 9.1 기준정보 · 관리 화면 · 보안 경계 |\n| 개정 | 2026-10-18 작성 사경진 과장. PLC 연계 요구사항정의서 v0.2 의 명령 결과 두 단계 · 대상 개소에 맞춤: 4.1 설치 값에 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초), 4.2 허용 명령 확정(주배수펌프 기동 · 정지) · 설비 구성(도면 기준), 9.1 · 9.2 명령 점검 항목(접수 결과 · 동작 결과 · 지연 표시), 10절 #3 근거를 요구사항정의서 5장으로 |\n| 개정 | 2026-10-19 작성 사경진 과장. 2026-10-18 미결정 6건 확정: 4.1 설치 값에 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초), 9.1 명령 점검에 덮임 31(원값 없음) · 전달 불명이 생기는 경우 · `GW_LATE` |\n| 상태 | 초안. 설치 PC · DBMS · 망연계 주소 회신(`DPMS-ISS-03`)과 내부 시험 서버 설치 시험으로 확정한다 |\n| 근거 | `dpms_gateway/dist/build-dist.ps1` · `dist/package/`(`install.ps1` · `uninstall.ps1` · `README.txt` · `config/application.example.yml` · `winsw/dpms-gw.xml` · `db/create_db.sql` · `bin/*.cmd`) · 위험및이슈관리대장 `DPMS-ISS-08` · `DPMS-ISS-16` |\n| 같이 보는 문서 | [게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md) · [DPMS 연계 API 정의서](DPMS연계API정의서.md) · [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8절 |\n\n> 표기: **[확인]** 회신이 필요한 항목, **[협의]** 상대와 정할 항목, **[제안]** 이 설계가 정한 기본값, **[재계산 필요]** 실측으로 다시 정할 값.\n> 이 문서는 운영 방식(무엇을 어디에 두고 어떤 순서로 하는가)을 정한다. 현장에서 따라 하는 단계별 절차는 설치 절차서(WBS 8.3) · 운영 절차서가 이 문서를 바탕으로 쓴다.\n\n## 목적: 1. 목적 · 전제\n\n연계 게이트웨이(`dpms_gateway`)를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한다.\n\n| # | 전제 | 근거 | 이 설계에서의 뜻 |\n|--:|---|---|---|\n| 1 | **원격 작업 불가**. 유지보수 업체의 원격 접속을 허용하지 않는다 | `DPMS-ISS-08` (발주기관 자체보안대책서) | 설치 · 패치 · 장애 대응은 **현장 방문**으로 한다. 현장에서 인터넷 · 개발 도구 없이 끝낼 수 있어야 한다. 방문 전에는 DPMS 가 받은 `health` 이력 · 게이트웨이 상태로 원인 범위를 좁힌다 |\n| 2 | **패키지형 납품**. 납기가 현장 공사 · 인프라보다 빠르다 | `DPMS-ISS-16` | 현장 값(PLC 주소 · 매핑표 · 설비 · 허용 주소) 없이 설치할 수 있는 패키지를 납품하고, 현장 값은 설치 때 설정 · 기준정보로 넣는다 |\n| 3 | 폐쇄망(상황실 제어망) | 시스템 구성도 | Java · 라이브러리를 현장에서 받지 않는다. 전용 JRE 를 패키지에 넣는다 |\n| 4 | 설치 PC 는 Windows, DB 는 같은 PC 의 PostgreSQL | 프로그램 설계서 §2 | 설치 PC OS · PostgreSQL 판 **[확인: ISS-03]**. PostgreSQL 설치본은 이 패키지에 넣지 않는다 |\n| 5 | 범용 제품 | 설계 기조(2026-10-11) | 패키지 · 스크립트에 현장 고유값을 넣지 않는다. 현장마다 다른 값은 4절의 세 곳으로만 받는다 |\n\n## 패키지: 2. 패키지 구성\n\n개발 PC 에서 `powershell -ExecutionPolicy Bypass -File dist\\build-dist.ps1 [-WinSw \u003cWinSW-x64.exe>] [-SkipBuild]` 로 만든다. 결과는 `dist\\out\\dpms-gateway-\u003c판>\\` 폴더와 같은 이름의 zip 이다.\n\n| 경로 | 내용 | 만드는 곳 |\n|---|---|---|\n| `jre\\` | 전용 Java 17 런타임(jlink, 필요한 모듈 · 한국어/영어 로캘만) | build-dist ③ |\n| `dpms-gateway.jar` | 게이트웨이 (Spring Boot 실행형 jar). 매핑표 반영 도구 · 비밀값 도구도 이 jar 의 하위 명령 | build-dist ① (`mvn package`) |\n| `config\\application.example.yml` | 설치 값 설명 · 예 (4절) | `dist/package` |\n| `winsw\\dpms-gw.xml` · `winsw\\dpms-gw.exe` | Windows 서비스 설정 · WinSW 실행 파일. exe 는 레포에 넣지 않고 빌드 때 넣는다(없으면 예약 작업 방식, 6.3) | `dist/package` · build-dist ④ |\n| `bin\\gw-map.cmd` | 매핑표 반영 도구 (`map template` · `check` · `sql`) | `dist/package` |\n| `bin\\gw-secret.cmd` | 비밀값 도구 (`secret init` · `set` · `keys`) | `dist/package` |\n| `db\\create_db.sql` | DB 계정 `gw_app` · DB `dpms_gw` 만들기 (PostgreSQL 관리자로) | `dist/package` |\n| `db\\V001__gw_ddl.sql` | 스키마 참고본. 실제 적용은 게이트웨이가 기동 때 Flyway 로 한다 | build-dist ② |\n| `양식\\기준정보_적재양식.xlsx` | 빈 기준정보 적재 양식(설명 시트 · 예시 행). 패키지의 JRE 로 만들어 JRE 도 함께 확인한다 | build-dist ⑤ |\n| `install.ps1` · `uninstall.ps1` | 설치 · 갱신 / 서비스 내리기 | `dist/package` |\n| `README.txt` | 요약 설치 순서 · 폴더 설명 | `dist/package` |\n| `VERSION.txt` | 판 · 커밋(작업 중 변경이 있으면 `-dirty`) · 빌드 시각 · JRE 판 | build-dist ⑥ |\n| `checksums.txt` | `jre\\` 밖 파일의 SHA-256 | build-dist ⑥ |\n\n설치 뒤 설치 폴더에 생기는 것:\n\n| 경로 | 내용 |\n|---|---|\n| `config\\application.yml` | 설치 값 (install.ps1 ②, 처음 한 번) |\n| `config\\gw-api.p12` · `config\\gw-api.crt` | TLS 키 저장소 · 인증서 (install.ps1 ④) |\n| `secrets.dat` | 비밀값 (DPAPI, 그 PC 에서만 풀린다. install.ps1 ③) |\n| `data\\blackbox\\YYYY\\MM\\bb-YYYYMMDD.log[.gz]` | 블랙박스 (기록 B) |\n| `logs\\` | 로그 (6.2) |\n| `prev\\dpms-gateway.jar` | 직전 판 jar (갱신 때, 7절) |\n\n## 설치: 3. 설치 순서\n\n3.1. 준비\n\n- 설치 PC 에 PostgreSQL 이 설치 · 기동돼 있고 `127.0.0.1` 로만 받는다 **[확인: 판 · 설치 주체]**.\n- 패키지 zip 을 반입 절차대로 들여와 풀고, `checksums.txt` 로 파일을 확인한다.\n- DPMS 연계 API 에 붙을 주소(DPMS 서버, 망연계 장비가 중계하면 그 장비 주소)를 받아 둔다 **[확인: ISS-03]**.\n- 관리자 권한 PowerShell 을 연다.\n\n3.2. `install.ps1` 매개변수\n\n```\npowershell -ExecutionPolicy Bypass -File install.ps1 -AllowIps \u003c주소> [-CreateDb -PsqlPath \u003cpsql.exe>] [-ServerAddress \u003c이 PC 주소>] …\n```\n\n| 매개변수 | 기본값 | 뜻 |\n|---|---|---|\n| `-AllowIps` | (필수) | DPMS 연계 API 에 붙을 수 있는 주소 목록. 설정 `gw.api.allow-ips` 와 방화벽 규칙에 같이 쓴다 |\n| `-Target` | `C:\\dpms-gw` | 설치 폴더 |\n| `-Port` | 18443 | DPMS 연계 API 포트 |\n| `-DbUrl` | `jdbc:postgresql://127.0.0.1:5432/dpms_gw` | DB 접속 주소 |\n| `-CreateDb` | 끔 | DB 계정 · DB 를 만든다(처음 설치 때만) |\n| `-PsqlPath` | | `-CreateDb` 때 `psql.exe` 위치 |\n| `-PgSuperUser` · `-PgHost` · `-PgPort` | `postgres` · `127.0.0.1` · 5432 | `-CreateDb` 때 PostgreSQL 관리자 접속 |\n| `-ServerAddress` | | TLS 인증서 SAN 에 넣을 이 PC 주소 |\n| `-NoTls` | 끔 | TLS 를 쓰지 않는다(HTTP). i-oneNet 이 TLS 를 통과시키지 못할 때만 **[협의: ISS-03]** |\n| `-NoFirewall` | 끔 | 방화벽 규칙을 만들지 않는다 |\n| `-NoStart` | 끔 | 서비스를 등록만 하고 시작 · 기동 확인을 하지 않는다 |\n\n3.3. 단계\n\n| 단계 | 하는 일 | 다시 실행할 때 |\n|--:|---|---|\n| 1 복사 | 설치 폴더와 `config` · `data` · `logs` 를 만든다. 서비스가 돌고 있으면 멈춘다. 이미 jar 가 있으면 `prev\\dpms-gateway.jar` 로 남긴다. `jre` · `bin` · `db` · `양식` · `winsw` 폴더와 jar · 스크립트 · `README.txt` · `VERSION.txt` · `checksums.txt` · `config\\application.example.yml` 을 복사한다 | 갱신(7절) |\n| 2 설정 | `config\\application.yml` 을 매개변수로 만든다: DB 주소 · 계정 `gw_app`, API 포트 · TLS 사용 · 허용 주소, 블랙박스 폴더 `data/blackbox`, 비밀값 저장소 `dpapi` · `secrets.dat`, TLS 면 `server.ssl.*`(키 저장소 `config/gw-api.p12`, 별칭 `dpms-gw`) | 있으면 그대로 둔다(손으로 고친 값을 지키기 위해) |\n| 3 비밀값 | `secret init secrets.dat dpms-ctrl dpms-read`: `jwt.key` 와 두 클라이언트 비밀값을 무작위로 만든다. **클라이언트 비밀값은 화면에 한 번만 나온다**(DPMS 설정에 옮긴다). `db.password` 가 없으면 무작위로 만들어 넣는다 | 있는 키는 그대로 둔다 |\n| 4 TLS | `-NoTls` 가 아니면 PKCS12 키 저장소 `config\\gw-api.p12` 를 만든다(EC P-256, 10년, `CN=dpms-gateway`, `-ServerAddress` 가 있으면 SAN). 비밀번호는 무작위로 만들어 `secrets.dat` 의 `tls.keystore.password` 에 넣는다. 인증서 `config\\gw-api.crt` 를 내보낸다(DPMS 쪽 게이트웨이 신뢰 목록에 넣는다) | 있으면 그대로 둔다 |\n| 5 DB | `-CreateDb` 면 `db\\create_db.sql` 의 비밀번호 자리에 3단계 `db.password` 를 채워 PostgreSQL 관리자로 넣는다: 계정 `gw_app`, DB `dpms_gw`(소유 `gw_app`, UTF8). 관리자 비밀번호는 psql 이 묻는다. 스키마 · 표는 게이트웨이가 기동 때 Flyway 로 만든다 | `db.password` 가 이미 있으면 멈춘다(`-CreateDb` 를 빼고 다시 실행) |\n| 6 서비스 | `winsw\\dpms-gw.exe` 가 있으면 서비스 `dpms-gw` 를 등록(있으면 설정 갱신)하고 다시 시작한다. 없으면 예약 작업으로 대신한다(6.3) | 설정 갱신 · 다시 시작 |\n| 7 방화벽 | 인바운드 규칙 `DPMS 연계 API`: TCP `-Port` 를 `-AllowIps` 에서만 허용. 같은 이름 규칙은 지우고 다시 만든다 | 다시 만든다 |\n| 8 기동 확인 | `https://127.0.0.1:\u003c포트>/gw/v1/health` 를 2초마다 최대 3분 부른다. 응답이 오거나 거부(401 · 403)가 오면 기동한 것으로 본다(127.0.0.1 이 허용 목록 밖이면 거부가 정상). 응답이 없으면 `logs\\startup.log` · `gateway.log` 를 보라고 알린다 | |\n\n- `-CreateDb` 를 쓰지 않으면 DB 계정 `gw_app` 의 비밀번호를 3단계에서 만든 값으로 맞추거나, `bin\\gw-secret.cmd set secrets.dat db.password=…` 로 기존 비밀번호를 넣는다.\n- 설치가 끝나면 기준정보를 넣는다(5절). 기준정보가 없으면 게이트웨이는 PLC 에 붙지 않는다.\n- DPMS 쪽에 넘길 것: 게이트웨이 주소 · 포트, 클라이언트 ID · 비밀값(`dpms-ctrl` 조회 + 명령, `dpms-read` 조회만), `config\\gw-api.crt`.\n\n3.4. 서비스 내리기\n\n`uninstall.ps1 [-Target …]`: 서비스(또는 예약 작업)와 방화벽 규칙만 지운다. 설치 폴더(`data` · `logs` · `config` · `secrets.dat`)와 DB `dpms_gw` 는 남긴다. 완전히 지우려면 폴더와 DB 를 따로 지운다.\n\n## 설정: 4. 설정\n\n4.1. 값을 두는 세 곳\n\n| 곳 | 담는 것 | 넣는 방법 | 바꾼 뒤 |\n|---|---|---|---|\n| `config\\application.yml` (설치 값) | 그 설치에서 제품 기본값과 다른 운영 값: DB 주소 · 계정, API 포트 · TLS · 허용 주소, 블랙박스 폴더 · 보존, 피드 보존, 매일 정리 시각, 허용 명령 코드, PLC 멈춤 판정 시간, 명령 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초. 이 시간이 지나도 PLC 결과가 없으면 \"결과 확인 중(지연)\" 만 표시하고 실패 처리하지 않는다), 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초. 이 시간 안에 PLC 접수 번호가 오지 않으면 그 명령을 전달 불명으로 끝내고 같은 PLC 의 접수 대기(308)를 푼다) 등 (프로그램 설계서 §3.4 의 키) | install.ps1 ② 가 만들고, 그 뒤는 `application.example.yml` 을 보고 손으로 고친다 | 서비스 다시 시작 |\n| `secrets.dat` (비밀값) | `db.password` · `jwt.key` · `client.\u003c클라이언트ID>.secret` · `tls.keystore.password` | install.ps1 ③ · ④, `bin\\gw-secret.cmd init` · `set` · `keys` | 서비스 다시 시작 |\n| 기준정보 DB (`gw` 스키마) | PLC 연결(`gt_link`) · 사이트(`gt_site`) · 설비(`gt_fclt`) · 매핑표(`gt_map_iem`) · 경보 코드(`gt_alrm_cd`) · 결과 코드 대응(`gt_rslt_cd_ractn`) · 판 기록(`gt_map_ver`) | `bin\\gw-map.cmd` 로 만든 적재 SQL 을 `psql` 로, 또는 뷰어 「기준정보 · 관리」 양식 적재 (5절) | 기준정보 다시 읽기 (뷰어 양식 적재는 적재 뒤 바로 다시 읽는다). 바뀐 링크만 다시 연결하고 서비스는 다시 시작하지 않는다 |\n\n- 제품 기본값은 jar 안의 `application.yml` 이다. 설치 값 파일에는 다른 값만 둔다. 프로파일은 `site`(서비스 설정이 준다).\n- 비밀값은 설정 파일 · 로그 · 진단 자료에 쓰지 않는다. `secrets.dat` 는 DPAPI 머신 범위로 암호화돼 그 PC 에서만 풀린다. PC 를 바꾸면 그 PC 에서 다시 만든다.\n- PLC 접속 주소 · 폴링 주기 · 워드 순서 같은 링크별 값은 설정 파일이 아니라 기준정보(`gt_link`)다.\n- 기동 때 설정 값 범위를 검사하고, 틀리면 기동을 멈추고 `logs\\startup.log` 에 사유를 남긴다. 허용 주소가 비어 있어도 기동을 멈춘다.\n\n4.2. 현장 설정 예 (합천)\n\n아래는 첫 설치 현장의 값이다. 패키지 · 스크립트의 기본값이 아니다.\n\n| 곳 | 값 | 상태 |\n|---|---|---|\n| `-AllowIps` · `gw.api.allow-ips` | i-oneNet(망연계) 중계 장비 주소 | **[확인: ISS-03]** |\n| `gw.command.allowed-cmd-codes` | `[1, 2]` (기동 · 정지). 명령 대상은 매핑표에 동작 결과 영역이 있는 주배수펌프뿐 | 확정 (요구사항정의서 v0.2 CMD-07) |\n| 기준정보 `gt_link` · `gt_site` | 대상 5개소(핫들 · 영창 · 미곡 · 질매 · 삼가 배수펌프장, 2026-10-16 확정, ISS-09), 개소마다 PLC 하나 · 사이트 하나. 첫 시험 현장 질매 | PLC 쪽 매핑표 · 개소 구성도 수령 뒤 |\n| 기준정보 `gt_fclt` | 도면 기준 개소마다 주배수펌프 3 · 지배수펌프 2 · 토출밸브 3 · 제진기 3 · 협잡물 컨베이어 2, 미곡만 수문(배수통문) 1 추가 (요구사항정의서 v0.2 4.2). 실제 PLC 구성이 다르면 매핑표 · 기준정보로 맞춘다 | 〃 |\n| 설치 PC · DB | 상황실 제어망 PC, 같은 PC 의 PostgreSQL | **[확인: ISS-03]** |\n\n## 기준정보: 5. 기준정보 반영\n\nPLC 담당 매핑표를 받으면 아래 순서로 넣는다. 양식 · 검사 · 시험 벡터 · 적재 SQL 규칙은 [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8.3절.\n\n| 순서 | 하는 일 | 도구 |\n|--:|---|---|\n| 1 | 빈 양식(`양식\\기준정보_적재양식.xlsx`)에 연결 · 설비 · 경보코드 · 매핑표 · (결과코드) · 시험벡터 시트를 채운다. 예시 행은 지운다 | Excel |\n| 2 | 검사한다. 오류가 있으면 고치고 다시 한다 | `bin\\gw-map.cmd check 양식.xlsx` |\n| 3 | 적재 SQL 을 만든다. 시험 벡터가 통과한 사이트만 판(`gt_site.map_ver`)이 올라간다 | `bin\\gw-map.cmd sql 양식.xlsx 적재.sql --activate` |\n| 4 | `적재.sql` 머리 주석에서 사이트마다 \"판 올림\" 인지 확인한다 | 메모장 |\n| 5 | 넣는다(한 트랜잭션) | `psql -U gw_app -d dpms_gw -f 적재.sql` |\n| 6 | 기준정보를 다시 읽는다. 바뀐 링크만 끊었다 다시 연결하고, 바뀌지 않은 개소의 폴링은 끊기지 않는다. 끝나지 않은 명령이 있으면 다시 읽지 않으므로(409) 명령이 끝난 뒤 다시 한다 | 뷰어 「기준정보 · 관리」 [기준정보 다시 읽기] (`POST /viewer/api/reload`) |\n| 7 | `status` 에서 사이트마다 `links[].st = UP`, `gwMapVer = plcMapVer`, `missingRoles` 빈 목록을 확인한다 | DPMS 화면 또는 9절 |\n\n- 양식 파일과 적재 SQL 은 판마다 남긴다(현장 설치 기록). 다른 판의 매핑표 줄은 DB 에 그대로 남으므로 이전 판으로 되돌릴 때는 그 판의 양식으로 3 ~ 6 을 다시 한다(적재 뒤 기준정보 다시 읽기까지. PLC 의 판 번호도 그 판이어야 한다).\n- 뷰어 「기준정보 · 관리」 에서 양식을 적재하면 검사 · SQL 만들기 · 넣기 · 다시 읽기(2 · 3 · 5 · 6)를 한 번에 한다(`POST /viewer/api/map/apply`, 판 올림은 선택, 적재 뒤 다시 읽기가 기본). 명령이 진행 중이라 다시 읽지 못했으면 명령이 끝난 뒤 [기준정보 다시 읽기] 를 누른다. `psql` 로 직접 넣었을 때도 [기준정보 다시 읽기] 로 반영한다. 게이트웨이 다시 시작(`restart=true` 또는 [다시 시작])은 설정 파일 · 비밀값을 바꿨을 때처럼 다시 읽기로 반영되지 않는 경우에만 한다.\n- `--activate` 없이 만들면 판을 올리지 않는다(내용 확인용). 새 사이트를 판 올림 없이 넣으면 판 0 으로 들어가 수집 · 제어를 하지 않는다.\n\n## 서비스로그: 6. 서비스 · 로그\n\n6.1. Windows 서비스 (WinSW)\n\n`winsw\\dpms-gw.xml` (WinSW v2). `%BASE%` 는 `winsw` 폴더다.\n\n| 항목 | 값 |\n|---|---|\n| 서비스 ID · 이름 | `dpms-gw` · DPMS 연계 게이트웨이 |\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\n| 환경변수 | `SPRING_PROFILES_ACTIVE=site`, `GW_LOG_DIR=\u003c설치 폴더>\\logs` |\n| 시작 | 자동(지연 시작) |\n| 실패 시 | 10초 → 30초 → 60초 뒤 다시 시작, 실패 횟수는 1시간 뒤 초기화 |\n| 정지 대기 | 20초 |\n| 서비스 래퍼 로그 | `logs\\service\\`, 크기 10MB 마다 돌리고 8개 보관 |\n| 실행 계정 | WinSW 기본(LocalSystem). `secrets.dat` 는 머신 범위라 계정에 묶이지 않는다 |\n\n6.2. 로그\n\n| 파일 | 내용 | 보존 |\n|---|---|---|\n| `logs\\startup.log` | 기동 자가진단 결과. 기동 실패 사유가 첫 줄에 보인다 | 기동마다 덮어씀 |\n| `logs\\gateway.log` | 프로그램 로그(링크 상태 변화 · 명령 · 정리 결과 · 오류) | 날마다 `gateway.YYYY-MM-DD.log` 로 돌리고 30일 |\n| `logs\\service\\` | WinSW 래퍼 로그(표준 출력 · 오류) | 10MB × 8 |\n| `data\\blackbox\\` | 블랙박스(기록 B). 로그가 아니라 증거 기록이다 | 8절 |\n\n로그에는 비밀값을 남기지 않는다. 운영 사건(링크 상태 · 명령 진행 · 경보)은 로그보다 피드(`gt_evt`)와 블랙박스가 정본이다.\n\n6.3. WinSW 가 없을 때 (예약 작업)\n\n패키지에 `winsw\\dpms-gw.exe` 가 없으면 install.ps1 이 Windows 예약 작업 `dpms-gw` 로 대신한다.\n\n| 항목 | 값 |\n|---|---|\n| 트리거 | 시스템 시작 시 |\n| 계정 | `SYSTEM`, 가장 높은 권한 |\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Dspring.profiles.active=site -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\n| 실패 시 | 1분 간격으로 다시 시작(최대 999회), 실행 시간 제한 없음 |\n| 로그 | `logs\\` (작업 폴더 기준 기본값). 래퍼 로그는 없다 |\n\n예약 작업은 비상용이다. 정지 · 재시작 관리가 서비스보다 약하므로 납품 패키지에는 WinSW 를 넣는다 **[확인: WinSW 실행 파일 반입]**.\n\n## 갱신: 7. 갱신 · 되돌리기\n\n| 작업 | 방법 |\n|---|---|\n| 갱신 | 새 패키지를 풀고 그 폴더에서 `install.ps1` 을 같은 매개변수로 다시 실행한다. 서비스를 멈추고, 직전 jar 를 `prev\\` 에 남기고, 프로그램 파일(`jre` · `bin` · `db` · `양식` · `winsw` · jar)을 바꾼다. `config\\application.yml` · `secrets.dat` · TLS 키 저장소 · `data` · `logs` 는 그대로 둔다. 서비스 설정을 갱신하고 다시 시작한다 |\n| 스키마 | 게이트웨이가 기동 때 Flyway 로 새 마이그레이션(`V00n__*.sql`)만 적용한다(적용된 것은 검증만). 스키마 적용에 실패하면 기동을 멈춘다 |\n| 되돌리기 | 서비스 정�"},{"k":"A","l":"안 A 작성기준 확장","t":"# 게이트웨이운영설계서\n\n연계 게이트웨이를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한 문서다. 원격 작업이 불가해 설치 · 패치 · 장애 대응은 현장 방문으로 한다.\n\n## 개요\n\n이 설계서는 DPMS 구축 WBS 3.3.4 의 게이트웨이 운영 설계이고, 지금 판은 초안이다.\n\n- **사업**: 배수펌프장 통합운영관리시스템(DPMS) 구축\n- **WBS**: 3.3.4 게이트웨이 운영 설계\n- **작성**: DPMS 개발 (세정아이앤씨) 사경진 과장\n- **기준일**: 2026-10-18\n- **판**: v0.1 (2026-10-15). 설치 패키지 구현(`dpms_gateway/dist`)을 기준으로 처음 썼다.\n- **상태**: 초안. 설치 PC · DBMS · 망연계 주소 회신(`DPMS-ISS-03`)과 내부 시험 서버 설치 시험으로 확정한다.\n- **근거**: `dpms_gateway/dist/build-dist.ps1` · `dist/package/` · 위험및이슈관리대장 `DPMS-ISS-08` · `DPMS-ISS-16`\n* `dist/package/` 안: `install.ps1` · `uninstall.ps1` · `README.txt` · `config/application.example.yml` · `winsw/dpms-gw.xml` · `db/create_db.sql` · `bin/*.cmd`\n- **같이 보는 문서**: [게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md) · [DPMS 연계 API 정의서](DPMS연계API정의서.md) · [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8절\n- **개정**:\n* 2026-10-15 사경진 과장: TermFlow 표준 용어로 테이블 · 컬럼 이름 재설계 반영(3.4_설계_DPMS웹설계\\작업문서\\TermFlow재설계). 게이트웨이 DB 표 이름(`gt_*`)과 9절 조회 예의 칸 이름을 바꿨다.\n* 2026-10-16 사경진 과장: TermFlow 테이블 설계 가이드 적용(코드 컬럼 · 감사 컬럼 · 코드값). 보존 정리 표의 명령 상태 값을 새 값(`RJCT_GW` · `DLVR_UNKN`)으로, 9절 접속 기록 조회 예를 문자 코드 비교(`rpns_cd IN ('211', …)`)로 바꿨다. 모든 게이트웨이 표에 표준 감사 컬럼이 붙었다.\n* 2026-10-16 사경진 과장: 게이트웨이 뷰어(UI/UX 검토 UXR-G-17). 9절에 뷰어(`http://127.0.0.1:18444/viewer/`)로 보는 점검 항목 · 보안 경계를 더했다.\n* 2026-10-16 사경진 과장: 뷰어 진단 번들(UXR-G-11). 9절 반출: 뷰어 개요 [진단 번들] zip 하나. 명령줄 `gw diag` 는 아직 구현 전이다.\n* 2026-10-18 사경진 과장: 망 구간 담당 정정. 게이트웨이 설치 PC · OS · PostgreSQL 은 나산전기산업(망연계 장비 전까지의 네트워크 · 서버), i-oneNet 정책은 DID 외주(10절 #3). 근거 PLC 연계 요구사항정의서 v0.2 5장. 기준정보 운영 중 반영(다시 읽기 · 개소 사용 중지 · 기준정보 해시)을 코드에 맞췄다: 4.1 · 5절 반영 순서(6단계 다시 읽기), 9.1 기준정보 · 관리 화면 · 보안 경계.\n* 2026-10-18 사경진 과장: PLC 연계 요구사항정의서 v0.2 의 명령 결과 두 단계 · 대상 개소에 맞췄다. 4.1 설치 값에 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초), 4.2 허용 명령 확정(주배수펌프 기동 · 정지) · 설비 구성(도면 기준), 9.1 · 9.2 명령 점검 항목(접수 결과 · 동작 결과 · 지연 표시), 10절 #3 근거를 요구사항정의서 5장으로.\n* 2026-10-19 사경진 과장: 2026-10-18 미결정 6건 확정. 4.1 설치 값에 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초), 9.1 명령 점검에 덮임 31(원값 없음) · 전달 불명이 생기는 경우 · `GW_LATE`.\n\n1. 표기\n- **[확인]**: 회신이 필요한 항목\n- **[협의]**: 상대와 정할 항목\n- **[제안]**: 이 설계가 정한 기본값\n- **[재계산 필요]**: 실측으로 다시 정할 값\n\n2. 범위\n- 이 문서는 운영 방식(무엇을 어디에 두고 어떤 순서로 하는가)을 정한다.\n- 현장에서 따라 하는 단계별 절차는 설치 절차서(WBS 8.3) · 운영 절차서가 이 문서를 바탕으로 쓴다.\n\n## 목적: 목적 · 전제\n\n연계 게이트웨이(`dpms_gateway`)를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한다. 아래 다섯 전제가 이 설계를 묶는다.\n\n| # | 전제 | 근거 | 이 설계에서의 뜻 |\n|--:|---|---|---|\n| 1 | **원격 작업 불가**. 유지보수 업체의 원격 접속을 허용하지 않는다 | `DPMS-ISS-08` (발주기관 자체보안대책서) | 설치 · 패치 · 장애 대응은 **현장 방문**으로 한다. 현장에서 인터넷 · 개발 도구 없이 끝낼 수 있어야 한다. 방문 전에는 DPMS 가 받은 `health` 이력 · 게이트웨이 상태로 원인 범위를 좁힌다 |\n| 2 | **패키지형 납품**. 납기가 현장 공사 · 인프라보다 빠르다 | `DPMS-ISS-16` | 현장 값(PLC 주소 · 매핑표 · 설비 · 허용 주소) 없이 설치할 수 있는 패키지를 납품하고, 현장 값은 설치 때 설정 · 기준정보로 넣는다 |\n| 3 | 폐쇄망(상황실 제어망) | 시스템 구성도 | Java · 라이브러리를 현장에서 받지 않는다. 전용 JRE 를 패키지에 넣는다 |\n| 4 | 설치 PC 는 Windows, DB 는 같은 PC 의 PostgreSQL | 프로그램 설계서 §2 | 설치 PC OS · PostgreSQL 판 **[확인: ISS-03]**. PostgreSQL 설치본은 이 패키지에 넣지 않는다 |\n| 5 | 범용 제품 | 설계 기조(2026-10-11) | 패키지 · 스크립트에 현장 고유값을 넣지 않는다. 현장마다 다른 값은 [설정](#설정)의 세 곳으로만 받는다 |\n\n## 패키지: 패키지 구성\n\n설치 패키지는 개발 PC 에서 `build-dist.ps1` 로 만드는 폴더 하나와 같은 이름의 zip 이다.\n\n1. 만들기\n1) 개발 PC 에서 `powershell -ExecutionPolicy Bypass -File dist\\build-dist.ps1 [-WinSw \u003cWinSW-x64.exe>] [-SkipBuild]` 를 실행한다. 결과는 `dist\\out\\dpms-gateway-\u003c판>\\` 폴더와 같은 이름의 zip 이다.\n\n2. 패키지 안\n\n| 경로 | 내용 | 만드는 곳 |\n|---|---|---|\n| `jre\\` | 전용 Java 17 런타임(jlink, 필요한 모듈 · 한국어/영어 로캘만) | build-dist ③ |\n| `dpms-gateway.jar` | 게이트웨이 (Spring Boot 실행형 jar). 매핑표 반영 도구 · 비밀값 도구도 이 jar 의 하위 명령 | build-dist ① (`mvn package`) |\n| `config\\application.example.yml` | 설치 값 설명 · 예 ([설정](#설정)) | `dist/package` |\n| `winsw\\dpms-gw.xml` · `winsw\\dpms-gw.exe` | Windows 서비스 설정 · WinSW 실행 파일. exe 는 레포에 넣지 않고 빌드 때 넣는다(없으면 예약 작업 방식, [서비스 · 로그](#서비스로그) 3.) | `dist/package` · build-dist ④ |\n| `bin\\gw-map.cmd` | 매핑표 반영 도구 (`map template` · `check` · `sql`) | `dist/package` |\n| `bin\\gw-secret.cmd` | 비밀값 도구 (`secret init` · `set` · `keys`) | `dist/package` |\n| `db\\create_db.sql` | DB 계정 `gw_app` · DB `dpms_gw` 만들기 (PostgreSQL 관리자로) | `dist/package` |\n| `db\\V001__gw_ddl.sql` | 스키마 참고본. 실제 적용은 게이트웨이가 기동 때 Flyway 로 한다 | build-dist ② |\n| `양식\\기준정보_적재양식.xlsx` | 빈 기준정보 적재 양식(설명 시트 · 예시 행). 패키지의 JRE 로 만들어 JRE 도 함께 확인한다 | build-dist ⑤ |\n| `install.ps1` · `uninstall.ps1` | 설치 · 갱신 / 서비스 내리기 | `dist/package` |\n| `README.txt` | 요약 설치 순서 · 폴더 설명 | `dist/package` |\n| `VERSION.txt` | 판 · 커밋(작업 중 변경이 있으면 `-dirty`) · 빌드 시각 · JRE 판 | build-dist ⑥ |\n| `checksums.txt` | `jre\\` 밖 파일의 SHA-256 | build-dist ⑥ |\n\n3. 설치 뒤 생기는 것\n\n| 경로 | 내용 |\n|---|---|\n| `config\\application.yml` | 설치 값 (install.ps1 ②, 처음 한 번) |\n| `config\\gw-api.p12` · `config\\gw-api.crt` | TLS 키 저장소 · 인증서 (install.ps1 ④) |\n| `secrets.dat` | 비밀값 (DPAPI, 그 PC 에서만 풀린다. install.ps1 ③) |\n| `data\\blackbox\\YYYY\\MM\\bb-YYYYMMDD.log[.gz]` | 블랙박스 (기록 B) |\n| `logs\\` | 로그 ([서비스 · 로그](#서비스로그) 2.) |\n| `prev\\dpms-gateway.jar` | 직전 판 jar (갱신 때, [갱신 · 되돌리기](#갱신)) |\n\n## 설치: 설치 순서\n\n게이트웨이는 관리자 PowerShell 에서 `install.ps1` 한 번으로 설치하고, 같은 명령을 다시 실행하면 갱신한다.\n\n1. 준비\n- 설치 PC 에 PostgreSQL 이 설치 · 기동돼 있고 `127.0.0.1` 로만 받는다 **[확인: 판 · 설치 주체]**.\n- 패키지 zip 을 반입 절차대로 들여와 풀고, `checksums.txt` 로 파일을 확인한다.\n- DPMS 연계 API 에 붙을 주소(DPMS 서버, 망연계 장비가 중계하면 그 장비 주소)를 받아 둔다 **[확인: ISS-03]**.\n- 관리자 권한 PowerShell 을 연다.\n\n2. 입력: `install.ps1` 매개변수\n\n```\npowershell -ExecutionPolicy Bypass -File install.ps1 -AllowIps \u003c주소> [-CreateDb -PsqlPath \u003cpsql.exe>] [-ServerAddress \u003c이 PC 주소>] …\n```\n\n| 매개변수 | 기본값 | 뜻 |\n|---|---|---|\n| `-AllowIps` | (필수) | DPMS 연계 API 에 붙을 수 있는 주소 목록. 설정 `gw.api.allow-ips` 와 방화벽 규칙에 같이 쓴다 |\n| `-Target` | `C:\\dpms-gw` | 설치 폴더 |\n| `-Port` | 18443 | DPMS 연계 API 포트 |\n| `-DbUrl` | `jdbc:postgresql://127.0.0.1:5432/dpms_gw` | DB 접속 주소 |\n| `-CreateDb` | 끔 | DB 계정 · DB 를 만든다(처음 설치 때만) |\n| `-PsqlPath` | - | `-CreateDb` 때 `psql.exe` 위치 |\n| `-PgSuperUser` · `-PgHost` · `-PgPort` | `postgres` · `127.0.0.1` · 5432 | `-CreateDb` 때 PostgreSQL 관리자 접속 |\n| `-ServerAddress` | - | TLS 인증서 SAN 에 넣을 이 PC 주소 |\n| `-NoTls` | 끔 | TLS 를 쓰지 않는다(HTTP). i-oneNet 이 TLS 를 통과시키지 못할 때만 **[협의: ISS-03]** |\n| `-NoFirewall` | 끔 | 방화벽 규칙을 만들지 않는다 |\n| `-NoStart` | 끔 | 서비스를 등록만 하고 시작 · 기동 확인을 하지 않는다 |\n\n3. 단계\n1) 복사: 설치 폴더와 `config` · `data` · `logs` 를 만든다. 서비스가 돌고 있으면 멈추고, 이미 jar 가 있으면 `prev\\dpms-gateway.jar` 로 남긴다. `jre` · `bin` · `db` · `양식` · `winsw` 폴더와 jar · 스크립트 · `README.txt` · `VERSION.txt` · `checksums.txt` · `config\\application.example.yml` 을 복사한다.\n- 다시 실행할 때: 갱신([갱신 · 되돌리기](#갱신))\n2) 설정: `config\\application.yml` 을 매개변수로 만든다. DB 주소 · 계정 `gw_app`, API 포트 · TLS 사용 · 허용 주소, 블랙박스 폴더 `data/blackbox`, 비밀값 저장소 `dpapi` · `secrets.dat`, TLS 면 `server.ssl.*`(키 저장소 `config/gw-api.p12`, 별칭 `dpms-gw`)를 넣는다.\n- 다시 실행할 때: 있으면 그대로 둔다(손으로 고친 값을 지키기 위해)\n3) 비밀값: `secret init secrets.dat dpms-ctrl dpms-read` 로 `jwt.key` 와 두 클라이언트 비밀값을 무작위로 만든다. **클라이언트 비밀값은 화면에 한 번만 나온다**(DPMS 설정에 옮긴다). `db.password` 가 없으면 무작위로 만들어 넣는다.\n- 다시 실행할 때: 있는 키는 그대로 둔다\n4) TLS: `-NoTls` 가 아니면 PKCS12 키 저장소 `config\\gw-api.p12` 를 만든다(EC P-256, 10년, `CN=dpms-gateway`, `-ServerAddress` 가 있으면 SAN). 비밀번호는 무작위로 만들어 `secrets.dat` 의 `tls.keystore.password` 에 넣는다. 인증서 `config\\gw-api.crt` 를 내보낸다(DPMS 쪽 게이트웨이 신뢰 목록에 넣는다).\n- 다시 실행할 때: 있으면 그대로 둔다\n5) DB: `-CreateDb` 면 `db\\create_db.sql` 의 비밀번호 자리에 3) 의 `db.password` 를 채워 PostgreSQL 관리자로 넣는다. 계정 `gw_app`, DB `dpms_gw`(소유 `gw_app`, UTF8)가 생긴다. 관리자 비밀번호는 psql 이 묻는다. 스키마 · 표는 게이트웨이가 기동 때 Flyway 로 만든다.\n- 다시 실행할 때: `db.password` 가 이미 있으면 멈춘다(`-CreateDb` 를 빼고 다시 실행)\n6) 서비스: `winsw\\dpms-gw.exe` 가 있으면 서비스 `dpms-gw` 를 등록(있으면 설정 갱신)하고 다시 시작한다. 없으면 예약 작업으로 대신한다([서비스 · 로그](#서비스로그) 3.).\n- 다시 실행할 때: 설정 갱신 · 다시 시작\n7) 방화벽: 인바운드 규칙 `DPMS 연계 API` 를 만들어 TCP `-Port` 를 `-AllowIps` 에서만 허용한다. 같은 이름 규칙은 지우고 다시 만든다.\n- 다시 실행할 때: 다시 만든다\n8) 기동 확인: `https://127.0.0.1:\u003c포트>/gw/v1/health` 를 2초마다 최대 3분 부른다. 응답이 오거나 거부(401 · 403)가 오면 기동한 것으로 본다(127.0.0.1 이 허용 목록 밖이면 거부가 정상). 응답이 없으면 `logs\\startup.log` · `gateway.log` 를 보라고 알린다.\n- 다시 실행할 때: -\n\n4. 확인\n- `-CreateDb` 를 쓰지 않으면 DB 계정 `gw_app` 의 비밀번호를 3) 에서 만든 값으로 맞추거나, `bin\\gw-secret.cmd set secrets.dat db.password=…` 로 기존 비밀번호를 넣는다.\n- 설치가 끝나면 기준정보를 넣는다([기준정보 반영](#기준정보)). 기준정보가 없으면 게이트웨이는 PLC 에 붙지 않는다.\n- DPMS 쪽에 넘길 것: 게이트웨이 주소 · 포트, 클라이언트 ID · 비밀값(`dpms-ctrl` 조회 + 명령, `dpms-read` 조회만), `config\\gw-api.crt`.\n\n5. 되돌리기: 서비스 내리기\n1) `uninstall.ps1 [-Target …]` 을 실행한다. 서비스(또는 예약 작업)와 방화벽 규칙만 지운다.\n- 설치 폴더(`data` · `logs` · `config` · `secrets.dat`)와 DB `dpms_gw` 는 남는다. 완전히 지우려면 폴더와 DB 를 따로 지운다.\n\n## 설정\n\n게이트웨이 설정 값은 설치 값 · 비밀값 · 기준정보 DB 세 곳에만 두고, 곳마다 넣는 방법과 반영 방법이 다르다.\n\n1. 값을 두는 세 곳\n\n| 곳 | 넣는 방법 | 바꾼 뒤 |\n|---|---|---|\n| `config\\application.yml` (설치 값) | install.ps1 ② 가 만들고, 그 뒤는 `application.example.yml` 을 보고 손으로 고친다 | 서비스 다시 시작 |\n| `secrets.dat` (비밀값) | install.ps1 ③ · ④, `bin\\gw-secret.cmd init` · `set` · `keys` | 서비스 다시 시작 |\n| 기준정보 DB (`gw` 스키마) | `bin\\gw-map.cmd` 로 만든 적재 SQL 을 `psql` 로, 또는 뷰어 「기준정보 · 관리」 양식 적재([기준정보 반영](#기준정보)) | 기준정보 다시 읽기(뷰어 양식 적재는 적재 뒤 바로 다시 읽는다). 바뀐 링크만 다시 연결하고 서비스는 다시 시작하지 않는다 |\n\n1.1. 설치 값(`config\\application.yml`)\n설치 값은 그 설치에서 제품 기본값과 다른 운영 값이다(키는 프로그램 설계서 §3.4). 주요한 것은 아래와 같다.\n- DB 주소 · 계정\n- API 포트 · TLS · 허용 주소\n- 블랙박스 폴더 · 보존\n- 피드 보존\n- 매일 정리 시각\n- 허용 명령 코드\n- PLC 멈춤 판정 시간\n- 명령 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초)\n* 이 시간이 지나도 PLC 결과가 없으면 \"결과 확인 중(지연)\" 만 표시하고 실패 처리하지 않는다.\n- 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초)\n* 이 시간 안에 PLC 접수 번호가 오지 않으면 그 명령을 전달 불명으로 끝내고 같은 PLC 의 접수 대기(308)를 푼다.\n1.2. 비밀값(`secrets.dat`)\n- `db.password`\n- `jwt.key`\n- `client.\u003c클라이언트ID>.secret`\n- `tls.keystore.password`\n1.3. 기준정보 DB(`gw` 스키마)\n- PLC 연결(`gt_link`)\n- 사이트(`gt_site`)\n- 설비(`gt_fclt`)\n- 매핑표(`gt_map_iem`)\n- 경보 코드(`gt_alrm_cd`)\n- 결과 코드 대응(`gt_rslt_cd_ractn`)\n- 판 기록(`gt_map_ver`)\n1.4. 지킬 것\n- 제품 기본값은 jar 안의 `application.yml` 이다. 설치 값 파일에는 다른 값만 둔다. 프로파일은 `site`(서비스 설정이 준다).\n- 비밀값은 설정 파일 · 로그 · 진단 자료에 쓰지 않는다. `secrets.dat` 는 DPAPI 머신 범위로 암호화돼 그 PC 에서만 풀린다. PC 를 바꾸면 그 PC 에서 다시 만든다.\n- PLC 접속 주소 · 폴링 주기 · 워드 순서 같은 링크별 값은 설정 파일이 아니라 기준정보(`gt_link`)다.\n- 기동 때 설정 값 범위를 검사하고, 틀리면 기동을 멈추고 `logs\\startup.log` 에 사유를 남긴다. 허용 주소가 비어 있어도 기동을 멈춘다.\n\n2. 현장 설정 예(합천)\n아래는 첫 설치 현장의 값이다. 패키지 · 스크립트의 기본값이 아니다.\n\n| 곳 | 값 | 상태 |\n|---|---|---|\n| `-AllowIps` · `gw.api.allow-ips` | i-oneNet(망연계) 중계 장비 주소 | **[확인: ISS-03]** |\n| `gw.command.allowed-cmd-codes` | `[1, 2]` (기동 · 정지). 명령 대상은 매핑표에 동작 결과 영역이 있는 주배수펌프뿐 | 확정 (요구사항정의서 v0.2 CMD-07) |\n| 기준정보 `gt_link` · `gt_site` | 대상 5개소, 개소마다 PLC 하나 · 사이트 하나. 첫 시험 현장 질매 | PLC 쪽 매핑표 · 개소 구성도 수령 뒤 |\n| 기준정보 `gt_fclt` | 도면 기준 개소마다 설비 구성(아래 2.2). 실제 PLC 구성이 다르면 매핑표 · 기준정보로 맞춘다 | PLC 쪽 매핑표 · 개소 구성도 수령 뒤 |\n| 설치 PC · DB | 상황실 제어망 PC, 같은 PC 의 PostgreSQL | **[확인: ISS-03]** |\n\n2.1. 대상 개소(2026-10-16 확정, ISS-09)\n- 핫들 배수펌프장\n- 영창 배수펌프장\n- 미곡 배수펌프장\n- 질매 배수펌프장\n- 삼가 배수펌프장\n2.2. 개소마다 설비(요구사항정의서 v0.2 4.2, 도면 기준)\n- 주배수펌프 3\n- 지배수펌프 2\n- 토출밸브 3\n- 제진기 3\n- 협잡물 컨베이어 2\n* 미곡만 수문(배수통문) 1 을 더한다.\n\n## 기준정보: 기준정보 반영\n\nPLC 담당 매핑표를 받으면 양식을 채워 검사 · 적재 · 다시 읽기 순서로 넣는다. 양식 · 검사 · 시험 벡터 · 적재 SQL 규칙은 [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8.3절이다.\n\n1. 단계\n1) Excel 에서 빈 양식(`양식\\기준정보_적재양식.xlsx`)에 연결 · 설비 · 경보코드 · 매핑표 · (결과코드) · 시험벡터 시트를 채운다. 예시 행은 지운다.\n2) `bin\\gw-map.cmd check 양식.xlsx` 로 검사한다. 오류가 있으면 고치고 다시 한다.\n3) `bin\\gw-map.cmd sql 양식.xlsx 적재.sql --activate` 로 적재 SQL 을 만든다. 시험 벡터가 통과한 사이트만 판(`gt_site.map_ver`)이 올라간다.\n4) 메모장에서 `적재.sql` 머리 주석을 열어 사이트마다 \"판 올림\" 인지 확인한다.\n5) `psql -U gw_app -d dpms_gw -f 적재.sql` 로 넣는다(한 트랜잭션).\n6) 뷰어 「기준정보 · 관리」 에서 [기준정보 다시 읽기] (`POST /viewer/api/reload`) 를 누른다. 바뀐 링크만 끊었다 다시 연결하고, 바뀌지 않은 개소의 폴링은 끊기지 않는다. 끝나지 않은 명령이 있으면 다시 읽지 않으므로(409) 명령이 끝난 뒤 다시 한다.\n7) DPMS 화면 또는 9절에서 `status` 를 보고 사이트마다 `links[].st = UP`, `gwMapVer = plcMapVer`, `missingRoles` 빈 목록을 확인한다.\n\n2. 지킬 것\n- 양식 파일과 적재 SQL 은 판마다 남긴다(현장 설치 기록).\n- 다른 판의 매핑표 줄은 DB 에 그대로 남는다. 이전 판으로 되돌릴 때는 그 판의 양식으로 3) ~ 6) 을 다시 한다(적재 뒤 기준정보 다시 읽기까지. PLC 의 판 번호도 그 판이어야 한다).\n- 뷰어 「기준정보 · 관리」 에서 양식을 적재하면 검사 · SQL 만들기 · 넣기 · 다시 읽기(2) · 3) · 5) · 6))를 한 번에 한다(`POST /viewer/api/map/apply`, 판 올림은 선택, 적재 뒤 다시 읽기가 기본). 명령이 진행 중이라 다시 읽지 못했으면 명령이 끝난 뒤 [기준정보 다시 읽기] 를 누른다.\n- `psql` 로 직접 넣었을 때도 [기준정보 다시 읽기] 로 반영한다. 게이트웨이 다시 시작(`restart=true` 또는 [다시 시작])은 설정 파일 · 비밀값을 바꿨을 때처럼 다시 읽기로 반영되지 않는 경우에만 한다.\n- `--activate` 없이 만들면 판을 올리지 않는다(내용 확인용). 새 사이트를 판 올림 없이 넣으면 판 0 으로 들어가 수집 · 제어를 하지 않는다.\n\n## 서비스로그: 서비스 · 로그\n\n게이트웨이는 WinSW Windows 서비스 `dpms-gw` 로 돌고, 로그는 설치 폴더 `logs\\` 에, 운영 사건의 정본은 피드와 블랙박스에 남는다.\n\n1. Windows 서비스(WinSW)\n`winsw\\dpms-gw.xml` (WinSW v2) 의 값이다. `%BASE%` 는 `winsw` 폴더다.\n\n| 항목 | 값 |\n|---|---|\n| 서비스 ID · 이름 | `dpms-gw` · DPMS 연계 게이트웨이 |\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\n| 환경변수 | `SPRING_PROFILES_ACTIVE=site`, `GW_LOG_DIR=\u003c설치 폴더>\\logs` |\n| 시작 | 자동(지연 시작) |\n| 실패 시 | 10초 → 30초 → 60초 뒤 다시 시작, 실패 횟수는 1시간 뒤 초기화 |\n| 정지 대기 | 20초 |\n| 서비스 래퍼 로그 | `logs\\service\\`, 크기 10MB 마다 돌리고 8개 보관 |\n| 실행 계정 | WinSW 기본(LocalSystem). `secrets.dat` 는 머신 범위라 계정에 묶이지 않는다 |\n\n2. 로그\n\n| 파일 | 내용 | 보존 |\n|---|---|---|\n| `logs\\startup.log` | 기동 자가진단 결과. 기동 실패 사유가 첫 줄에 보인다 | 기동마다 덮어씀 |\n| `logs\\gateway.log` | 프로그램 로그(링크 상태 변화 · 명령 · 정리 결과 · 오류) | 날마다 `gateway.YYYY-MM-DD.log` 로 돌리고 30일 |\n| `logs\\service\\` | WinSW 래퍼 로그(표준 출력 · 오류) | 10MB × 8 |\n| `data\\blackbox\\` | 블랙박스(기록 B). 로그가 아니라 증거 기록이다 | 8절 |\n\n- 로그에는 비밀값을 남기지 않는다.\n- 운영 사건(링크 상태 · 명령 진행 · 경보)은 로그보다 피드(`gt_evt`)와 블랙박스가 정본이다.\n\n3. WinSW 가 없을 때(예약 작업)\n패키지에 `winsw\\dpms-gw.exe` 가 없으면 install.ps1 이 Windows 예약 작업 `dpms-gw` 로 대신한다.\n\n| 항목 | 값 |\n|---|---|\n| 트리거 | 시스템 시작 시 |\n| 계정 | `SYSTEM`, 가장 높은 권한 |\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Dspring.profiles.active=site -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\n| 실패 시 | 1분 간격으로 다시 시작(최대 999회), 실행 시간 제한 없음 |\n| 로그 | `logs\\` (작업 폴더 기준 기본값). 래퍼 로그는 없다 |\n\n- 예약 작업은 비상용이다. 정지 · 재시작 관리가 서비스보다 약하므로 납품 패키지에는 WinSW 를 넣는다 **[확인: WinSW 실행 파일 반입]**.\n\n## 갱신: 갱신 · 되돌리기\n\n갱신은 새 패키지에서 `install.ps1` 을 같은 매개변수로 다시 실행하는 것이고, 설정 · 비밀값 · 데이터는 그대로 남는다.\n\n| 작업 | 방법 |\n|---|---|\n| 갱신 | 새 패키지를 풀고 그 폴더에서 `install.ps1` 을 같은 매개변수로 다시 실행한다. 서비스를 멈추고, 직전 jar 를 `prev\\` 에 남기고, 프로그램 파일(`jre` · `bin` · `db` · `양식` · `winsw` · jar)을 바꾼다. `config\\application.yml` · `secrets.dat` · TLS 키 저장소 · `data` · `logs` 는 그대로 둔다. 서비스 설정을 갱신하고 다시 시작한다 |\n| 스키마 | 게이트웨이가 기동 때 Flyway 로 새 마이그레이션(`V00n__*.sql`)만 적용한다(적용된 것은 검증만). 스키마 적용에 실패하면 기동을 멈춘다 |\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: DPMS 게이트웨이운영설계서 앞 22k 자. 「갱신 · 되돌리기」 의 되돌리기 행부터 뒤(8 ~ 10절 포함)는 이 재료에 없다\n  - 옛 장 번호(1 ~ 7절 · 3.1 · 4.1 · 6.3)는 항목 링크와 항목 안 덩이 번호로 바꿨다. 개정 줄 · 이 재료 밖 장(8 · 9 · 10절)의 번호는 그대로 둔다\n\u003c!-- /kmd:참고 -->\n"},{"k":"B","l":"안 B 정보 유형","t":"# 게이트웨이운영설계서\n\n연계 게이트웨이를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한 문서다. 원격 작업이 불가해 설치 · 패치 · 장애 대응은 현장 방문으로 한다. 현장에서 따라 하는 단계별 절차는 설치 절차서(WBS 8.3) · 운영 절차서가 이 문서를 바탕으로 쓴다.\n\n## 문서 정보\n\n이 설계서는 v0.1 초안이고, 설치 PC · DBMS · 망연계 주소 회신과 내부 시험 서버 설치 시험으로 확정한다.\n\n| 속성 | 값 |\n|---|---|\n| 사업 | 배수펌프장 통합운영관리시스템(DPMS) 구축 |\n| WBS | 3.3.4 게이트웨이 운영 설계 |\n| 작성 | DPMS 개발 (세정아이앤씨) 사경진 과장 |\n| 기준일 | 2026-10-18 |\n| 판 | v0.1 (2026-10-15). 설치 패키지 구현(`dpms_gateway/dist`)을 기준으로 처음 썼다 |\n| 상태 | 초안. 설치 PC · DBMS · 망연계 주소 회신([DPMS-ISS-03](../1.2_사업관리/위험및이슈관리대장.md#DPMS-ISS-03))과 내부 시험 서버 설치 시험으로 확정한다 |\n\n1. 근거\n- `dpms_gateway/dist/build-dist.ps1`\n- `dist/package/`: `install.ps1` · `uninstall.ps1` · `README.txt` · `config/application.example.yml` · `winsw/dpms-gw.xml` · `db/create_db.sql` · `bin/*.cmd`\n- 위험및이슈관리대장: [DPMS-ISS-08](../1.2_사업관리/위험및이슈관리대장.md#DPMS-ISS-08) · [DPMS-ISS-16](../1.2_사업관리/위험및이슈관리대장.md#DPMS-ISS-16)\n2. 같이 보는 문서\n- [게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md)\n- [DPMS 연계 API 정의서](DPMS연계API정의서.md)\n- [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8절\n3. 표기\n- **[확인]**: 회신이 필요한 항목.\n- **[협의]**: 상대와 정할 항목.\n- **[제안]**: 이 설계가 정한 기본값.\n- **[재계산 필요]**: 실측으로 다시 정할 값.\n4. 개정\n개정마다 날짜 · 작성 · 바뀐 것이다. 바뀐 것의 장 번호(4.1 · 9절 · 10절 #3)는 그 판의 장 번호다.\n\n| 날짜 | 작성 | 바뀐 것 |\n|---|---|---|\n| 2026-10-15 | 사경진 과장 | TermFlow 표준 용어로 테이블 · 컬럼 이름 재설계 반영 (3.4_설계_DPMS웹설계\\작업문서\\TermFlow재설계). 게이트웨이 DB 표 이름(`gt_*`)과 9절 조회 예의 칸 이름을 바꿈 |\n| 2026-10-16 | 사경진 과장 | TermFlow 테이블 설계 가이드 적용 (코드 컬럼 · 감사 컬럼 · 코드값). 보존 정리 표의 명령 상태 값을 새 값(`RJCT_GW` · `DLVR_UNKN`)으로, 9절 접속 기록 조회 예를 문자 코드 비교(`rpns_cd IN ('211', …)`)로 바꿈. 모든 게이트웨이 표에 표준 감사 컬럼이 붙었다 |\n| 2026-10-16 | 사경진 과장 | 게이트웨이 뷰어(UI/UX 검토 UXR-G-17). 9절에 뷰어(`http://127.0.0.1:18444/viewer/`)로 보는 점검 항목 · 보안 경계를 더했다 |\n| 2026-10-16 | 사경진 과장 | 뷰어 진단 번들(UXR-G-11). 9절 반출: 뷰어 개요 [진단 번들] zip 하나. 명령줄 `gw diag` 는 아직 구현 전 |\n| 2026-10-18 | 사경진 과장 | 망 구간 담당 정정: 게이트웨이 설치 PC · OS · PostgreSQL 은 나산전기산업(망연계 장비 전까지의 네트워크 · 서버), i-oneNet 정책은 DID 외주 (10절 #3). 근거 PLC 연계 요구사항정의서 v0.2 5장. 기준정보 운영 중 반영(다시 읽기 · 개소 사용 중지 · 기준정보 해시) 코드에 맞춤: 4.1 · 5절 반영 순서(6단계 다시 읽기), 9.1 기준정보 · 관리 화면 · 보안 경계 |\n| 2026-10-18 | 사경진 과장 | PLC 연계 요구사항정의서 v0.2 의 명령 결과 두 단계 · 대상 개소에 맞춤: 4.1 설치 값에 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초), 4.2 허용 명령 확정(주배수펌프 기동 · 정지) · 설비 구성(도면 기준), 9.1 · 9.2 명령 점검 항목(접수 결과 · 동작 결과 · 지연 표시), 10절 #3 근거를 요구사항정의서 5장으로 |\n| 2026-10-19 | 사경진 과장 | 2026-10-18 미결정 6건 확정: 4.1 설치 값에 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초), 9.1 명령 점검에 덮임 31(원값 없음) · 전달 불명이 생기는 경우 · `GW_LATE` |\n\n## 목적 · 전제\n\n이 설계는 연계 게이트웨이(`dpms_gateway`)의 설치 · 현장 값 넣기 · 운영 · 갱신 · 점검 방식을 정하고, 아래 다섯 전제 위에 선다.\n\n| # | 전제 | 근거 | 이 설계에서의 뜻 |\n|--:|---|---|---|\n| 1 | **원격 작업 불가**. 유지보수 업체의 원격 접속을 허용하지 않는다 | [DPMS-ISS-08](../1.2_사업관리/위험및이슈관리대장.md#DPMS-ISS-08) (발주기관 자체보안대책서) | 설치 · 패치 · 장애 대응은 **현장 방문**으로 한다. 현장에서 인터넷 · 개발 도구 없이 끝낼 수 있어야 한다. 방문 전에는 DPMS 가 받은 `health` 이력 · 게이트웨이 상태로 원인 범위를 좁힌다 |\n| 2 | **패키지형 납품**. 납기가 현장 공사 · 인프라보다 빠르다 | [DPMS-ISS-16](../1.2_사업관리/위험및이슈관리대장.md#DPMS-ISS-16) | 현장 값(PLC 주소 · 매핑표 · 설비 · 허용 주소) 없이 설치할 수 있는 패키지를 납품하고, 현장 값은 설치 때 설정 · 기준정보로 넣는다 |\n| 3 | 폐쇄망(상황실 제어망) | 시스템 구성도 | Java · 라이브러리를 현장에서 받지 않는다. 전용 JRE 를 패키지에 넣는다 |\n| 4 | 설치 PC 는 Windows, DB 는 같은 PC 의 PostgreSQL | 프로그램 설계서 §2 | 설치 PC OS · PostgreSQL 판 **[확인: ISS-03]**. PostgreSQL 설치본은 이 패키지에 넣지 않는다 |\n| 5 | 범용 제품 | 설계 기조(2026-10-11) | 패키지 · 스크립트에 현장 고유값을 넣지 않는다. 현장마다 다른 값은 [설정 값을 두는 곳](#설정%20값을%20두는%20곳)의 세 곳으로만 받는다 |\n\n## 패키지 구성\n\n패키지는 개발 PC 에서 `powershell -ExecutionPolicy Bypass -File dist\\build-dist.ps1 [-WinSw \u003cWinSW-x64.exe>] [-SkipBuild]` 로 만들고, 결과는 `dist\\out\\dpms-gateway-\u003c판>\\` 폴더와 같은 이름의 zip 이다.\n\n| 경로 | 내용 | 만드는 곳 |\n|---|---|---|\n| `jre\\` | 전용 Java 17 런타임(jlink, 필요한 모듈 · 한국어/영어 로캘만) | build-dist ③ |\n| `dpms-gateway.jar` | 게이트웨이 (Spring Boot 실행형 jar). 매핑표 반영 도구 · 비밀값 도구도 이 jar 의 하위 명령 | build-dist ① (`mvn package`) |\n| `config\\application.example.yml` | 설치 값 설명 · 예([설정 값을 두는 곳](#설정%20값을%20두는%20곳)) | `dist/package` |\n| `winsw\\dpms-gw.xml` · `winsw\\dpms-gw.exe` | Windows 서비스 설정 · WinSW 실행 파일. exe 는 레포에 넣지 않고 빌드 때 넣는다(없으면 [예약 작업](#예약%20작업) 방식) | `dist/package` · build-dist ④ |\n| `bin\\gw-map.cmd` | 매핑표 반영 도구 (`map template` · `check` · `sql`) | `dist/package` |\n| `bin\\gw-secret.cmd` | 비밀값 도구 (`secret init` · `set` · `keys`) | `dist/package` |\n| `db\\create_db.sql` | DB 계정 `gw_app` · DB `dpms_gw` 만들기 (PostgreSQL 관리자로) | `dist/package` |\n| `db\\V001__gw_ddl.sql` | 스키마 참고본. 실제 적용은 게이트웨이가 기동 때 Flyway 로 한다 | build-dist ② |\n| `양식\\기준정보_적재양식.xlsx` | 빈 기준정보 적재 양식(설명 시트 · 예시 행). 패키지의 JRE 로 만들어 JRE 도 함께 확인한다 | build-dist ⑤ |\n| `install.ps1` · `uninstall.ps1` | 설치 · 갱신 / 서비스 내리기 | `dist/package` |\n| `README.txt` | 요약 설치 순서 · 폴더 설명 | `dist/package` |\n| `VERSION.txt` | 판 · 커밋(작업 중 변경이 있으면 `-dirty`) · 빌드 시각 · JRE 판 | build-dist ⑥ |\n| `checksums.txt` | `jre\\` 밖 파일의 SHA-256 | build-dist ⑥ |\n\n1. 설치 뒤 생기는 것\n설치하면 설치 폴더에 아래가 생긴다.\n\n| 경로 | 내용 |\n|---|---|\n| `config\\application.yml` | 설치 값 (install.ps1 ②, 처음 한 번) |\n| `config\\gw-api.p12` · `config\\gw-api.crt` | TLS 키 저장소 · 인증서 (install.ps1 ④) |\n| `secrets.dat` | 비밀값 (DPAPI, 그 PC 에서만 풀린다. install.ps1 ③) |\n| `data\\blackbox\\YYYY\\MM\\bb-YYYYMMDD.log[.gz]` | 블랙박스 (기록 B) |\n| `logs\\` | 로그([로그](#로그)) |\n| `prev\\dpms-gateway.jar` | 직전 판 jar (갱신 때, [갱신 · 되돌리기](#갱신%20·%20되돌리기)) |\n\n## install.ps1 매개변수\n\n`install.ps1` 은 아래 매개변수를 받고, 그 가운데 `-AllowIps` 만 필수다.\n\n```\npowershell -ExecutionPolicy Bypass -File install.ps1 -AllowIps \u003c주소> [-CreateDb -PsqlPath \u003cpsql.exe>] [-ServerAddress \u003c이 PC 주소>] …\n```\n\n| 매개변수 | 기본값 | 뜻 |\n|---|---|---|\n| `-AllowIps` | (필수) | DPMS 연계 API 에 붙을 수 있는 주소 목록. 설정 `gw.api.allow-ips` 와 방화벽 규칙에 같이 쓴다 |\n| `-Target` | `C:\\dpms-gw` | 설치 폴더 |\n| `-Port` | 18443 | DPMS 연계 API 포트 |\n| `-DbUrl` | `jdbc:postgresql://127.0.0.1:5432/dpms_gw` | DB 접속 주소 |\n| `-CreateDb` | 끔 | DB 계정 · DB 를 만든다(처음 설치 때만) |\n| `-PsqlPath` | - | `-CreateDb` 때 `psql.exe` 위치 |\n| `-PgSuperUser` · `-PgHost` · `-PgPort` | `postgres` · `127.0.0.1` · 5432 | `-CreateDb` 때 PostgreSQL 관리자 접속 |\n| `-ServerAddress` | - | TLS 인증서 SAN 에 넣을 이 PC 주소 |\n| `-NoTls` | 끔 | TLS 를 쓰지 않는다(HTTP). i-oneNet 이 TLS 를 통과시키지 못할 때만 **[협의: ISS-03]** |\n| `-NoFirewall` | 끔 | 방화벽 규칙을 만들지 않는다 |\n| `-NoStart` | 끔 | 서비스를 등록만 하고 시작 · 기동 확인을 하지 않는다 |\n\n## 게이트웨이 설치\n\n게이트웨이 설치는 준비한 설치 PC 에서 `install.ps1`([install.ps1 매개변수](#install.ps1%20매개변수))을 관리자 권한으로 실행하면 아래 여덟 단계로 진행된다.\n\n1. 준비\n- 설치 PC 에 PostgreSQL 이 설치 · 기동돼 있고 `127.0.0.1` 로만 받는다 **[확인: 판 · 설치 주체]**.\n- 패키지 zip 을 반입 절차대로 들여와 풀고, `checksums.txt` 로 파일을 확인한다.\n- DPMS 연계 API 에 붙을 주소(DPMS 서버, 망연계 장비가 중계하면 그 장비 주소)를 받아 둔다 **[확인: ISS-03]**.\n- 관리자 권한 PowerShell 을 연다.\n2. 단계\n1) 복사: 설치 폴더와 `config` · `data` · `logs` 를 만든다. 서비스가 돌고 있으면 멈춘다. 이미 jar 가 있으면 `prev\\dpms-gateway.jar` 로 남긴다. `jre` · `bin` · `db` · `양식` · `winsw` 폴더와 jar · 스크립트 · `README.txt` · `VERSION.txt` · `checksums.txt` · `config\\application.example.yml` 을 복사한다.\n- 다시 실행할 때: 갱신([갱신 · 되돌리기](#갱신%20·%20되돌리기)).\n2) 설정: `config\\application.yml` 을 매개변수로 만든다: DB 주소 · 계정 `gw_app`, API 포트 · TLS 사용 · 허용 주소, 블랙박스 폴더 `data/blackbox`, 비밀값 저장소 `dpapi` · `secrets.dat`, TLS 면 `server.ssl.*`(키 저장소 `config/gw-api.p12`, 별칭 `dpms-gw`).\n- 다시 실행할 때: 있으면 그대로 둔다(손으로 고친 값을 지키기 위해).\n3) 비밀값: `secret init secrets.dat dpms-ctrl dpms-read`: `jwt.key` 와 두 클라이언트 비밀값을 무작위로 만든다. **클라이언트 비밀값은 화면에 한 번만 나온다**(DPMS 설정에 옮긴다). `db.password` 가 없으면 무작위로 만들어 넣는다.\n- 다시 실행할 때: 있는 키는 그대로 둔다.\n4) TLS: `-NoTls` 가 아니면 PKCS12 키 저장소 `config\\gw-api.p12` 를 만든다(EC P-256, 10년, `CN=dpms-gateway`, `-ServerAddress` 가 있으면 SAN). 비밀번호는 무작위로 만들어 `secrets.dat` 의 `tls.keystore.password` 에 넣는다. 인증서 `config\\gw-api.crt` 를 내보낸다(DPMS 쪽 게이트웨이 신뢰 목록에 넣는다).\n- 다시 실행할 때: 있으면 그대로 둔다.\n5) DB: `-CreateDb` 면 `db\\create_db.sql` 의 비밀번호 자리에 3단계 `db.password` 를 채워 PostgreSQL 관리자로 넣는다: 계정 `gw_app`, DB `dpms_gw`(소유 `gw_app`, UTF8). 관리자 비밀번호는 psql 이 묻는다. 스키마 · 표는 게이트웨이가 기동 때 Flyway 로 만든다.\n- 다시 실행할 때: `db.password` 가 이미 있으면 멈춘다(`-CreateDb` 를 빼고 다시 실행).\n6) 서비스: `winsw\\dpms-gw.exe` 가 있으면 서비스 `dpms-gw` 를 등록(있으면 설정 갱신)하고 다시 시작한다. 없으면 [예약 작업](#예약%20작업)으로 대신한다.\n- 다시 실행할 때: 설정 갱신 · 다시 시작.\n7) 방화벽: 인바운드 규칙 `DPMS 연계 API`: TCP `-Port` 를 `-AllowIps` 에서만 허용. 같은 이름 규칙은 지우고 다시 만든다.\n- 다시 실행할 때: 다시 만든다.\n8) 기동 확인: `https://127.0.0.1:\u003c포트>/gw/v1/health` 를 2초마다 최대 3분 부른다. 응답이 오거나 거부(401 · 403)가 오면 기동한 것으로 본다(127.0.0.1 이 허용 목록 밖이면 거부가 정상). 응답이 없으면 `logs\\startup.log` · `gateway.log` 를 보라고 알린다.\n3. 마친 뒤\n- `-CreateDb` 를 쓰지 않으면 DB 계정 `gw_app` 의 비밀번호를 3단계에서 만든 값으로 맞추거나, `bin\\gw-secret.cmd set secrets.dat db.password=…` 로 기존 비밀번호를 넣는다.\n- 설치가 끝나면 기준정보를 넣는다([기준정보 반영](#기준정보%20반영)). 기준정보가 없으면 게이트웨이는 PLC 에 붙지 않는다.\n- DPMS 쪽에 넘길 것: 게이트웨이 주소 · 포트, 클라이언트 ID · 비밀값(`dpms-ctrl` 조회 + 명령, `dpms-read` 조회만), `config\\gw-api.crt`.\n\n## 서비스 내리기\n\n`uninstall.ps1 [-Target …]` 은 서비스(또는 예약 작업)와 방화벽 규칙만 지운다. 설치 폴더(`data` · `logs` · `config` · `secrets.dat`)와 DB `dpms_gw` 는 남긴다. 완전히 지우려면 폴더와 DB 를 따로 지운다.\n\n## 설정 값을 두는 곳\n\n게이트웨이 값은 설치 값 파일 · 비밀값 · 기준정보 DB 세 곳에 둔다.\n\n| 곳 | 담는 것 | 넣는 방법 | 바꾼 뒤 |\n|---|---|---|---|\n| `config\\application.yml` (설치 값) | 그 설치에서 제품 기본값과 다른 운영 값(아래 1.) | install.ps1 ② 가 만들고, 그 뒤는 `application.example.yml` 을 보고 손으로 고친다 | 서비스 다시 시작 |\n| `secrets.dat` (비밀값) | `db.password` · `jwt.key` · `client.\u003c클라이언트ID>.secret` · `tls.keystore.password` | install.ps1 ③ · ④, `bin\\gw-secret.cmd init` · `set` · `keys` | 서비스 다시 시작 |\n| 기준정보 DB (`gw` 스키마) | PLC 연결 · 사이트 · 설비 · 매핑표 · 경보 코드 · 결과 코드 대응 · 판 기록(아래 2.) | `bin\\gw-map.cmd` 로 만든 적재 SQL 을 `psql` 로, 또는 뷰어 「기준정보 · 관리」 양식 적재([기준정보 반영](#기준정보%20반영)) | 기준정보 다시 읽기 (뷰어 양식 적재는 적재 뒤 바로 다시 읽는다). 바뀐 링크만 다시 연결하고 서비스는 다시 시작하지 않는다 |\n\n1. 설치 값\n설치 값의 키는 [게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md) §3.4 에 있고, 주요한 것은 아래다.\n1.1. 연결 · 보존\n- DB 주소 · 계정\n- API 포트 · TLS · 허용 주소\n- 블랙박스 폴더 · 보존\n- 피드 보존\n- 매일 정리 시각\n1.2. 명령 · PLC\n- 허용 명령 코드\n- PLC 멈춤 판정 시간\n- 명령 결과 지연 표시 시간: `gw.command.result-pending-notice-sec`, 기본 600초. 이 시간이 지나도 PLC 결과가 없으면 \"결과 확인 중(지연)\" 만 표시하고 실패 처리하지 않는다.\n- 접수 번호 상한: `gw.command.ack-give-up-sec`, 기본 30초. 이 시간 안에 PLC 접수 번호가 오지 않으면 그 명령을 전달 불명으로 끝내고 같은 PLC 의 접수 대기(308)를 푼다.\n2. 기준정보 표\n- PLC 연결: `gt_link`\n- 사이트: `gt_site`\n- 설비: `gt_fclt`\n- 매핑표: `gt_map_iem`\n- 경보 코드: `gt_alrm_cd`\n- 결과 코드 대응: `gt_rslt_cd_ractn`\n- 판 기록: `gt_map_ver`\n3. 규칙\n- 제품 기본값은 jar 안의 `application.yml` 이다. 설치 값 파일에는 다른 값만 둔다. 프로파일은 `site`(서비스 설정이 준다).\n- 비밀값은 설정 파일 · 로그 · 진단 자료에 쓰지 않는다. `secrets.dat` 는 DPAPI 머신 범위로 암호화돼 그 PC 에서만 풀린다. PC 를 바꾸면 그 PC 에서 다시 만든다.\n- PLC 접속 주소 · 폴링 주기 · 워드 순서 같은 링크별 값은 설정 파일이 아니라 기준정보(`gt_link`)다.\n- 기동 때 설정 값 범위를 검사하고, 틀리면 기동을 멈추고 `logs\\startup.log` 에 사유를 남긴다. 허용 주소가 비어 있어도 기동을 멈춘다.\n\n## 합천 현장 설정\n\n합천은 첫 설치 현장이고, 아래는 그 현장의 값이다. 패키지 · 스크립트의 기본값이 아니다.\n\n| 곳 | 값 | 상태 |\n|---|---|---|\n| `-AllowIps` · `gw.api.allow-ips` | i-oneNet(망연계) 중계 장비 주소 | **[확인: ISS-03]** |\n| `gw.command.allowed-cmd-codes` | `[1, 2]` (기동 · 정지). 명령 대상은 매핑표에 동작 결과 영역이 있는 주배수펌프뿐 | 확정 (요구사항정의서 v0.2 CMD-07) |\n| 기준정보 `gt_link` · `gt_site` | 대상 5개소(아래 1.) | PLC 쪽 매핑표 · 개소 구성도 수령 뒤 |\n| 기준정보 `gt_fclt` | 도면 기준 설비 구성(아래 2.) | PLC 쪽 매핑표 · 개소 구성도 수령 뒤 |\n| 설치 PC · DB | 상황실 제어망 PC, 같은 PC 의 PostgreSQL | **[확인: ISS-03]** |\n\n1. 대상 개소\n- 대상은 핫들 · 영창 · 미곡 · 질매 · 삼가 배수펌프장 다섯 곳이다(2026-10-16 확정, [DPMS-ISS-09](../1.2_사업관리/위험및이슈관리대장.md#DPMS-ISS-09)).\n- 개소마다 PLC 하나 · 사이트 하나다.\n- 첫 시험 현장은 질매다.\n2. 설비 구성\n- 도면 기준 개소마다 주배수펌프 3 · 지배수펌프 2 · 토출밸브 3 · 제진기 3 · 협잡물 컨베이어 2 이고, 미곡만 수문(배수통문) 1 을 더한다(요구사항정의서 v0.2 4.2).\n- 실제 PLC 구성이 다르면 매핑표 · 기준정보로 맞춘다.\n\n## 기준정보 반영\n\nPLC 담당 매핑표를 받으면 아래 순서로 기준정보에 넣는다. 양식 · 검사 · 시험 벡터 · 적재 SQL 규칙은 [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8.3절에 있다.\n\n1. 단계\n1) 빈 양식(`양식\\기준정보_적재양식.xlsx`)에 연결 · 설비 · 경보코드 · 매핑표 · (결과코드) · 시험벡터 시트를 채운다. 예시 행은 지운다.\n- 도구: Excel\n2) 검사한다. 오류가 있으면 고치고 다시 한다.\n- 도구: `bin\\gw-map.cmd check 양식.xlsx`\n3) 적재 SQL 을 만든다. 시험 벡터가 통과한 사이트만 판(`gt_site.map_ver`)이 올라간다.\n- 도구: `bin\\gw-map.cmd sql 양식.xlsx 적재.sql --activate`\n4) `적재.sql` 머리 주석에서 사이트마다 \"판 올림\" 인지 확인한다.\n- 도구: 메모장\n5) 넣는다(한 트랜잭션).\n- 도구: `psql -U gw_app -d dpms_gw -f 적재.sql`\n6) 기준정보를 다시 읽는다. 바뀐 링크만 끊었다 다시 연결하고, 바뀌지 않은 개소의 폴링은 끊기지 않는다. 끝나지 않은 명령이 있으면 다시 읽지 않으므로(409) 명령이 끝난 뒤 다시 한다.\n- 도구: 뷰어 「기준정보 · 관리」 [기준정보 다시 읽기] (`POST /viewer/api/reload`)\n2. 확인\n7) `status` 에서 사이트마다 `links[].st = UP`, `gwMapVer = plcMapVer`, `missingRoles` 빈 목록을 확인한다.\n- 도구: DPMS 화면 또는 9절\n3. 되돌리기\n- 양식 파일과 적재 SQL 은 판마다 남긴다(현장 설치 기록). 다른 판의 매핑표 줄은 DB 에 그대로 남으므로 이전 판으로 되돌릴 때는 그 판의 양식으로 3 ~ 6 을 다시 한다(적재 뒤 기준정보 다시 읽기까지. PLC 의 판 번호도 그 판이어야 한다).\n4. 주의\n- 뷰어 「기준정보 · 관리」 에서 양식을 적재하면 검사 · SQL 만들기 · 넣기 · 다시 읽기(2 · 3 · 5 · 6)를 한 번에 한다(`POST /viewer/api/map/apply`, 판 올림은 선택, 적재 뒤 다시 읽기가 기본). 명령이 진행 중이라 다시 읽지 못했으면 명령이 끝난 뒤 [기준정보 다시 읽기] 를 누른다. `psql` 로 직접 넣었을 때도 [기준정보 다시 읽기] 로 반영한다.\n- 게이트웨이 다시 시작(`restart=true` 또는 [다시 시작])은 설정 파일 · 비밀값을 바꿨을 때처럼 다시 읽기로 반영되지 않는 경우에만 한다.\n- `--activate` 없이 만들면 판을 올리지 않는다(내용 확인용). 새 사이트를 판 올림 없이 넣으면 판 0 으로 들어가 수집 · 제어를 하지 않는다.\n\n## Windows 서비스\n\n게이트웨이는 `winsw\\dpms-gw.xml`(WinSW v2)로 Windows 서비스에 등록되고, `%BASE%` 는 `winsw` 폴더다.\n\n| 속성 | 값 |\n|---|---|\n| 서비스 ID · 이름 | `dpms-gw` · DPMS 연계 게이트웨이 |\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\n| 환경변수 | `SPRING_PROFILES_ACTIVE=site`, `GW_LOG_DIR=\u003c설치 폴더>\\logs` |\n| 시작 | 자동(지연 시작) |\n| 실패 시 | 10초 → 30초 → 60초 뒤 다시 시작, 실패 횟수는 1시간 뒤 초기화 |\n| 정지 대기 | 20초 |\n| 서비스 래퍼 로그 | `logs\\service\\`, 크기 10MB 마다 돌리고 8개 보관 |\n| 실행 계정 | WinSW 기본(LocalSystem). `secrets.dat` 는 머신 범위라 계정에 묶이지 않는다 |\n\n## 로그\n\n게이트웨이는 아래 네 곳에 기록을 남기고, 운영 사건의 정본은 로그가 아니라 피드와 블랙박스다.\n\n| 파일 | 내용 | 보존 |\n|---|---|---|\n| `logs\\startup.log` | 기동 자가진단 결과. 기동 실패 사유가 첫 줄에 보인다 | 기동마다 덮어씀 |\n| `logs\\gateway.log` | 프로그램 로그(링크 상태 변화 · 명령 · 정리 결과 · 오류) | 날마다 `gateway.YYYY-MM-DD.log` 로 돌리고 30일 |\n| `logs\\service\\` | WinSW 래퍼 로그(표준 출력 · 오류) | 10MB × 8 |\n| `data\\blackbox\\` | 블랙박스(기록 B). 로그가 아니라 증거 기록이다 | 8절 |\n\n1. 규칙\n- 로그에는 비밀값을 남기지 않는다.\n- 운영 사건(링크 상태 · 명령 진행 · 경보)은 로그보다 피드(`gt_evt`)와 블랙박스가 정본이다.\n\n## 예약 작업\n\n패키지에 `winsw\\dpms-gw.exe` 가 없으면 install.ps1 이 Windows 예약 작업 `dpms-gw` 로 [Windows 서비스](#Windows%20서비스)를 대신한다.\n\n| 속성 | 값 |\n|---|---|\n| 트리거 | 시스템 시작 시 |\n| 계정 | `SYSTEM`, 가장 높은 권한 |\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Dspring.profiles.active=site -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\n| 실패 시 | 1분 간격으로 다시 시작(최대 999회), 실행 시간 제한 없음 |\n| 로그 | `logs\\` (작업 폴더 기준 기본값). 래퍼 로그는 없다 |\n\n1. 규칙\n- 예약 작업은 비상용이다. 정지 · 재시작 관리가 서비스보다 약하므로 납품 패키지에는 WinSW 를 넣는다 **[확인: WinSW 실행 파일 반입]**.\n\n## 갱신 · 되돌리기\n\n갱신은 새 패키지의 `install.ps1` 을 같은 매개변수로 다시 실행하는 것이고, 설치 값 · 비밀값 · 데이터는 그대로 남는다.\n\n1. 갱신\n- 새 패키지를 풀고 그 폴더에서 `install.ps1` 을 같은 매개변수로 다시 실행한다.\n- 서비스를 멈추고, 직전 jar 를 `prev\\` 에 남기고, 프로그램 파일(`jre` · `bin` · `db` · `양식` · `winsw` · jar)을 바꾼다.\n- `config\\application.yml` · `secrets.dat` · TLS 키 저장소 · `data` · `logs` 는 그대로 둔다.\n- 서비스 설정을 갱신하고 다시 시작한다.\n2. 스키마\n- 게이트웨이가 기동 때 Flyway 로 새 마이그레이션(`V00n__*.sql`)만 적용한다(적용된 것은 검증만). 스키마 적용에 실패하면 기동을 멈춘다.\n3. 되돌리기\n- 서비스 정\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: DPMS 팀 지식 게이트웨이운영설계서 앞 22k 자. 「되돌리기」 는 표본이 끊긴 자리까지만 옮겼다. 본문의 8절 · 9절은 표본에 없는 장이라 장 번호 그대로 두었다\n\u003c!-- /kmd:참고 -->\n"},{"k":"C","l":"안 C 블록 스키마","t":"# 게이트웨이운영설계서\n\n연계 게이트웨이를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한 문서다. 원격 작업이 불가해 설치 · 패치 · 장애 대응은 현장 방문으로 하고, 지금은 설치 PC · DBMS · 망연계 주소 회신을 기다리는 초안이다.\n\n## 개요: 게이트웨이 운영 설계서의 판 · 상태 · 근거 (DPMS_3.3.4)\n\n이 문서는 운영 방식(무엇을 어디에 두고 어떤 순서로 하는가)을 정하고, 현장에서 따라 하는 단계별 절차는 설치 절차서(WBS 8.3) · 운영 절차서가 이 문서를 바탕으로 쓴다.\n\n| 속성 | 값 |\n|---|---|\n| 사업 | 배수펌프장 통합운영관리시스템(DPMS) 구축 |\n| WBS | 3.3.4 게이트웨이 운영 설계 |\n| 작성 | DPMS 개발 (세정아이앤씨) 사경진 과장 |\n| 기준일 | 2026-10-18 |\n| 판 | v0.1 (2026-10-15) |\n| 상태 | 초안 |\n\n1. 상태\n- 설치 PC · DBMS · 망연계 주소 회신([DPMS-ISS-03](위험및이슈관리대장.md#DPMS-ISS-03))과 내부 시험 서버 설치 시험으로 확정한다.\n- v0.1 은 설치 패키지 구현(`dpms_gateway/dist`)을 기준으로 처음 썼다.\n2. 근거\n- `dpms_gateway/dist/build-dist.ps1`\n- `dist/package/`: `install.ps1` · `uninstall.ps1` · `README.txt` · `config/application.example.yml` · `winsw/dpms-gw.xml` · `db/create_db.sql` · `bin/*.cmd`\n- 위험및이슈관리대장 [DPMS-ISS-08](위험및이슈관리대장.md#DPMS-ISS-08) · [DPMS-ISS-16](위험및이슈관리대장.md#DPMS-ISS-16)\n3. 같이 보는 문서\n- [게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md)\n- [DPMS 연계 API 정의서](DPMS연계API정의서.md)\n- [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8절\n4. 표기\n- **[확인]**: 회신이 필요한 항목\n- **[협의]**: 상대와 정할 항목\n- **[제안]**: 이 설계가 정한 기본값\n- **[재계산 필요]**: 실측으로 다시 정할 값\n\n## 목적: 목적 · 전제\n\n연계 게이트웨이(`dpms_gateway`)를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한다. 이 설계가 딛는 전제는 다섯이다.\n\n| # | 전제 | 근거 | 이 설계에서의 뜻 |\n|--:|---|---|---|\n| 1 | **원격 작업 불가**. 유지보수 업체의 원격 접속을 허용하지 않는다 | [DPMS-ISS-08](위험및이슈관리대장.md#DPMS-ISS-08) (발주기관 자체보안대책서) | 설치 · 패치 · 장애 대응은 **현장 방문**으로 한다 |\n| 2 | **패키지형 납품**. 납기가 현장 공사 · 인프라보다 빠르다 | [DPMS-ISS-16](위험및이슈관리대장.md#DPMS-ISS-16) | 현장 값 없이 설치할 수 있는 패키지를 납품한다 |\n| 3 | 폐쇄망(상황실 제어망) | 시스템 구성도 | Java · 라이브러리를 현장에서 받지 않는다 |\n| 4 | 설치 PC 는 Windows, DB 는 같은 PC 의 PostgreSQL | [게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md) 2절 | 설치 PC OS · PostgreSQL 판 **[확인: ISS-03]** |\n| 5 | 범용 제품 | 설계 기조(2026-10-11) | 패키지 · 스크립트에 현장 고유값을 넣지 않는다 |\n\n1. 전제마다 더 정한 것\n- **1 원격 작업 불가**: 현장에서 인터넷 · 개발 도구 없이 끝낼 수 있어야 한다. 방문 전에는 DPMS 가 받은 `health` 이력 · 게이트웨이 상태로 원인 범위를 좁힌다.\n- **2 패키지형 납품**: 현장 값(PLC 주소 · 매핑표 · 설비 · 허용 주소)은 설치 때 설정 · 기준정보로 넣는다.\n- **3 폐쇄망**: 전용 JRE 를 패키지에 넣는다.\n- **4 Windows · PostgreSQL**: PostgreSQL 설치본은 이 패키지에 넣지 않는다.\n- **5 범용 제품**: 현장마다 다른 값은 [설정](#설정)의 세 곳으로만 받는다.\n\n## 패키지: 패키지 구성\n\n납품 패키지는 개발 PC 에서 `build-dist.ps1` 로 만드는 폴더 하나와 같은 이름의 zip 이다.\n\n1. 만드는 법\n```\npowershell -ExecutionPolicy Bypass -File dist\\build-dist.ps1 [-WinSw \u003cWinSW-x64.exe>] [-SkipBuild]\n```\n- 결과는 `dist\\out\\dpms-gateway-\u003c판>\\` 폴더와 같은 이름의 zip 이다.\n2. 패키지 안\n패키지에 드는 것과 만드는 곳이다.\n\n| 경로 | 내용 | 만드는 곳 |\n|---|---|---|\n| `jre\\` | 전용 Java 17 런타임(jlink, 필요한 모듈 · 한국어/영어 로캘만) | build-dist ③ |\n| `dpms-gateway.jar` | 게이트웨이 (Spring Boot 실행형 jar). 매핑표 반영 도구 · 비밀값 도구도 이 jar 의 하위 명령 | build-dist ① (`mvn package`) |\n| `config\\application.example.yml` | 설치 값 설명 · 예 ([설정](#설정)) | `dist/package` |\n| `winsw\\dpms-gw.xml` · `winsw\\dpms-gw.exe` | Windows 서비스 설정 · WinSW 실행 파일 | `dist/package` · build-dist ④ |\n| `bin\\gw-map.cmd` | 매핑표 반영 도구 (`map template` · `check` · `sql`) | `dist/package` |\n| `bin\\gw-secret.cmd` | 비밀값 도구 (`secret init` · `set` · `keys`) | `dist/package` |\n| `db\\create_db.sql` | DB 계정 `gw_app` · DB `dpms_gw` 만들기 (PostgreSQL 관리자로) | `dist/package` |\n| `db\\V001__gw_ddl.sql` | 스키마 참고본. 실제 적용은 게이트웨이가 기동 때 Flyway 로 한다 | build-dist ② |\n| `양식\\기준정보_적재양식.xlsx` | 빈 기준정보 적재 양식(설명 시트 · 예시 행). 패키지의 JRE 로 만들어 JRE 도 함께 확인한다 | build-dist ⑤ |\n| `install.ps1` · `uninstall.ps1` | 설치 · 갱신 / 서비스 내리기 | `dist/package` |\n| `README.txt` | 요약 설치 순서 · 폴더 설명 | `dist/package` |\n| `VERSION.txt` | 판 · 커밋(작업 중 변경이 있으면 `-dirty`) · 빌드 시각 · JRE 판 | build-dist ⑥ |\n| `checksums.txt` | `jre\\` 밖 파일의 SHA-256 | build-dist ⑥ |\n\n* `winsw\\dpms-gw.exe` 는 레포에 넣지 않고 빌드 때 넣는다. 없으면 예약 작업 방식이다([서비스 · 로그](#서비스로그) 3.).\n3. 설치 뒤 생기는 것\n- `config\\application.yml`: 설치 값 (`install.ps1` 2단계, 처음 한 번)\n- `config\\gw-api.p12` · `config\\gw-api.crt`: TLS 키 저장소 · 인증서 (`install.ps1` 4단계)\n- `secrets.dat`: 비밀값 (DPAPI, 그 PC 에서만 풀린다. `install.ps1` 3단계)\n- `data\\blackbox\\YYYY\\MM\\bb-YYYYMMDD.log[.gz]`: 블랙박스 (기록 B)\n- `logs\\`: 로그 ([서비스 · 로그](#서비스로그) 2.)\n- `prev\\dpms-gateway.jar`: 직전 판 jar (갱신 때, [갱신 · 되돌리기](#갱신))\n\n## 설치: 설치 순서\n\n`install.ps1` 하나로 복사부터 기동 확인까지 여덟 단계를 하고, 다시 실행하면 손으로 고친 값은 그대로 두고 갱신한다.\n\n1. 준비\n- 설치 PC 에 PostgreSQL 이 설치 · 기동돼 있고 `127.0.0.1` 로만 받는다 **[확인: 판 · 설치 주체]**.\n- 패키지 zip 을 반입 절차대로 들여와 풀고, `checksums.txt` 로 파일을 확인한다.\n- DPMS 연계 API 에 붙을 주소(DPMS 서버, 망연계 장비가 중계하면 그 장비 주소)를 받아 둔다 **[확인: ISS-03]**.\n- 관리자 권한 PowerShell 을 연다.\n1.1. `install.ps1` 매개변수\n```\npowershell -ExecutionPolicy Bypass -File install.ps1 -AllowIps \u003c주소> [-CreateDb -PsqlPath \u003cpsql.exe>] [-ServerAddress \u003c이 PC 주소>] …\n```\n\n| 매개변수 | 기본값 | 뜻 |\n|---|---|---|\n| `-AllowIps` | (필수) | DPMS 연계 API 에 붙을 수 있는 주소 목록. 설정 `gw.api.allow-ips` 와 방화벽 규칙에 같이 쓴다 |\n| `-Target` | `C:\\dpms-gw` | 설치 폴더 |\n| `-Port` | 18443 | DPMS 연계 API 포트 |\n| `-DbUrl` | `jdbc:postgresql://127.0.0.1:5432/dpms_gw` | DB 접속 주소 |\n| `-CreateDb` | 끔 | DB 계정 · DB 를 만든다(처음 설치 때만) |\n| `-PsqlPath` | - | `-CreateDb` 때 `psql.exe` 위치 |\n| `-PgSuperUser` · `-PgHost` · `-PgPort` | `postgres` · `127.0.0.1` · 5432 | `-CreateDb` 때 PostgreSQL 관리자 접속 |\n| `-ServerAddress` | - | TLS 인증서 SAN 에 넣을 이 PC 주소 |\n| `-NoTls` | 끔 | TLS 를 쓰지 않는다(HTTP). i-oneNet 이 TLS 를 통과시키지 못할 때만 **[협의: ISS-03]** |\n| `-NoFirewall` | 끔 | 방화벽 규칙을 만들지 않는다 |\n| `-NoStart` | 끔 | 서비스를 등록만 하고 시작 · 기동 확인을 하지 않는다 |\n\n2. 단계\n1) 복사: 설치 폴더와 `config` · `data` · `logs` 를 만든다. 서비스가 돌고 있으면 멈추고, 이미 jar 가 있으면 `prev\\dpms-gateway.jar` 로 남긴다.\n- 복사하는 폴더: `jre` · `bin` · `db` · `양식` · `winsw`\n- 복사하는 파일: jar · 스크립트 · `README.txt` · `VERSION.txt` · `checksums.txt` · `config\\application.example.yml`\n* 다시 실행할 때: 갱신([갱신 · 되돌리기](#갱신)).\n2) 설정: `config\\application.yml` 을 매개변수로 만든다.\n- DB 주소 · 계정 `gw_app`\n- API 포트 · TLS 사용 · 허용 주소\n- 블랙박스 폴더 `data/blackbox`\n- 비밀값 저장소 `dpapi` · `secrets.dat`\n- TLS 면 `server.ssl.*`(키 저장소 `config/gw-api.p12`, 별칭 `dpms-gw`)\n* 다시 실행할 때: 있으면 그대로 둔다(손으로 고친 값을 지키기 위해).\n3) 비밀값: `secret init secrets.dat dpms-ctrl dpms-read` 로 `jwt.key` 와 두 클라이언트 비밀값을 무작위로 만든다. `db.password` 가 없으면 무작위로 만들어 넣는다.\n* **클라이언트 비밀값은 화면에 한 번만 나온다**(DPMS 설정에 옮긴다).\n* 다시 실행할 때: 있는 키는 그대로 둔다.\n4) TLS: `-NoTls` 가 아니면 PKCS12 키 저장소 `config\\gw-api.p12` 를 만든다(EC P-256, 10년, `CN=dpms-gateway`, `-ServerAddress` 가 있으면 SAN). 비밀번호는 무작위로 만들어 `secrets.dat` 의 `tls.keystore.password` 에 넣는다. 인증서 `config\\gw-api.crt` 를 내보낸다(DPMS 쪽 게이트웨이 신뢰 목록에 넣는다).\n* 다시 실행할 때: 있으면 그대로 둔다.\n5) DB: `-CreateDb` 면 `db\\create_db.sql` 의 비밀번호 자리에 3단계 `db.password` 를 채워 PostgreSQL 관리자로 넣는다. 계정 `gw_app`, DB `dpms_gw`(소유 `gw_app`, UTF8)가 생긴다. 관리자 비밀번호는 psql 이 묻는다. 스키마 · 표는 게이트웨이가 기동 때 Flyway 로 만든다.\n* 다시 실행할 때: `db.password` 가 이미 있으면 멈춘다(`-CreateDb` 를 빼고 다시 실행).\n6) 서비스: `winsw\\dpms-gw.exe` 가 있으면 서비스 `dpms-gw` 를 등록(있으면 설정 갱신)하고 다시 시작한다. 없으면 예약 작업으로 대신한다([서비스 · 로그](#서비스로그) 3.).\n* 다시 실행할 때: 설정 갱신 · 다시 시작.\n7) 방화벽: 인바운드 규칙 `DPMS 연계 API` 를 만든다. TCP `-Port` 를 `-AllowIps` 에서만 허용한다.\n* 다시 실행할 때: 같은 이름 규칙은 지우고 다시 만든다.\n8) 기동 확인: `https://127.0.0.1:\u003c포트>/gw/v1/health` 를 2초마다 최대 3분 부른다. 응답이 오거나 거부(401 · 403)가 오면 기동한 것으로 본다(127.0.0.1 이 허용 목록 밖이면 거부가 정상). 응답이 없으면 `logs\\startup.log` · `gateway.log` 를 보라고 알린다.\n3. 다음\n- `-CreateDb` 를 쓰지 않으면 DB 계정 `gw_app` 의 비밀번호를 3단계에서 만든 값으로 맞추거나, `bin\\gw-secret.cmd set secrets.dat db.password=…` 로 기존 비밀번호를 넣는다.\n- 설치가 끝나면 기준정보를 넣는다([기준정보 반영](#기준정보)). 기준정보가 없으면 게이트웨이는 PLC 에 붙지 않는다.\n- DPMS 쪽에 넘길 것: 게이트웨이 주소 · 포트, 클라이언트 ID · 비밀값(`dpms-ctrl` 조회 + 명령, `dpms-read` 조회만), `config\\gw-api.crt`.\n\n## 내리기: 서비스 내리기\n\n`uninstall.ps1 [-Target …]` 은 서비스(또는 예약 작업)와 방화벽 규칙만 지운다.\n\n1. 단계\n1) `uninstall.ps1 [-Target …]` 을 실행한다. 설치 폴더(`data` · `logs` · `config` · `secrets.dat`)와 DB `dpms_gw` 는 남는다.\n2) 완전히 지우려면 폴더와 DB 를 따로 지운다.\n\n## 설정: 설정\n\n현장마다 다른 값은 설치 값 · 비밀값 · 기준정보 DB 세 곳에만 두고, 제품 기본값은 jar 안의 `application.yml` 이다.\n\n1. 값을 두는 세 곳\n1.1. 설치 값 (`config\\application.yml`)\n- **담는 것**: 그 설치에서 제품 기본값과 다른 운영 값([게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md) 3.4 의 키)\n- **넣는 방법**: `install.ps1` 2단계가 만들고, 그 뒤는 `application.example.yml` 을 보고 손으로 고친다\n- **바꾼 뒤**: 서비스 다시 시작\n설치 값에 두는 운영 값은 아래와 같다(다 적은 것은 아니다).\n- DB 주소 · 계정\n- API 포트 · TLS · 허용 주소\n- 블랙박스 폴더 · 보존\n- 피드 보존\n- 매일 정리 시각\n- 허용 명령 코드\n- PLC 멈춤 판정 시간\n- 명령 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초): 이 시간이 지나도 PLC 결과가 없으면 \"결과 확인 중(지연)\" 만 표시하고 실패 처리하지 않는다.\n- 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초): 이 시간 안에 PLC 접수 번호가 오지 않으면 그 명령을 전달 불명으로 끝내고 같은 PLC 의 접수 대기(308)를 푼다.\n1.2. 비밀값 (`secrets.dat`)\n- **담는 것**: `db.password` · `jwt.key` · `client.\u003c클라이언트ID>.secret` · `tls.keystore.password`\n- **넣는 방법**: `install.ps1` 3 · 4단계, `bin\\gw-secret.cmd init` · `set` · `keys`\n- **바꾼 뒤**: 서비스 다시 시작\n1.3. 기준정보 DB (`gw` 스키마)\n- **담는 것**: PLC 연결(`gt_link`) · 사이트(`gt_site`) · 설비(`gt_fclt`) · 매핑표(`gt_map_iem`) · 경보 코드(`gt_alrm_cd`) · 결과 코드 대응(`gt_rslt_cd_ractn`) · 판 기록(`gt_map_ver`)\n- **넣는 방법**: `bin\\gw-map.cmd` 로 만든 적재 SQL 을 `psql` 로, 또는 뷰어 「기준정보 · 관리」 양식 적재([기준정보 반영](#기준정보))\n- **바꾼 뒤**: 기준정보 다시 읽기(뷰어 양식 적재는 적재 뒤 바로 다시 읽는다). 바뀐 링크만 다시 연결하고 서비스는 다시 시작하지 않는다\n1.4. 규칙\n- 설치 값 파일에는 제품 기본값과 다른 값만 둔다. 프로파일은 `site`(서비스 설정이 준다).\n- 비밀값은 설정 파일 · 로그 · 진단 자료에 쓰지 않는다. `secrets.dat` 는 DPAPI 머신 범위로 암호화돼 그 PC 에서만 풀린다. PC 를 바꾸면 그 PC 에서 다시 만든다.\n- PLC 접속 주소 · 폴링 주기 · 워드 순서 같은 링크별 값은 설정 파일이 아니라 기준정보(`gt_link`)다.\n- 기동 때 설정 값 범위를 검사하고, 틀리면 기동을 멈추고 `logs\\startup.log` 에 사유를 남긴다. 허용 주소가 비어 있어도 기동을 멈춘다.\n2. 현장 설정 예 (합천)\n첫 설치 현장의 값이다. 패키지 · 스크립트의 기본값이 아니다.\n- **`-AllowIps` · `gw.api.allow-ips`**: i-oneNet(망연계) 중계 장비 주소. 상태 **[확인: ISS-03]**\n- **`gw.command.allowed-cmd-codes`**: `[1, 2]` (기동 · 정지). 명령 대상은 매핑표에 동작 결과 영역이 있는 주배수펌프뿐이다. 상태 확정 (요구사항정의서 v0.2 CMD-07)\n- **기준정보 `gt_link` · `gt_site`**: 대상 5개소(핫들 · 영창 · 미곡 · 질매 · 삼가 배수펌프장, 2026-10-16 확정, ISS-09), 개소마다 PLC 하나 · 사이트 하나. 첫 시험 현장 질매. 상태: PLC 쪽 매핑표 · 개소 구성도 수령 뒤\n- **기준정보 `gt_fclt`**: 도면 기준 개소마다 아래 설비(요구사항정의서 v0.2 4.2). 실제 PLC 구성이 다르면 매핑표 · 기준정보로 맞춘다. 상태: PLC 쪽 매핑표 · 개소 구성도 수령 뒤\n* 주배수펌프 3 · 지배수펌프 2 · 토출밸브 3 · 제진기 3 · 협잡물 컨베이어 2\n* 미곡만 수문(배수통문) 1 추가\n- **설치 PC · DB**: 상황실 제어망 PC, 같은 PC 의 PostgreSQL. 상태 **[확인: ISS-03]**\n\n## 기준정보: 기준정보 반영\n\nPLC 담당 매핑표를 받으면 양식 채우기부터 상태 확인까지 일곱 단계로 넣는다.\n\n1. 준비\n- PLC 담당 매핑표를 받는다.\n- 양식 · 검사 · 시험 벡터 · 적재 SQL 규칙은 [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8.3절을 본다.\n2. 단계\n1) Excel 에서 빈 양식(`양식\\기준정보_적재양식.xlsx`)에 연결 · 설비 · 경보코드 · 매핑표 · (결과코드) · 시험벡터 시트를 채운다. 예시 행은 지운다.\n2) `bin\\gw-map.cmd check 양식.xlsx` 로 검사한다. 오류가 있으면 고치고 다시 한다.\n3) `bin\\gw-map.cmd sql 양식.xlsx 적재.sql --activate` 로 적재 SQL 을 만든다. 시험 벡터가 통과한 사이트만 판(`gt_site.map_ver`)이 올라간다.\n4) 메모장에서 `적재.sql` 머리 주석을 열어 사이트마다 \"판 올림\" 인지 확인한다.\n5) `psql -U gw_app -d dpms_gw -f 적재.sql` 로 넣는다(한 트랜잭션).\n6) 뷰어 「기준정보 · 관리」 [기준정보 다시 읽기] (`POST /viewer/api/reload`)로 기준정보를 다시 읽는다. 바뀐 링크만 끊었다 다시 연결하고, 바뀌지 않은 개소의 폴링은 끊기지 않는다.\n* 끝나지 않은 명령이 있으면 다시 읽지 않으므로(409) 명령이 끝난 뒤 다시 한다.\n7) DPMS 화면 또는 9절에서 `status` 를 본다.\n3. 확인\n- 사이트마다 `links[].st = UP`, `gwMapVer = plcMapVer`, `missingRoles` 빈 목록이다.\n4. 되돌리기\n- 양식 파일과 적재 SQL 은 판마다 남긴다(현장 설치 기록).\n- 다른 판의 매핑표 줄은 DB 에 그대로 남으므로 이전 판으로 되돌릴 때는 그 판의 양식으로 3) ~ 6) 을 다시 한다(적재 뒤 기준정보 다시 읽기까지. PLC 의 판 번호도 그 판이어야 한다).\n5. 주의\n- 뷰어 「기준정보 · 관리」 에서 양식을 적재하면 검사 · SQL 만들기 · 넣기 · 다시 읽기(2) · 3) · 5) · 6))를 한 번에 한다(`POST /viewer/api/map/apply`, 판 올림은 선택, 적재 뒤 다시 읽기가 기본).\n- 명령이 진행 중이라 다시 읽지 못했으면 명령이 끝난 뒤 [기준정보 다시 읽기] 를 누른다. `psql` 로 직접 넣었을 때도 [기준정보 다시 읽기] 로 반영한다.\n- 게이트웨이 다시 시작(`restart=true` 또는 [다시 시작])은 설정 파일 · 비밀값을 바꿨을 때처럼 다시 읽기로 반영되지 않는 경우에만 한다.\n- `--activate` 없이 만들면 판을 올리지 않는다(내용 확인용). 새 사이트를 판 올림 없이 넣으면 판 0 으로 들어가 수집 · 제어를 하지 않는다.\n\n## 서비스로그: 서비스 · 로그\n\n게이트웨이는 WinSW Windows 서비스 `dpms-gw` 로 돌고, 로그는 `logs\\` 에 남으며 운영 사건의 정본은 로그가 아니라 피드(`gt_evt`)와 블랙박스다.\n\n1. Windows 서비스 (WinSW)\n`winsw\\dpms-gw.xml` (WinSW v2) 의 값이다. `%BASE%` 는 `winsw` 폴더다.\n\n| 속성 | 값 |\n|---|---|\n| 서비스 ID · 이름 | `dpms-gw` · DPMS 연계 게이트웨이 |\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\n| 환경변수 | `SPRING_PROFILES_ACTIVE=site`, `GW_LOG_DIR=\u003c설치 폴더>\\logs` |\n| 시작 | 자동(지연 시작) |\n| 실패 시 | 10초 → 30초 → 60초 뒤 다시 시작, 실패 횟수는 1시간 뒤 초기화 |\n| 정지 대기 | 20초 |\n| 서비스 래퍼 로그 | `logs\\service\\`, 크기 10MB 마다 돌리고 8개 보관 |\n| 실행 계정 | WinSW 기본(LocalSystem). `secrets.dat` 는 머신 범위라 계정에 묶이지 않는다 |\n\n2. 로그\n로그 파일마다 내용과 보존이다.\n\n| 파일 | 내용 | 보존 |\n|---|---|---|\n| `logs\\startup.log` | 기동 자가진단 결과. 기동 실패 사유가 첫 줄에 보인다 | 기동마다 덮어씀 |\n| `logs\\gateway.log` | 프로그램 로그(링크 상태 변화 · 명령 · 정리 결과 · 오류) | 날마다 `gateway.YYYY-MM-DD.log` 로 돌리고 30일 |\n| `logs\\service\\` | WinSW 래퍼 로그(표준 출력 · 오류) | 10MB × 8 |\n| `data\\blackbox\\` | 블랙박스(기록 B). 로그가 아니라 증거 기록이다 | 8절 |\n\n- 로그에는 비밀값을 남기지 않는다.\n- 운영 사건(링크 상태 · 명령 진행 · 경보)은 로그보다 피드(`gt_evt`)와 블랙박스가 정본이다.\n3. WinSW 가 없을 때 (예약 작업)\n패키지에 `winsw\\dpms-gw.exe` 가 없으면 `install.ps1` 이 Windows 예약 작업 `dpms-gw` 로 대신한다.\n\n| 속성 | 값 |\n|---|---|\n| 트리거 | 시스템 시작 시 |\n| 계정 | `SYSTEM`, 가장 높은 권한 |\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Dspring.profiles.active=site -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\n| 실패 시 | 1분 간격으로 다시 시작(최대 999회), 실행 시간 제한 없음 |\n| 로그 | `logs\\` (작업 폴더 기준 기본값). 래퍼 로그는 없다 |\n\n- 예약 작업은 비상용이다. 정지 · 재시작 관리가 서비스보다 약하므로 납품 패키지에는 WinSW 를 넣는다 **[확인: WinSW 실행 파일 반입]**.\n\n## 갱신: 갱신 · 되돌리기\n\n갱신은 새 패키지에서 `install.ps1` 을 같은 매개변수로 다시 실행하는 것이고, 설정 · 비밀값 · 데이터는 그대로 남는다.\n\n1. 갱신\n1) 새 패키지를 풀고 그 폴더에서 `install.ps1` 을 같은 매개변수로 다시 실행한다.\n2) 스크립트가 서비스를 멈추고, 직전 jar 를 `prev\\` 에 남기고, 프로그램 파일(`jre` · `bin` · `db` · `양식` · `winsw` · jar)을 바꾼다.\n3) 스크립트가 서비스 설정을 갱신하고 다시 시작한다.\n- 그대로 두는 것: `config\\application.yml` · `secrets.dat` · TLS 키 저장소 · `data` · `logs`\n2. 스키마\n- 게이트웨이가 기동 때 Flyway 로 새 마이그레이션(`V00n__*.sql`)만 적용한다(적용된 것은 검증만).\n- 스키마 적용에 실패하면 기동을 멈춘다.\n3. 되돌리기\n- 서비스 정(표본이 여기서 끊김)\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: 원본 앞 22k\n- 개요\n  - 개정: 2026-10-15 작성 사경진 과장. TermFlow 표준 용어로 테이블 · 컬럼 이름 재설계 반영 (3.4_설계_DPMS웹설계\\작업문서\\TermFlow재설계). 게이트웨이 DB 표 이름(`gt_*`)과 9절 조회 예의 칸 이름을 바꿈\n  - 개정: 2026-10-16 작성 사경진 과장. TermFlow 테이블 설계 가이드 적용 (코드 컬럼 · 감사 컬럼 · 코드값). 보존 정리 표의 명령 상태 값을 새 값(`RJCT_GW` · `DLVR_UNKN`)으로, 9절 접속 기록 조회 예를 문자 코드 비교(`rpns_cd IN ('211', …)`)로 바꿈. 모든 게이트웨이 표에 표준 감사 컬럼이 붙었다\n  - 개정: 2026-10-16 작성 사경진 과장. 게이트웨이 뷰어(UI/UX 검토 UXR-G-17). 9절에 뷰어(`http://127.0.0.1:18444/viewer/`)로 보는 점검 항목 · 보안 경계를 더했다\n  - 개정: 2026-10-16 작성 사경진 과장. 뷰어 진단 번들(UXR-G-11). 9절 반출: 뷰어 개요 [진단 번들] zip 하나. 명령줄 `gw diag` 는 아직 구현 전\n  - 개정: 2026-10-18 작성 사경진 과장. 망 구간 담당 정정: 게이트웨이 설치 PC · OS · PostgreSQL 은 나산전기산업(망연계 장비 전까지의 네트워크 · 서버), i-oneNet 정책은 DID 외주 (10절 #3). 근거 PLC 연계 요구사항정의서 v0.2 5장. 기준정보 운영 중 반영(다시 읽기 · 개소 사용 중지 · 기준정보 해시) 코드에 맞춤: 4.1 · 5절 반영 순서(6단계 다시 읽기), 9.1 기준정보 · 관리 화면 · 보안 경계\n  - 개정: 2026-10-18 작성 사경진 과장. PLC 연계 요구사항정의서 v0.2 의 명령 결과 두 단계 · 대상 개소에 맞춤: 4.1 설치 값에 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초), 4.2 허용 명령 확정(주배수펌프 기동 · 정지) · 설비 구성(도면 기준), 9.1 · 9.2 명령 점검 항목(접수 결과 · 동작 결과 · 지연 표시), 10절 #3 근거를 요구사항정의서 5장으로\n  - 개정: 2026-10-19 작성 사경진 과장. 2026-10-18 미결정 6건 확정: 4.1 설치 값에 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초), 9.1 명령 점검에 덮임 31(원값 없음) · 전달 불명이 생기는 경우 · `GW_LATE`\n  - 옛 장 번호: 목적 1 · 패키지 2 · 설치 3(3.4 는 「내리기」 항목) · 설정 4 · 기준정보 5 · 서비스로그 6 · 갱신 7. 개정 줄의 4.1 · 4.2 · 5절은 이 번호다\n\u003c!-- /kmd:참고 -->\n"},{"k":"D","l":"안 D 읽기 우선","t":"# 게이트웨이운영설계서\r\n\r\n연계 게이트웨이(`dpms_gateway`)를 상황실 제어망 PC 에 패키지로 설치하고, 현장 값은 설치 값 · 비밀값 · 기준정보 세 곳으로만 넣는다. 원격 작업이 안 되므로 설치 · 패치 · 장애 대응은 현장 방문으로 한다. 지금 판은 초안 v0.1 이고 설치 PC · DBMS · 망연계 주소 회신과 내부 시험 서버 설치 시험으로 확정한다.\r\n\r\n## 개요\r\n\r\n**초안**(v0.1, 기준일 2026-10-18). 설치 PC · DBMS · 망연계 주소 회신([DPMS-ISS-03](위험및이슈관리대장.md#DPMS-ISS-03))과 내부 시험 서버 설치 시험으로 확정한다.\r\n\r\n- **범위**: 운영 방식(무엇을 어디에 두고 어떤 순서로 하는가)을 정한다. 현장에서 따라 하는 단계별 절차는 설치 절차서(WBS 8.3) · 운영 절차서가 이 문서를 바탕으로 쓴다.\r\n- **사업**: 배수펌프장 통합운영관리시스템(DPMS) 구축\r\n- **WBS**: 3.3.4 게이트웨이 운영 설계\r\n- **작성**: DPMS 개발(세정아이앤씨) 사경진 과장\r\n- **판**: v0.1(2026-10-15). 설치 패키지 구현(`dpms_gateway/dist`)을 기준으로 처음 썼다.\r\n- **근거**: `dpms_gateway/dist/build-dist.ps1` · `dist/package/`(`install.ps1` · `uninstall.ps1` · `README.txt` · `config/application.example.yml` · `winsw/dpms-gw.xml` · `db/create_db.sql` · `bin/*.cmd`) · [DPMS-ISS-08](위험및이슈관리대장.md#DPMS-ISS-08) · [DPMS-ISS-16](위험및이슈관리대장.md#DPMS-ISS-16)\r\n- **표기**: **[확인]** 회신이 필요한 것, **[협의]** 상대와 정할 것, **[제안]** 이 설계가 정한 기본값, **[재계산 필요]** 실측으로 다시 정할 값.\r\n\r\n관련: [게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md) · [DPMS 연계 API 정의서](DPMS연계API정의서.md) · [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8절\r\n\r\n## 전제\r\n\r\n게이트웨이는 원격 작업 불가 · 패키지형 납품 · 폐쇄망 · Windows 와 같은 PC 의 PostgreSQL · 범용 제품 다섯 전제 아래 운영한다.\r\n\r\n| # | 전제 | 근거 | 이 설계에서의 뜻 |\r\n|--:|---|---|---|\r\n| 1 | **원격 작업 불가**. 유지보수 업체의 원격 접속을 허용하지 않는다 | [DPMS-ISS-08](위험및이슈관리대장.md#DPMS-ISS-08)(발주기관 자체보안대책서) | 설치 · 패치 · 장애 대응은 **현장 방문**으로 한다. 현장에서 인터넷 · 개발 도구 없이 끝낼 수 있어야 한다. 방문 전에는 DPMS 가 받은 `health` 이력 · 게이트웨이 상태로 원인 범위를 좁힌다 |\r\n| 2 | **패키지형 납품**. 납기가 현장 공사 · 인프라보다 빠르다 | [DPMS-ISS-16](위험및이슈관리대장.md#DPMS-ISS-16) | 현장 값(PLC 주소 · 매핑표 · 설비 · 허용 주소) 없이 설치할 수 있는 패키지를 납품하고, 현장 값은 설치 때 설정 · 기준정보로 넣는다 |\r\n| 3 | 폐쇄망(상황실 제어망) | 시스템 구성도 | Java · 라이브러리를 현장에서 받지 않는다. 전용 JRE 를 패키지에 넣는다 |\r\n| 4 | 설치 PC 는 Windows, DB 는 같은 PC 의 PostgreSQL | 프로그램 설계서 §2 | 설치 PC OS · PostgreSQL 판 **[확인: ISS-03]**. PostgreSQL 설치본은 이 패키지에 넣지 않는다 |\r\n| 5 | 범용 제품 | 설계 기조(2026-10-11) | 패키지 · 스크립트에 현장 고유값을 넣지 않는다. 현장마다 다른 값은 [설정](#설정)의 세 곳으로만 받는다 |\r\n\r\n## 패키지\r\n\r\n개발 PC 에서 `build-dist.ps1` 하나로 `dist\\out\\dpms-gateway-\u003c판>\\` 폴더와 같은 이름의 zip 을 만든다. 전용 JRE · jar · 설치 스크립트 · 도구 · 양식을 담는다.\r\n\r\n```\r\npowershell -ExecutionPolicy Bypass -File dist\\build-dist.ps1 [-WinSw \u003cWinSW-x64.exe>] [-SkipBuild]\r\n```\r\n\r\n1. 패키지에 든 것\r\n\r\n| 경로 | 내용 | 만드는 곳 |\r\n|---|---|---|\r\n| `jre\\` | 전용 Java 17 런타임(jlink, 필요한 모듈 · 한국어/영어 로캘만) | build-dist ③ |\r\n| `dpms-gateway.jar` | 게이트웨이(Spring Boot 실행형 jar). 매핑표 반영 도구 · 비밀값 도구도 이 jar 의 하위 명령 | build-dist ①(`mvn package`) |\r\n| `config\\application.example.yml` | 설치 값 설명 · 예([설정](#설정)) | `dist/package` |\r\n| `winsw\\dpms-gw.xml` · `winsw\\dpms-gw.exe` | Windows 서비스 설정 · WinSW 실행 파일. exe 는 레포에 넣지 않고 빌드 때 넣는다(없으면 예약 작업 방식, [서비스](#서비스) 3) | `dist/package` · build-dist ④ |\r\n| `bin\\gw-map.cmd` | 매핑표 반영 도구(`map template` · `check` · `sql`) | `dist/package` |\r\n| `bin\\gw-secret.cmd` | 비밀값 도구(`secret init` · `set` · `keys`) | `dist/package` |\r\n| `db\\create_db.sql` | DB 계정 `gw_app` · DB `dpms_gw` 만들기(PostgreSQL 관리자로) | `dist/package` |\r\n| `db\\V001__gw_ddl.sql` | 스키마 참고본. 실제 적용은 게이트웨이가 기동 때 Flyway 로 한다 | build-dist ② |\r\n| `양식\\기준정보_적재양식.xlsx` | 빈 기준정보 적재 양식(설명 시트 · 예시 행). 패키지의 JRE 로 만들어 JRE 도 함께 확인한다 | build-dist ⑤ |\r\n| `install.ps1` · `uninstall.ps1` | 설치 · 갱신 / 서비스 내리기 | `dist/package` |\r\n| `README.txt` | 요약 설치 순서 · 폴더 설명 | `dist/package` |\r\n| `VERSION.txt` | 판 · 커밋(작업 중 변경이 있으면 `-dirty`) · 빌드 시각 · JRE 판 | build-dist ⑥ |\r\n| `checksums.txt` | `jre\\` 밖 파일의 SHA-256 | build-dist ⑥ |\r\n\r\n2. 설치 뒤 생기는 것\r\n\r\n| 경로 | 내용 |\r\n|---|---|\r\n| `config\\application.yml` | 설치 값(install.ps1 ②, 처음 한 번) |\r\n| `config\\gw-api.p12` · `config\\gw-api.crt` | TLS 키 저장소 · 인증서(install.ps1 ④) |\r\n| `secrets.dat` | 비밀값(DPAPI, 그 PC 에서만 풀린다. install.ps1 ③) |\r\n| `data\\blackbox\\YYYY\\MM\\bb-YYYYMMDD.log[.gz]` | 블랙박스(기록 B) |\r\n| `logs\\` | 로그([서비스](#서비스) 2) |\r\n| `prev\\dpms-gateway.jar` | 직전 판 jar(갱신 때, [갱신](#갱신)) |\r\n\r\n## 설치\r\n\r\n관리자 PowerShell 에서 `install.ps1` 을 한 번 돌리면 복사 · 설정 · 비밀값 · TLS · DB · 서비스 · 방화벽 · 기동 확인 여덟 단계를 한다. 다시 돌려도 손으로 고친 설정 · 있는 비밀값 · 키 저장소는 그대로 둔다.\r\n\r\n1. 준비\r\n- 설치 PC 에 PostgreSQL 이 설치 · 기동돼 있고 `127.0.0.1` 로만 받는다 **[확인: 판 · 설치 주체]**.\r\n- 패키지 zip 을 반입 절차대로 들여와 풀고, `checksums.txt` 로 파일을 확인한다.\r\n- DPMS 연계 API 에 붙을 주소(DPMS 서버, 망연계 장비가 중계하면 그 장비 주소)를 받아 둔다 **[확인: ISS-03]**.\r\n- 관리자 권한 PowerShell 을 연다.\r\n2. 매개변수\r\n\r\n```\r\npowershell -ExecutionPolicy Bypass -File install.ps1 -AllowIps \u003c주소> [-CreateDb -PsqlPath \u003cpsql.exe>] [-ServerAddress \u003c이 PC 주소>] …\r\n```\r\n\r\n| 매개변수 | 기본값 | 뜻 |\r\n|---|---|---|\r\n| `-AllowIps` | (필수) | DPMS 연계 API 에 붙을 수 있는 주소 목록. 설정 `gw.api.allow-ips` 와 방화벽 규칙에 같이 쓴다 |\r\n| `-Target` | `C:\\dpms-gw` | 설치 폴더 |\r\n| `-Port` | 18443 | DPMS 연계 API 포트 |\r\n| `-DbUrl` | `jdbc:postgresql://127.0.0.1:5432/dpms_gw` | DB 접속 주소 |\r\n| `-CreateDb` | 끔 | DB 계정 · DB 를 만든다(처음 설치 때만) |\r\n| `-PsqlPath` | - | `-CreateDb` 때 `psql.exe` 위치 |\r\n| `-PgSuperUser` · `-PgHost` · `-PgPort` | `postgres` · `127.0.0.1` · 5432 | `-CreateDb` 때 PostgreSQL 관리자 접속 |\r\n| `-ServerAddress` | - | TLS 인증서 SAN 에 넣을 이 PC 주소 |\r\n| `-NoTls` | 끔 | TLS 를 쓰지 않는다(HTTP). i-oneNet 이 TLS 를 통과시키지 못할 때만 **[협의: ISS-03]** |\r\n| `-NoFirewall` | 끔 | 방화벽 규칙을 만들지 않는다 |\r\n| `-NoStart` | 끔 | 서비스를 등록만 하고 시작 · 기동 확인을 하지 않는다 |\r\n\r\n3. 단계\r\n\r\n| 단계 | 하는 일 | 다시 실행할 때 |\r\n|--:|---|---|\r\n| 1 복사 | 설치 폴더와 `config` · `data` · `logs` 를 만든다. 서비스가 돌고 있으면 멈춘다. 이미 jar 가 있으면 `prev\\dpms-gateway.jar` 로 남긴다. `jre` · `bin` · `db` · `양식` · `winsw` 폴더와 jar · 스크립트 · `README.txt` · `VERSION.txt` · `checksums.txt` · `config\\application.example.yml` 을 복사한다 | 갱신([갱신](#갱신)) |\r\n| 2 설정 | `config\\application.yml` 을 매개변수로 만든다: DB 주소 · 계정 `gw_app`, API 포트 · TLS 사용 · 허용 주소, 블랙박스 폴더 `data/blackbox`, 비밀값 저장소 `dpapi` · `secrets.dat`, TLS 면 `server.ssl.*`(키 저장소 `config/gw-api.p12`, 별칭 `dpms-gw`) | 있으면 그대로 둔다(손으로 고친 값을 지키기 위해) |\r\n| 3 비밀값 | `secret init secrets.dat dpms-ctrl dpms-read`: `jwt.key` 와 두 클라이언트 비밀값을 무작위로 만든다. **클라이언트 비밀값은 화면에 한 번만 나온다**(DPMS 설정에 옮긴다). `db.password` 가 없으면 무작위로 만들어 넣는다 | 있는 키는 그대로 둔다 |\r\n| 4 TLS | `-NoTls` 가 아니면 PKCS12 키 저장소 `config\\gw-api.p12` 를 만든다(EC P-256, 10년, `CN=dpms-gateway`, `-ServerAddress` 가 있으면 SAN). 비밀번호는 무작위로 만들어 `secrets.dat` 의 `tls.keystore.password` 에 넣는다. 인증서 `config\\gw-api.crt` 를 내보낸다(DPMS 쪽 게이트웨이 신뢰 목록에 넣는다) | 있으면 그대로 둔다 |\r\n| 5 DB | `-CreateDb` 면 `db\\create_db.sql` 의 비밀번호 자리에 3단계 `db.password` 를 채워 PostgreSQL 관리자로 넣는다: 계정 `gw_app`, DB `dpms_gw`(소유 `gw_app`, UTF8). 관리자 비밀번호는 psql 이 묻는다. 스키마 · 표는 게이트웨이가 기동 때 Flyway 로 만든다 | `db.password` 가 이미 있으면 멈춘다(`-CreateDb` 를 빼고 다시 실행) |\r\n| 6 서비스 | `winsw\\dpms-gw.exe` 가 있으면 서비스 `dpms-gw` 를 등록(있으면 설정 갱신)하고 다시 시작한다. 없으면 예약 작업으로 대신한다([서비스](#서비스) 3) | 설정 갱신 · 다시 시작 |\r\n| 7 방화벽 | 인바운드 규칙 `DPMS 연계 API`: TCP `-Port` 를 `-AllowIps` 에서만 허용. 같은 이름 규칙은 지우고 다시 만든다 | 다시 만든다 |\r\n| 8 기동 확인 | `https://127.0.0.1:\u003c포트>/gw/v1/health` 를 2초마다 최대 3분 부른다. 응답이 오거나 거부(401 · 403)가 오면 기동한 것으로 본다(127.0.0.1 이 허용 목록 밖이면 거부가 정상). 응답이 없으면 `logs\\startup.log` · `gateway.log` 를 보라고 알린다 | - |\r\n\r\n4. 설치 뒤\r\n- `-CreateDb` 를 쓰지 않으면 DB 계정 `gw_app` 의 비밀번호를 3단계에서 만든 값으로 맞추거나, `bin\\gw-secret.cmd set secrets.dat db.password=…` 로 기존 비밀번호를 넣는다.\r\n- 기준정보를 넣는다([기준정보](#기준정보)). 기준정보가 없으면 게이트웨이는 PLC 에 붙지 않는다.\r\n- DPMS 쪽에 넘긴다: 게이트웨이 주소 · 포트, 클라이언트 ID · 비밀값(`dpms-ctrl` 조회 + 명령, `dpms-read` 조회만), `config\\gw-api.crt`.\r\n5. 서비스 내리기\r\n\r\n`uninstall.ps1 [-Target …]` 는 서비스(또는 예약 작업)와 방화벽 규칙만 지운다. 설치 폴더(`data` · `logs` · `config` · `secrets.dat`)와 DB `dpms_gw` 는 남긴다. 완전히 지우려면 폴더와 DB 를 따로 지운다.\r\n\r\n## 설정\r\n\r\n현장마다 다른 값은 설치 값 파일 · 비밀값 파일 · 기준정보 DB 세 곳에만 둔다. 설치 값 · 비밀값은 서비스를 다시 시작해야, 기준정보는 다시 읽기만으로 반영된다.\r\n\r\n1. 값을 두는 세 곳\r\n\r\n| 곳 | 담는 것 | 넣는 방법 | 바꾼 뒤 |\r\n|---|---|---|---|\r\n| `config\\application.yml`(설치 값) | 그 설치에서 제품 기본값과 다른 운영 값(아래 1.1.) | install.ps1 ② 가 만들고, 그 뒤는 `application.example.yml` 을 보고 손으로 고친다 | 서비스 다시 시작 |\r\n| `secrets.dat`(비밀값) | `db.password` · `jwt.key` · `client.\u003c클라이언트ID>.secret` · `tls.keystore.password` | install.ps1 ③ · ④, `bin\\gw-secret.cmd init` · `set` · `keys` | 서비스 다시 시작 |\r\n| 기준정보 DB(`gw` 스키마) | PLC 연결 · 사이트 · 설비 · 매핑표 등 표 일곱(아래 1.2.) | `bin\\gw-map.cmd` 로 만든 적재 SQL 을 `psql` 로, 또는 뷰어 「기준정보 · 관리」 양식 적재([기준정보](#기준정보)) | 기준정보 다시 읽기(뷰어 양식 적재는 적재 뒤 바로 다시 읽는다). 바뀐 링크만 다시 연결하고 서비스는 다시 시작하지 않는다 |\r\n\r\n1.1. 설치 값의 운영 값\r\n\r\n[게이트웨이 프로그램 설계서](게이트웨이프로그램설계서.md) §3.4 의 키다.\r\n\r\n- DB 주소 · 계정\r\n- API 포트 · TLS · 허용 주소\r\n- 블랙박스 폴더 · 보존\r\n- 피드 보존\r\n- 매일 정리 시각\r\n- 허용 명령 코드\r\n- PLC 멈춤 판정 시간\r\n- 명령 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초): 이 시간이 지나도 PLC 결과가 없으면 \"결과 확인 중(지연)\" 만 표시하고 실패 처리하지 않는다.\r\n- 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초): 이 시간 안에 PLC 접수 번호가 오지 않으면 그 명령을 전달 불명으로 끝내고 같은 PLC 의 접수 대기(308)를 푼다.\r\n\r\n1.2. 기준정보 표\r\n\r\n- PLC 연결(`gt_link`)\r\n- 사이트(`gt_site`)\r\n- 설비(`gt_fclt`)\r\n- 매핑표(`gt_map_iem`)\r\n- 경보 코드(`gt_alrm_cd`)\r\n- 결과 코드 대응(`gt_rslt_cd_ractn`)\r\n- 판 기록(`gt_map_ver`)\r\n\r\n1.3. 지키는 것\r\n- 제품 기본값은 jar 안의 `application.yml` 이다. 설치 값 파일에는 다른 값만 둔다. 프로파일은 `site`(서비스 설정이 준다).\r\n- 비밀값은 설정 파일 · 로그 · 진단 자료에 쓰지 않는다. `secrets.dat` 는 DPAPI 머신 범위로 암호화돼 그 PC 에서만 풀린다. PC 를 바꾸면 그 PC 에서 다시 만든다.\r\n- PLC 접속 주소 · 폴링 주기 · 워드 순서 같은 링크별 값은 설정 파일이 아니라 기준정보(`gt_link`)다.\r\n- 기동 때 설정 값 범위를 검사하고, 틀리면 기동을 멈추고 `logs\\startup.log` 에 사유를 남긴다. 허용 주소가 비어 있어도 기동을 멈춘다.\r\n2. 현장 설정 예(합천)\r\n\r\n첫 설치 현장의 값이다. 패키지 · 스크립트의 기본값이 아니다.\r\n\r\n| 곳 | 값 | 상태 |\r\n|---|---|---|\r\n| `-AllowIps` · `gw.api.allow-ips` | i-oneNet(망연계) 중계 장비 주소 | **[확인: ISS-03]** |\r\n| `gw.command.allowed-cmd-codes` | `[1, 2]`(기동 · 정지). 명령 대상은 매핑표에 동작 결과 영역이 있는 주배수펌프뿐 | 확정(요구사항정의서 v0.2 CMD-07) |\r\n| 기준정보 `gt_link` · `gt_site` | 대상 5개소(핫들 · 영창 · 미곡 · 질매 · 삼가 배수펌프장, 2026-10-16 확정, ISS-09), 개소마다 PLC 하나 · 사이트 하나. 첫 시험 현장 질매 | PLC 쪽 매핑표 · 개소 구성도 수령 뒤 |\r\n| 기준정보 `gt_fclt` | 도면 기준 개소마다 주배수펌프 3 · 지배수펌프 2 · 토출밸브 3 · 제진기 3 · 협잡물 컨베이어 2, 미곡만 수문(배수통문) 1 추가(요구사항정의서 v0.2 4.2). 실제 PLC 구성이 다르면 매핑표 · 기준정보로 맞춘다 | PLC 쪽 매핑표 · 개소 구성도 수령 뒤 |\r\n| 설치 PC · DB | 상황실 제어망 PC, 같은 PC 의 PostgreSQL | **[확인: ISS-03]** |\r\n\r\n## 기준정보\r\n\r\nPLC 담당 매핑표를 받으면 양식 채우기 → 검사 → 적재 SQL → 넣기 → 다시 읽기 → 상태 확인 순서로 넣는다. 뷰어 「기준정보 · 관리」 의 양식 적재는 검사부터 다시 읽기까지를 한 번에 한다. 양식 · 검사 · 시험 벡터 · 적재 SQL 규칙은 [PLC 연계 규격서](../3.2_SCADA연계설계/PLC연계규격서.md) 8.3절이다.\r\n\r\n1. 단계\r\n\r\n| 순서 | 하는 일 | 도구 |\r\n|--:|---|---|\r\n| 1 | 빈 양식(`양식\\기준정보_적재양식.xlsx`)에 연결 · 설비 · 경보코드 · 매핑표 · (결과코드) · 시험벡터 시트를 채운다. 예시 행은 지운다 | Excel |\r\n| 2 | 검사한다. 오류가 있으면 고치고 다시 한다 | `bin\\gw-map.cmd check 양식.xlsx` |\r\n| 3 | 적재 SQL 을 만든다. 시험 벡터가 통과한 사이트만 판(`gt_site.map_ver`)이 올라간다 | `bin\\gw-map.cmd sql 양식.xlsx 적재.sql --activate` |\r\n| 4 | `적재.sql` 머리 주석에서 사이트마다 \"판 올림\" 인지 확인한다 | 메모장 |\r\n| 5 | 넣는다(한 트랜잭션) | `psql -U gw_app -d dpms_gw -f 적재.sql` |\r\n| 6 | 기준정보를 다시 읽는다. 바뀐 링크만 끊었다 다시 연결하고, 바뀌지 않은 개소의 폴링은 끊기지 않는다. 끝나지 않은 명령이 있으면 다시 읽지 않으므로(409) 명령이 끝난 뒤 다시 한다 | 뷰어 「기준정보 · 관리」 [기준정보 다시 읽기] (`POST /viewer/api/reload`) |\r\n| 7 | `status` 에서 사이트마다 `links[].st = UP`, `gwMapVer = plcMapVer`, `missingRoles` 빈 목록을 확인한다 | DPMS 화면 또는 9절 |\r\n\r\n2. 뷰어로 넣기\r\n- 뷰어 「기준정보 · 관리」 에서 양식을 적재하면 검사 · SQL 만들기 · 넣기 · 다시 읽기(2 · 3 · 5 · 6)를 한 번에 한다(`POST /viewer/api/map/apply`, 판 올림은 선택, 적재 뒤 다시 읽기가 기본).\r\n- 명령이 진행 중이라 다시 읽지 못했으면 명령이 끝난 뒤 [기준정보 다시 읽기] 를 누른다. `psql` 로 직접 넣었을 때도 [기준정보 다시 읽기] 로 반영한다.\r\n- 게이트웨이 다시 시작(`restart=true` 또는 [다시 시작])은 설정 파일 · 비밀값을 바꿨을 때처럼 다시 읽기로 반영되지 않는 경우에만 한다.\r\n3. 판 관리\r\n- 양식 파일과 적재 SQL 은 판마다 남긴다(현장 설치 기록).\r\n- 다른 판의 매핑표 줄은 DB 에 그대로 남으므로 이전 판으로 되돌릴 때는 그 판의 양식으로 3 ~ 6 을 다시 한다(적재 뒤 기준정보 다시 읽기까지. PLC 의 판 번호도 그 판이어야 한다).\r\n- `--activate` 없이 만들면 판을 올리지 않는다(내용 확인용). 새 사이트를 판 올림 없이 넣으면 판 0 으로 들어가 수집 · 제어를 하지 않는다.\r\n\r\n## 서비스\r\n\r\n게이트웨이는 WinSW 서비스 `dpms-gw` 로 돈다. WinSW 가 없을 때만 예약 작업으로 대신한다. 운영 사건(링크 상태 · 명령 진행 · 경보)은 로그보다 피드(`gt_evt`)와 블랙박스가 정본이다.\r\n\r\n1. Windows 서비스(WinSW)\r\n\r\n`winsw\\dpms-gw.xml`(WinSW v2)이다. `%BASE%` 는 `winsw` 폴더다.\r\n\r\n| 항목 | 값 |\r\n|---|---|\r\n| 서비스 ID · 이름 | `dpms-gw` · DPMS 연계 게이트웨이 |\r\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\r\n| 환경변수 | `SPRING_PROFILES_ACTIVE=site`, `GW_LOG_DIR=\u003c설치 폴더>\\logs` |\r\n| 시작 | 자동(지연 시작) |\r\n| 실패 시 | 10초 → 30초 → 60초 뒤 다시 시작, 실패 횟수는 1시간 뒤 초기화 |\r\n| 정지 대기 | 20초 |\r\n| 서비스 래퍼 로그 | `logs\\service\\`, 크기 10MB 마다 돌리고 8개 보관 |\r\n| 실행 계정 | WinSW 기본(LocalSystem). `secrets.dat` 는 머신 범위라 계정에 묶이지 않는다 |\r\n\r\n2. 로그\r\n\r\n로그에는 비밀값을 남기지 않는다.\r\n\r\n| 파일 | 내용 | 보존 |\r\n|---|---|---|\r\n| `logs\\startup.log` | 기동 자가진단 결과. 기동 실패 사유가 첫 줄에 보인다 | 기동마다 덮어씀 |\r\n| `logs\\gateway.log` | 프로그램 로그(링크 상태 변화 · 명령 · 정리 결과 · 오류) | 날마다 `gateway.YYYY-MM-DD.log` 로 돌리고 30일 |\r\n| `logs\\service\\` | WinSW 래퍼 로그(표준 출력 · 오류) | 10MB × 8 |\r\n| `data\\blackbox\\` | 블랙박스(기록 B). 로그가 아니라 증거 기록이다 | 8절 |\r\n\r\n3. 예약 작업(WinSW 가 없을 때)\r\n\r\n패키지에 `winsw\\dpms-gw.exe` 가 없으면 install.ps1 이 Windows 예약 작업 `dpms-gw` 로 대신한다. 예약 작업은 비상용이다. 정지 · 재시작 관리가 서비스보다 약하므로 납품 패키지에는 WinSW 를 넣는다 **[확인: WinSW 실행 파일 반입]**.\r\n\r\n| 항목 | 값 |\r\n|---|---|\r\n| 트리거 | 시스템 시작 시 |\r\n| 계정 | `SYSTEM`, 가장 높은 권한 |\r\n| 실행 | `jre\\bin\\java.exe -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Dspring.profiles.active=site -jar dpms-gateway.jar`, 작업 폴더 = 설치 폴더 |\r\n| 실패 시 | 1분 간격으로 다시 시작(최대 999회), 실행 시간 제한 없음 |\r\n| 로그 | `logs\\`(작업 폴더 기준 기본값). 래퍼 로그는 없다 |\r\n\r\n## 갱신\r\n\r\n새 패키지를 풀고 `install.ps1` 을 같은 매개변수로 다시 돌린다. 설정 · 비밀값 · 키 저장소 · 데이터 · 로그는 그대로 두고 프로그램 파일만 바꾸며, 스키마는 기동 때 새 마이그레이션만 적용한다.\r\n\r\n| 작업 | 방법 |\r\n|---|---|\r\n| 갱신 | 새 패키지를 풀고 그 폴더에서 `install.ps1` 을 같은 매개변수로 다시 실행한다. 서비스를 멈추고, 직전 jar 를 `prev\\` 에 남기고, 프로그램 파일(`jre` · `bin` · `db` · `양식` · `winsw` · jar)을 바꾼다. `config\\application.yml` · `secrets.dat` · TLS 키 저장소 · `data` · `logs` 는 그대로 둔다. 서비스 설정을 갱신하고 다시 시작한다 |\r\n| 스키마 | 게이트웨이가 기동 때 Flyway 로 새 마이그레이션(`V00n__*.sql`)만 적용한다(적용된 것은 검증만). 스키마 적용에 실패하면 기동을 멈춘다 |\r\n\r\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\r\n**참고**\r\n\r\n- (문서)\r\n  - 글 출처: 게이트웨이운영설계서 앞 22k 자. 「갱신」 의 되돌리기 줄(「서비스 정」)에서 끊겨 그 뒤 줄과 8 ~ 10절이 없다\r\n  - 개정 2026-10-15 사경진 과장: TermFlow 표준 용어로 테이블 · 컬럼 이름 재설계 반영(3.4_설계_DPMS웹설계\\작업문서\\TermFlow재설계). 게이트웨이 DB 표 이름(`gt_*`)과 9절 조회 예의 칸 이름을 바꿈\r\n  - 개정 2026-10-16 사경진 과장: TermFlow 테이블 설계 가이드 적용(코드 컬럼 · 감사 컬럼 · 코드값). 보존 정리 표의 명령 상태 값을 새 값(`RJCT_GW` · `DLVR_UNKN`)으로, 9절 접속 기록 조회 예를 문자 코드 비교(`rpns_cd IN ('211', …)`)로 바꿈. 모든 게이트웨이 표에 표준 감사 컬럼이 붙었다\r\n  - 개정 2026-10-16 사경진 과장: 게이트웨이 뷰어(UI/UX 검토 UXR-G-17). 9절에 뷰어(`http://127.0.0.1:18444/viewer/`)로 보는 점검 항목 · 보안 경계를 더했다\r\n  - 개정 2026-10-16 사경진 과장: 뷰어 진단 번들(UXR-G-11). 9절 반출: 뷰어 개요 [진단 번들] zip 하나. 명령줄 `gw diag` 는 아직 구현 전\r\n  - 개정 2026-10-18 사경진 과장: 망 구간 담당 정정: 게이트웨이 설치 PC · OS · PostgreSQL 은 나산전기산업(망연계 장비 전까지의 네트워크 · 서버), i-oneNet 정책은 DID 외주(10절 #3). 근거 PLC 연계 요구사항정의서 v0.2 5장. 기준정보 운영 중 반영(다시 읽기 · 개소 사용 중지 · 기준정보 해시) 코드에 맞춤: 4.1 · 5절 반영 순서(6단계 다시 읽기), 9.1 기준정보 · 관리 화면 · 보안 경계\r\n  - 개정 2026-10-18 사경진 과장: PLC 연계 요구사항정의서 v0.2 의 명령 결과 두 단계 · 대상 개소에 맞춤: 4.1 설치 값에 결과 지연 표시 시간(`gw.command.result-pending-notice-sec`, 기본 600초), 4.2 허용 명령 확정(주배수펌프 기동 · 정지) · 설비 구성(도면 기준), 9.1 · 9.2 명령 점검 항목(접수 결과 · 동작 결과 · 지연 표시), 10절 #3 근거를 요구사항정의서 5장으로\r\n  - 개정 2026-10-19 사경진 과장: 2026-10-18 미결정 6건 확정: 4.1 설치 값에 접수 번호 상한(`gw.command.ack-give-up-sec`, 기본 30초), 9.1 명령 점검에 덮임 31(원값 없음) · 전달 불명이 생기는 경우 · `GW_LATE`\r\n  - 옛 장 번호: 개요 · 1 전제 · 2 패키지 · 3 설치 · 4 설정 · 5 기준정보 · 6 서비스 · 7 갱신. 개정 줄의 「4.1」 · 「4.2」 는 [설정](#설정) 1 · 2, 「5절」 은 [기준정보](#기준정보)다\r\n\u003c!-- /kmd:참고 -->\r\n"}]},{"name":"기록","kind":"기록(옛 held)","best":"없음(원본 그대로)","why":"네 안 모두 옛 기록을 다시 써서 P12 를 어겼다. 그나마 덜 어긴 것은 B 다. 옛 기록은 바꾸지 않는 것이 정답이고, 기록 서식은 새 기록에만 건다.","views":[{"k":"src","l":"원본","t":"---\nid: 2026-1109-패키지-1.0.0-후보판\ntitle: \"패키지 1.0.0 후보판: 갱신 자동 백업 · 되돌리기 · 블랙박스 검증 · 빌드 JDK 17 고정\"\ndate: 2026-11-09 13:02\nauthor: kjsa\ntouches:\n  - 설치절차:갱신되돌리기\n  - 납품:패키지\ntags:\n  - held\n---\n\n# 패키지 1.0.0 후보판: 갱신 자동 백업 · 되돌리기 · 블랙박스 검증 · 빌드 JDK 17 고정\n\n연계 게이트웨이 · DPMS 웹 패키지를 최신 코드 · Java 17 · 판 1.0.0 으로 다시 묶었다. DPMS 웹 갱신은 새 DB 스크립트 전에 자동 백업하고, 두 패키지에 rollback.ps1, 게이트웨이에 블랙박스 검증 명령을 넣었다.\n\n## 바뀐 것\n- 게이트웨이 패키지: dpms-gateway-0.1.0 (b0628ce) → dpms-gateway-1.0.0 (gw af0af86, JRE 17.0.9, db V001 ~ V005)\n- DPMS 웹 패키지: dpms-0.9-20261017 (JRE 21, db V001 ~ V014) → dpms-1.0.0-20261109 (bo 68e0efb, JRE 17.0.9, db V001 ~ V021)\n- DPMS 웹 갱신 백업: 손으로 pg_dump → install.ps1 이 새 V*.sql 적용 전 backup\\ 에 자동 pg_dump, 실패하면 적용하지 않음 (-NoBackup 으로만 뺌)\n- 되돌리기: 손으로 jar · war 복사 → 두 패키지 rollback.ps1 (DPMS 웹은 -DbBackup 이면 DB 도)\n- 블랙박스 검증: 없음 → bin\\gw-verify.cmd (dpms-gateway.jar verify, 종료 코드 0 · 1 · 2)\n- 빌드: JAVA_HOME 그대로 → dist\\jdk17.ps1 로 JDK 17 만, WinSW 없으면 빌드 멈춤\n- DPMS 웹 설치 인자: -MapPmtiles 추가 (DPMS_MAP_PMTILES)\n\n## 까닭\n- 지난 묶음이 JRE 21 로 묶였고 DPMS 웹은 DB 스크립트가 V014 까지라 최신 코드와 달랐다\n- 갱신 때 V014 처럼 되돌릴 수 없는 스크립트를 백업 없이 적용할 위험이 있었다\n- 게이트웨이 설계서 §8 · 운영설계서 10절 #6 이 약속한 블랙박스 검증 명령이 진입점에 이어지지 않았다\n- 패키지 단위 서비스 개발 TODO (8.3 작업문서) 진행, 사경진 과장\n\n## 버린 안\n- 갱신 백업을 설치 절차서 안내로만 두는 안: 현장 방문 작업에서 빠뜨리기 쉬워 스크립트가 하고 실패하면 멈추게 했다\n\n## 영향\n- 설치 리허설(관리자 권한 PC) · 내부 시험 서버 187 · 188 반영 · 72시간 구동 뒤 확정판을 다시 만든다\n- 백업 파일 보관 · 폐기는 발주처 협의 (SER-05)\n\n## 근거\n- dpms_docs 커밋 2dc9d4a (브랜치 docs/package-release)\n- dpms_gateway af0af86 (feat/package-release) · dpms_backoffice 68e0efb (feat/redesign-mockup)\n- 설치절차서 v0.9 · 운영절차서 v0.9 · 납품패키지목록 2026-11-09\n\n## 넣지 못함\n```json\n[\n {\n  \"doc\": \"docs/8.3_설치준비/설치절차서.md\",\n  \"heading\": \"7. 갱신 · 되돌리기\",\n  \"coord\": \"설치절차:갱신되돌리기\",\n  \"code\": \"values\",\n  \"why\": \"근거에 없는 값이 있다: C:\\\\dpms-gw\\\\rollback.ps1 · C:\\\\dpms-web\\\\rollback.ps1 · rollback.ps1-DbBackup\u003c백업파일>-PsqlPath\u003cpsql.exe>\",\n  \"base\": \"d9ca15dc6d092703\",\n  \"edits\": [\n   {\n    \"find\": \"서비스 정지 → `prev\\\\dpms-gateway.jar` 를 `C:\\\\dpms-gw\\\\` 로 복사 → 서비스 시작. DB 스키마는 되돌아가지 않는다(마이그레이션은 추가만, 게이트웨이 운영 설계서 7절) |\",\n    \"replace\": \"관리자 PowerShell 에서 `C:\\\\dpms-gw\\\\rollback.ps1` (서비스 · 예약 작업 정지 → `prev\\\\dpms-gateway.jar` 복원 → 시작). DB 스키마는 되돌아가지 않는다(마이그레이션은 추가만, 옛 jar 는 앞선 판 스크립트를 무시한다. 게이트웨이 운영 설계서 7절) |\"\n   },\n   {\n    \"find\": \"새 `V*.sql` 만 적용되고 직전 war 는 `prev\\\\`. GDI 판에서 처음 올릴 때는 먼저 7.1 | `Stop-Service dpms-web` → `prev\\\\dpms.war` 를 `C:\\\\dpms-web\\\\dpms.war` 로 복사 → `Start-Service dpms-web`. 적용된 DB 스크립트는 되돌아가지 않는다(V014 를 넘는 되돌리기는 7.1) |\",\n    \"replace\": \"새 `V*.sql` 만 적용되고 직전 war 는 `prev\\\\`. 새 스크립트가 있으면 적용 전에 `pg_dump` 로 `backup\\\\` 에 DB 백업을 만든다(백업이 안 되면 적용하지 않고 멈춘다. 빼려면 `-NoBackup`). GDI 판에서 처음 올릴 때는 먼저 7.1 | 관리자 PowerShell 에서 `C:\\\\dpms-web\\\\rollback.ps1` (직전 war). 새 DB 스크립트가 옛 war 와 맞지 않으면 `rollback.ps1 -DbBackup \u003c백업 파일> -PsqlPath \u003cpsql.exe>` 로 DB 도 백업 시점으로 되돌린다(백업 뒤 쌓인 기록은 잃는다) |\"\n   },\n   {\n    \"find\": \"- `prev\\\\` 에는 바로 앞 판 하나만 남는다.\",\n    \"replace\": \"- `prev\\\\` 에는 바로 앞 판 하나만 남는다. `backup\\\\` 의 DB 백업은 지우지 않으므로 보관 · 폐기를 정한다 **[협의: SER-05]**.\\n- 블랙박스 검증: 게이트웨이 PC 에서 `C:\\\\dpms-gw\\\\bin\\\\gw-verify.cmd [--from YYYY-MM-DD] [--to YYYY-MM-DD]`. 종료 코드 0 이상 없음 · 1 문제 · 2 인자 오류. 서비스를 멈추지 않아도 된다.\"\n   },\n   {\n    \"find\": \"서비스를 멈추고 1 의 백업으로 DB 를 되살린 뒤(`pg_restore`) `prev\\\\dpms.war` 를 복사한다.\",\n    \"replace\": \"`rollback.ps1 -DbBackup \u003c1 의 백업> -PsqlPath \u003cpsql.exe>` 로 DB 와 war 를 함께 되돌린다.\"\n   }\n  ]\n },\n {\n  \"doc\": \"docs/10.3_납품/납품패키지목록.md\",\n  \"heading\": \"1. 패키지\",\n  \"coord\": \"납품:패키지\",\n  \"code\": \"values\",\n  \"why\": \"근거에 없는 값이 있다: dpms-gateway-1.0.0.zip · 78.6MB · 3B4EBB15A4D553FA097C74E46415CA7511B9C64B7EBE23FC2E6669982AF09CBE\",\n  \"base\": \"71aafc916473f70c\",\n  \"edits\": [\n   {\n    \"find\": \"| 연계 게이트웨이 | `dpms-gateway-0.1.0.zip` | 76.8 MB | `9C228746673A7BD280761822B3157202AB393D86E4E240CC4DBDCD6BA89619C1` | dpms_gateway 커밋 b0628ce |\\n| DPMS 웹 (재개발 판, 시험 묶음) | `dpms-0.9-20261017.zip` | 88.9 MB | `E1FF87FDAB572956F6BBC7C23EB42F119DDCDE81341F329918C52506C2167523` | dpms_backoffice 8936fc3 커밋 직전 작업 트리 (2026-10-17 01:43 빌드). 묶음 안 `VERSION.txt` 의 커밋은 그때 HEAD 인 742f26d 로 적혀 있다. **납품판은 8936fc3 에서 다시 만든다** |\\n| DPMS 웹 (이전, GDI 판) | `dpms-0.9-20261015.zip` | 115.2 MB | `B4A94944D733DA9FECA33678640F29D82411825B9FC6AF0430A44F9A30B358E9` | dpms_backoffice 커밋 b65591a. 재개발 판으로 대체, 납품하지 않는다 |\",\n    \"replace\": \"| 연계 게이트웨이 | `dpms-gateway-1.0.0.zip` | 78.6 MB | `3B4EBB15A4D553FA097C74E46415CA7511B9C64B7EBE23FC2E6669982AF09CBE` | dpms_gateway af0af86 (2026-11-09 빌드, 후보판) |\\n| DPMS 웹 | `dpms-1.0.0-20261109.zip` | 89.7 MB | `82C18EE5B1658FD725634A67C7B81ED4824A1966AB99038D0F80444C57F240DB` | dpms_backoffice 68e0efb (2026-11-09 빌드, 후보판) |\\n| (이전) 연계 게이트웨이 | `dpms-gateway-0.1.0.zip` | 76.8 MB | `9C228746673A7BD280761822B3157202AB393D86E4E240CC4DBDCD6BA89619C1` | dpms_gateway b0628ce. 1.0.0 으로 대체 |\\n| (이전) DPMS 웹 재개발 시험 묶음 · GDI 판 | `dpms-0.9-20261017.zip` · `dpms-0.9-20261015.zip` | 88.9 · 115.2 MB | | 1.0.0 으로 대체, 납품하지 않는다 |\"\n   },\n   {\n    \"find\": \"두 패키지 모두 전용 Java 런타임과 Windows 서비스 등록(WinSW 2.12.0)을 담는다. 게이트웨이는 Java 17(17.0.9)이다. DPMS 웹 시험 묶음 `dpms-0.9-20261017` 의 런타임은 빌드 PC 의 `JAVA_HOME` 을 따라 Java 21 로 만들어졌다(`VERSION.txt` `JAVA_VERSION=\\\"21\\\"`). 납품판은 Java 17 JDK 로 다시 만든다 **[확인]**. 패키지 안 `checksums.txt` 로 파일마다 확인한다.\",\n    \"replace\": \"두 패키지 모두 전
