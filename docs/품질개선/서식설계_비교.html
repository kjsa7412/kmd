가 시 지연 가능.\n\n## 2022-08-11 요구사항 수집\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-08-10 11:00. 장소: 나라기업 김해 오피스. 진행자: 대리 박재성. 참석자: 나라기업 김지현, 세정아이앤씨 박재성.\n\n1. 요구사항 수집\n- 요구사항 정의서(NRC_AN_110_요구사항정의서) 기반으로 수집.\n\n2. AS-IS 시스템 분석 이슈\n- 구축·유지보수 업체에서 AS-IS 시스템에 접속하여 소스코드 분석 시 계약위반 가능성 통보됨.\n\n3. 나라기업 측 실행 항목\n- 차세대 시스템 플랫폼(Windows Application) 도입 검토.\n- 개별 관리 데이터 반영 및 점검이지 월 관리를 위한 업무 프로세스 내부 협의.\n- 더존 연계 모듈 전달.\n- 서버/DB 접속 정보 전달.\n- 네트워크 구성도 또는 네트워크 구성 정보 전달.\n\n4. 세정아이앤씨 측 실행 항목\n- 요구사항 수용 여부 검토.\n- API 연계 가능 여부 기술적 검토.\n\n## 2022-08-12 요구사항 수집 분석\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-08-12 10:00. 장소: 나라기업 김해 오피스. 진행자: 대리 박재성. 참석자: 나라기업 김지현, 세정아이앤씨 박재성.\n\n1. 요구사항 수집\n- 요구사항 정의서(NRC_AN_110_요구사항정의서) 기반으로 수집.\n\n2. 나라기업 측 실행 항목\n1) 인프라 정보\n- 네트워크 구성 정보 전달.\n- DB 접속 정보 전달.\n2) 샘플 파일 전달\n- 배치신고 샘플 파일.\n- 전사업소 자격증 소지 현황 파일.\n- 업별선임현황 파일.\n3) 인터페이스 연계\n- 더존 연계 모듈 전달.\n4) 플랫폼·프로그램 설계 및 검토\n- 차세대 시스템 플랫폼(Windows Application) 도입.\n- 실무진과 업무 프로세스 내부 협의: 공사사진대장 프로그램 사용 여부, 감리 관리 프로그램 신규 개발, 설계 관리 프로그램 신규 개발, 알림톡 발송 프로세스 재정립(조회 기능 등) 및 통합 작업, 업무보고 모듈, 소방안전관리입금현황 삭제 여부.\n\n3. 세정아이앤씨 측 실행 항목\n- 요구사항 수용 여부 검토.\n- API 연계 가능 여부 검토.\n- 메일 발송 기능 검토.\n\n## 2022-08-18 AS-IS 시스템 분석\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-08-19 15:00. 장소: 나라기업 김해 오피스. 진행자: 대리 박재성. 참석자: 나라기업 김지현, 세정아이앤씨 박재성.\n\n1. 시스템 분석 결과\n1.1. 거래처·건축물\n- 거래처 단위 관리 사용 안 함. 건축물 단위로 관리.\n1.2. 메일 발송\n- 메일 발송 기능 구현 시 한비로 이용.\n1.3. 긴급출동\n- 긴급출동은 모바일로만 생성.\n- 출동 후 계약(공사/자재) 생성하여 대금 지급.\n- 차세대 시스템에서 긴급출동 후 나라119 시스템에 접속하여 결재 상신 진행.\n1.4. 계약 구분\n\n| 계약 구분 | 내용 |\n|---|---|\n| 소방안전관리 | 매월 진행하는 월 관리(1회) / 종합정밀점검·작동기능점검 포함 가능 |\n| 일반 | 법정 점검 계약. 종합정밀점검·작동기능점검 용도 |\n| 공사(자재) | 도소매 자재 판매(업무 없음) / 긴급출동 대금지급 용도로 생성 가능 |\n| 감리·소방설계·소방방염 | 업무 없음 |\n| 소방공사 | 소방시설공사. 공사 모듈 사용. 일반적으로 대금지급 자금 1개 생성 후 익월 지급. 공사의뢰서는 소방공사에만 적용 |\n| 전기공사 | 업무 없음 / 소방공사와 업무 프로세스 유사하나 수기 처리 중 |\n| A/S | 소방공사 A/S. 계약금 0원으로 생성. 공사 모듈 사용 |\n| 위험물안전관리대행 | 매월 2~4회 진행하는 월 관리. AS-IS 시스템에서 일지 미사용 |\n\n1.5. 결재\n- 결재 협조 사용 안 함. 통보로 대체.\n- 전결 기능 사용 안 함.\n1.6. 공사\n- 공사 일보는 현재 원활히 사용되지 않음(사용자 이용 어려움, 데이터 누락).\n- 모바일 기능 삭제 검토 중.\n1.7. 의사소통 관리\n- 업무보고: 매주 목요일 진행. WBS 및 업무보고 문서로 보고 대체.\n\n## 2022-08-24 회계팀 실무진 인터뷰\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-08-24 11:00. 장소: 나라기업 창원 오피스. 진행자: 대리 박재성. 참석자: 나라기업 송미정·김지윤·김지현, 세정아이앤씨 박재성.\n\n1. 회계 업무 분석\n1.1. 자금관리 일업무\n1) 매일 오전 통장 입출금 내역 은행에서 다운로드(기초자료).\n2) 나라119 시스템에 입출금 내역 입력(대금/기타).\n3) 자금일보 출력.\n4) 엑셀 청구방 입력(수기 관리).\n5) 더존 위하고 입력. 입력 시 금액 크로스 확인.\n6) 더존 거래처원장으로 계산서 발행 및 입금 유무 확인.\n7) 미수 독촉, 미수 현황 업로드.\n1.2. 계약 관련 업무\n1) 계약 접수.\n2) 청구서류 전달.\n3) 더존 세금계산서 입력 준비.\n1.3. 보고\n- 일일업무보고: 자금일보 출력.\n- 주업무보고: 주간수입현황 출력 + 별도 엑셀 수기 작업(시스템은 금액 맞추고 복사 용도로 사용).\n1.4. 미사용 기능\n- 기타입출금관리(현황출력·기안생성·자동생성) 사용 안 함. 기안지 별도 양식 사용.\n- 미수현황 사용 안 함. 별도 팀별 관리 엑셀 이용(조회 어려움).\n- 회계팀에서 월방 생성으로 자금 생성.\n\n2. 운영지원 업무 분석\n1) 단발성으로 계약서 접수 후 업무 처리.\n2) 대상처 발굴(현장) → 견적(수기) → 계약초안작성(수기) → 계약체결(현장팀) → 건축물 대장 생성 → 계약 생성 → 자금 생성.\n- TO-BE: 계약 관련 업무보고 생성 요청. AS-IS: 지원팀 업무보고 없음.\n- TO-BE: 선임현황 관리 시스템 구현 요청. AS-IS: 선임현황 엑셀 수기 관리.\n- 현장팀 의뢰서 작성 → 지원팀 의뢰서 기반 계약 생성 → 공사팀 공사 후 공사정산서 생성.\n\n3. 개선 요청 사항\n- 입출금관리 입력 UI 개선.\n- 미수금 조회 항목·조회 조건 변경.\n- 미수금 리포트: 대상처별 계약구분·월·금액·미납 총계 출력.\n- 악성 미수 포털 추가 여부 검토.\n- 신규 대상처 관리 방안 검토(현재 별도 입금현황 엑셀 관리).\n- SR 관리: 대상처 메모·미수 메모·구분값·비고 등 메모 추가.\n- 마감 추가로 시스템 통제 및 데이터 신뢰성 확보.\n- 기타입출금 고정 지출 복사 또는 템플릿화.\n- 팀별(파이어팀) 정산 기능(고정지출·교통비 등).\n\n## 2022-08-26 점검 소방안전관리팀 실무진 인터뷰\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-08-26 09:00. 장소: 나라기업 부산 오피스. 진행자: 대리 박재성. 참석자: 나라기업 김종우·정희용·김지현, 세정아이앤씨 박재성.\n\n1. 업무 분석\n- 배치 신고·자체 신고: 목적은 월별 점검 현황 보고 용도.\n- 의뢰 대장: 발주난 것만 입력(AS-IS).\n- 일일업무일지 보고: 한비로 진행.\n- 회계팀 입금 등록 시 한번에 입금된 금액 나눠서 등록.\n- 청구방: 청구를 위해 만든 엑셀 양식.\n\n2. 개선 요청 사항\n2.1. 담당자 관리\n- 건축물 담당자가 여러 담당을 겸직하는 경우가 많으므로 겸직 담당 체크 형태로 변경.\n2.2. 신고\n- 자체신고·배치신고 프로그램 통합.\n- 배치신고 시 유효한 관리사만 나오도록 변경. 자체신고 시 관리사 없음.\n- 배치신고 월별 점검 현황 출력 시 정렬 순서 공문번호대로 수정.\n2.3. 출력물\n- 공사의뢰대장 출력물 양식 변경(점검팀 수기 양식 참조).\n- 견적대장 출력 시 견적 대비 공사의뢰 출력물 검토(점검팀 수기 양식 참조).\n- 년보고 출력물(점검팀 수기 양식 참조).\n- 긴급출동 보고서 출력 시 대표님 제외 결재 완료 후 출력.\n- 월보고 진행 시 갑지에 결재 넣고 각각 보고서에서 결재 제거 방안 검토.\n- 프로그램에서 내용·사진 편집 가능하도록 수정.\n- 연락처 수정 가능하도록 요청.\n- 요청자·확인자 동일 버튼으로 자동완성 기능 제공.\n- 월관리 월보고 출력물 셀 밀림 오류 수정 및 양식 수정(점검팀 수기 양식 참조, 사업소 간 검토 후 피드백).\n- 종합정밀점검 리포트 점검 일자를 배치 일자 기간으로 변경.\n- 공문번호 순서 바뀌는 오류 수정.\n- 금액 0원 대신 문구 또는 `-` 기호로 대체.\n2.4. 소방안전관리 관리 일지\n- 종합·작동 체크 시 다음 달까지 계속 나오는 문제를 단발성으로 수정.\n2.5. 계약 업로드 파일\n- 지적·점검 보고서를 배치신고 또는 점검 쪽으로 분리.\n2.6. 알림톡\n- 월별 발송 현황 내역 화면 추가.\n- 알림톡 템플릿 시스템관리자가 관리하도록 구현.\n2.7. 모바일\n- 모바일 자동로그인 검토.\n- 점검사진대장 시스템에서 수정 기능 추가(AS-IS: 모바일에서만 가능).\n2.8. 기타\n- 일반 대상처 점검 목록 시스템에서 출력 가능하도록 요청.\n- 계약 만료 안내 추가(월관리는 1달 전, 일반적으로 1년 계약).\n- 점검팀 월업무보고 시스템 추가(AS-IS: 기능 없음).\n- 주간업무일지(주간업무보고) 시스템 추가(AS-IS: 기능 없음).\n- 자산관리대장·자재대장 시스템 추가(한비로 기능 사용 검토).\n- 마감 기능 추가로 시스템 통제.\n- 리포트 사진 표출 시 해당 셀에 가득 차게 나오도록.\n- 파일 관리 삭제 검토. 사용 중인 자격증 파일은 별도 프로그램에서 업로드 기능 추가.\n- 파일 관리 시스템 삭제 후 나스 이용 또는 별도 관리.\n\n3. 공사 의뢰 프로세스(재정립)\n견적(전체) → 공사의뢰서(전체) → 접수(지원팀) → 검토(지원팀) → 계약(지원팀) → 자금 생성(지원팀) → 공사 접수(공무팀) → 공사진행·완료(공사팀) → 정산서 작성(공무팀) → 완료 확인(회계팀) → 청구(회계팀).\n\n4. 전체 일일 업무 데일리 리포트 기능 추가(계약·점검·공사·자금 등).\n\n5. WBS 일정 조정\n\n| 태스크 | 변경 시작일 | 변경 종료일 |\n|---|---|---|\n| 1.1.4.2.1 설계보고 | 2022-09-16 | 2022-09-23 |\n| 2.1.1.3.0 TO-BE 프로세스 정의 | 2022-08-19 | 2022-09-10 |\n| 3.1.1.2.1 나라119 화면설계 | 2022-08-25 | 2022-09-16 |\n| 3.1.1.2.2 현장지원 화면설계 | 2022-08-25 | 2022-09-16 |\n| 3.1.1.3.1 나라119 디자인 시안 작성 | 2022-08-25 | 2022-09-16 |\n| 3.1.1.3.2 현장지원 디자인 시안 작성 | 2022-08-25 | 2022-09-16 |\n| 3.1.1.3.3 디자인 가이드 | 2022-08-25 | 2022-09-16 |\n| 3.2.1.2.0 시스템 인터페이스 설계 | 2022-08-11 | 2022-09-10 |\n\n- 태스크 변경: `3.2.2.1.0 ERD 설계` → `3.2.2.1.0 데이터이관 설계`.\n- 태스크 추가: `4.4.1.1.0 서버설치/VM구성` (2022-10-01 ~ 2022-10-18).\n\n## 2022-08-30 공무팀 실무진 인터뷰\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-08-30 10:00. 장소: 나라기업 김해 오피스. 진행자: 대리 박재성. 참석자: 나라기업 전성진·김지현, 세정아이앤씨 박재성·사경진.\n\n1. 공무팀 업무 분석\n1.1. 보고 체계\n- 공사 진행 사항·소요·인원 등을 주 단위 보고.\n- 모든 직원 업무를 일 단위 보고.\n1.2. 작업 방식\n- 나라119가 업무 프로세스 전체를 커버하지 못함. 엑셀 작업 다수 존재.\n- 중복 작업 다수 존재.\n- 공사의뢰서·정산서·월보고 위주로 사용. 나머지 기능 사용 안 함.\n- 착공이사: 고도화에서 진행.\n1.3. 단발성 업무\n- 건축물 등록이 용이하지 않아 공무팀에서 처리 중.\n- 단발성 공사 의뢰 → 공무팀에서 계약서 작성. 단발성은 보통 의뢰 발생 달에 계약 진행.\n- 9월 공사가 10월로 변경되면 10월에 정산서를 만들기 때문에 계약도 10월로 이동.\n1.4. 중도금 청구\n- 장기 공사는 중간 정산 프로세스 존재. 시스템 상 정산 진행 시 회계팀에서 공사가 끝난 것으로 알고 청구 진행.\n- 중도금 정산은 공무팀에서 별도 진행.\n1.5. 정산·청구\n- 공무팀: 정산서·청구서 작성.\n- 회계팀: 청구(계산서 발행).\n1.6. 일용직\n- 일용직 엑셀로 관리.\n- 출근·퇴근은 현장에서 이루어짐.\n1.7. 임시 일정 관리\n- 공사 진행 예정 정보를 공사팀·점검팀에 공유.\n- 확정되지 않은 임시 일정은 엑셀로 관리. 시스템에 올리면 공사팀·점검팀이 확정일자로 인식하는 문제 존재.\n1.8. 산출물\n- 점검팀·월방팀: 일정표.\n- 공무팀: 엑셀 자료.\n- 일정 관리 및 현황: 나라119가 아닌 그룹웨어 이용.\n1.9. 정산\n- 엑셀 데이터 기반 월 정산 진행. 지사별·팀별 정산 따로 진행되어야 하나 시스템에서 미지원.\n- 특정 사업소 공사에 다른 사업소 직원 투입 시 해당 공사를 관리하는 사업소에서 모든 비용 지불.\n- 중간 정산 완료된 것과 중간 정산 중인 것이 같이 표시됨. 공사 완료 정산서만 표시되어야 함.\n- 공사가 끝나지 않은 상태에서 정산서 작성 불가 처리 필요.\n\n2. 개발 우선순위\n- 공사팀 프로세스가 가장 혼잡. 필요에 따라 우선순위 조정 가능.\n- 점검·월방 이후 공사를 넣는 방향으로 진행.\n\n3. 모바일(현장지원)\n- 공사 모듈 사용 안 함.\n- 모바일 사용 대상 연령이 높음.\n- 더존 연동 여부 결정 필요.\n\n4. 인건비\n- 사원 인건비는 직급에 따라 결정.\n- 공통 코드에 인건비 정의 및 수정 관리 진행.\n\n5. 엑셀 속성\n\n| 속성 | 설명 |\n|---|---|\n| 기한일 | 공사완료 요청일(제외 검토) |\n| 접수일 | 공사의뢰 접수일. 의뢰서 등록일 |\n| 시공자 | 텍스트. 내외부 관리 필요 |\n| 완료일 | 공사최종완료일 |\n| 정산월 | 공사 끝나고 정산서를 작성한 달(공무팀 정산 월) |\n\n6. 출력물\n- 사용: 공사정산서·공사의뢰서·월별공사현황·연별공사현황(회계팀).\n- 미사용: 자료전송 기능.\n\n7. TO-BE 제안\n- 중간 정산 프로세스 추가.\n- 접수 및 청구 여부 등 상태값 정의.\n- 공사 일정 변경 프로세스: 계약 변경 후 완료 일자 변경. 공사 완료 일자 변경 시 회계팀에서 먼저 계약 변경 필요.\n- 사업소 단위로 사용자 접근 권한 부여.\n- 직급 공통 코드에 노무비 속성 추가. 내부이면 직급별 노무비 자동완성.\n- 건축물 도면 관리 기능 강화(별도 프로그램 추가·누락 필터).\n- 정산서 생성 시 경비·사무실경비는 계약금의 5%로 자동 생성. 공무회계 노무비는 계약금의 5%로 추가 생성(정렬 순서 제일 아래).\n- 설계·감리 기록부 추가: 착공일·완공일·시공사·설계사(전화번호 포함)·감리원(전화번호 포함)·소방시설현황(텍스트)·첨부파일. 감리원·설계사는 계약 구분에 따라 내부·외부 자격증 선임자만 표시.\n\n## 2022-09-05 프로그램 개발 목록 정의\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-09-05 09:00. 장소: 나라기업 김해 오피스. 진행자: 대리 박재성. 참석자: 나라기업 김지현, 세정아이앤씨 박재성·사경진.\n\n1. 모바일 기능\n1.1. 점검 대상\n- 해당 월에 점검이 완료된 대상은 리스트에서 제외.\n- 점검 대상은 월 관리에 대한 것. 작동과 종합은 점검표 불필요. 사진대장만 사용.\n1.2. 점검표 작성\n- 마지막 작성한 점검표 불러오기 기능(불러오기 버튼 추가) 제안.\n- 입력 편의성을 위해 select에서 radio로 변경.\n1.3. 위험물 관리 대상\n- 월 2회 또는 4회 속성 추가.\n- 점검 대상의 점검 현황 확인 정보 추가(예: `1/2`, `1/4`).\n- 항목을 계약 기준으로 표시. 계약·주소·일자 등 점검 대상과 동일 구성.\n1.4. 위험물 관리 대상 점검표 작성\n- 수기 작성 양식 기반 구성.\n- 수정·삭제·사진·서명 기능 포함.\n1.5. 사진 업로드\n- 세로로 뒤집혀서 업로드 되는 문제 존재.\n- 사진 등록 시 손가락으로 특정 지점 지정해서 사진 촬영.\n- 편집 기능은 고도화에서 고려.\n1.6. 건축물 이력\n- 기본정보에 미수금 정보 추가.\n- 전화번호 클릭 시 전화 기능 추가.\n\n2. 백오피스 기능\n2.1. 내부 정산\n- 변경 프로세스: 특정 팀에서 공사의뢰서 작성·공사 진행·정산서까지 작성(팀별 정산 누적).\n- 팀 단위 기준으로 사업소를 구분으로 처리.\n2.2. 더존\n- 데이터 조회 가능. 조작 불가능.\n- 더존에서 Excel Export 후 양식 그대로 업로드.\n2.3. 코드·권한\n- 사업소 환경 설정 공통 코드 화면 추가(부서·소방 등).\n- 현재 권한 관리 기능이 있으나 사용하기 어려움. 한 화면에서 권한 관리 기능 제공.\n- 프로그램 권한은 사업소 권한.\n- 사원의 사업소 접근 권한. 중복 사업소 소속 허용.\n- 팀 단위 권한 부여.\n2.4. 데이터 이관\n- 없는 속성들은 임의로 지정.\n- 의뢰서·정산서·계약·자금 등 1:1 형태로 연결. 정산서가 2개인 중복 데이터는 이관 제외.\n- 지급 기한 속성 추가 시 생성일자 기준으로 추가 데이터 생성.\n- 백업 데이터·법정동 데이터 이관 제외.\n2.5. 알림톡\n- 발송과 내역으로 구분.\n- 조회·출력·미리보기 기능 포함.\n2.6. 사원 관리\n- 팀장 여부 추가.\n- 승인된 리포트 출력 시 승인한 팀장 정보 포함.\n- 감리·설계·점검 여부 추가하여 권한 획득.\n2.7. 미수 관리\n- 지급 기한으로 악성 미수 관리.\n- 자금에 지급 기한 속성 추가(회계팀 확인 필요).\n2.8. 데일리 리포트\n- 보고용 화면 추가. 오늘 기준 화면 및 일자 선택 기능.\n2.9. 기타\n- 월 관리팀 여부 속성 추가(예: 점검팀 여부·공사팀 여부).\n- 출력물에 출력한 사원 이름 출력.\n- 선임 현황 관리는 제공받은 엑셀 양식과 UI가 다르게 표현될 수 있음.\n- 시스템접속관리 추가.\n- 견적서 엑셀 양식 발송 기능 추가 여부 검토(점검·월관리).\n\n## 2022-09-16 회계팀 업무 협의\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-09-16 10:00. 장소: 나라기업 창원 오피스. 진행자: 대리 박재성. 참석자: 나라기업 김지현·김지윤·송미정, 세정아이앤씨 박재성·사경진.\n\n1. 미수 관리\n- 자금 생성 시 기한에 따른 미수 여부 체크. 대금지급기한 속성 추가.\n- 계약에 따른 기본 기한 설정(예: 2~3개월). 변경 가능.\n\n2. 마감\n- 월 기준·사업소별 마감.\n- 사업소별로 담당자가 나뉘어 있어 전체 마감 불가.\n- 금액 확인 후 마감 진행. 해당 달 마감 후 수정 불가. 필요에 따라 해제 처리.\n\n3. 화면 설계\n3.1. 계좌 관리\n- 계좌 비고 항목 추가(대출 기한·갱신 등).\n- 대표 계좌 추가. 자금 관리 시 설정한 대표 계좌 사용. 사업소당 1개 설정.\n- 대표 계좌 상단 정렬. 은행명 가나다 순 정렬.\n3.2. 기타 입출금\n- 지출 구분 설정 후 기안지 출력.\n- 지출 구분 설정 관리 기능 제공(기존 코드 변경 불가).\n3.3. 리포트\n- 리포트 항목 변경이 빈번. 유비 리포트 고려. 사용자 직접 수정 가능 여부 검토.\n\n4. 더존 연계\n- 현행: 나라119 은행에서 기초 데이터 추출 → 엑셀 정리(이름-거래처 연동) → 나라119 접속 후 건별 등록. 더존 통장을 기준으로 기초 데이터 가져옴.\n- 하나의 사업자가 다수의 건물 소유·다수의 계약 체결 시, 한번 입금된 금액을 팀별로 분할하여 나라119에서 쪼개서 입력.\n- 결론: 현행 유지.\n- 거래처 기준 변경에 대한 결정 필요.\n\n## 2022-10-12 업무 협의\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-10-12 10:00. 장소: 나라기업 김해소방. 진행자: 대리 박재성. 참석자: 나라기업 김지현, 세정아이앤씨 박재성·사경진.\n\n1. 출력물 검토\n- 소방 안전 관리 선임 신고서 파일 수신 완료 후 진행.\n\n2. 기타입출금관리\n- 기안서 거래처(매입처) 추가 후 진행.\n\n3. 첨부파일\n- 파일 받아서 테스트 진행.\n\n4. 거래처 관리\n- 거래처 관리 프로그램 추가 개발(관리 모듈).\n\n5. 서버 설치\n- 10월 3째주 진행.\n\n6. 중간보고\n- 주간 보고 취합 자료로 진행.\n\n7. 추후 검토 항목\n- CRM.\n- 업무보고 메뉴.\n\n## 2022-12-23 전개 및 안정화\n\u003c!-- applied: 2026-1111-바탕-세움-24 -->\n프로젝트명: 차세대 나라119정보시스템. 일시: 2022-12-23 10:00. 장소: 나라기업 김해소방. 진행자: 대리 박재성. 참석자: 나라기업 김지현, 세정아이앤씨 박재성·사경진.\n\n1. 전개 일정\n- 2022-12-26(월) 오전 데이터 이관 진행.\n- 2022-12-26(월) 사용 시작(테스트 및 운영).\n\n2. 수정 요청 사항\n- 요구사항 정의서 기반 변화 관리 진행.\n- 데이터 이관 요청 시 추가 작업 진행.\n\n3. 테스트 및 검수\n- 테스트 계획서 전달 후 결과서 회신.\n\n4. 요구사항 정의서 반영 사항\n- 토지대장 조회 팝업 추가.\n- 견적서 리포트(세부사항 추가 반영).\n- 견적서 세부사항 엔티티 추가.\n- 견적서 속성: 순번·내용·규격·수량·단위·단가·비고(텍스트).\n- 견적일: 견적일자. 담당자: 건물 담당자. 공급대가: 견적금액 부가세별도(체크 여부).\n- 레포트 비고 예시: 1. 견적서 외 추가부분 별도 비용 발생. 4. 용역 시 발생하는 폐기물처리 비용 포함.\n\n5. 기타\n- 월별기초금액 없는 경우 0원으로 데이터 생성.\n- 부산팀 점검 양식 전달(2022-12-27까지 개발 진행).\n- 창원 방화벽 문제로 인한 접속 불가 오류: 업체 확인 요청.\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- 2022-08-03 분석 설계 사전 미팅\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-08-11 요구사항 수집\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-08-12 요구사항 수집 분석\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-08-18 AS-IS 시스템 분석\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-08-24 회계팀 실무진 인터뷰\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-08-26 점검 소방안전관리팀 실무진 인터뷰\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-08-30 공무팀 실무진 인터뷰\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-09-05 프로그램 개발 목록 정의\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-09-16 회계팀 업무 협의\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-10-12 업무 협의\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n- 2022-12-23 전개 및 안정화\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-24.md)\n\u003c!-- /kmd:참고 -->\n"},{"k":"A","l":"안 A 작성기준 확장","t":"# 회의록\n\n차세대 나라119정보시스템 구축 사업의 회의를 회의 한 번에 항목 하나로 적는다. 항목마다 정한 것과 남은 것(맡은 이 · 기한)을 앞에 두고, 긴 회의는 다룬 것을 주제 덩이로 뒤에 둔다.\n\n## 2022-08-30 실무자 인터뷰\n\n공무팀 실무자를 인터뷰해 AS-IS 업무와 TO-BE 요구를 모았고, 개발 순서는 점검 · 월방 다음에 공사를 넣는 방향으로 잡았다.\n\n- **때 · 곳**: 2022-08-30 10:00 · 나라기업 김해 오피스\n- **누가**: 나라기업 전성진 · 김지현, 세정아이앤씨 박재성 · 사경진 (진행 · 작성: 대리 박재성)\n- **안건**: 업무 분석 및 요구사항 수집\n- **정한 것**:\n* 개발은 점검 · 월방 다음에 공사를 넣는 방향으로 한다. 공사팀 프로세스가 가장 혼잡해 필요하면 우선순위를 조정한다.\n- **남은 것**:\n* 김지현: 수기 관리 엑셀 파일 전달(공사의뢰서 관리 · 월단위보고 · 소방시설기록부) · 기한 -\n* 김지현: 자금일보의 금액 속성 가운데 대체금액 항목 확인 · 기한 -\n* -: 더존 연동 결정 · 기한 -\n\n1. 공무팀 업무 분석\n1.1. 보고\n- 공사 진행사항 · 소요 · 인원을 주 단위로 보고한다.\n- 모든 직원의 업무를 일 단위로 보고한다.\n1.2. 작업 방식\n- 나라119 가 업무 프로세스 전체를 덮지 못해 엑셀 작업이 많고 중복 작업도 많다.\n- 공사의뢰서 · 정산서 · 월보고를 주로 쓰고 나머지 기능은 쓰지 않는다.\n- 착공이사 고도화에서 진행한다.\n1.3. 단발성 업무\n- 건축물 등록이 쉽지 않다. 경영지원팀이 등록하면 효율이 떨어져 공무팀이 처리하고 있다.\n- 단발성 공사 의뢰가 오면 공무팀이 계약서를 쓴다. 계약은 보통 의뢰가 생긴 달에 한다.\n- 9월 공사가 10월로 바뀌면 정산서를 10월에 만들기 때문에 계약도 10월로 옮긴다.\n1.4. 중도금 청구\n- 장기 공사에는 중간 정산 프로세스가 있다. 시스템에서 정산하면 회계팀이 공사가 끝난 것으로 알고 청구한다.\n- 그래서 중도금 정산은 공무팀이 따로 한다.\n1.5. 정산 · 청구\n- 공무팀: 정산 · 청구서\n- 회계팀: 청구(계산서 발행)\n1.6. 공사 시정 기간\n- 시정기한에 따라 공사를 한다.\n- 공사하는 사람들이 급하면 시정시간을 줄여 적는다(일부 악용 사례).\n1.7. 일용직\n- 일용직을 엑셀로 관리한다.\n- 시스템에서 근태를 관리하고 일용직 단가까지 다루기를 바란다. 일용직의 출근 · 퇴근은 현장에서 이루어지는 것을 고려한다.\n1.8. 정산월\n- 정산월은 정산서를 작성한 달이다.\n- 9월 28일에 공사가 끝나 9월 정산서를 만들어도, 대기업은 말일에 청구를 막는 경우가 있다.\n1.9. 임시 일정 관리\n- 공사 진행 예정 정보를 공사팀 · 점검팀에 공유한다.\n- 공무팀은 확정되지 않은 임시 일정을 만들어 엑셀로 관리한다. 임시 일정을 시스템에 올리면 공사팀 · 점검팀이 그 일정을 확정일자로 보고 진행한다.\n1.10. 산출물\n- 부서마다 필요한 산출물이 다르다.\n- 일정표: 점검팀 · 월방팀\n- 엑셀자료: 공무팀\n1.11. 일정관리 및 현황표\n- 나라119 가 아닌 그룹웨어로 일정관리와 현황을 기록 · 공유한다.\n- 감리 · 설계는 공사보다 기간이 길어 누적 보고를 하고 현황 파악이 필요하다.\n1.12. 정산\n- 엑셀 데이터를 바탕으로 월 정산을 한다. 지사별 · 팀별 정산을 따로 해야 하지만 시스템이 고려하지 않는다.\n- 한 사업소가 관리하는 공사에 다른 사업소 직원이 투입되면, 공사를 관리하는 사업소가 투입된 인력 모두의 비용을 낸다.\n- 김해 소방서 계약 공사 건을 창원에서 다룰 수 있다. 이때 김해가 창원으로 금액을 정산한다.\n- 계산서 발생 · 자재 매입 청구 같은 여러 금액을 정리해 전달해야 한다.\n1.13. 중간 정산\n- 정산이 끝난 것과 중간 정산 중인 것이 같이 보인다. 공사가 끝난 정산서만 보여야 한다.\n- 공사가 끝나지 않았는데 정산서가 작성되면 안 된다.\n1.14. 모바일(현장지원)\n- 공사 모듈을 쓰지 않는다.\n- 모바일을 쓰는 사람들의 연령이 높다.\n1.15. 인건비\n- 사원 인건비는 직급에 따라 정한다.\n- 공통 코드에서 인건비를 정의하고 고쳐 관리한다.\n1.16. 설비\n- 상세 내용이 필요하다: 스프링 쿨러가 신설인지 증축인지 같은 것.\n- 설비가 들어가야 감리 · 설계를 진행할 수 있다.\n1.17. 공사 정산서\n- 감리는 공사가 끝난 뒤 청구한다.\n- 설계는 설계가 끝난 뒤 진행하지만 정산서가 없다.\n1.18. 권한\n- 감리 · 계약 · 설계 같은 모듈마다 권한 관리가 필요하다.\n1.19. 엑셀 속성\n- 기한일: 공사완료 요청일(제외 검토)\n- 접수일: 공사의뢰 접수일 · 의뢰서 등록일\n- 시공자: 텍스트, 내외부 관리 필요\n- 완료일: 공사최종완료일\n- 정산월: 공사가 끝나고 정산서를 작성한 달(공무팀 정산 월)\n- 경영지원: 입금 여부 · 미수 확인\n1.20. 출력물\n- 쓰는 출력물: 공사정산서 · 공사의뢰서 · 월별공사현황 · 연별공사현황(회계팀)\n- 쓰지 않는 기능: 자료전송\n1.21. 참고사항\n- 계약 · 의뢰서 · 정산서는 모두 1개씩만 만들 수 있다.\n1.22. 정산서 자동입력 항목\n- 정산서를 만들 때 경비 · 사무실경비가 계약금의 5% 로 저절로 생긴다.\n- 공무회계 노무비도 계약금 5% 로 생기도록 요청했다(정렬순서 맨 아래).\n1.23. 설계 · 감리 기록부 추가\n- 기록부에 아래 칸을 더한다.\n* 착공일\n* 완공일\n* 시공사(회사)\n* 설계사(전화번호 포함)\n* 감리원(전화번호 포함)\n* 소방시설현황(텍스트 형태)\n* 첨부파일\n- 감리원 · 설계사는 계약 구분에 따라 내부 · 외부 자격증 선임자만 나오게 한다.\n- 기록부는 잔행 상태를 관리한다(원문 표기).\n- 건별 출력물: 계약데이터 · 기록부 자료\n- 월별 출력물: 월별공사정산서 형태 · 소방시설기록부 참조\n2. TO-BE 제안\n2.1. 중간 정산\n- 중간 정산 프로세스를 더한다.\n- 접수 · 청구 여부 같은 상태 값을 정의한다.\n2.2. 공사일정 변경\n- 계약을 바꾼 뒤 완료 일자를 바꾼다. 공무팀이 공사 완료 일자를 바꾸려면 회계팀이 먼저 계약을 바꿔야 한다.\n2.3. 권한\n- 사업소 단위로 사용자 접근 권한을 준다.\n2.4. 노무비\n- 직급 공통코드에 노무비 속성을 더해, 정산서에 노무비를 넣을 때 내부이면 직급별 노무비를 자동완성한다.\n2.5. 건축물 도면 관리\n- 건축물 도면 관리 기능 강화를 요청했다(별도 프로그램 추가 · 누락 필터).\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- 2022-08-30 실무자 인터뷰\n  - 글 출처: 20220830_실무진인터뷰_회의록(총 3 장 · 작성 대리 박재성 · 확인자 칸 비어 있음)\n\u003c!-- /kmd:참고 -->\n"},{"k":"B","l":"안 B 정보 유형","t":"# 회의록\n\n차세대 나라119정보시스템 사업의 회의를 회의 한 번에 항목 하나로 적는다. 항목마다 속성 표(때 · 곳 · 참석 · 안건) 뒤에 다룬 것 · 정한 것 · 할 일 · 열린 것을 같은 차례로 둔다.\n\n## 2022-08-30 실무자 인터뷰\n\n공무팀 업무를 분석하고 요구사항을 모은 실무자 인터뷰다. 개발은 점검 · 월방 다음에 공사를 넣는 차례로 하기로 했다.\n\n| 속성 | 값 |\n|---|---|\n| 때 | 2022-08-30 10:00 |\n| 곳 | 나라기업 김해 오피스 |\n| 진행 | 대리 박재성 |\n| 작성 · 확인 | 대리 박재성 · - |\n| 참석 | 나라기업 전성진 · 나라기업 김지현 · 세정아이앤씨 박재성 · 세정아이앤씨 사경진 |\n| 안건 | 업무 분석 및 요구사항 수집 |\n\n1. 다룬 것\n1.1. 공무팀 업무 방식\n- **보고**: 공사 진행사항 · 소요 · 인원을 주 단위로 보고하고, 모든 직원의 업무를 일 단위로 보고한다.\n- **작업 방식**: 나라119가 업무 프로세스 전체를 덮지 못해 엑셀 작업과 중복 작업이 많다. 공사의뢰서 · 정산서 · 월보고를 주로 쓰고 나머지 기능은 쓰지 않는다. 착공이사 고도화에서 진행한다.\n- **단발성 업무**: 건축물 등록이 쉽지 않다. 경영지원팀이 건축물을 등록하면 효율이 떨어져 공무팀이 처리하고 있다.\n- **단발성 공사 의뢰**: 공무팀이 계약서를 쓴다. 단발성은 보통 의뢰가 생긴 달에 계약한다. 9월 공사가 10월로 바뀌면 10월에 정산서를 만들기 때문에 계약도 10월로 옮긴다.\n- **공사 시정 기간**: 시정기한에 따라 공사를 진행한다. 공사하는 사람들이 급하면 시정시간을 줄여서 쓰는 일부 악용 사례가 있다.\n- **일용직**: 일용직을 엑셀로 관리한다. 시스템에서 근태관리가 되면 좋고, 일용직의 출근 · 퇴근이 현장에서 이루어지는 것을 고려해야 한다. 일용직 단가까지 고려되면 좋다.\n- **임시 일정 관리**: 공사 진행 예정 정보를 공사팀 · 점검팀에 공유한다. 공무팀은 확정되지 않은 임시 일정을 만들어 엑셀로 관리한다. 임시 일정을 시스템에 올리면 공사팀 · 점검팀이 확정일자로 여기고 진행한다.\n1.2. 산출물과 일정 공유\n- **산출물**: 부서마다 필요한 산출물이 다르다. 일정표는 점검팀 · 월방팀이, 엑셀자료는 공무팀이 쓴다.\n- **일정관리 및 현황표**: 나라119가 아닌 그룹웨어로 일정관리와 현황을 기록하고 공유한다. 감리 · 설계는 공사와 달리 기간이 길어 누적 보고를 하고 현황 파악이 필요하다.\n- **사용 출력물**: 공사정산서 · 공사의뢰서 · 월별공사현황 · 연별공사현황(회계팀).\n- **미사용**: 자료전송 기능.\n1.3. 정산 · 청구\n- **정산 · 청구 나눔**: 공무팀은 정산과 청구서를, 회계팀은 청구(계산서 발행)를 맡는다.\n- **중도금 청구**: 장기 공사는 중간 정산 프로세스가 있다. 시스템에서 정산을 하면 회계팀이 공사가 끝난 것으로 알고 청구하므로 공무팀이 중도금 정산을 따로 한다.\n- **정산월**: 정산서를 쓴 달이다. 9월 28일에 공사가 끝나 9월 정산서를 만들었어도 대기업은 말일에 청구를 막는 경우가 있다.\n- **정산**: 엑셀 데이터로 월 정산을 한다. 지사별 · 팀별 정산을 따로 해야 하지만 시스템이 고려하지 않는다. 한 사업소가 관리하는 공사에 다른 사업소 직원이 들어가면 관리 사업소가 투입 인력 모두의 비용을 낸다. 김해 소방서 계약 공사를 창원에서 다룰 수 있고, 이때 김해에서 창원으로 금액을 정산한다. 계산서 발생 · 자재 매입 청구 같은 여러 금액을 정리해 전달해야 한다.\n- **중간 정산**: 정산이 끝난 것과 중간 정산 중인 것이 같이 뜬다. 공사가 끝난 정산서만 보여야 하고, 공사가 안 끝났는데 정산서를 쓸 수 있으면 안 된다.\n- **공사 정산서**: 감리는 공사 완료 뒤 청구한다. 설계는 설계 완료 뒤 진행하지만 정산서가 없다.\n- **정산서 자동입력 항목**: 정산서를 만들 때 경비 · 사무실경비를 계약금의 5% 로 자동 생성한다. 공무회계 노무비도 계약금의 5% 로 생성되게(정렬순서는 맨 밑) 요청했다.\n1.4. 시스템 기능과 데이터\n- **모바일(현장지원)**: 공사 모듈은 쓰지 않는다. 모바일을 쓰는 사람의 연령이 높다.\n- **인건비**: 사원 인건비는 직급에 따라 정한다. 공통 코드에 인건비를 정의하고 고쳐 관리한다.\n- **설비**: 스프링 쿨러 신설인지 증축인지 같은 상세내용이 필요하다. 설비가 들어가야 감리 · 설계를 진행할 수 있다.\n- **권한**: 감리 · 계약 · 설계 같은 모듈마다 권한 관리가 필요하다.\n- **참고사항**: 계약 · 의뢰서 · 정산서는 모두 한 개씩만 만들 수 있다.\n- **설계/감리 기록부 추가**: 착공일 · 완공일 · 시공사(회사) · 설계사(전화번호 포함) · 감리원(전화번호 포함) · 소방시설현황(텍스트 형태) · 첨부파일을 둔다.\n* 감리원 · 설계사는 계약 구분에 따라 내부 · 외부 자격증 선임자만 나오게 한다.\n* 기록부는 잔행 상태로 관리한다. 출력물은 건 별(계약데이터 · 기록부 자료)과 월 별(월별공사정산서 형태 · 소방시설기록부 참조)이다.\n1.5. 엑셀 속성\n- **기한일**: 공사완료 요청일(제외 검토).\n- **접수일**: 공사의뢰 접수일 · 의뢰서 등록일.\n- **시공자**: 텍스트. 내외부 관리가 필요하다.\n- **완료일**: 공사최종완료일.\n- **정산월**: 공사가 끝나고 정산서를 쓴 달(공무팀 정산 월).\n- **경영지원**: 입금 여부 · 미수 확인.\n1.6. TO-BE 제안\n- 중간 정산 프로세스를 더한다.\n- 접수 · 청구 여부 같은 상태 값을 정의한다.\n- 공사일정 변경 프로세스: 계약을 바꾼 뒤 완료 일자를 바꾼다. 공무팀이 공사 완료 일자를 바꾸려면 회계팀이 먼저 계약을 바꿔야 한다.\n- 사업소 단위로 사용자 접근 권한을 준다.\n- 직급 공통코드에 노무비 속성을 더해, 정산서 관리에서 노무비를 넣을 때 내부이면 직급별 노무비를 자동완성한다.\n- 건축물 도면 관리 기능 강화를 요청했다(별도 프로그램 추가 · 누락 필터).\n2. 정한 것\n- 공사팀 프로세스가 가장 혼잡해 필요하면 우선순위를 조정할 수 있고, 점검 · 월방 다음에 공사를 넣는 방향으로 개발한다.\n3. 할 일\n- 수기 관리 엑셀파일(공사의뢰서 관리 · 월단위보고 · 소방시설기록부)을 전달한다: 김지현 · 기한 -\n- 자금일보 금액 속성 가운데 대체금액 항목을 확인한다: 김지현 · 기한 -\n4. 열린 것\n- 더존 연동을 정해야 한다. 관련: [10주차 요청 RQ1](주간업무보고.md#10주차)\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: 20220830_실무진인터뷰_회의록 (프로젝트명 차세대 나라119정보시스템 · 총 3 장). 서명 칸 · 빈 참석 번호(5 ~ 10)는 양식이라 옮기지 않았다\n\u003c!-- /kmd:참고 -->\n"},{"k":"C","l":"안 C 블록 스키마","t":"# 회의록\n\n차세대 나라119 정보시스템 구축 사업의 회의를 회의 한 번마다 항목 하나로 적는다. 항목마다 때 · 곳 · 참석과 다룬 것 · 정한 것 · 할 일을 같은 차례로 둔다.\n\n## 2022-08-30 실무진 인터뷰\n\n나라기업 공무팀 업무를 실무자에게 듣고 요구사항을 모았다. 개발 순서는 점검 · 월방 다음에 공사를 넣기로 했고, 나라기업 김지현이 수기 엑셀 파일과 대체금액 항목을 확인해 주기로 했다.\n\n- **때**: 2022-08-30 10:00\n- **곳**: 나라기업 김해 오피스\n- **진행**: 대리 박재성\n- **참석**: 나라기업 전성진 · 나라기업 김지현 · 세정아이앤씨 박재성 · 세정아이앤씨 사경진\n- **안건**: 업무 분석 및 요구사항 수집\n- **작성 · 확인**: 대리 박재성 · -\n\n1. 다룬 것\n1.1. 업무 방식\n- **보고**: 공사 진행사항 · 소요 · 인원 등을 주 단위로, 모든 직원의 업무를 일 단위로 보고한다.\n- **작업 방식**: 나라119가 업무 프로세스 전체를 덮지 못해 엑셀 작업과 중복 작업이 많다. 공사의뢰서 · 정산서 · 월보고만 주로 쓰고 나머지 기능은 쓰지 않는다. 착공이사는 고도화에서 진행한다.\n- **산출물**: 부서마다 필요한 산출물이 다르다. 일정표는 점검팀 · 월방팀, 엑셀자료는 공무팀이 쓴다.\n- **일정관리 및 현황표**: 나라119가 아닌 그룹웨어로 일정관리와 현황을 기록 · 공유한다. 감리 · 설계는 공사와 달리 기간이 길어 누적 보고를 하고 현황 파악이 필요하다.\n- **임시 일정 관리**: 공사 진행 예정 정보를 공사팀 · 점검팀에 공유한다. 공무팀은 확정되지 않은 임시 일정을 만들어 엑셀로 관리한다. 임시 일정을 시스템에 올리면 공사팀 · 점검팀이 그 일정을 확정일자로 여기고 진행한다.\n1.2. 공사 · 계약\n- **단발성 업무**: 건축물 등록이 쉽지 않다. 경영지원팀이 건축물을 등록하면 효율이 떨어져 공무팀이 처리하고 있다.\n- **단발성 공사 의뢰**: 공무팀이 계약서를 쓴다. 단발성은 보통 의뢰가 생긴 달에 계약한다. 9월 공사가 10월로 바뀌면 10월에 정산서를 만들기 때문에 계약도 10월로 옮긴다.\n- **공사 시정 기간**: 시정기한에 따라 공사를 진행한다. 공사하는 사람들이 급하면 시정시간을 줄여서 적는다(일부 악용 사례).\n- **설비**: 상세내용이 필요하다(스프링 쿨러 신설인지 증축인지 등). 설비가 들어가야 감리 · 설계를 진행할 수 있다.\n- **권한**: 감리 · 계약 · 설계 등 모듈마다 권한 관리가 필요하다.\n- **참고사항**: 계약 · 의뢰서 · 정산서는 모두 1개씩만 만들 수 있다.\n1.3. 정산 · 청구\n- **중도금 청구**: 장기 공사는 중간 정산 프로세스가 있다. 시스템에서 정산을 하면 회계팀이 공사가 끝난 것으로 알고 청구하므로, 중도금 정산은 공무팀이 따로 한다.\n- **정산 · 청구 나눔**: 공무팀은 정산 · 청구서, 회계팀은 청구(계산서 발행)를 맡는다.\n- **정산월**: 정산서를 작성한 달이다. 9월 28일에 공사가 끝나 9월 정산서를 만들었어도, 대기업은 말일 청구를 막는 경우가 있다.\n- **정산**: 엑셀 데이터로 월 정산을 한다. 지사별 · 팀별 정산이 따로 돼야 하지만 시스템에 없다. 한 사업소가 관리하는 공사에 다른 사업소 직원이 투입되면 관리하는 사업소가 투입 인력 모두의 비용을 낸다. 김해 소방서 계약 공사 건을 창원에서 다룰 수 있고, 이때 김해에서 창원으로 금액을 정산한다. 계산서 발생 · 자재 매입 청구 등 여러 금액을 정리해 전달해야 한다.\n- **중간 정산**: 정산이 끝난 것과 중간 정산 중인 것이 같이 보인다. 공사가 끝난 정산서만 보여야 하고, 공사가 끝나지 않았는데 정산서가 작성되면 안 된다.\n- **공사 정산서**: 감리는 공사 완료 뒤 청구한다. 설계는 설계 완료 뒤 진행하지만 정산서가 없다.\n- **정산서 자동입력 항목**: 정산서를 만들면 경비 · 사무실경비가 계약금의 5% 로 저절로 생긴다.\n1.4. 인력\n- **일용직**: 일용직은 엑셀로 관리한다. 출근 · 퇴근이 현장에서 이루어지는 것을 고려해 시스템에서 근태관리가 되고, 일용직까지 단가가 고려되기를 바란다.\n- **인건비**: 사원 인건비는 직급에 따라 정한다. 공통 코드에서 인건비를 정의하고 고친다.\n1.5. 엑셀 속성 · 출력물\n- **엑셀 속성**: 기한일은 공사완료 요청일(제외 검토) · 접수일은 공사의뢰 접수일 – 의뢰서 등록일 · 시공자는 텍스트(내외부 관리 필요) · 완료일은 공사최종완료일 · 정산월은 공사가 끝나고 정산서를 작성한 달(공무팀 정산 월)이다. 경영지원 입금 여부와 경영지원 미수를 확인한다.\n- **쓰는 출력물**: 공사정산서 · 공사의뢰서 · 월별공사현황 · 연별공사현황(회계팀)\n- **쓰지 않는 기능**: 자료전송\n1.6. 개발 · 모바일\n- **개발 우선순위**: 공사팀 프로세스가 가장 혼잡해 필요하면 우선순위를 바꿀 수 있다.\n- **모바일(현장지원)**: 공사 모듈은 쓰지 않는다. 모바일을 쓰는 사람의 연령이 높다.\n2. 정한 것\n- 점검 · 월방 다음에 공사를 넣는 방향으로 개발한다.\n3. 제안\n3.1. 실무자 요청\n- 정산서 자동입력 항목에 공무회계 노무비(계약금 5%)를 더하고 정렬 순서 맨 아래에 둔다.\n- 설계/감리 기록부를 더한다: 착공일 · 완공일 · 시공사(회사) · 설계사(전화번호 포함) · 감리원(전화번호 포함) · 소방시설현황(텍스트) · 첨부파일.\n* 감리원 · 설계사는 계약 구분에 따라 내부 · 외부 자격증 선임자만 나오게 한다.\n* 기록부는 잔행 상태를 관리한다.\n* 출력물은 건 별(계약데이터 · 기록부 자료) · 월 별(월별공사정산서 형태 · 소방시설기록부 참조)로 둔다.\n3.2. TO-BE 제안\n- 중간 정산 프로세스를 더한다.\n- 접수 · 청구 여부 등 상태 값을 정의한다.\n- 공사일정 변경 프로세스를 둔다. 계약을 바꾼 뒤 완료 일자를 바꾼다(공무팀이 공사 완료 일자를 바꾸려면 회계팀이 먼저 계약을 바꿔야 한다).\n- 사업소 단위로 사용자 접근 권한을 준다.\n- 직급 공통코드에 노무비 속성을 더해, 정산서 관리에서 노무비를 넣을 때 내부이면 직급별 노무비를 자동완성한다.\n- 건축물 도면 관리 기능을 강화한다(별도 프로그램 추가 · 누락 필터).\n4. 할 일\n- 수기 관리 엑셀파일 전달(공사의뢰서 관리 · 월단위보고 · 소방시설기록부): 김지현 · 기한 -\n- 자금일보의 금액 속성 가운데 대체금액 항목 확인: 김지현 · 기한 -\n5. 열린 것\n- 더존 연동을 정해야 한다. 이어진 요청 RQ1 · 이슈 IS5 는 [10주차](주간업무보고.md#10주차) 에 있다.\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- 2022-08-30 실무진 인터뷰\n  - 글 출처: 20220830_실무진인터뷰_회의록 · 프로젝트명 차세대 나라119정보시스템 · 총 3장\n  - 들일 때 고친 꼴: 일시 「2022. 08.30 10:00」 → 2022-08-30 10:00 · 회의내용 한 칸을 주제마다 정의 줄로 · Action Plan 의 빈 칸(실행기한 · 비고)은 기한 「-」\n\u003c!-- /kmd:참고 -->\n"},{"k":"D","l":"안 D 읽기 우선","t":"# 회의록\n\n차세대 나라119정보시스템 구축 사업의 회의를 날짜별로 쌓는다. 항목마다 정한 것 · 할 일을 먼저 두고, 나눈 내용은 그 아래에 둔다.\n\n## 2022-08-30 실무자 인터뷰\n\n공무팀 업무를 분석하고 요구사항을 모았다. 개발 순서는 점검 · 월방 다음에 공사를 넣고, 할 일은 김지현의 자료 전달 · 확인 두 건이다. 더존 연동은 정하지 못했다.\n\n- **정한 것**:\n* 착공이사는 고도화에서 한다.\n* 개발 순서: 공사팀 프로세스가 가장 혼잡해 필요하면 우선순위를 조정할 수 있고, 점검 · 월방 다음에 공사를 넣는다.\n* 사원 인건비는 직급에 따라 정하고, 공통 코드에서 인건비를 정의 · 수정 관리한다.\n* 설계 · 감리 기록부의 감리원 · 설계사는 계약 구분에 따라 내부 · 외부 자격증 선임자만 나오게 만든다.\n- **할 일**:\n* 수기 관리 엑셀파일(공사의뢰서 관리 · 월단위보고 · 소방시설기록부) 전달: 김지현 · 기한 -\n* 자금일보 금액 속성 중 대체금액 항목 확인: 김지현 · 기한 -\n- **열린 것**: 더존 연동을 정해야 한다.\n- **누가**: 진행 대리 박재성 · 나라기업 전성진 · 김지현 · 세정아이앤씨 박재성 · 사경진\n- **때 · 곳**: 2022-08-30 10:00 · 나라기업 김해 오피스\n- **다룬 것**: 업무 분석 및 요구사항 수집\n\n1. 공무팀 업무 방식\n- 보고: 공사 진행사항 · 소요 · 인원을 주 단위로, 모든 직원의 업무를 일 단위로 보고한다.\n- 작업 방식: 나라119가 업무 프로세스 전체를 덮지 못해 엑셀 작업과 중복 작업이 많다. 공사의뢰서 · 정산서 · 월보고를 주로 쓰고 나머지 기능은 쓰지 않는다.\n- 단발성 업무: 건축물 등록이 쉽지 않다. 경영지원팀이 건축물을 등록하면 효율이 떨어져 공무팀이 처리한다. 단발성 공사 의뢰는 공무팀이 계약서를 쓰고, 보통 의뢰가 생긴 달에 계약한다. 9월 공사가 10월로 바뀌면 10월에 정산서를 만들기 때문에 계약도 10월로 옮긴다.\n- 공사 시정 기간: 시정기한에 따라 공사한다. 공사하는 사람들이 급하면 시정시간을 줄여 적는다(일부 악용 사례).\n- 일용직: 엑셀로 관리한다. 시스템에서 근태관리가 되면 좋겠다. 출근 · 퇴근이 현장에서 이루어지는 것을 고려하고, 일용직 단가까지 고려되면 좋겠다.\n- 임시 일정 관리: 공사 진행 예정 정보를 공사팀 · 점검팀에 공유한다. 공무팀은 확정되지 않은 임시 일정을 엑셀로 관리한다. 임시 일정을 시스템에 올리면 공사팀 · 점검팀이 확정일자로 여기고 진행한다.\n- 산출물: 부서마다 필요한 산출물이 다르다. 일정표는 점검팀 · 월방팀, 엑셀자료는 공무팀이 쓴다.\n- 일정관리 및 현황표: 나라119가 아니라 그룹웨어로 일정관리 · 현황을 기록하고 공유한다. 감리 · 설계는 공사보다 기간이 길어 누적 보고와 현황 파악이 필요하다.\n- 모바일(현장지원): 공사 모듈을 쓰지 않는다. 모바일을 쓰는 사람의 연령이 높다.\n2. 정산 · 청구\n- 중도금 청구: 장기 공사는 중간 정산 프로세스가 있다. 시스템에서 정산하면 회계팀이 공사가 끝난 것으로 알고 청구하므로 공무팀이 중도금 정산을 따로 한다.\n- 정산 · 청구 나눔: 공무팀은 정산 · 청구서, 회계팀은 청구(계산서 발행)를 맡는다.\n- 정산월: 정산서를 쓴 달이다. 9월 28일에 공사가 끝나 9월 정산서를 만들었어도 대기업은 말일 청구를 막는 경우가 있다.\n- 정산: 엑셀 데이터로 월 정산을 한다. 지사별 · 팀별 정산을 따로 해야 하지만 시스템에 없다. 한 사업소가 관리하는 공사에 다른 사업소 직원이 들어가면 관리 사업소가 투입 인력 모두의 비용을 낸다. 김해 소방서 계약 공사를 창원에서 다룰 수 있고, 이때 김해에서 창원으로 금액을 정산한다. 계산서 발생 · 자재 매입 청구 등 여러 금액을 정리해 전달해야 한다.\n- 중간 정산: 정산이 끝난 것과 중간 정산 중인 것이 같이 뜬다. 공사가 끝난 정산서만 보여야 하고, 공사가 끝나지 않았으면 정산서를 쓸 수 없어야 한다.\n- 공사 정산서: 감리는 공사가 끝난 뒤 청구한다. 설계는 설계가 끝난 뒤 하지만 정산서가 없다.\n- 정산서 자동입력: 정산서를 만들면 경비 · 사무실경비가 계약금의 5% 로 저절로 생긴다. 공무회계 노무비도 계약금 5% 로 생기게(정렬 순서는 맨 아래) 요청했다.\n3. 설비 · 권한 · 출력물\n- 설비: 스프링 쿨러 신설인지 증축인지 같은 상세 내용이 필요하다. 설비가 들어가야 감리 · 설계를 할 수 있다.\n- 권한: 감리 · 계약 · 설계 같은 모듈마다 권한 관리가 필요하다.\n- 사용 출력물: 공사정산서 · 공사의뢰서 · 월별공사현황 · 연별공사현황(회계팀).\n- 쓰지 않는 기능: 자료전송.\n- 생성 수: 계약 · 의뢰서 · 정산서는 모두 하나씩만 만들 수 있다.\n4. 엑셀 속성\n- 기한일: 공사완료 요청일(빼는 것을 검토).\n- 접수일: 공사의뢰 접수일, 의뢰서 등록일.\n- 시공자: 텍스트. 내부 · 외부 관리가 필요하다.\n- 완료일: 공사최종완료일.\n- 정산월: 공사가 끝나고 정산서를 쓴 달(공무팀 정산 월).\n- 경영지원: 입금 여부 · 경영지원 미수 확인.\n5. 설계 · 감리 기록부 추가\n- 칸: 착공일 · 완공일 · 시공사(회사) · 설계사(전화번호 포함) · 감리원(전화번호 포함) · 소방시설현황(텍스트) · 첨부파일.\n- 기록부는 진행 상태를 관리한다.\n- 출력물: 건별(계약데이터 · 기록부 자료) · 월별(월별공사정산서 형태, 소방시설기록부 참조).\n6. TO-BE 제안\n1) 중간 정산 프로세스를 더한다.\n2) 접수 · 청구 여부 같은 상태 값을 정의한다.\n3) 공사일정 변경 프로세스: 계약을 바꾼 뒤 완료 일자를 바꾼다. 공무팀이 공사 완료 일자를 바꾸려면 회계팀이 먼저 계약을 바꿔야 한다.\n4) 사업소 단위로 사용자 접근 권한을 준다.\n5) 직급 공통코드에 노무비 속성을 더해, 정산서에 노무비를 넣을 때 내부면 직급별 노무비를 자동완성한다.\n6) 건축물 도면 관리 기능을 강화한다(별도 프로그램 추가 · 누락 필터).\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- 2022-08-30 실무자 인터뷰\n  - 글 출처: 20220830_실무진인터뷰_회의록(총 3장) · 작성자 대리 박재성 · 확인자 -\n  - 날짜 정리: 일시 「2022. 08.30 10:00」 → 2022-08-30 10:00\n  - 원문 「잔행 상태 관리」 는 「진행 상태 관리」 로 읽었다\n\u003c!-- /kmd:참고 -->\n"}]},{"name":"위험및이슈관리대장","kind":"대장","best":"A","why":"원본 ID 행을 모두 세웠고 속성 13행을 같은 차례로 두었으며 라벨 넷을 「-」 로 남겨 빠짐과 비어 있음을 갈랐다. 44785 원본 값도 참고 메모에 남겼다. B 는 IS02 표와 덩이를 잃었고, C 는 주간 IS1 값을 베꼈고, D 는 baseline 목록과 「식별만」 을 지어냈다. 남은 흠은 빈 행이 27줄로 늘어진 것이다.","views":[{"k":"src","l":"원본","t":"# NRC_BM_601_위험_및_이슈관리대장_v0.8_20220819\n\n## 표지\n\n|  | 비밀구분 | 일반 |\n|---|---|---|\n|  | 문서관리 번호 | NRC_BM_610 |\n|  | 버전 | 0.8 |\n|  | 작성일자 | 2022.08.17 |\n| 차세대 나라119 정보시스템 구축 |  |  |\n| 위험 및 이슈관리대장 |  |  |\n| Copyright ⓒ 세정아이앤씨 2022 |  |  |\n| ㈜세정아이앤씨의 사전 승인 없이 본 내용의 전부 또는 일부에 대한 복사, 배포, 사용을 금합니다. |  |  |\n\n## 개정이력표\n\n|  |  | 승인 이력 |  |  |  |\n|---|---|---|---|---|---|\n| 구분 | 직책 | 성명 | 일자 | 버전 | 서명 |\n| 작성 | PL | 박재성 | 44790 | 0.8 |  |\n| 검토 | PM | 김덕기 |  |  |  |\n| 승인 | 나라기업 | 김지현 |  |  |  |\n|  |  | 개정 이력 |  |  |  |\n| 개정번호 | 개정장 | 개정내역 | 작성자 | 시행일자 |  |\n| 1.0 | 전체 | 최초 작성 | 박재성 |  |  |\n\n## 본문\n\n| ■ 위험 및 이슈관리 대장 |  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| 위험 및 이슈 식별 |  |  |  |  |  |  |  |  |  |  | 위험 및 이슈 해결방안 수립 |  |  |  |  | 위험 및 이슈 해결 |  |\n| ID | 유형 | 사업부문 | 식별단계 | 위험 및 이슈명 | 발생일 | 내역 설명 | 제기자 | 관리범위 | 중요도 | 긴급도 | 처리 담당자 | 해결방안 | 협조사항 | 등록일 (발생일) | 완료 예 n\u003c!-- applied: 2026-1111-바탕-세움-21 -->\n위험 및 이슈관리대장은 식별, 해결방안 수립, 해결의 세 단계로 필드를 구성한다.\n\n1. 식별\n- 이슈ID: 이슈의 식별 ID. 필수.\n- 이슈 유형: 범위, 일정, 인력, 비용, 품질, 기술, 기능, 장비, 정책 등에서 선택. 필수.\n- 관련 서비스(영역): 사업, 어플리케이션, 네트워크, 보안, 솔루션, 시스템 분야 구분. 필수.\n- 이슈식별단계: 착수/계획, 분석, 설계, 구축, 시험 등. 필수.\n- 이슈 명: 이슈 명 기술. 필수.\n- 이슈 발생일: 이슈가 발생된 일자. 필수.\n- 이슈내역 설명: 이슈의 상세 내역. 필수.\n- 이슈 제기자: 이슈 제기자 명. 선택.\n- 관리범위: 프로젝트 또는 전사로 구분. 필수.\n- 중요도: 상/중/하. 필수.\n- 긴급성: 상/중/하. 선택.\n1. 해결방안 수립\n- 이슈처리 담당자: 처리할 담당자 명. 필수.\n- 해결방안: 해결방안 상세 기술. 필수.\n- 협조사항: 이해관계자로부터 요구되는 협조사항. 선택.\n- 목표 해결일: 이슈 해결 목표일. 선택.\n1. 해결\n- 이슈해결 결과: 처리 결과 내역 상세 기술. 필수.\n- 이슈 해결일: 이슈 해결 완료일. 필수.\n- 해결여부: 식별/진행중/종료 중 선택. 필수.\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- IS01: AS-IS 시스템 소스코드 접근 불가\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-21.md)\n- 이슈 관리 필드 구조\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-21.md)\n\u003c!-- /kmd:참고 -->\n"},{"k":"A","l":"안 A 작성기준 확장","t":"# 위험및이슈관리대장\n\n차세대 나라119 정보시스템 구축의 위험 · 이슈를 식별하고 해결방안 · 해결 결과와 상태를 관리하는 대장이다. 이슈 하나가 항목 하나이고, 속성 표의 행 이름과 차례는 모든 항목이 같다. 지금 IS01 은 해결이고 IS02 는 원본에 번호만 있다.\n\n## IS01: AS-IS 시스템 소스코드 접근 불가\n\nIS01 은 AS-IS 시스템 업체와 고객사의 계약 때문에 AS-IS 소스코드를 분석할 수 없는 범위 이슈이고, 진행상태는 해결이다.\n\n| 속성 | 값 |\n|---|---|\n| 유형 | 범위 |\n| 영역 | 시스템 |\n| 식별단계 | 분석 |\n| 발생일 | 2022-08-12 |\n| 제기 | 박재성 · 김지현 |\n| 관리범위 | 프로젝트 |\n| 중요도 | 상 |\n| 긴급도 | 상 |\n| 처리 담당 | 고객사 · 세정 |\n| 등록일 | - |\n| 완료 예정일 | - |\n| 진행상태 | 해결 |\n| 해결일 | - |\n\n- **내용**:\n* AS-IS 시스템 분석과 TO-BE 설계를 하려면 AS-IS 소스코드에 접근해 분석해야 한다.\n* AS-IS 시스템 업체와 고객사의 계약상 소스코드를 제공할 수 없고, 소스코드를 분석하면 계약 위반일 수 있다고 통보받았다.\n- **해결방안**: -\n- **협조**: -\n- **결과**: -\n\n## IS02: 이름 없음\n\nIS02 는 원본 대장에 번호만 있고 나머지 칸이 모두 비어 있다.\n\n| 속성 | 값 |\n|---|---|\n| 유형 | - |\n| 영역 | - |\n| 식별단계 | - |\n| 발생일 | - |\n| 제기 | - |\n| 관리범위 | - |\n| 중요도 | - |\n| 긴급도 | - |\n| 처리 담당 | - |\n| 등록일 | - |\n| 완료 예정일 | - |\n| 진행상태 | - |\n| 해결일 | - |\n\n- **내용**: -\n- **해결방안**: -\n- **협조**: -\n- **결과**: -\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: NRC_BM_601_위험_및_이슈관리대장_v0.8_20220819 (문서관리 번호 NRC_BM_610 · 판 0.8 · 작성일자 2022.08.17 · 비밀구분 일반)\n  - 승인 이력: 작성 PL 박재성 2022-08-17(원본 44790) 판 0.8 · 검토 PM 김덕기 · 승인 나라기업 김지현\n  - 개정 이력: 1.0 · 전체 · 최초 작성 · 박재성 · 시행일자 없음\n  - 작성지침 시트는 갈래 장부의 속성 행 · 허용 값으로 옮겼다(작성목적은 문서 요약)\n- IS01: AS-IS 시스템 소스코드 접근 불가\n  - 발생일 2022-08-12 는 원본 칸 값 44785(엑셀 일련번호)를 바꾼 것이다\n\u003c!-- /kmd:참고 -->\n"},{"k":"B","l":"안 B 정보 유형","t":"# 위험및이슈관리대장\n\n차세대 나라119 정보시스템 구축 사업의 위험과 이슈를 ID 하나에 항목 하나로 적는다. 지금 IS01 은 해결 상태이고 IS02 는 번호만 있다.\n\n## IS01: AS-IS 시스템 소스코드 접근 불가\n\nIS01 은 AS-IS 시스템 소스코드를 분석에 쓸 수 없다는 범위 이슈이고, 지금 상태는 해결이다.\n\n| 속성 | 값 |\n|---|---|\n| 유형 | 범위 |\n| 영역 | 시스템 |\n| 식별단계 | 분석 |\n| 발생일 | 2022-08-12 |\n| 제기 | 박재성 · 김지현 |\n| 관리범위 | 프로젝트 |\n| 중요도 | 상 |\n| 긴급도 | 상 |\n| 처리 담당 | 고객사 · 세정 |\n| 등록일 | - |\n| 목표일 | - |\n| 진행상태 | 해결 |\n| 해결일 | - |\n\n1. 내용\n- AS-IS 시스템을 분석하고 TO-BE 를 설계하려면 AS-IS 소스코드에 접근해 분석해야 한다.\n- AS-IS 시스템 업체와 고객사의 계약상 소스코드를 제공할 수 없고, 소스코드를 분석하면 계약 위반일 수 있다는 통보가 있었다.\n\n## IS02\n\nIS02 는 대장에 번호만 있고 이름 · 속성 · 내용 칸이 모두 비어 있다.\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: NRC_BM_601 위험 및 이슈관리대장 v0.8 (문서관리 번호 NRC_BM_610 · 작성일자 2022-08-17 · 작성 PL 박재성 2022-08-17 · 검토 PM 김덕기 · 승인 나라기업 김지현 · 개정 1.0 전체 최초 작성 박재성)\n  - 서식: 작성지침 시트는 갈래 서식(대장 행 속성 · 덩이)으로 옮겼다. 표지 · 해더 시트는 양식이라 옮기지 않았다\n\u003c!-- /kmd:참고 -->\n"},{"k":"C","l":"안 C 블록 스키마","t":"# 위험및이슈관리대장\n\n차세대 나라119 정보시스템 구축 사업의 위험과 이슈를 ID 마다 항목 하나로 적는다. 지금 이슈는 둘이고, IS01 은 해결 상태이며 IS02 는 ID 만 있고 내용이 적히지 않았다.\n\n## IS01: AS-IS 시스템 소스코드 접근 불가\n\nIS01 은 AS-IS 시스템 소스코드를 볼 수 없어 소스코드 분석 없이 업무 분석으로 차세대 시스템을 짓게 된 범위 이슈이고, 지금 해결 상태다.\n\n| 속성 | 값 |\n|---|---|\n| 유형 | 범위 |\n| 사업부문 | 시스템 |\n| 식별단계 | 분석 |\n| 발생일 | 2022-08-12 |\n| 제기자 | 박재성 · 김지현 |\n| 관리범위 | 프로젝트 |\n| 중요도 | 상 |\n| 긴급도 | 상 |\n| 처리 담당자 | 고객사 · 세정 |\n| 등록일 | - |\n| 완료 예정일 | - |\n| 진행상태 | 해결 |\n| 이슈 해결일 | - |\n\n1. 내용\n- AS-IS 시스템을 분석하고 TO-BE 를 설계하려면 AS-IS 소스코드에 접근해 분석해야 한다.\n- AS-IS 시스템 업체와 고객사의 계약상 소스코드를 제공할 수 없고, 소스코드를 분석하면 계약 위반이 될 수 있다는 통보를 받았다.\n2. 해결방안\n미기재\n3. 결과\n- 소스코드 분석 없이 업무 분석 뒤 차세대 시스템을 구축한다. 주간 보고의 기한은 2022-08-16 · 경과는 완료다([10주차](주간업무보고.md#10주차) IS1).\n\n## IS02\n\nIS02 는 원본 대장에 ID 만 있고 다른 칸이 모두 비어 있는 이슈다.\n\n| 속성 | 값 |\n|---|---|\n| 유형 | - |\n| 사업부문 | - |\n| 식별단계 | - |\n| 발생일 | - |\n| 제기자 | - |\n| 관리범위 | - |\n| 중요도 | - |\n| 긴급도 | - |\n| 처리 담당자 | - |\n| 등록일 | - |\n| 완료 예정일 | - |\n| 진행상태 | - |\n| 이슈 해결일 | - |\n\n1. 내용\n미기재\n2. 해결방안\n미기재\n3. 결과\n미기재\n* [10주차](주간업무보고.md#10주차) 의 IS2(AS-IS CRM 시스템 종료 검토)와 같은 이슈인지는 정해지지 않았다.\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: NRC_BM_601 위험 및 이슈관리대장 v0.8 (2022-08-19) · 문서관리 번호 NRC_BM_610 · 작성일자 2022.08.17 · 비밀구분 일반\n  - 승인 이력: 작성 PL 박재성 2022-08-17 v0.8 · 검토 PM 김덕기 · 승인 나라기업 김지현\n  - 개정 이력: 1.0 · 전체 · 최초 작성 · 박재성 · 시행일자 없음\n  - 들일 때 고친 꼴: 엑셀 일련번호 날짜 44785 → 2022-08-12 · 44790 → 2022-08-17 · 병합 머리(위험 및 이슈 식별 · 해결방안 수립 · 해결)는 풀어 열 이름으로 · 작성지침 시트는 이 갈래의 서식(속성 차례 · 필수/선택 · 값 꼴)으로 옮김\n  - 옮기지 않은 시트: 표지 · 해더(문서번호 NRC-BM_610 · 개정번호 0.8 · 붙여넣기 안내)\n\u003c!-- /kmd:참고 -->\n"},{"k":"D","l":"안 D 읽기 우선","t":"# 위험및이슈관리대장\n\n차세대 나라119 정보시스템 구축 사업의 위험과 이슈를 ID 하나에 항목 하나로 둔다. 지금 이슈는 둘이다: `IS01`(소스코드 접근 불가)은 해결이고, `IS02` 는 ID 만 잡혀 있다.\n\n## 이슈 목록\n\n이슈마다 지금 상태와 맡은 곳이다. 상태가 해결이 아닌 것이 위에 온다.\n\n\u003c!-- baseline: kmd 목록 · 항목에서 다시 만든다 -->\n| ID | 이름 | 진행상태 | 중요도 · 긴급도 | 처리 담당 |\n|---|---|---|---|---|\n| [IS02](#IS02) | - | - | - | - |\n| [IS01](#IS01) | AS-IS 시스템 소스코드 접근 불가 | 해결 | 상 · 상 | 고객사, 세정 |\n\u003c!-- /baseline -->\n\n## IS01: AS-IS 시스템 소스코드 접근 불가\n\n**해결**. AS-IS 업체와 고객사의 계약 때문에 AS-IS 소스코드를 볼 수 없다는 범위 이슈다. 해결방안 · 해결일 칸은 비어 있다.\n\n- **내용**: AS-IS 시스템 분석과 TO-BE 설계를 위해 AS-IS 소스코드에 접근해 분석해야 한다. AS-IS 시스템 업체와 고객사의 계약상 소스코드를 제공할 수 없고, 소스코드를 분석하면 계약 위반일 수 있다는 통보를 받았다.\n- **해결방안**: -\n- **협조사항**: -\n\n| 속성 | 값 |\n|---|---|\n| 유형 | 범위 |\n| 사업부문 | 시스템 |\n| 식별단계 | 분석 |\n| 발생일 | 2022-08-12 |\n| 제기자 | 박재성, 김지현 |\n| 관리범위 | 프로젝트 |\n| 중요도 | 상 |\n| 긴급도 | 상 |\n| 처리 담당자 | 고객사, 세정 |\ 1 | 건물용도 | 0001 없음~0040 기타 36종. 연관1 값으로 위험도 계수 포함(0.7~1.1) |\n| AC001 | 문서 | 0001 소방계획서·0002 외관점검표 |\n| AC001 | 설비항목 | 레벨1: 소화설비(0001)·경보설비(0002)·피난설비(0003)·소화용수설비(0004)·소화활동설비(0005)·기타(0006). 레벨2: 소화기구~방염물품 등 44종(0007~0050), 루트 ZZZZ |\n| AC001 | 점검상태 | 0 양호(○)·1 정비요함(△)·2 불량(X)·3 없음(-) |\n| AC001 | 전달방법 | 0001 이메일·0002 팩스·0003 우편·0004 전자접수·0005 직접전달 |\n| AC001 | 전화수신구분 | 01 일반업무·02 계약문의·03 고객불만·04 긴급출동·05 기타·06 서비스·07 청구·08 일정통보 |\n\n## 환경설정 항목\n\u003c!-- applied: 2026-1111-바탕-세움-11 -->\n애플리케이션 환경은 `sy_conf` 테이블(변수·값 구조)로 관리한다. 정의된 환경설정 코드는 아래 8개이다.\n\n| 코드 | 항목명 | 설명 |\n|---|---|---|\n| `SMTP_PORT` | SMTP PORT | SMTP 포트 |\n| `SMTP_SERVER` | SMTP SERVER | SMTP 서버 |\n| `SMTP_ID` | SMTP ID | SMTP 아이디 |\n| `SMTP_PASSWORD` | SMTP PASSWORD | SMTP 비밀번호 |\n| `SMTP_MAIL` | SYSTEM MAIL | 메일 발신 주소 |\n| `SMTP_NAME` | SYSTEM MAIL NAME | 메일 발신자 |\n| `PASS_LIMIT_DAYS` | 비번 사용 가능 일수 | 비밀번호 사용 가능 일수 |\n| `LOGIN_FAIL_COUNT` | 비번 실패 횟수 | 비밀번호 실패 허용 수(잠금 기준) |\n\n값 컬럼은 `sy_conf.value`(varchar 50)이며, 실제 설정값은 운영 환경별로 채운다.\n\n## 테이블 목록·이관 대상\n\u003c!-- applied: 2026-1111-바탕-세움-11 -->\n신규 시스템(NRC) 테이블은 총 40개이며 주제영역별로 구분한다.\n\n| 순번 | 주제영역 | 테이블명 | 엔티티명 |\n|---|---|---|---|\n| 1 | SY 시스템관리 | `sy_conf` | 시스템설정 |\n| 2 | | `sy_menu` | 메뉴구성 |\n| 3 | | `sy_program` | 프로그램정보 |\n| 4 | | `sy_auth` | 프로그램권한 |\n| 5 | | `sy_cmm` | 공통코드 |\n| 6 | | `sy_comp` | 회사 |\n| 7 | | `sy_branch` | 사업소 |\n| 8 | | `sy_dept` | 부서 |\n| 9 | | `sy_kakao` | 알림톡 |\n| 10 | | `sy_team` | 팀 |\n| 11 | | `sy_ven` | 관리업체 |\n| 12 | | `sy_user` | 사원 |\n| 13 | | `sy_userbranch` | 사원사업소 |\n| 14 | | `sy_file` | 파일 |\n| 15 | | `sy_mac` | 사원접근제한 |\n| 16 | BD 건축물 | `bd_building` | 건축물 |\n| 17 | | `bd_user` | 건축물담당자 |\n| 18 | ES 견적 | `es_estimate` | 견적서 |\n| 19 | CT 계약 | `ct_contract` | 계약서 |\n| 20 | | `ct_file` | 계약서 파일 |\n| 21 | BL 청구 | `bl_bill` | 청구서 |\n| 22 | IS 점검 | `is_emg` | 긴급출동 |\n| 23 | | `is_emgfile` | 긴급출동파일 |\n| 24 | | `is_inspection` | 소방안전관리 |\n| 25 | | `is_inspectionfile` | 소방안전관리파일 |\n| 26 | | `is_danger` | 위험물관리대행 |\n| 27 | | `is_dangerfile` | 위험물관리대행파일 |\n| 28 | | `is_batch` | 배치 |\n| 29 | CS 공사 | `cs_request` | 공사의뢰 |\n| 30 | | `cs_settle` | 공사정산 |\n| 31 | | `cs_labor` | 공사노무 |\n| 32 | | `cs_material` | 공사자재 |\n| 33 | | `cs_cost` | 공사경비 |\n| 34 | SR 민원 | `sr_service` | 민원 |\n| 35 | AC 회계 | `ac_account` | 계좌 |\n| 36 | | `ac_yaccount` | 연도별계좌 |\n| 37 | | `ac_maccount` | 월별계좌 |\n| 38 | | `ac_pay` | 자금 |\n| 39 | | `ac_transaction` | 입출금 |\n| 40 | | `ac_etctransaction` | 기타입출금 |\n\nAS-IS 이관 대상은 `bangjae` DB `dbo` 스키마의 테이블이다. 이관 여부가 명시된 주요 항목은 아래와 같다.\n\n| 테이블명 | 건수 | 이관 |\n|---|---|---|\n| `파일` | 23,921 | Y |\n| `파일_고유번호` | 3 | Y |\n| `휴일` | 20 | N |\n| `코드_보수자재` | 2 | - |\n| `코드_공사정산_내외구분` | 7 | - |\n\n이관 대상 AS-IS 테이블은 건축물대장·계약·공사정산·자금·점검·청구서 등 업무 테이블과 코드성 테이블·백업 테이블·뷰를 포함한 100여 개이다. `sy_file` 테이블은 AS-IS 이관 파악 대상으로 별도 표시되어 있다.\n\n## SY 시스템 테이블\n\u003c!-- applied: 2026-1111-바탕-세움-11 -->\nSY 주제영역 테이블의 컬럼 정의는 아래와 같다. 모든 테이블은 `inst_dt`·`inst_id`·`inst_ip`·`updt_dt`·`updt_id`·`updt_ip` 감사 컬럼을 공통으로 가진다.\n\n1. `sy_cmm_m` 공통코드마스터\n\n| 컬럼명 | 타입 | 길이 | NOT NULL |\n|---|---|---|---|\n| `comp_cd` | varchar | 2 | Y |\n| `wk_type` | varchar | 3 | Y |\n| `base_type` | varchar | 3 | Y |\n| `base_type_nm` | varchar | 20 | Y |\n| `use_yn` | varchar | 1 | - |\n| `remark` | varchar | 200 | - |\n\n1.1. `sy_cmm_d` 공통코드디테일\n\n| 컬럼명 | 타입 | 길이 | NOT NULL |\n|---|---|---|---|\n| `base_cd` | varchar | 10 | Y |\n| `base_nm` | varchar | 100 | Y |\n| `sort_no` | int4 | - | - |\n| `use_yn` | varchar | 1 | Y |\n| `relation_wk_type` | varchar | 3 | - |\n| `relation_cd_type` | varchar | 3 | - |\n| `relation_cd` | varchar | 30 | - |\n\n2. `sy_conf` 환경설정: `compcd`(varchar 2, NOT NULL)·`variable`(varchar 30, NOT NULL)·`value`(varchar 50)·`remark`(varchar 200)\n\n3. `sy_comp` 회사: `compcd`(varchar 2, NOT NULL)·`compnm`(varchar 30, NOT NULL)·`bizno`(varchar 13, NOT NULL)·`bizregistno`(varchar 20, NOT NULL)·`president`(varchar 20, NOT NULL)·`taxcd`(varchar 100)·`homtaxid`(varchar 15)\n\n4. `sy_menu` 메뉴구성: `compcd`·`no`(int4, NOT NULL)·`level`(int4, NOT NULL)·`category`(varchar 50)·`programid`(varchar 10)\n\n5. `sy_program` 프로그램: `compcd`·`programid`(varchar 10, NOT NULL)·`programnm`(varchar 50, NOT NULL)·`programtype`(varchar 1)·`wktype`(varchar 2)·`wkdetailtype`(varchar 3)·`version`(numeric)·`useyn`(varchar 1). 버튼별 사용여부 플래그: `selyn/newyn/savyn/delyn/proyn/uplyn/priyn/iniyn/etc1~5yn`·정렬순서: `selord/neword/savord/delord/proord/uplord/priord/iniord/etc1~5ord`. 부가 필드: `spc1/spc2/spc3`(varchar 20)\n\n6. `sy_auth` 권한: `compcd`·`programid`·`userid` 복합키. 버튼별 권한 플래그: `selyn/newyn/savyn/delyn/proyn/uplyn/priyn/iniyn/etc1~5yn/spc1~3yn`\n\n7. `sy_team` 팀: `compcd`·`team_nm`(varchar 50, NOT NULL)·`team_cd`(varchar 50, NOT NULL)\n\n8. `sy_dept` 부서: `compcd`·`dept_nm`(varchar 50, NOT NULL)·`dept_cd`(varchar 50, NOT NULL)\n\n9. `sy_userbranch` 사원사업소: `compcd`·`bran_cd`(varchar 50, NOT NULL)·`user_id`(varchar 50, NOT NULL)\n\n10. `sy_mac` 사원접근제한: `comp_cd`·`mac_nm`·`mac_val`·`user_id` (모두 varchar 5)\n\n별도로 `SY_CMM_CD`·`SY_SYS_CONF`·`SY_COMP_INFO`·`SY_USER_INFO`·`SY_PGM_INFO`·`SY_MENU_INFO`·`SY_MENU_AUTH`·`SY_MENUBTN_AUTH`·`SY_BATCH_LOG` 테이블도 정의되어 있다.\n\n`SY_USER_INFO` 주요 컬럼은 아래와 같다.\n\n| 컬럼명 | 속성명 | 타입 | 길이 | NOT NULL | 기본값 |\n|---|---|---|---|---|---|\n| `USER_ID` | 사용자ID | VARCHAR2 | 20 | Y | - |\n| `USER_NM` | 사용자명 | VARCHAR2 | 100 | Y | - |\n| `COMP_CD` | 회사코드 | VARCHAR2 | 5 | Y | - |\n| `PWD` | 비밀번호 | VARCHAR2 | 256 | Y | - |\n| `DEPT_CD` | 부서코드 | VARCHAR2 | 10 | - | - |\n| `USER_GB_CD` | 사용자구분코드 | VARCHAR2 | 10 | Y | - |\n| `DUEUP_DD` | 만료일자 | VARCHAR2 | 8 | - | 29991231 |\n| `PWD_RST_YN` | 비밀번호초기화여부 | VARCHAR2 | 1 | - | N |\n| `PWD_LK_YN` | 비밀번호잠금여부 | VARCHAR2 | 1 | - | N |\n| `FRST_LOGIN_YN` | 최초로그인여부 | VARCHAR2 | 1 | - | Y |\n| `LOGIN_FLR_TMS` | 로그인실패횟수 | NUMBER | 8 | - | - |\n\n## BD 건축물 테이블\n\u003c!-- applied: 2026-1111-바탕-세움-11 -->\nBD 주제영역은 `bd_building`(건축물)과 `bd_user`(건축물담당자) 2개 테이블로 구성한다.\n\n1. `bd_building` 건축물\n\n| 컬럼명 | 속성명 | 타입 | 길이 | NOT NULL |\n|---|---|---|---|---|\n| `bd_c pt_yn`(미수여부)·발주서 정보 7종·특이사항 첨부 플래그 복수\n\n8. `cs_settle` 공사정산: `cntrwk_excclc_no`(bpchar 12, NOT NULL)·`contract_no`·`cntrwk_sn`(공사일련번호, bpchar 9, NOT NULL)·`bgnde/compt_de`(시작/완료일, NOT NULL)·`bilde`(청구일)·`work_daycnt`(작업일수, numeric, NOT NULL)·`chrg_empno`(담당사번)·`worker`(작업자, varchar 50)·`job_charger`(업무담당자, varchar 30)\n\n9. `cs_labor` 공사노무: `cntrwk_excclc_no`·`seq`·`worker`(varchar 50, NOT NULL)·`lbrc_untpc`(노무단가, numeric, NOT NULL)·`work_daycnt`(NOT NULL)·`amount`(NOT NULL)·`inout_gb`(내외구분, bpchar 4, NOT NULL)·`outord_gb_cd`(외주구분코드, bpchar 2)\n\n10. `cs_material` 공사자재: `cntrwk_excclc_no`·`seq`·`prdnm`(품명, varchar 50, NOT NULL)·`mtril_prmpc`(자재원가, NOT NULL)·`qty`(수량, int4, NOT NULL)·`splpc_am`(공급가액, NOT NULL)·`puchas_offic`(매입처, varchar 50)\n\n11. `cs_cost` 공사경비: `cntrwk_excclc_no`·`seq`·`dtls`(내역, varchar 50, NOT NULL)·`dd`(일자, date, NOT NULL)·`amount`(금액, numeric, NOT NULL)\n\n## AC 회계 테이블\n\u003c!-- applied: 2026-1111-바탕-세움-11 -->\nAC 회계 주제영역은 6개 테이블로 구성한다.\n\n1. `ac_account` 계좌\n\n| 컬럼명 | 속성명 | 타입 | 길이 | NOT NULL |\n|---|---|---|---|---|\n| `cd` | 코드 | bpchar | 4 | Y |\n| `bran_cd` | 지사코드 | bpchar | 4 | Y |\n| `acnut_gb_cd` | 계좌구분코드 | bpchar | 4 | - |\n| `acnutno` | 계좌번호 | varchar | 50 | Y |\n| `bank_nm` | 은행명 | varchar | 50 | Y |\n| `reprsnt_acnut_yn` | 대표계좌여부 | bool | - | - |\n| `dpstr` | 예금주 | varchar | 20 | - |\n| `seq` | 순번 | int4 | - | - |\n\n2. `ac_yaccount` 연도별계좌: `acnut_cd`(bpchar 4, NOT NULL)·`year`(bpchar 4, NOT NULL)·`blce`(잔고, numeric, NOT NULL)\n\n3. `ac_maccount` 월별계좌(마감)\n\n| 컬럼명 | 속성명 | 타입 | NOT NULL |\n|---|---|---|---|\n| `acnut_cd` | 계좌코드 | varchar(50) | Y |\n| `year` | 연도 | varchar(4) | Y |\n| `month` | 월 | varchar(2) | Y |\n| `in_amt` | 입금금액 | bigint | Y |\n| `out_amt` | 출금금액 | bigint | Y |\n| `etc_in_amt` | 기타입금금액 | bigint | Y |\n| `etc_out_amt` | 기타출금금액 | bigint | Y |\n| `base_amt` | 기초금액 | bigint | Y |\n| `tot_in_amt` | 총입금금액 | bigint | Y |\n| `tot_out_amt` | 총출금금액 | bigint | Y |\n| `end_amt` | 기말금액 | bigint | Y |\n\n4. `ac_pay` 자금: `rc -08 |\n| RQ18 | 박재성 | 회계팀 인터뷰 요청 | 2022-09-05 | 2022-09-14 |\n| RQ19 | 이병만 | 시스템 오픈 단계별로 진행 요청 | 2022-09-23 | 2022-09-23 |\n\n6.2. 협의 결과\n요청마다 협의결과와 경과다.\n\n| 요청번호 | 협의결과 | 경과 |\n|---|---|---|\n| RQ1 | 연계 없음 | 2022-09-08 (완료) |\n| RQ2 | 전달 완료 | 2022-08-12 (완료) |\n| RQ3 | Windows Application | 2022-08-12 (완료) |\n| RQ4 | - | - |\n| RQ5 | 삭제 | 2022-08-30 (완료) |\n| RQ6 | 삭제 | 2022-08-30 (완료) |\n| RQ7 | - | - |\n| RQ8 | 삭제 | 완료 |\n| RQ9 | 슈어엠 담당자 연결 | 2022-09-08 (완료) |\n| RQ10 | - | 2022-09-16 (완료) |\n| RQ11 | - | - |\n| RQ12 | - | 2022-09-16 (완료) |\n| RQ13 | 모듈 삭제 후 해당 파일 전달 · to-be 자체 나스 이용 검토 | 2022-09-05 (완료) |\n| RQ14 | 파일 전달 예정 | - |\n| RQ15 | - | 2022-09-16 (완료) |\n| RQ16 | TO-BE 지급 기한 값 이관 시 임의 데이터 요청 | 2022-09-16 (완료) |\n| RQ17 | - | - |\n| RQ18 | - | 2022-09-15 (완료) |\n| RQ19 | 12월 1차 오픈, 1월 2차 오픈 | 2022-09-23 (완료) |\n\n7. 이슈 · 결심 · 변경\n이슈마다 내용 · 조치 · 기한 · 경과다. 발생자 칸은 모두 비어 있다.\n\n| 이슈번호 | 최초발생 | 요구 및 이슈 내용 | 조치 및 진행사항 | 기한 | 경과 |\n|---|---|---|---|---|---|\n| IS1 | 2022-08-12 | AS-IS 시스템 소스코드 제공 불가 | 소스코드 분석 없이 업무 분석 후 차세대 시스템 구축 | 2022-08-16 | 완료 |\n| IS2 | 2022-08-22 | AS-IS CRM 시스템 종료 검토 | - | 2022-09-14 | - |\n| IS3 | 2022-08-26 | 일정 조정 건(실무진 인터뷰, 연계 모듈) | WBS 수정 | 2022-08-26 | 완료 |\n| IS4 | 2202-08-26 | WBS TASK 추가 변경(데이터 이관, Server설치/VM구성) | WBS 수정 | 2022-08-26 | 완료 |\n| IS5 | 2022-09-05 | 회계 시스템 연계 제한(더 존 전표 연계 불가) | 회계 시스템에 엑셀 업로드하는 편의 기능 제공으로 대체 검토 · 회계 담당자 협의 필요 | 2022-09-06 | 완료 |\n| IS6 | 2022-09-16 | 거래처 추가 검토 | - | 2022-10-21 | - |\n\n관련: [IS01: AS-IS 시스템 소스코드 접근 불가](위험및이슈관리대장.md#IS01)\n\n8. 위험\n위험마다 내용 · 조치 · 기한이다. 발생자 · 경과 칸은 비어 있다.\n\n| 위험번호 | 최초발생 | 핵심 위험 사항 | 조치 및 진행사항 | 기한 |\n|---|---|---|---|---|\n| DG1 | 2022-08-31 | 업무보고 메뉴 검토 및 설계 | 검토/설계된 메뉴 우선 개발 진행 | 2022-10-28 |\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: NRC_BM_310 주간업무보고 v1.0 10주차 (슬라이드 12장 · 보고일은 원본에 없다). 슬라이드 9 「요청 및 협의사항 관리(3/3)」 는 머리 줄만 있어 옮기지 않았다\n\u003c!-- /kmd:참고 -->\n"},{"k":"C","l":"안 C 블록 스키마","t":"# 주간업무보고\n\n차세대 나라119 정보시스템 구축 사업의 주간 보고를 주차마다 항목 하나로 적는다. 항목마다 주요 이슈 활동 · 공정 진도 · 업무 추진 · 단위 프로그램 개발 · 주요 일정 · 요청 · 이슈 · 위험을 같은 차례로 둔다. 진도율은 일정 기간 기준의 계획 대비 실적이고, 환산 진도율은 진도율에 가중치를 곱한 값이다(상세는 NRC_BM_110_WBS).\n\n## 10주차\n\n10주차 환산 진도율은 계획 48.68% 에 실적 48.55%(달성률 99.73%)이고, 설계는 데이터 이관 설계 20%, 구현은 백오피스 20% · 모바일 25% 다.\n\n- **보고 차수**: 10주차\n- **보고일**: 미기재\n\n1. 주요 이슈 활동\n- **사업관리**: -\n- **설계**: 디자인 샘플 검토\n- **구축**: 개발 진행\n2. 공정 진도\n진도율(A)은 아래와 같다.\n\n| 일정 항목 | 계획 | 실적 | 달성률 | 차주 계획 |\n|---|--:|--:|--:|--:|\n| 사업관리 | 29.29% | 61.90% | 211.35% | 29.29% |\n| 분석 | 100.00% | 100.00% | 100.00% | 100.00% |\n| 설계 | 100.00% | 97.36% | 97.36% | 100.00% |\n| 구현 및 테스트 | 26.88% | 20.05% | 74.60% | 37.71% |\n| 전개 및 안정화 | 0.00% | 0.00% | 0.00% | 0.00% |\n| 운영 및 검수 | 0.00% | 0.00% | 0.00% | 0.00% |\n| 합계 | 37.47% | 48.62% | 129.76% | - |\n\n환산 진도율(A*B)은 아래와 같다.\n\n| 일정 항목 | 가중치(B) | 계획 | 실적 | 달성률 |\n|---|--:|--:|--:|--:|\n| 사업관리 | 10 | 2.93% | 6.19% | 211.35% |\n| 분석 | 10 | 10.00% | 10.00% | 100.00% |\n| 설계 | 25 | 25.00% | 24.34% | 97.36% |\n| 구현 및 테스트 | 40 | 10.75% | 8.02% | 74.60% |\n| 전개 및 안정화 | 10 | 0.00% | 0.00% | 0.00% |\n| 운영 및 검수 | 5 | 0.00% | 0.00% | 0.00% |\n| 합계 | 100 | 48.68% | 48.55% | 99.73% |\n\n3. 업무 추진\nWBS 업무마다 이번 주 실적과 다음 주 계획이다.\n\n| 구분 | 업무 | WBS | 주간 실적 | 차주 계획 |\n|---|---|---|--:|--:|\n| 설계 | 데이터 아키텍처 설계 > 데이터 이관 설계 | `3.2.2.1.0` | 20% | 40% |\n| 구현 | 개발 > 백오피스 개발 | `4.3.1.1.1` | 20% | - |\n| 구현 | 개발 > 모바일 개발 | `4.3.1.1.2` | 25% | - |\n\n* 차주 계획의 구현은 백오피스 개발 · 모바일 개발 두 업무만 적혀 있고 비율이 없다.\n4. 단위 프로그램 개발\n단위 프로그램의 개발 계획과 진척률이다. 프로그램 본수는 아래와 같다.\n\n| 어플리케이션 | 프로그램 | 배치 | 인터페이스 | 보고서 | 계 |\n|---|--:|--:|--:|--:|--:|\n| 백오피스 | 41 | 0 | 4 | 19 | 64 |\n| 모바일 | 8 | 0 | 0 | 0 | 8 |\n| 합계 | 49 | 1 | 4 | 19 | 73 |\n\n* 합계 줄의 배치 1 · 계 73 은 두 줄의 합(0 · 72)과 다르다. 원본 그대로다.\n\n금주 실적은 아래와 같다.\n\n| 어플리케이션 | 계획 본수 | 실적 본수 | 달성률 |\n|---|--:|--:|--:|\n| 백오피스 | 4 | 3 | 75.0% |\n| 모바일 | 1 | 0 | 0.0% |\n| 합계 | 5 | 3 | 60.0% |\n\n누적 실적은 아래와 같다.\n\n| 어플리케이션 | 계획 본수 | 실적 | 달성률 | 계획진척률 | 실적진척률 |\n|---|--:|--:|--:|--:|--:|\n| -05 ~ 2022-09-08 | - |\n| RQ18 | 박재성 | 회계팀 인터뷰 요청 | - | 2022-09-05 ~ 2022-09-14 | 2022-09-15 (완료) |\n| RQ19 | 이병만 | 시스템 오픈 단계별로 진행 요청 | 12월 1차 오픈, 1월 2차 오픈 | 2022-09-23 ~ 2022-09-23 | 2022-09-23 (완료) |\n\n7. 이슈\n이슈 · 결심 · 변경사항의 이번 주 상태다. 발생자 칸은 모두 비어 있다.\n\n| 번호 | 최초 발생 | 요구 · 이슈 내용 | 조치 · 진행 | 기한 | 경과 |\n|---|---|---|---|---|---|\n| [IS1](위험및이슈관리대장.md#IS01) | 2022-08-12 | AS-IS 시스템 소스코드 제공 불가 | 소스코드 분석 없이 업무 분석 후 차세대 시스템 구축 | 2022-08-16 | 완료 |\n| IS2 | 2022-08-22 | AS-IS CRM 시스템 종료 검토 | - | 2022-09-14 | - |\n| IS3 | 2022-08-26 | 일정 조정 건(실무진 인터뷰, 연계 모듈) | WBS 수정 | 2022-08-26 | 완료 |\n| IS4 | 2202-08-26 | WBS TASK 추가 변경(데이터 이관, Server설치/VM구성) | WBS 수정 | 2022-08-26 | 완료 |\n| IS5 | 2022-09-05 | 회계 시스템 연계 제한(더 존 전표 연계 불가) | 회계 시스템에 엑셀 업로드하는 편의 기능 제공으로 대체 검토, 회계 담당자 협의 필요 | 2022-09-06 | 완료 |\n| IS6 | 2022-09-16 | 거래처 추가 검토 | - | 2022-10-21 | - |\n\n* IS4 의 최초 발생 「2202-08-26」 은 원본 그대로다.\n8. 위험\n핵심 위험의 이번 주 상태다. 발생자 칸은 비어 있다.\n\n| 번호 | 최초 발생 | 핵심 위험 사항 | 조치 · 진행 | 기한 | 경과 |\n|---|---|---|---|---|---|\n| DG1 | 2022-08-31 | 업무보고 메뉴 검토 및 설계 | 검토/설계된 메뉴 우선 개발 진행 | 2022-10-28 | - |\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- 10주차\n  - 글 출처: NRC_BM_310 주간업무보고 v1.0 10주차(슬라이드 12장)\n  - 들일 때 고친 꼴: 슬라이드 글을 표로 다시 묶음 · 9열 진도 표는 표 둘로, 15열 개발 현황 표는 표 넷으로 나눔 · 요청일과 기한은 「~」 로 한 칸 · 비어 있는 슬라이드 1 · 9(요청 3/3) · 12(End of Document)는 옮기지 않음\n\u003c!-- /kmd:참고 -->\n"},{"k":"D","l":"안 D 읽기 우선","t":"# 주간업무보고\r\n\r\n차세대 나라119 정보시스템 구축 사업의 주간 보고를 주차마다 항목 하나로 쌓는다. 항목 첫 줄에 그 주의 진도와 열린 요청 · 이슈 · 위험 수를 둔다.\r\n\r\n## 10주차\r\n\r\n환산 진도는 계획 48.68% 에 실적 48.55%(달성률 99.73%)다. 요청 19건 중 다섯(RQ4 · RQ7 · RQ11 · RQ14 · RQ17), 이슈 6건 중 둘(IS2 · IS6), 위험 1건(DG1)이 경과 없이 열려 있다.\r\n\r\n- **금주 주요 이슈**: 설계는 디자인 샘플 검토, 구축은 개발 진행이다. 사업관리는 적힌 것이 없다. 시행 결과 · 비고 칸은 비어 있다.\r\n- **업무 추진**: 데이터 이관 설계 20% → 차주 40%. 백오피스 개발 20% · 모바일 개발 25% 를 이어 간다.\r\n- **주요 일정**: 10월 1주 ~ 4주 모두 구축이다. 10월 3일 개천절 · 10월 10일 대체 휴일.\r\n\r\n1. 열린 요청 · 이슈 · 위험\r\n\r\n경과 칸이 빈 것이다. 이슈 · 위험의 발생자 칸은 모두 비어 있다.\r\n\r\n| 번호 | 내용 | 요청자 | 요청일 리 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1111`(백오피스)은 시스템 기초정보를 관리하는 절차를 검증한다. 관련 프로세스는 `SY-01` ~ `SY-07`, 관련 요구사항은 `SER-001-01`, `SFR-001-06`, `SFR-001-09`, `SFR-001-36`이다. 사전 조건: 시스템 기초 정보 존재, 관리자 사용자 등록 상태.\n\n1. `BMC101` 로그인: ID `1`로 로그인한다. 사용여부 Y, 잠금해제 Y, 접근관리 허용된 네트워크/장비 조건이 충족되어야 한다.\n1.1. `BMC102` 비밀번호 변경: [설정아이콘] 클릭 → 현재/신규/확인 비밀번호 입력(8자리 이상, 특수문자 포함) → [확인].\n1.2. `BMC103` 잠금: [프로그램 잠금아이콘] 클릭 → [잠금] 팝업 → 비밀번호 입력 → [잠금해제] → 프로그램 복귀.\n\n2. `BSY101` 회사정보: 기본 회사 정보를 조회하고 [저장]을 클릭하면 [저장 알림] 팝업이 뜬다.\n2.1. `BSY102` 사업소관리: [신규] → 정보 입력 → [저장] → 목록 갱신. 등록한 사업소 더블클릭 시 수정 팝업, [저장] 또는 [삭제]로 처리한다.\n2.2. `BSY103` 부서관리: 검색조건 입력 → [검색] → 행추가(우클릭) → 부서정보 입력 → [저장]. 체크박스 체크 후 [삭제]로 삭제한다.\n2.3. `BSY104` 팀관리: 부서관리와 동일한 패턴으로 팀을 추가·수정·삭제한다.\n2.4. `BSY105` 환경설정: \"비밀번호 시도 수(계정 잠김)\" 코드값을 변경하고 [저장]을 클릭하면 환경변수 목록이 갱신된다.\n2.5. `BSY106` 공통코드: 검색 → [신규]로 공통코드 구분 등록 → 코드 입력/수정/삭제. [공통코드(구분) 수정] 버튼으로 구분 수정·삭제도 가능하다.\n2.6. `BSY107` 프로그램관리: 조회만 진행한다(시스템 구축 관리로 인해 등록·수정·삭제는 생략).\n2.7. `BSY108` 메뉴구성: [조회] → 폴더 추가(우클릭) → 프로그램 드래그 앤 드랍으로 추가 → [저장] → [메뉴 영역] 반영 확인. 폴더 삭제 후 [저장]으로 메뉴를 제거한다.\n2.8. `BSY109` 사원관리: [신규] → 사원정보 입력(초기비밀번호: 아이디) → [저장]. 더블클릭으로 수정/삭제 팝업을 연다. 자격정보는 목록 수정 후 [저장], 체크 후 [삭제]한다.\n2.9. `BSY110` 권한관리: 사용자 선택 → [프로그램권한] 체크 수정 → [저장]. [전체] 선택 시 일괄 체크 적용. [권한복사]: 기준 사용자와 대상 사용자를 입력(대상은 권한이 없는 상태여야 함) → [확인].\n2.10. `BSY111` 사원영업소관리: 사용자 선택 → [사업소 목록]의 \"권한\" 체크 수정 → [저장].\n2.11. `BSY112` 접근관리: 사용자 선택 → MAC 목록 수정 → [저장]. 체크 후 [삭제]. 접근권한이 없는 사용자로 로그인 시도 시 [접근 없음 알림] 팝업이 뜬다. 관리자가 해당 사용자의 MAC 정보에서 \"승인여부\"를 체크 후 저장하면 로그인이 가능해진다.\n\n## 백오피스 관리그룹 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1112`(백오피스)는 건축물 대장·계약·견적·민원·알림톡·선임·거래처·일정 관리 절차를 검증한다. 관련 프로세스는 `BD-01`, `BD-02`, `BD-03`, `ES-01`, `CT-01`, `CT-02`, `SR-01`이다. 관련 요구사항: `SFR-001-11`, `SFR-001-15` ~ `SFR-001-28`, `SFR-001-37`, `SFR-001-40`, `SFR-001-41`, `SFR-001-50`, `SFR-001-53`, `SFR-001-70`. 사전 조건: 기초정보 존재, 권한 사용자 로그인 상태.\n\n1. `BMT101` 건축물대장\n1.1. [신규] → 기본정보 입력 → [저장] → 건물 목록 갱신.\n1.2. 건물 선택 → 주소는 [돋보기]로 등록. [건축물대장] 버튼 클릭 시 국토교통부 세움터 연계 데이터 팝업이 뜬다.\n1.3. [담당자탭]: 담당자 정보 입력 → [저장]. [선임신고서]·[감독자지정] 버튼으로 각 리포트 출력. [삭제] 가능(담당자 관련 테스트를 위해 최소 1개 담당자 유지).\n1.4. [파일탭]: [도면] 또는 [건축물대장] 버튼으로 파일 선택·업로드. 파일 더블클릭 시 바탕화면에 다운로드. [삭제]로 파일 제거.\n\n2. `BMT102` 건축물이력: [건축물] 돋보기 → 건물 선택 → [조회](또는 Enter). 건물정보·담당자·파일·민원·점검현황·점검내역·계약·견적·공사·긴급점검 내역이 갱신된다.\n\n3. `BMT103` 계약관리\n3.1. [신규] → 계약 정보 입력(앞서 등록한 건물 사용) → [저장]. 더블클릭 → 수정 또는 삭제(이후 테스트를 위해 계약은 남겨둔다).\n3.2. 파일 종류별 업로드: 계약서 및 발주서, 점검보고서, 지적내역서(원본), 지적내역서(최종보고), 계약서_기타. 파일 더블클릭 시 다운로드. 체크 후 [삭제].\n\n4. `BMT104` 견적서관리\n4.1. [신규] → 견적정보 입력(이메일: 견적수신처 주소) → [저장]. 더블클릭 → 수정/삭제.\n4.2. [첨부파일탭]: 파일 업로드·다운로드·삭제. [견적상세탭]: 내역 입력 → [저장]. 삭제 가능.\n4.3. [견적서] 리포트 출력. [견적 대장] 팝업 → [출력]. [견적서 발송](첨부파일 포함) 발송.\n4.4. [계약등록] 클릭 시 [계약 신규 등록] 팝업이 뜨며 계약번호와 연계된다.\n\n5. `BMT106` 민원관리: [신규] → 민원정보 입력 → [저장]. 처리자가 등록된 경우 처리자의 [나의민원]에 조회되고, 없을 시 등록자의 [나의민원]에 조회된다. [전체민원탭]은 조회 전용이다.\n\n6. `BMT107` 알림톡발송: 검색조건 선택 → [조회] → 발송 대상 체크 → \"입력일자\" 항목 존재 시 입력 → 템플릿 선택 → [저장] → 알림톡 발송.\n\n7. `BMT108` 알림톡내역: 조회조건 입력 → [조회] → 발송 목록 확인.\n\n8. `BMT105` 선임현황관리: [조회] → 사업소 선택 → 선임 정보 추가·수정(행추가는 우클릭) → [저장]. 체크 후 [삭제]. 공사 모듈에서 선임상태의 감리·설계 사용자만 조회된다.\n\n9. `BMT110` 거래처관리: [조회] → 거래처 추가·입력(기타입출금관리 매입처 용도) → [저장]. 체크 후 [삭제].\n\n10. `BMT111` 일정관리: [신규] 또는 날짜 더블클릭 → 일정 입력 → [저장](포탈 일정은 10분마다 갱신). 더블클릭으로 수정 또는 삭제한다.\n\n## 백오피스 회계그룹 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1113`(백오피스)는 자금·기타입출금·미수·청구서·계좌·회계마감 관리 절차를 검증한다. 관련 프로세스는 `BL-01`, `AC-01` ~ `AC-07`이다. 관련 요구사항: `SFR-001-07`, `SFR-001-38`, `SFR-001-42`, `SFR-001-47`, `SFR-001-48`, `SFR-001-51`. 사전 조건: 기초정보 존재, 권한 사용자 로그인 상태, 테스트 대상 계약 존재.\n\n1. `BAC101` 자금관리\n1.1. 계약 조회 → 계약 선택 → [신규] → 자금 정보 입력 → [저장]. 계약금액과 자금금액이 다를 경우 알림 팝업이 뜬다.\n- 손망실 금액은 서비스 금액으로 처리한다.\n- 서비스 시 서비스금액을 입력하여 자금을 생성한다.\n1.2. 저장한 자금 더블클릭 → 수정 → [저장].\n1.3. 입출금목록 추가·입력 → [저장]. 체크 후 [삭제].\n1.4. [자금일보] 버튼으로 리포트를 출력한다.\n\n2. `BAC102` 기타입출금관리: [조회] → 행추가 → 정보 입력 → [저장]. 체크 후 삭제 또는 복사(동일 항목으로 목록 추가). [기안서] 버튼으로 리포트를 출력한다.\n\n3. `BAC103` 미수현황: [거래처매출장] → 정보 입력 → [출력]으로 리포트 출력. [조회] → 사업소별 미수 선택 → 건물별 미수 선택 → 자금 조회 순으로 드릴다운한다.\n\n4. `BAC104` 청구서관리: 자금 조회 → 청구할 자금 선택 → 청구서 정보 입력 → [저장](청구서 번호 목록 표기). 파일 업로드·다운로드·삭제. [청구서출력] 리포트 출력. [청구서발송](첨부파일 포함) 발송.\n\n5. `BAC105` 계좌관리: [조회] → 행추가 → 계좌정보 입력 → [저장]. 체크 후 [삭제](연도별 계좌 테스트 진행 후 삭제).\n\n6. `BAC106` 연도별계좌관리: [조회] → 행추가 → 연도별 계좌 정보 입력 → [저장]. 체크 후 [삭제].\n\n7. `BAC107` 회계마감\n- [마감]: 기말금액이 입력되고 기초금액으로 이월된다.\n- [해제]: 기말금액이 0이 되고 이월된 기초금액도 0이 된다.\n\n## 백오피스 점검모듈 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1114`(백오피스)는 소방안전관리일지·긴급점검일지·위험물관리대행일지·일별점검확인·배치 관리 절차를 검증한다. 관련 프로세스는 `IS-01` ~ `IS-06`이다. 관련 요구사항: `SFR-001-31`, `SFR-001-33`, `SFR-001-34`, `SFR-001-39`, `SFR-001-54`, `SFR-001-58`, `SFR-001-59`, `SFR-001-63`, `SFR-001-67`, `SFR-001-68`, `SFR-001-74`. 사전 조건: 기초정보 존재, 권한 사용자 로그인 상태.\n\n1. `BIS101` 소방안전관리일지\n1.1. 검색조건 → [조회]. [신규] → 계약정보 입력 → [불러오기](해당 계약의 최근 점검내용 로드) → 점검내용 입력 → [저장]. 더블클릭으로 수정·삭제.\n1.2. 파일 관리: [점검] / [불량] / [조치완료] 버튼 → [업로드] 팝업 → 파일 선택·저장. 파일 선택 후 [삭제].\n1.3. 리포트 출력:\n- [점검결과보고서]: 직접 출력.\n- [점검보고서]: [점검현황] 팝업 내용 기입 후 [출력].\n- [월소방안전종합현황], [월소방안전업무보고]: 각 버튼 클릭으로 직접 출력.\n\n2. `BIS102` 긴급점검일지\n2.1. 검색조건 → [조회]. [신규] → 점검내용 입력 → [저장]. 더블클릭으로 수정·삭제.\n2.2. 파일 관리: [주요현상] / [처리확인] / [기타] 버튼 → [업로드] 팝업 → 파일 선택·저장. [삭제].\n2.3. [긴급출동결과보고서] 리포트 출력.\n\n3. `BIS103` 위험물관리대행일지\n3.1. 검색조건 → [조회]. [신규] → 점검내용 입력 → [저장]. 더블클릭으로 수정·삭제.\n3.2. 파일 관리: [점검] / [불량] / [조치완료] 버튼 → [업로드] 팝업 → 파일 선택·저장. [삭제].\n3.3. [점검결과보고서] 리포트 출력.\n\n4. `BIS104` 일별점검확인: 검색조건 → [조회]. 항목 클릭 → [점검사진대장] 클릭으로 리포트 출력. 파일 목록에 서명이 아닌 파일이 존재해야 리포트가 출력된다.\n\n5. `BIS105` 배치관리: 검색조건 → [조회]. 날짜 더블클릭 → 배치 내용 등록 → [저장]. 더블클릭으로 수정·삭제.\n\n6. `BIS106` 배치업로드: 검색조건 → [조회]. [업로드] → 엑셀 파일 선택 → 엑셀 내용 입력. 계약번호·계약명·계약구분·건물명이 없는 항목은 [검색]으로 계약을 선택해 기입한다. [저장]으로 배치 일괄 등록. 목록에서 내용 수정 후 [저장]으로 수정한다.\n\n## 백오피스 공사모듈 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1115`(백오피스)는 공사의뢰서·공사정산서·설계기록부·감리기록부 관리 절차를 검증한다. 관련 프로세스는 `CS-01` ~ `CS-04`이다. 관련 요구사항: `SFR-001-43`, `SFR-001-44`, `SFR-001-46`. 사전 조건: 기초정보 존재, 권한 사용자 로그인 상태.\n\n1. `BCS101` 공사의뢰서\n1.1. 검색조건 → [조회]. [신규] → 공사의뢰서 작성 → [저장]. 더블클릭으로 수정·삭제.\n1.2. [공사의뢰서] 버튼 → [업로드] 팝업 → 파일 선택·저장. 파일 선택 후 [삭제].\n1.3. [공사의뢰서 출력] 버튼으로 리포트를 출력한다.\n\n2. `BCS102` 공사정산서\n2.1. 검색조건 → [조회]. 공사의뢰번호가 없는 항목 선택 → 작성 → [저장]. 수정·삭제 가능.\n2.2. 탭별 정보 관리(오른쪽 클릭으로 행추가):\n\n| 탭 | 주요 비고 |\n|---|---|\n| 노무 | 구분이 \"내부\"이면 작업자코드 입력 가능. 작업자에 따라 노무단가 자동 입력. |\n| 자재 | - |\n| 경비 | 신규 생성 시 경비 5%, 사무실경비 5%, 공무회계 노무비 계약금 5% 자동 생성. |\n| 자료 | [사진대상] / [공사의뢰서] / [기타] 버튼으로 파일 업로드. 파일 선택 후 [삭제]. |\n\n2.3. 리포트 출력: 공사정산서, 공사내역(년도), 공사내역(월).\n\n3. `BCS103` 설계기록부: 검색조건 → [조회]. 기록부번호가 없는 항목 선택 → 설계기록부 작성 → [저장]. 수정·삭제 가능. [업로드]로 파일 관리. [설계기록부 출력] 리포트 출력.\n\n4. `BCS104` 감리기록부: 검색조건 → [조회]. 기록부번호가 없는 항목 선택 → 감리기록부 작성 → [저장]. 수정·삭제 가능. [업로드]로 파일 관리. [감리기록부 출력] 리포트 출력.\n\n## 현장지원 점검 시행·결과 확인 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1111`(현장지원)은 건축물 점검 시행 및 결과 확인 절차를 검증한다. 사전 조건: 로그인 상태.\n\n1. 점검대상 조회 및 점검표 작성(`MIS101` 점검대상)\n1.1. '점검대상' 화면으로 이동하면 현재 년·월 기준으로 자동 조회된다.\n1.2. 검색조건(년: `2023`, 월: `1`, 계약서: `김해대학교`, 사업소: `김해`)으로 조회한다.\n1.3. 항목 선정 후 [점검표 작성] → '점검표' 화면으로 이동.\n1.4. '기본정보'에서 대상 정보를 확인하고 점검항목을 점검한다. [불러오기]를 누르면 최근 점검내용이 로드된다.\n1.5. 점검 결과 기록: 담당자 `홍길동`, 점검일자 `2023-01-01` 필수 입력.\n1.6. [작성] → '저장 확인' 팝업 → [확인] → '저장 완료 확인' 팝업 → [확인] → '점검대상' 화면 복귀.\n\n2. 점검일지 수정(`MIS102` 점검일지)\n2.1. 검색조건(년: `2023`, 월: `1`, 건축물: `김해대학교`, 사업소: `김해`)으로 조회.\n2.2. [수정] → 점검표 수정(담당자 `홍길동`, 점검일자 `2023-01-01` 필수) → [수정] → 저장 완료 → '점검일지' 복귀.\n\n3. 사진 등록·삭제(`Picture` 점검일지 > 사진)\n3.1. [사진] 버튼 → [점검] / [불량] / [조치완료] 탭별로 사진 선택(2장 중 1장 [휴지통] 삭제 가능) → [저장].\n3.2. 사진 삭제: [휴지통] 버튼 클릭 시 빨간색으로 활성화. 우측 상단 [저장] 클릭 시 실제 삭제 진행.\n3.3. 삭제 완료 후 각 탭에 저장된 사진이 없음을 확인한다.\n\n4. 서명 등록·삭제(`Signature` 점검일지 > 서명)\n4.1. [서명] 버튼 → [터치하여 서명을 등록하세요] → '서명 등록' 창에서 서명 작성 → [생성] → [저장].\n- 지우기: 작성한 서명을 지운다.\n- 취소: 서명 작성 작업을 종료한다.\n4.2. '생성한 서명' 중 [휴지통]으로 1장 삭제 가능.\n4.3. 서명 삭제: [휴지통] 빨간색 활성화 → [저장] 시 실제 삭제. 삭제 후 저장된 서명이 없음을 확인한다.\n\n5. 점검일지 삭제(`MIS102`): [삭제] → [확인] → '삭제 완료 확인' 팝업 → [확인] → '점검일지' 복귀. '점검대상' 화면에서 삭제된 항목이 다시 조회되는 것을 확인한다.\n\n## 현장지원 위험물안전관리 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1112`(현장지원)는 건축물 위험물안전관리 시행 및 결과 확인 절차를 검증한다. 사전 조건: 로그인 상태.\n\n1. 위험물관리대상 조회 및 점검표 작성(`MIS103` 위험물관리대상)\n1.1. 화면 이동 시 현재 년·월 기준으로 자동 조회된다.\n1.2. 검색조건(년: `2023`, 월: `1`, 계약서: `루팩스`, 사업소: `창원`)으로 조회.\n1.3. 대상 선택 후 [점검표 작성] → 점검항목 확인. [불러오기]로 최근 점검내용을 로드한다.\n1.4. 결과 기록: 안전관리자 `홍길동`, 점검일자 `2023-01-01` 필수 입력.\n1.5. [작성] → '저장 확인' 팝업 → [확인] → '저장 완료 확인' 팝업 → [확인] → '위험물관리대상' 복귀.\n1.6. 1회 작성 후 조회 목록의 횟수가 `1/3`으로 표시된다. 2회 더 작성하면(총 3회) 해당 대상이 목록에서 사라진다.\n\n2. 위험물관리일지 수정(`MIS104` 위험물관리일지)\n2.1. 검색조건(년: `2023`, 월: `1`, 건축물: `루팩스`, 사업소: `창원`)으로 조회.\n2.2. 작성한 3개 중 1개 선택 → [수정] → 내용 수정(안전관리자 `홍길동`, 점검일자 `2023-01-01` 필수) → [수정] → 저장 완료.\n\n3. 사진 등록·삭제(`Picture` 위험물관리일지 > 사진)\n3.1. [사진] → [점검] / [불량] / [조치완료] 탭별 사진 선택(2장 중 1장 삭제 가능) → [저장].\n3.2. 삭제 시 [휴지통] 빨간색 활성화 후 [저장] 클릭으로 실제 삭제. 삭제 후 각 탭에 저장된 사진이 없음을 확인한다.\n\n4. 서명 등록·삭제(`Signature` 위험물관리일지 > 서명)\n4.1. [서명] → [터치하여 서명을 등록하세요] → '서명 등록' 팝업 → 서명 작성 → [생성] → [저장].\n- 지우기: 서명을 지운다. 취소: 작업 종료.\n4.2. 서명 삭제: [휴지통] 빨간색 활성화 → [저장] 클릭 시 실제 삭제. 삭제 후 저장된 서명이 없음을 확인한다.\n\n5. 위험물관리일지 삭제(`MIS104`): [삭제] → [확인] → 삭제 완료 확인 창 → [확인] → '위험물관리일지' 복귀. '위험물관리대상' 화면에서 삭제된 항목이 다시 표시되는 것을 확인한다.\n\n## 현장지원 긴급점검 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1113`(현장지원)은 건축물 긴급점검 시행 및 결과 확인 절차를 검증한다. 사전 조건: 로그인 상태.\n\n1. 긴급점검일지 작성(`MEM101` 긴급점검)\n1.1. '긴급점검' 화면으로 이동하면 현재 년·월 기준으로 자동 조회된다.\n1.2. 검색조건(년: `2023`, 월: `1`)으로 조회.\n1.3. 우측 상단 [점검표 작성] → '점검표' 화면으로 이동 → 점검 시행.\n1.4. 결과 기록: 건축물 `김해대학교`, 사업소 `김해`, 방문자 `홍길동`, 방문일자 `2023-01-01` 필수 입력.\n1.5. [작성] → '저장 확인' 팝업 → [확인] → '저장 완료 확인' 팝업 → [확인] → '긴급점검' 화면 복귀.\n\n2. 긴급점검일지 수정(`MEM101`)\n2.1. 검색조건(년: `2023`, 월: `1`, 건축물: `김해대학교`, 사업소: `김해`)으로 조회.\n2.2. [수정] → 내용 수정(건축물·사업소·방문자·방문일자 필수) → [수정] → 저장 완료 → '긴급점검일지' 화면 복귀.\n\n3. 사진 등록·삭제(`Picture` 긴급점검 > 사진)\n3.1. [사진] → [주요현상] / [처리확인] / [기타] 탭별 사진 선택(2장 중 1장 삭제 가능) → [저장].\n3.2. 삭제: [휴지통] 빨간색 활성화 → [저장] 클릭 시 실제 삭제. 각 탭에 저장된 사진이 없음을 확인한다.\n\n4. 서명 등록·삭제(`Signature` 긴급점검 > 서명)\n4.1. [서명] → [터치하여 서명을 등록하세요] → '서명 등록' 팝업 → 서명 작성 → [생성] → [저장].\n- 지우기: 서명을 지운다. 취소: 작업 종료.\n4.2. '생성한 서명' 중 [휴지통]으로 삭제 가능.\n4.3. 서명 삭제: [휴지통] 빨간색 활성화 → [저장] 클릭 시 실제 삭제. 저장된 서명이 없음을 확인한다.\n\n5. 긴급점검일지 삭제(`MEM101`): [삭제] → [확인] → '삭제 완료 확인' 팝업 → [확인] → '긴급점검일지' 화면 복귀.\n\n## 현장지원 건축물 이력 조회 시나리오\n\u003c!-- applied: 2026-1111-바탕-세움-13 -->\n시나리오 `TE_PID_CC_1114`(현장지원)는 건축물 이력 조회 절차를 검증한다. 사전 조건: 로그인 상태.\n\n1. 건축물이력 조회(`MBD101` 건축물이력)\n1.1. '건축물이력' 화면 최초 진입 시 전체 조회된다(기본 검색조건: 건축물 없음).\n1.2. 검색조건에서 건축물 `김해대학교`를 입력하여 조회하면 해당 건물 이력이 조회된다.\n\n2. 건축물이력 상세조회(`MBD101H1` 건축물이력 > 건축물정보)\n2.1. 조회된 건물에서 [이력 조회] 버튼을 클릭하면 '건축물정보' 화면으로 이동된다.\n2.2. 탭별 확인 내용:\n\n| 탭 | 출력 내용 |\n|---|---|\n| [건축물정보] | 해당 건축물의 정보 |\n| [연도정보] | 해당 건축물의 연도정보 |\n| [점검정보] | 해당 건축물의 점검정보 |\n| [계약정보] | 해당 건축물의 계약정보 |\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- 백오피스 기초정보 관리 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n- 백오피스 관리그룹 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n- 백오피스 회계그룹 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n- 백오피스 점검모듈 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n- 백오피스 공사모듈 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n- 현장지원 점검 시행·결과 확인 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n- 현장지원 위험물안전관리 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n- 현장지원 긴급점검 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n- 현장지원 건축물 이력 조회 시나리오\n  - 2026-11-11 [바탕 세움](../../work/2026-1111-%EB%B0%94%ED%83%95-%EC%84%B8%EC%9B%80-13.md)\n\u003c!-- /kmd:참고 -->\n"},{"k":"A","l":"안 A 작성기준 확장","t":"# 통합테스트계획서\n\n차세대 나라119 정보시스템 현장지원 서브시스템의 통합테스트 시나리오를 시나리오 하나에 항목 하나로 적는다. 시나리오 안은 하위 시나리오마다 덩이 하나와 단계 표 하나이고, 단계 번호는 원본 번호를 그대로 쓴다. 시나리오는 TE_PID_CC_1111 ~ TE_PID_CC_1114 넷이다.\n\n## TE_PID_CC_1111: 건축물 점검 시행 및 결과 확인\n\n이 시나리오는 건축물 점검을 시행하고 점검일지 · 사진 · 서명의 등록 · 수정 · 삭제 결과를 확인한다.\n\n| 속성 | 값 |\n|---|---|\n| 단계 | 시험 |\n| 작성 | 사경진 |\n| 작성일 | 2022-12-27 |\n| 관련 프로세스 ID | - |\n| 관련 요구사항 ID | - |\n| 사전 조건 | 로그인 상태이어야 한다. |\n| 사후 조건 | - |\n| 테스트 결과 | PASS/FAIL |\n\n1. 점검대상 조회\n\n| 번호 | 화면 | 수행 절차 | 테스트 데이터 | 예상 결과 |\n|---|---|---|---|---|\n| 1 | MIS101 점검대상 | '점검대상' 화면으로 이동한다. | - | '점검대상' 화면으로 이동된다. |\n| 2 | - | '점검대상'은 '검색조건' 기준으로 자동 조회된다. | [default] 년: 현재날짜의 년 · 월: 현재날짜의 월 | '검색조건'에 해당되는 '점검대상'이 조회된다. |\n| 3 | - | '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '점검대상'을 조회한다. | 년: 2023년 · 월: 1월 · 계약서: 김해대학교 · 사업소: 김해 | '검색조건'에 해당되는 '점검대상'이 조회된다. |\n\n2. 점검표 작성\n\n| 번호 | 화면 | 수행 절차 | 테스트 데이터 | 예상 결과 |\n|---|---|---|---|---|\n| 4 | - | 점검을 진행 할 항목을 선정하고 [점검표 작성] 버튼을 클릭한다. | - | '점검표' 화면으로 이동된다. |\n| 5 | MIS101R1 점검대상 > 점검표 | '기본정보'에서 점검을 진행 할 대상의 정보를 확인한다. | - | 점검을 진행 할 대상의 정보가 표시된다. |\n| 6 | - | 점검항목을 확인하고 점검한다. | - | - |\n| 7 | - | [불러오기] 버튼을 눌러 최근에 작성한 점검표 결과를 불러와 기초 데이터로 활용한다. | - | 해당 점검 대상의 최근 점검내용을 불러온다. |\n| 8 | - | 점검 결과를 기록한다. | [필수] 담당자: 홍길동 · 점검일자: 2023-01-01 | - |\n| 9 | - | [작성] 버튼을 눌러 점검표를 저장 작업을 진행한다. | - | '저장 확인' 팝업 창이 나타난다. |\n| 10 | - | [확인] 버튼을 눌러 점검표를 저장한다. | - | '저장 완료 확인' 팝업 창이 나타난다. |\n| 11 | - | [확인] 버튼을 눌러 점검표 저장을 완료한다. | - | '점검대상' 화면으로 이동된다. |\n\n3. 점검일지 조회\n\n| 번호 | 화면 | 수행 절차 | 테스트 데이터 | 예상 결과 |\n|---|---|---|---|---|\n| 12 | MIS102 점검일지 | '점검일지' 화면으로 이동한다. | - | '점검일지' 화면으로 이동된다. |\n| 13 | - | '점검일지'은 '검색조건' 기준으로 자동 조회된다. | [default] 년: 현재날짜의 년 · 월: 현재날짜의 월 | '검색조건'에 해당하는 '점검일지'가 조회된다. |\n\n4. 점검일지 수정\n\n| 번호 | 화면 | 수행 절차 | 테스트 데이터 | 예상 결과 |\n|---|---|---|---|---|\n| 14 | - | '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. | 년: 2023년 · 월: 1월 · 건축물: 김해대학교 · 사업소: 김해 | '검색조건'에 해당하는 '점검일지'가 조회된다. |\n| 15 | - | 조회된 점검일지에서 [수정] 버튼을 클릭한
