박스 검증은 게이트웨이 PC 에서 `C:\\dpms-gw\\bin\\gw-verify.cmd [--from YYYY-MM-DD] [--to YYYY-MM-DD]`. 종료 코드 0 이상 없음 · 1 문제 · 2 인자 오류. 서비스를 멈추지 않아도 된다\r\n- 납품 패키지 목록 › 1. 패키지:\r\n* 연계 게이트웨이: `dpms-gateway-0.1.0.zip` (76.8 MB, SHA-256 `9C228746673A7BD280761822B3157202AB393D86E4E240CC4DBDCD6BA89619C1`, dpms_gateway b0628ce) → `dpms-gateway-1.0.0.zip` (78.6 MB, SHA-256 `3B4EBB15A4D553FA097C74E46415CA7511B9C64B7EBE23FC2E6669982AF09CBE`, dpms_gateway af0af86, 2026-11-09 빌드, 후보판)\r\n* DPMS 웹: `dpms-0.9-20261017.zip` (88.9 MB, SHA-256 `E1FF87FDAB572956F6BBC7C23EB42F119DDCDE81341F329918C52506C2167523`, dpms_backoffice 8936fc3 커밋 직전 작업 트리, `VERSION.txt` 커밋 742f26d, Java 21) → `dpms-1.0.0-20261109.zip` (89.7 MB, SHA-256 `82C18EE5B1658FD725634A67C7B81ED4824A1966AB99038D0F80444C57F240DB`, dpms_backoffice 68e0efb, 2026-11-09 빌드, 후보판)\r\n* 이전 판: `dpms-gateway-0.1.0.zip` · `dpms-0.9-20261017.zip` · `dpms-0.9-20261015.zip` (GDI 판, 115.2 MB, SHA-256 `B4A94944D733DA9FECA33678640F29D82411825B9FC6AF0430A44F9A30B358E9`, dpms_backoffice b65591a) 은 1.0.0 으로 대체하고 납품하지 않는다\r\n* 런타임: 두 패키지 모두 Java 17.0.9 · WinSW 2.12.0. 빌드 스크립트는 JDK 17 이 아니면 그 JDK 를 건너뛰고(`dist\\jdk17.ps1`), WinSW 가 없으면 멈춘다(일부러 뺄 때만 `-NoWinSw`)\r\n* 확인: 패키지 안 `checksums.txt` 로 파일마다, zip 옆 `.sha256` 으로 묶음을 확인한다\r\n\r\n## 까닭\r\n- 지난 묶음이 JRE 21 로 묶였고 DPMS 웹은 DB 스크립트가 V014 까지라 최신 코드와 달랐다.\r\n- 갱신 때 V014 처럼 되돌릴 수 없는 스크립트를 백업 없이 적용할 위험이 있었다.\r\n- 게이트웨이 설계서 §8 · 운영설계서 10절 #6 이 약속한 블랙박스 검증 명령이 진입점에 이어지지 않았다.\r\n- 패키지 단위 서비스 개발 TODO(8.3 작업문서)를 진행했다. 정한 사람: 사경진 과장.\r\n\r\n## 버린 안\r\n- 갱신 백업을 설치 절차서 안내로만 두는 안: 현장 방문 작업에서 빠뜨리기 쉬워, 스크립트가 백업하고 실패하면 멈추게 했다.\r\n\r\n## 영향\r\n- 설치 리허설(관리자 권한 PC) · 내부 시험 서버 187 · 188 반영 · 72시간 구동 뒤 확정판을 다시 만든다.\r\n- 백업 파일 보관 · 폐기는 발주처와 협의한다(SER-05).\r\n\r\n## 근거\r\n- 커밋: dpms_docs 2dc9d4a (브랜치 docs/package-release)\r\n- 커밋: dpms_gateway af0af86 (feat/package-release) · dpms_backoffice 68e0efb (feat/redesign-mockup)\r\n- 문서 판: 설치절차서 v0.9 · 운영절차서 v0.9 · 납품패키지목록 2026-11-09\r\n"},{"k":"B","l":"안 B 정보 유형","t":"---\r\nid: 2026-1109-패키지-1.0.0-후보판\r\ntitle: \"패키지 1.0.0 후보판: 갱신 자동 백업 · 되돌리기 · 블랙박스 검증 · 빌드 JDK 17 고정\"\r\ndate: 2026-11-09 13:02\r\nauthor: kjsa\r\ntouches:\r\n  - 설치절차:갱신되돌리기\r\n  - 납품:패키지\r\ntags:\r\n  - held\r\n---\r\n\r\n# 패키지 1.0.0 후보판: 갱신 자동 백업 · 되돌리기 · 블랙박스 검증 · 빌드 JDK 17 고정\r\n\r\n연계 게이트웨이 · DPMS 웹 패키지를 최신 코드 · Java 17 · 판 1.0.0 으로 다시 묶었다. DPMS 웹 갱신은 새 DB 스크립트 전에 자동 백업하고, 두 패키지에 rollback.ps1, 게이트웨이에 블랙박스 검증 명령을 넣었다.\r\n\r\n## 바뀐 것\r\n- 고침: 게이트웨이 패키지: `dpms-gateway-0.1.0`(b0628ce) → `dpms-gateway-1.0.0`\r\n* 새 값: gw af0af86 · JRE 17.0.9 · db V001 ~ V005\r\n- 고침: DPMS 웹 패키지: `dpms-0.9-20261017`(JRE 21 · db V001 ~ V014) → `dpms-1.0.0-20261109`\r\n* 새 값: bo 68e0efb · JRE 17.0.9 · db V001 ~ V021\r\n- 고침: DPMS 웹 갱신 백업: 손으로 `pg_dump` → `install.ps1` 이 새 `V*.sql` 적용 전 `backup\\` 에 자동 `pg_dump`\r\n* 백업이 실패하면 적용하지 않는다. `-NoBackup` 으로만 뺀다\r\n- 고침: 되돌리기: 손으로 jar · war 복사 → 두 패키지 `rollback.ps1`\r\n* DPMS 웹은 `-DbBackup` 이면 DB 도 되돌린다\r\n- 새로: 블랙박스 검증: 없음 → `bin\\gw-verify.cmd`(`dpms-gateway.jar verify`)\r\n* 종료 코드 0 · 1 · 2\r\n- 고침: 빌드: `JAVA_HOME` 그대로 → `dist\\jdk17.ps1` 로 JDK 17 만\r\n* WinSW 가 없으면 빌드가 멈춘다\r\n- 새로: DPMS 웹 설치 인자: `-MapPmtiles`(`DPMS_MAP_PMTILES`)\r\n\r\n## 까닭\r\n- 지난 묶음이 JRE 21 로 묶였고 DPMS 웹은 DB 스크립트가 V014 까지라 최신 코드와 달랐다.\r\n- 갱신 때 V014 처럼 되돌릴 수 없는 스크립트를 백업 없이 적용할 위험이 있었다.\r\n- 게이트웨이 설계서 §8 · 운영설계서 10절 #6 이 약속한 블랙박스 검증 명령이 진입점에 이어지지 않았다.\r\n- 정한 사람 · 일: 사경진 과장 · 패키지 단위 서비스 개발 TODO(8.3 작업문서).\r\n\r\n## 버린 안\r\n- 갱신 백업을 설치 절차서 안내로만 두는 안: 현장 방문 작업에서 빠뜨리기 쉬워 스크립트가 하고 실패하면 멈추게 했다.\r\n\r\n## 영향\r\n- 설치 리허설(관리자 권한 PC) · 내부 시험 서버 187 · 188 반영 · 72시간 구동 뒤 확정판을 다시 만든다.\r\n- 백업 파일 보관 · 폐기는 발주처와 협의한다(SER-05).\r\n\r\n## 근거\r\n- dpms_docs 커밋 2dc9d4a (브랜치 docs/package-release)\r\n- dpms_gateway af0af86 (feat/package-release) · dpms_backoffice 68e0efb (feat/redesign-mockup)\r\n- 설치절차서 v0.9 · 운영절차서 v0.9 · 납품패키지목록 2026-11-09\r\n\r\n## 넣지 못함\r\n```json\r\n[\r\n {\r\n  \"doc\": \"docs/8.3_설치준비/설치절차서.md\",\r\n  \"heading\": \"7. 갱신 · 되돌리기\",\r\n  \"coord\": \"설치절차:갱신되돌리기\",\r\n  \"code\": \" ":"C","l":"안 C 블록 스키마","t":"---\nid: 2026-1109-패키지-1.0.0-후보판\ntitle: \"패키지 1.0.0 후보판: 갱신 자동 백업 · 되돌리기 · 블랙박스 검증 · 빌드 JDK 17 고정\"\ndate: 2026-11-09 13:02\nauthor: kjsa\ntouches:\n  - 설치절차:갱신되돌리기\n  - 납품:패키지\ntags:\n  - held\n---\n\n# 패키지 1.0.0 후보판: 갱신 자동 백업 · 되돌리기 · 블랙박스 검증 · 빌드 JDK 17 고정\n\n연계 게이트웨이 · DPMS 웹 패키지를 최신 코드 · Java 17 · 판 1.0.0 으로 다시 묶었다. DPMS 웹 갱신은 새 DB 스크립트 전에 자동 백업하고, 두 패키지에 rollback.ps1, 게이트웨이에 블랙박스 검증 명령을 넣었다.\n\n## 바뀐 것\n- **게이트웨이 패키지**: dpms-gateway-0.1.0 (b0628ce) → dpms-gateway-1.0.0 (gw af0af86 · JRE 17.0.9 · db V001 ~ V005)\n- **DPMS 웹 패키지**: dpms-0.9-20261017 (JRE 21 · db V001 ~ V014) → dpms-1.0.0-20261109 (bo 68e0efb · JRE 17.0.9 · db V001 ~ V021)\n- **DPMS 웹 갱신 백업**: 손으로 pg_dump → install.ps1 이 새 V*.sql 적용 전 backup\\ 에 자동 pg_dump\n* 백업이 실패하면 적용하지 않는다. -NoBackup 으로만 뺀다.\n- **되돌리기**: 손으로 jar · war 복사 → 두 패키지의 rollback.ps1\n* DPMS 웹은 -DbBackup 이면 DB 도 되돌린다.\n- **블랙박스 검증**: 없음 → bin\\gw-verify.cmd (dpms-gateway.jar verify · 종료 코드 0 · 1 · 2)\n- **빌드 JDK**: JAVA_HOME 그대로 → dist\\jdk17.ps1 로 JDK 17 만\n- **빌드 WinSW**: 새로: 없으면 빌드 멈춤\n- **DPMS 웹 설치 인자**: 새로: -MapPmtiles (DPMS_MAP_PMTILES)\n\n## 까닭\n- **판 어긋남**: 지난 묶음이 JRE 21 로 묶였고 DPMS 웹은 DB 스크립트가 V014 까지라 최신 코드와 달랐다.\n- **되돌릴 수 없는 스크립트**: 갱신 때 V014 처럼 되돌릴 수 없는 스크립트를 백업 없이 적용할 위험이 있었다.\n- **약속한 명령**: 게이트웨이 설계서 §8 · 운영설계서 10절 #6 이 약속한 블랙박스 검증 명령이 진입점에 이어지지 않았다.\n- **정한 곳 · 사람**: 패키지 단위 서비스 개발 TODO (8.3 작업문서) 진행 · 사경진 과장\n\n## 버린 안\n- **갱신 백업을 설치 절차서 안내로만 두는 안**: 현장 방문 작업에서 빠뜨리기 쉬워 스크립트가 하고 실패하면 멈추게 했다.\n\n## 영향\n- **확정판**: 설치 리허설(관리자 권한 PC) · 내부 시험 서버 187 · 188 반영 · 72시간 구동 뒤 확정판을 다시 만든다.\n- **백업 파일**: 보관 · 폐기는 발주처와 협의한다(SER-05).\n\n## 근거\n- **dpms_docs**: 커밋 2dc9d4a (브랜치 docs/package-release)\n- **dpms_gateway**: af0af86 (feat/package-release)\n- **dpms_backoffice**: 68e0efb (feat/redesign-mockup)\n- **문서 판**: 설치절차서 v0.9 · 운영절차서 v0.9 · 납품패키지목록 2026-11-09\n\n## 넣지 못함\n```json\n[\n {\n  \"doc\": \"docs/8.3_설치준비/설치절차서.md\",\n  \"heading\": \"7. 갱신 · 되돌리기\",\n  \"coord\": \"설치절차:갱신되돌리기\",\n  \"code\": \"v 갱신 자동 백업 · 되돌리기 · 블랙박스 검증 · 빌드 JDK 17 고정\"\ndate: 2026-11-09 13:02\nauthor: kjsa\ntouches:\n  - 설치절차:갱신되돌리기\n  - 납품:패키지\ntags:\n  - held\n---\n\n# 패키지 1.0.0 후보판: 갱신 자동 백업 · 되돌리기 · 블랙박스 검증 · 빌드 JDK 17 고정\n\n게이트웨이 · DPMS 웹 패키지를 판 1.0.0 후보판으로 다시 묶었다(Java 17, 최신 코드). DPMS 웹 갱신은 새 DB 스크립트 전에 저절로 백업하고, 두 패키지에 `rollback.ps1`, 게이트웨이에 블랙박스 검증 명령이 생겼다. 확정판은 설치 리허설과 72시간 구동 뒤 다시 만든다.\n\n## 바뀐 것\n- 게이트웨이 패키지: `dpms-gateway-0.1.0`(b0628ce) → `dpms-gateway-1.0.0`(gw af0af86 · JRE 17.0.9 · db V001 ~ V005)\n- DPMS 웹 패키지: `dpms-0.9-20261017`(JRE 21 · db V001 ~ V014) → `dpms-1.0.0-20261109`(bo 68e0efb · JRE 17.0.9 · db V001 ~ V021)\n- DPMS 웹 갱신 백업: 손으로 `pg_dump` → `install.ps1` 이 새 `V*.sql` 적용 전 `backup\\` 에 `pg_dump`\n* 백업이 실패하면 적용하지 않는다. `-NoBackup` 으로만 뺀다\n- 되돌리기: 손으로 jar · war 복사 → 두 패키지의 `rollback.ps1`\n* DPMS 웹은 `-DbBackup` 이면 DB 도 되돌린다\n- 블랙박스 검증: 없음 → `bin\\gw-verify.cmd`(`dpms-gateway.jar verify` · 종료 코드 0 · 1 · 2)\n- 빌드 JDK: `JAVA_HOME` 그대로 → `dist\\jdk17.ps1` 로 JDK 17 만\n* WinSW 가 없으면 빌드가 멈춘다\n- 새로: DPMS 웹 설치 인자 `-MapPmtiles`(`DPMS_MAP_PMTILES`)\n\n## 까닭\n- 지난 묶음이 JRE 21 로 묶였고 DPMS 웹은 DB 스크립트가 V014 까지라 최신 코드와 달랐다.\n- 갱신 때 V014 처럼 되돌릴 수 없는 스크립트를 백업 없이 적용할 위험이 있었다.\n- 게이트웨이 설계서 §8 · 운영설계서 10절 #6 이 약속한 블랙박스 검증 명령이 진입점에 이어지지 않았다.\n- 패키지 단위 서비스 개발 TODO(8.3 작업문서)를 따라 사경진 과장이 진행했다.\n\n## 버린 안\n- 갱신 백업을 설치 절차서 안내로만 두는 안: 현장 방문 작업에서 빠뜨리기 쉬워 스크립트가 하고 실패하면 멈추게 했다.\n\n## 영향\n- 남은 일: 설치 리허설(관리자 권한 PC) · 내부 시험 서버 187 · 188 반영 · 72시간 구동 뒤 확정판을 다시 만든다.\n- 협의: 백업 파일 보관 · 폐기는 발주처와 정한다(SER-05).\n\n## 근거\n- dpms_docs 커밋 2dc9d4a(브랜치 docs/package-release)\n- dpms_gateway af0af86(feat/package-release) · dpms_backoffice 68e0efb(feat/redesign-mockup)\n- 설치절차서 v0.9 · 운영절차서 v0.9 · 납품패키지목록 2026-11-09\n\n## 넣지 못함\n```json\n[\n {\n  \"doc\": \"docs/8.3_설치준비/설치절차서.md\",\n  \"heading\": \"7. 갱신 · 되돌리기\",\n  \"coord\": \"설치절차:갱신되돌리기\",\n  \"code\": \"values\",\n  \"why\": \"근거에 없는 값이 있다: C:\\\\dpms-gw\\\\rollback.ps1 · C:\\\\dpms-web\\\\rollback.ps1 · rollback.ps1-DbBackup\u003c백업파일>-PsqlPath\u003cpsql.ex const hl=t=>esc(t).split('\n').map(l=>/^##? /.test(l)?'<span class="h2">'+l+'</span>':/^- \*\*[^*]+\*\*:/.test(l)?l.replace(/^(- \*\*[^*]+\*\*:)/,'<span class="lab">$1</span>'):/^\|/.test(l)?'<span class="tb">'+l+'</span>':/^&lt;!--/.test(l)?'<span class="ref">'+l+'</span>':l).join('\n');
const sc=document.getElementById('score');
P.score.forEach(v=>{const tot=v.s.reduce((a,b)=>a+b,0);const d=document.createElement('div');d.className='card'+(v.k==='A'?' win':'');d.innerHTML='<div class="tot">'+tot+' <small>/ '+(P.crit.length*5)+' · 안 '+v.k+' '+esc(v.l)+'</small></div>'+P.crit.map((c,i)=>'<div class="bar"><i title="'+esc(c)+'">'+esc(c)+'</i><u style="--w:'+(v.s[i]*20)+'%"></u><em>'+v.s[i]+'</em></div>').join('');sc.appendChild(d)});
let cur=0,left='src',right='A';
const tabs=document.getElementById('samples');
P.data.forEach((s,i)=>{const b=document.createElement('button');b.role='tab';b.innerHTML=esc(s.name)+'<small>'+esc(s.kind)+'</small>';b.onclick=()=>{cur=i;draw()};tabs.appendChild(b)});
function pane(el,side){const s=P.data[cur];const sel=side==='L'?left:right;const v=s.views.find(x=>x.k===sel)||s.views[0];
el.innerHTML='<div class="ph">'+s.views.map(x=>'<button aria-pressed="'+(x.k===v.k)+'" data-k="'+x.k+'">'+esc(x.l)+'</button>').join('')+'</div><pre>'+hl(v.t)+'</pre><div class="meta">'+v.t.length.toLocaleString()+' 자 · 머리 '+(v.t.match(/^## /gm)||[]).length+' · 표 줄 '+(v.t.match(/^\|/gm)||[]).length+'</div>';
el.querySelectorAll('.ph button').forEach(b=>b.onclick=()=>{if(side==='L')left=b.dataset.k;else right=b.dataset.k;draw()})}
function draw(){[...tabs.children].forEach((b,i)=>b.setAttribute('aria-selected',i===cur));const s=P.data[cur];
document.getElementById('verdict').textContent='가장 좋은 안: '+(s.best||'-')+' · '+s.why;
pane(document.getElementById('L'),'L');pane(document.getElementById('R'),'R')}
draw();
</script></body></html>
