통 속성은 넷 모두 같다.\r\n\r\n| 속성 | 값 |\r\n|---|---|\r\n| 시스템명 | 나라119정보시스템 (시나리오 표의 시스템명은 차세대 나라119 정보시스템) |\r\n| 서브시스템명 | 현장지원 |\r\n| 단계명 | 시험 |\r\n| 작성자 | 사경진 |\r\n| 작성일자 | 2022-12-27 |\r\n\r\n시나리오 ID 와 개요는 다음과 같다.\r\n\r\n- [TE_PID_CC_1111](#TE_PID_CC_1111): 건축물 점검 시행 및 결과 확인에 대한 시나리오\r\n- [TE_PID_CC_1112](#TE_PID_CC_1112): 건축물 위험물안전관리 시행 및 결과 확인에 대한 시나리오\r\n- `TE_PID_CC_1113`: 건축물 긴급점검 시행 및 결과 확인에 대한 시나리오\r\n- `TE_PID_CC_1114`: 건축물 이력 조회에 대한 시나리오\r\n\r\n## TE_PID_CC_1111: 건축물 점검 시행 및 결과 확인\r\n\r\nTE_PID_CC_1111 은 건축물 점검을 시행하고 점검일지 · 사진 · 서명 · 삭제까지 결과를 확인하는 시나리오다.\r\n\r\n| 속성 | 값 |\r\n|---|---|\r\n| 사전 조건 | 로그인 상태이어야 한다. |\r\n| 사후 조건 | - |\r\n| 관련 프로세스 ID | - |\r\n| 관련 요구사항 ID | - |\r\n| 테스트 결과 | PASS/FAIL |\r\n\r\n1. 점검대상 조회\r\n1) [MIS101 점검대상] '점검대상' 화면으로 이동한다. → '점검대상' 화면으로 이동된다.\r\n2) '점검대상'은 '검색조건' 기준으로 자동 조회된다. → '검색조건'에 해당되는 '점검대상'이 조회된다.\r\n- 데이터(default): 년 현재날짜의 년 · 월 현재날짜의 월\r\n3) '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '점검대상'을 조회한다. → '검색조건'에 해당되는 '점검대상'이 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 계약서 김해대학교 · 사업소 김해\r\n2. 점검표 작성\r\n4) 점검을 진행 할 항목을 선정하고 [점검표 작성] 버튼을 클릭한다. → '점검표' 화면으로 이동된다.\r\n5) [MIS101R1 점검대상 > 점검표] '기본정보'에서 점검을 진행 할 대상의 정보를 확인한다. → 점검을 진행 할 대상의 정보가 표시된다.\r\n6) 점검항목을 확인하고 점검한다.\r\n7) [불러오기] 버튼을 눌러 최근에 작성한 점검표 결과를 불러와 기초 데이터로 활용한다. → 해당 점검 대상의 최근 점검내용을 불러온다.\r\n8) 점검 결과를 기록한다.\r\n- 데이터(필수): 담당자 홍길동 · 점검일자 2023-01-01\r\n9) [작성] 버튼을 눌러 점검표를 저장 작업을 진행한다. → '저장 확인' 팝업 창이 나타난다.\r\n10) [확인] 버튼을 눌러 점검표를 저장한다. → '저장 완료 확인' 팝업 창이 나타난다.\r\n11) [확인] 버튼을 눌러 점검표 저장을 완료한다. → '점검대상' 화면으로 이동된다.\r\n3. 점검일지 조회\r\n12) [MIS102 점검일지] '점검일지' 화면으로 이동한다. → '점검일지' 화면으로 이동된다.\r\n13) '점검일지'은 '검색조건' 기준으로 자동 조회된다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터(default): 년 현재날짜의 년 · 월 현재날짜의 월\r\n4. 점검일지 수정\r\n14) '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\r\n15) 조회된 점검일지에서 [수정] 버튼을 클릭한다. → '점검표' 화면으로 이동된다.\r\n16) [MIS102R1 점검일지 > 점검표] 점검일지 내용을 수정한다.\r\n- 데이터(필수): 담당자 홍길동 · 점검일자 2023-01-01\r\n17) [수정] 버튼을 눌러 점검표를 저장 작업을 진행한다. → '저장 확인' 팝업 창이 나타난다.\r\n18) [확인] 버튼을 눌러 점검표를 저장한다. → '저장 완료 확인' 팝업 창이 나타난다.\r\n19) [확인] 버튼을 눌러 점검표 저장을 완료한다. → '점검일지' 화면으로 이동된다.\r\n5. 점검일지 사진등록\r\n20) [MIS102 점검일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\r\n21) 조회된 점검일지에서 [사진] 버튼을 클릭한다. → '사진' 화면으로 이동된다.\r\n22) [Picture 점검일지 > 사진] [점검] 탭을 클릭한다. → [점검] 탭으로 이동된다.\r\n23) [터치하여 사진을 선택하세요] 버튼을 클릭한다. → '사진선택' 화면으로 이동한다.\r\n24) 업로드 할 사진을 2장 선택한다. → '선택한 파일'에 사진이 나타난다.\r\n25) '선택한 파일'에 등록된 사진 중 1장을 [휴지통] 버튼을 눌러 삭제한다. → '선택한 파일'에 해당 사진이 삭제된다.\r\n26) [불량], [조치완료] 탭을 클릭하여 [점검] 탭과 동일한 작업을 진행한다.\r\n27) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\r\n28) [확인] 버튼을 눌러 사진을 저장한다. → '저장 완료 확인' 팝업 창이 나타난다.\r\n29) [확인] 버튼을 눌러 사진 저장을 완료한다. → '점검일지' 화면으로 이동된다.\r\n6. 점검일지 사진삭제\r\n30) [MIS102 점검일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\" 을 입력하여 '점검일지'을 조회한다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\r\n31) 조회된 점검일지의 [사진] 버튼에 체크 표시를 확인하고 클릭한다. → '사진' 화면으로 이동된다.\r\n32) [Picture 점검일지 > 사진] [점검] 탭을 클릭한다. → [점검] 탭으로 이동된다.\r\n33) '저장된 파일'에 등록된 사진에 [휴지통] 버튼을 눌러 삭제 표시한다. → 삭제 표시된 사진 항목의 [휴지통] 버튼의 색상이 빨간색으로 활성화 된다.\r\n* 우측 상단 [저장] 버튼을 눌렀을 때 실제로 삭제 작업이 진행된다.\r\n34) [불량], [조치완료] 탭을 클릭하여 [점검] 탭과 동일한 작업을 진행한다.\r\n35) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\r\n36) [확인] 버튼을 눌러 사진을 저장한다. → '저장 완료 확인' 팝업 창이 나타난다.\r\n37) [확인] 버튼을 눌러 사진 저장을 완료한다. → '점검일지' 화면으로 이동된다.\r\n7. 사진 삭제 확인\r\n38) [MIS102 점검일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\r\n39) 조회된 점검일지의 [사진] 버튼에 체크 표시가 사라진 것을 확인하고 [사진] 버튼을 클릭한다. → '사진' 화면으로 이동된다.\r\n40) [Picture 점검일지 > 사진] [점검], [불량], [조치완료] 탭을 눌러서 '저장된 파일'에 등록된 사진이 없는 것을 확인한다. → '저장된 파일'에 등록된 사진이 존재하지 않는다.\r\n41) 좌측 상단의 [X] 버튼을 클릭한다. → '점검일지' 화면으로 이동된다.\r\n8. 점검일지 서명등록\r\n42) [MIS102 점검일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\r\n43) 조회된 점검일지의 [서명] 버튼을 클릭한다. → '서명' 화면으로 이동된다.\r\n44) [Signature 점검일지 > 서명] [터치하여 서명을 등록하세요] 버튼을 클릭한다. → '서명 등록' 창이 나타난다.\r\n45) 서명을 작성한다. → 작성한 서명이 표시된다.\r\n46) '생성' 버튼을 눌러 서명을 작성한다. → 서명 등록' 창이 사라지고 '생성한 서명'에 서명이 나타난다.\r\n* 지우기: 작성한 서명을 지운다.\r\n* 취소: 서명 작성 작업을 종료한다.\r\n47) '생성한 서명'에 등록된 서명 중 1장을 [휴지통] 버튼을 눌러 삭제한다. → '생성한 서명'에 해당 서명이 삭제된다.\r\n48) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\r\n49) [확인] 버튼을 눌러 서명을 저장한다. → '저장 완료 확인' 팝업 창이 나타난다.\r\n50) [확인] 버튼을 눌러 서명 저장을 완료한다. → '점검일지' 화면으로 이동된다.\r\n9. 점검일지 서명삭제\r\n51) [MIS102 점검일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\r\n52) 조회된 점검일지의 [서명] 버튼에 체크가 표시된 것을 확인하고 [서명] 버튼을 클릭한다. → '서명' 화면으로 이동된다.\r\n53) [Signature 점검일지 > 서명] '저장된 서명'에 등록된 서명에 [휴지통] 버튼을 눌러 삭제 표시한다. → 삭제 표시된 사진 항목의 [휴지통] 버튼의 색상이 빨간색으로 활성화 된다.\r\n* 우측 상단 [저장] 버튼을 눌렀을 때 실제로 삭제 작업이 진행된다.\r\n54) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\r\n55) [확인] 버튼을 눌러 서명을 저장한다. → '저장 완료 확인' 팝업 창이 나타난다.\r\n56) [확인] 버튼을 눌러 서명 저장을 완료한다. → '점검일지' 화면으로 이동된다.\r\n10. 서명 삭제 확인\r\n57) [MIS102 점검일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\r\n58) 조회된 점검일지의 [서명] 버튼에 체크 표시가 사라진 것을 확인하고 [서명] 버튼을 클릭한다. → '서명' 화면으로 이동된다.\r\n59) [Signature 점검일지 > 서명] '저장된 서명'에 등록된 서명이 없는 것을 확인한다. → '저장된 서명'에 등록된 서명이 존재하지 않는다.\r\n60) 좌측 상단의 [X] 버튼을 클릭한다. → 점검일지' 화면으로 이동된다.\r\n11. 점검일지 삭제\r\n61) [MIS102 점검일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. → '검색조건'에 해당하는 '점검일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\r\n62) 조회된 점검일지의 [삭제] 버튼을 클릭한다.\r\n63) [확인] 버튼을 눌러 삭제를 진행한다. → \"삭제 완료 확인\" 팝업 창이 나타난다.\r\n64) [확인] 버튼을 눌러 삭제를 완료한다. → '점검일지' 화면으로 이동된다.\r\n12. 삭제 확인\r\n65) [MIS101 점검대상] '점검대상' 화면으로 이동한다. → '점검대상' 화면으로 이동된다.\r\n66) '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '점검대상'을 조회한다. → 점검일지에서 삭제되었기 때문에 해당 점검대상이 다시 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 계약서 김해대학교 · 사업소 김해\r\n\r\n## TE_PID_CC_1112: 건축물 위험물안전관리 시행 및 결과 확인\r\n\r\nTE_PID_CC_1112 는 건축물 위험물안전관리 점검을 세 번 시행하고 위험물관리일지 · 사진으로 결과를 확인하는 시나리오다.\r\n\r\n| 속성 | 값 |\r\n|---|---|\r\n| 사전 조건 | 로그인 상태이어야 한다. |\r\n| 사후 조건 | - |\r\n| 관련 프로세스 ID | - |\r\n| 관련 요구사항 ID | - |\r\n| 테스트 결과 | PASS/FAIL |\r\n\r\n1. 위험물 관리 대상 조회\r\n1) [MIS103 위험물관리대상] '위험물관리대상' 화면으로 이동한다. → '위험물관리대상' 화면으로 이동된다.\r\n2) '위험물관리대상'은 '검색조건' 기준으로 자동 조회된다. → '검색조건' 기준에 해당하는 '위험물관리'이 조회된다.\r\n- 데이터(default): 년 현재날짜의 년 · 월 현재날짜의 월\r\n3) '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '위험물관리대상'을 조회한다. → '검색조건'에 해당되는 '점검대상'이 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 계약서 루팩스 · 사업소 창원\r\n2. 점검표 작성\r\n4) '위험물관리대상'에서 점검을 진행할 대상을 찾고 [점검표 작성] 버튼을 클릭한다. → '점검표' 화면으로 이동된다.\r\n5) [MIS103R1 위험물관리대상 > 점검표] 점검항목을 확인하고 점검을 시행한다.\r\n6) [불러오기] 버튼을 눌러 최근에 작성한 점검표 결과를 불러와 기초 데이터로 활용한다. → 해당 점검 대상의 최근 점검내용이 작성된다.\r\n7) 점검을 시행한 결과를 기록한다.\r\n- 데이터(필수): 안전관리자 홍길동 · 점검일자 2023-01-01\r\n8) [작성] 버튼을 눌러 점검표를 저장 작업을 진행한다. → \"저장 확인\" 팝업 창이 나타난다.\r\n9) [확인] 버튼을 눌러 점검표를 저장한다. → \"저장 완료 확인\" 팝업 창이 나타난다.\r\n10) [확인] 버튼을 눌러 점검표 저장을 완료한다. → '위험물관리대상' 화면으로 이동된다.\r\n3. 점검 횟수 확인\r\n11) [MIS103 위험물관리대상] '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '위험물관리대상'을 조회한다. → '검색조건'에 해당되는 '점검대상'이 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 계약서 루팩스 · 사업소 창원\r\n12) 조회된 '위험물관리대상'에 횟수가 1/3이 된 것을 확인한다.\r\n13) 해당 '위험물관리대상'의 [점검표 작성] 버튼을 눌러 점검표를 2회 더 작성한다.\r\n14) [위험물관리대상] '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '위험물관리대상'을 조회한다. → '검색조건'에 해당되는 '점검대상'이 출력되지 않는다.\r\n- 데이터: 년 2023년 · 월 1월 · 계약서 루팩스 · 사업소 창원\r\n* 점검 횟수 3회를 모두 작성했기 때문에 '위험물관리대상'에서 조회 되지 않는다.\r\n4. 위험물관리일지 조회\r\n15) [MIS104 위험물관리일지] '위험물관리일지' 화면으로 이동한다. → '위험물관리일지' 화면으로 이동된다.\r\n16) '위험물관리일지'는 '검색조건' 기준으로 자동 조회된다. → '검색조건'에 해당하는 '위험물관리일지'가 조회된다.\r\n- 데이터(default): 년 현재날짜의 년 · 월 현재날짜의 월\r\n5. 위험물관리일지 수정\r\n17) '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"를 입력하여 '위험물관리일지'을 조회한다. → '검색조건'에 해당하는 '위험물관리일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 루팩스 · 사업소 창원\r\n18) 조회된 '위험물관리일지'에서 [수정] 버튼을 클릭한다. → '점검표' 화면으로 이동된다.\r\n* 작성한 위험물관리일지 3개 중에 1개를 선택합니다.\r\n19) [MIS104R1 위험물관리일지 > 점검표] 위험물관리일지 내용을 수정한다.\r\n- 데이터(필수): 안전관리자 홍길동 · 점검일자 2023-01-01\r\n20) [수정] 버튼을 눌러 점검표를 저장 작업을 진행한다. → \"저장 확인\" 팝업 창이 나타난다.\r\n21) [확인] 버튼을 눌러 점검표를 저장한다. → \"저장 완료 확인\" 팝업 창이 나타난다.\r\n22) [확인] 버튼을 눌러 점검표 저장을 완료한다. → '위험물관리일지' 화면으로 이동된다.\r\n6. 위험물일지 사진등록\r\n23) [MIS104 위험물관리일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"를 입력하여 '위험물관리일지'을 조회한다. → '검색조건'에 해당하는 '위험물관리일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 루팩스 · 사업소 창원\r\n24) 조회된 '위험물관리일지'에서 [사진] 버튼을 클릭한다. → '사진' 화면으로 이동된다.\r\n25) [Picture 위험물관리일지 > 사진] [점검] 탭을 클릭한다. → [점검] 탭으로 이동된다.\r\n26) [터치하여 사진을 선택하세요] 버튼을 클릭한다. → '사진선택' 화면으로 이동한다.\r\n27) 업로드 할 사진을 2장 선택한다. → '선택한 파일'에 사진이 조회된다.\r\n28) '선택한 파일'에 등록된 사진 중 1장을 [휴지통] 버튼을 눌러 삭제한다. → '선택한 파일'에 해당 사진이 삭제된다.\r\n29) [불량], [조치완료] 탭을 클릭하여 [점검] 탭과 동일한 작업을 진행한다.\r\n30) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\r\n31) [확인] 버튼을 눌러 사진을 저장한다. → \"저장 완료 확인\" 팝업 창이 나타난다.\r\n32) [확인] 버튼을 눌러 사진 저장을 완료한다. → '위험물관리일지' 화면으로 이동된다.\r\n7. 위험물관리일지 사진삭제\r\n33) [MIS104 위험물관리일지] '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"를 입력하여 '위험물관리일지'을 조회한다. → '검색조건'에 해당하는 '위험물관리일지'가 조회된다.\r\n- 데이터: 년 2023년 · 월 1월 · 건축물 루팩스 · 사업소 창원\r\n34) 조회된 위험물관리일지의 [사진] 버튼에 체크 표시를 확인하고 클릭한다. → '사진' 화면으로 이동된다.\r\n35) [Picture 위험물관리일지 > 사진] [점검] 탭을 클릭한다. → [점검] 탭으로 이동된다.\r\n36) '저장된 파일'에 등록된 사진에 [휴지통] 버튼을 눌러 삭제 표시한다. → 삭제 표시된 사진 항목의 [휴지통] 버튼의 색상이 빨간색으로 활성화 된다.\r\n* 우측 상단 [저장] 버튼을 눌렀을 때 실제로 삭제 작업이 진행된다.\r\n37) [불량], [조치완료] 탭을 클릭하여 [점검] 탭과 동일한 작업을 진행\r\n\r\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\r\n**참고**\r\n\r\n- (문서)\r\n  - 글 출처: NRC_TE_110 통합테스트계획서 현장지원 v0.9 (작성일자 2022-12-27 · 작성 개발 사경진 2022-12-27 0.7 · 검토 개발 PL 박재성 2022-12-27 0.8 · 검토 PM 김덕기 2022-12-29 0.9 · 승인 나라기업 김지현 1.0 · 개정 1.0 전체 최초 작성 사경진). 원본 앞 22k 자만 옮겼다: TE_PID_CC_1112 는 단계 37 에서 끊기고 TE_PID_CC_1113 · TE_PID_CC_1114 는 목록에만 있다. 빈 열(테스트 결과(결함번호) · 비고)과 순번 열은 옮기지 않았다\r\n\u003c!-- /kmd:참고 -->\r\n"},{"k":"C","l":"안 C 블록 스키마","t":"# 통합테스트계획서\n\n차세대 나라119 정보시스템 현장지원 서브시스템의 통합테스트 시나리오를 시나리오마다 항목 하나로 적는다. 단계는 시험, 작성은 사경진(2022-12-27)이고 시나리오는 넷이다. 이 표본은 원본 앞부분만 옮겨 `TE_PID_CC_1112` 는 37단계에서 끊기고 1113 · 1114 는 단계가 없다.\n\n## TE_PID_CC_1111: 건축물 점검 시행 및 결과 확인\n\n건축물 점검 시행 및 결과 확인 시나리오다. 단계 66개를 화면 순서대로 밟고, 번호는 원본 No. 그대로다.\n\n- **사전 조건**: 로그인 상태이어야 한다.\n- **사후 조건**: -\n- **관련 프로세스 ID**: -\n- **관련 요구사항 ID**: -\n- **시험 결과**: PASS/FAIL\n\n1. 점검대상 조회\n1) 화면 `MIS101` 점검대상: '점검대상' 화면으로 이동한다. 기대: '점검대상' 화면으로 이동된다.\n2) '점검대상'은 '검색조건' 기준으로 자동 조회된다. 기대: '검색조건'에 해당되는 '점검대상'이 조회된다.\n* 데이터(기본값): 년 현재날짜의 년 · 월 현재날짜의 월\n3) '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '점검대상'을 조회한다. 기대: '검색조건'에 해당되는 '점검대상'이 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 계약서 김해대학교 · 사업소 김해\n2. 점검표 작성\n4) 점검을 진행 할 항목을 선정하고 [점검표 작성] 버튼을 클릭한다. 기대: '점검표' 화면으로 이동된다.\n5) 화면 `MIS101R1` 점검대상 > 점검표: '기본정보'에서 점검을 진행 할 대상의 정보를 확인한다. 기대: 점검을 진행 할 대상의 정보가 표시된다.\n6) 점검항목을 확인하고 점검한다.\n7) [불러오기] 버튼을 눌러 최근에 작성한 점검표 결과를 불러와 기초 데이터로 활용한다. 기대: 해당 점검 대상의 최근 점검내용을 불러온다.\n8) 점검 결과를 기록한다.\n* 데이터(필수): 담당자 홍길동 · 점검일자 2023-01-01\n9) [작성] 버튼을 눌러 점검표를 저장 작업을 진행한다. 기대: '저장 확인' 팝업 창이 나타난다.\n10) [확인] 버튼을 눌러 점검표를 저장한다. 기대: '저장 완료 확인' 팝업 창이 나타난다.\n11) [확인] 버튼을 눌러 점검표 저장을 완료한다. 기대: '점검대상' 화면으로 이동된다.\n3. 점검일지 조회\n12) 화면 `MIS102` 점검일지: '점검일지' 화면으로 이동한다. 기대: '점검일지' 화면으로 이동된다.\n13) '점검일지'은 '검색조건' 기준으로 자동 조회된다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터(기본값): 년 현재날짜의 년 · 월 현재날짜의 월\n4. 점검일지 수정\n14) '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\n15) 조회된 점검일지에서 [수정] 버튼을 클릭한다. 기대: '점검표' 화면으로 이동된다.\n16) 화면 `MIS102R1` 점검일지 > 점검표: 점검일지 내용을 수정한다.\n* 데이터(필수): 담당자 홍길동 · 점검일자 2023-01-01\n17) [수정] 버튼을 눌러 점검표를 저장 작업을 진행한다. 기대: '저장 확인' 팝업 창이 나타난다.\n18) [확인] 버튼을 눌러 점검표를 저장한다. 기대: '저장 완료 확인' 팝업 창이 나타난다.\n19) [확인] 버튼을 눌러 점검표 저장을 완료한다. 기대: '점검일지' 화면으로 이동된다.\n5. 점검일지 사진등록\n20) 화면 `MIS102` 점검일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\n21) 조회된 점검일지에서 [사진] 버튼을 클릭한다. 기대: '사진' 화면으로 이동된다.\n22) 화면 `Picture` 점검일지 > 사진: [점검] 탭을 클릭한다. 기대: [점검] 탭으로 이동된다.\n23) [터치하여 사진을 선택하세요] 버튼을 클릭한다. 기대: '사진선택' 화면으로 이동한다.\n24) 업로드 할 사진을 2장 선택한다. 기대: '선택한 파일'에 사진이 나타난다.\n25) '선택한 파일'에 등록된 사진 중 1장을 [휴지통] 버튼을 눌러 삭제한다. 기대: '선택한 파일'에 해당 사진이 삭제된다.\n26) [불량], [조치완료] 탭을 클릭하여 [점검] 탭과 동일한 작업을 진행한다.\n27) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\n28) [확인] 버튼을 눌러 사진을 저장한다. 기대: '저장 완료 확인' 팝업 창이 나타난다.\n29) [확인] 버튼을 눌러 사진 저장을 완료한다. 기대: '점검일지' 화면으로 이동된다.\n6. 점검일지 사진삭제\n30) 화면 `MIS102` 점검일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\" 을 입력하여 '점검일지'을 조회한다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\n31) 조회된 점검일지의 [사진] 버튼에 체크 표시를 확인하고 클릭한다. 기대: '사진' 화면으로 이동된다.\n32) 화면 `Picture` 점검일지 > 사진: [점검] 탭을 클릭한다. 기대: [점검] 탭으로 이동된다.\n33) '저장된 파일'에 등록된 사진에 [휴지통] 버튼을 눌러 삭제 표시한다. 기대: 삭제 표시된 사진 항목의 [휴지통] 버튼의 색상이 빨간색으로 활성화 된다.\n* 우측 상단 [저장] 버튼을 눌렀을 때 실제로 삭제 작업이 진행된다.\n34) [불량], [조치완료] 탭을 클릭하여 [점검] 탭과 동일한 작업을 진행한다.\n35) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\n36) [확인] 버튼을 눌러 사진을 저장한다. 기대: '저장 완료 확인' 팝업 창이 나타난다.\n37) [확인] 버튼을 눌러 사진 저장을 완료한다. 기대: '점검일지' 화면으로 이동된다.\n38) 화면 `MIS102` 점검일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\n39) 조회된 점검일지의 [사진] 버튼에 체크 표시가 사라진 것을 확인하고 [사진] 버튼을 클릭한다. 기대: '사진' 화면으로 이동된다.\n40) 화면 `Picture` 점검일지 > 사진: [점검], [불량], [조치완료] 탭을 눌러서 '저장된 파일'에 등록된 사진이 없는 것을 확인한다. 기대: '저장된 파일'에 등록된 사진이 존재하지 않는다.\n41) 좌측 상단의 [X] 버튼을 클릭한다. 기대: '점검일지' 화면으로 이동된다.\n7. 점검일지 서명등록\n42) 화면 `MIS102` 점검일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\n43) 조회된 점검일지의 [서명] 버튼을 클릭한다. 기대: '서명' 화면으로 이동된다.\n44) 화면 `Signature` 점검일지 > 서명: [터치하여 서명을 등록하세요] 버튼을 클릭한다. 기대: '서명 등록' 창이 나타난다.\n45) 서명을 작성한다. 기대: 작성한 서명이 표시된다.\n46) '생성' 버튼을 눌러 서명을 작성한다. 기대: 서명 등록' 창이 사라지고 '생성한 서명'에 서명이 나타난다.\n* 지우기: 작성한 서명을 지운다.\n* 취소: 서명 작성 작업을 종료한다.\n47) '생성한 서명'에 등록된 서명 중 1장을 [휴지통] 버튼을 눌러 삭제한다. 기대: '생성한 서명'에 해당 서명이 삭제된다.\n48) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\n49) [확인] 버튼을 눌러 서명을 저장한다. 기대: '저장 완료 확인' 팝업 창이 나타난다.\n50) [확인] 버튼을 눌러 서명 저장을 완료한다. 기대: '점검일지' 화면으로 이동된다.\n8. 점검일지 서명삭제\n51) 화면 `MIS102` 점검일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\n52) 조회된 점검일지의 [서명] 버튼에 체크가 표시된 것을 확인하고 [서명] 버튼을 클릭한다. 기대: '서명' 화면으로 이동된다.\n53) 화면 `Signature` 점검일지 > 서명: '저장된 서명'에 등록된 서명에 [휴지통] 버튼을 눌러 삭제 표시한다. 기대: 삭제 표시된 사진 항목의 [휴지통] 버튼의 색상이 빨간색으로 활성화 된다.\n* 우측 상단 [저장] 버튼을 눌렀을 때 실제로 삭제 작업이 진행된다.\n54) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\n55) [확인] 버튼을 눌러 서명을 저장한다. 기대: '저장 완료 확인' 팝업 창이 나타난다.\n56) [확인] 버튼을 눌러 서명 저장을 완료한다. 기대: '점검일지' 화면으로 이동된다.\n57) 화면 `MIS102` 점검일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\n58) 조회된 점검일지의 [서명] 버튼에 체크 표시가 사라진 것을 확인하고 [서명] 버튼을 클릭한다. 기대: '서명' 화면으로 이동된다.\n59) 화면 `Signature` 점검일지 > 서명: '저장된 서명'에 등록된 서명이 없는 것을 확인한다. 기대: '저장된 서명'에 등록된 서명이 존재하지 않는다.\n60) 좌측 상단의 [X] 버튼을 클릭한다. 기대: 점검일지' 화면으로 이동된다.\n9. 점검일지 삭제\n61) 화면 `MIS102` 점검일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"을 입력하여 '점검일지'을 조회한다. 기대: '검색조건'에 해당하는 '점검일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 김해대학교 · 사업소 김해\n62) 조회된 점검일지의 [삭제] 버튼을 클릭한다.\n63) [확인] 버튼을 눌러 삭제를 진행한다. 기대: \"삭제 완료 확인\" 팝업 창이 나타난다.\n64) [확인] 버튼을 눌러 삭제를 완료한다. 기대: '점검일지' 화면으로 이동된다.\n65) 화면 `MIS101` 점검대상: '점검대상' 화면으로 이동한다. 기대: '점검대상' 화면으로 이동된다.\n66) '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '점검대상'을 조회한다. 기대: 점검일지에서 삭제되었기 때문에 해당 점검대상이 다시 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 계약서 김해대학교 · 사업소 김해\n\n## TE_PID_CC_1112: 건축물 위험물안전관리 시행 및 결과 확인\n\n건축물 위험물안전관리 시행 및 결과 확인 시나리오다. 단계 37개를 화면 순서대로 밟고, 번호는 원본 No. 그대로다.\n\n- **사전 조건**: 로그인 상태이어야 한다.\n- **사후 조건**: -\n- **관련 프로세스 ID**: -\n- **관련 요구사항 ID**: -\n- **시험 결과**: PASS/FAIL\n\n1. 위험물 관리 대상 조회\n1) 화면 `MIS103` 위험물관리대상: '위험물관리대상' 화면으로 이동한다. 기대: '위험물관리대상' 화면으로 이동된다.\n2) '위험물관리대상'은 '검색조건' 기준으로 자동 조회된다. 기대: '검색조건' 기준에 해당하는 '위험물관리'이 조회된다.\n* 데이터(기본값): 년 현재날짜의 년 · 월 현재날짜의 월\n3) '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '위험물관리대상'을 조회한다. 기대: '검색조건'에 해당되는 '점검대상'이 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 계약서 루팩스 · 사업소 창원\n2. 점검표 작성\n4) '위험물관리대상'에서 점검을 진행할 대상을 찾고 [점검표 작성] 버튼을 클릭한다. 기대: '점검표' 화면으로 이동된다.\n5) 화면 `MIS103R1` 위험물관리대상 > 점검표: 점검항목을 확인하고 점검을 시행한다.\n6) [불러오기] 버튼을 눌러 최근에 작성한 점검표 결과를 불러와 기초 데이터로 활용한다. 기대: 해당 점검 대상의 최근 점검내용이 작성된다.\n7) 점검을 시행한 결과를 기록한다.\n* 데이터(필수): 안전관리자 홍길동 · 점검일자 2023-01-01\n8) [작성] 버튼을 눌러 점검표를 저장 작업을 진행한다. 기대: \"저장 확인\" 팝업 창이 나타난다.\n9) [확인] 버튼을 눌러 점검표를 저장한다. 기대: \"저장 완료 확인\" 팝업 창이 나타난다.\n10) [확인] 버튼을 눌러 점검표 저장을 완료한다. 기대: '위험물관리대상' 화면으로 이동된다.\n11) 화면 `MIS103` 위험물관리대상: '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '위험물관리대상'을 조회한다. 기대: '검색조건'에 해당되는 '점검대상'이 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 계약서 루팩스 · 사업소 창원\n12) 조회된 '위험물관리대상'에 횟수가 1/3이 된 것을 확인한다.\n13) 해당 '위험물관리대상'의 [점검표 작성] 버튼을 눌러 점검표를 2회 더 작성한다.\n14) 화면 위험물관리대상: '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '위험물관리대상'을 조회한다. 기대: '검색조건'에 해당되는 '점검대상'이 출력되지 않는다.\n* 데이터: 년 2023년 · 월 1월 · 계약서 루팩스 · 사업소 창원\n* 점검 횟수 3회를 모두 작성했기 때문에 '위험물관리대상'에서 조회 되지 않는다.\n3. 위험물관리일지 조회\n15) 화면 `MIS104` 위험물관리일지: '위험물관리일지' 화면으로 이동한다. 기대: '위험물관리일지' 화면으로 이동된다.\n16) '위험물관리일지'는 '검색조건' 기준으로 자동 조회된다. 기대: '검색조건'에 해당하는 '위험물관리일지'가 조회된다.\n* 데이터(기본값): 년 현재날짜의 년 · 월 현재날짜의 월\n4. 위험물관리일지 수정\n17) '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"를 입력하여 '위험물관리일지'을 조회한다. 기대: '검색조건'에 해당하는 '위험물관리일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 루팩스 · 사업소 창원\n18) 조회된 '위험물관리일지'에서 [수정] 버튼을 클릭한다. 기대: '점검표' 화면으로 이동된다.\n* 작성한 위험물관리일지 3개 중에 1개를 선택합니다.\n19) 화면 `MIS104R1` 위험물관리일지 > 점검표: 위험물관리일지 내용을 수정한다.\n* 데이터(필수): 안전관리자 홍길동 · 점검일자 2023-01-01\n20) [수정] 버튼을 눌러 점검표를 저장 작업을 진행한다. 기대: \"저장 확인\" 팝업 창이 나타난다.\n21) [확인] 버튼을 눌러 점검표를 저장한다. 기대: \"저장 완료 확인\" 팝업 창이 나타난다.\n22) [확인] 버튼을 눌러 점검표 저장을 완료한다. 기대: '위험물관리일지' 화면으로 이동된다.\n5. 위험물일지 사진등록\n23) 화면 `MIS104` 위험물관리일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"를 입력하여 '위험물관리일지'을 조회한다. 기대: '검색조건'에 해당하는 '위험물관리일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 루팩스 · 사업소 창원\n24) 조회된 '위험물관리일지'에서 [사진] 버튼을 클릭한다. 기대: '사진' 화면으로 이동된다.\n25) 화면 `Picture` 위험물관리일지 > 사진: [점검] 탭을 클릭한다. 기대: [점검] 탭으로 이동된다.\n26) [터치하여 사진을 선택하세요] 버튼을 클릭한다. 기대: '사진선택' 화면으로 이동한다.\n27) 업로드 할 사진을 2장 선택한다. 기대: '선택한 파일'에 사진이 조회된다.\n28) '선택한 파일'에 등록된 사진 중 1장을 [휴지통] 버튼을 눌러 삭제한다. 기대: '선택한 파일'에 해당 사진이 삭제된다.\n29) [불량], [조치완료] 탭을 클릭하여 [점검] 탭과 동일한 작업을 진행한다.\n30) 우측 상단에 [저장] 버튼을 눌러 작업내용을 저장한다.\n31) [확인] 버튼을 눌러 사진을 저장한다. 기대: \"저장 완료 확인\" 팝업 창이 나타난다.\n32) [확인] 버튼을 눌러 사진 저장을 완료한다. 기대: '위험물관리일지' 화면으로 이동된다.\n6. 위험물관리일지 사진삭제\n33) 화면 `MIS104` 위험물관리일지: '검색조건'에서 \"년\", \"월\", \"건축물\", \"사업소\"를 입력하여 '위험물관리일지'을 조회한다. 기대: '검색조건'에 해당하는 '위험물관리일지'가 조회된다.\n* 데이터: 년 2023년 · 월 1월 · 건축물 루팩스 · 사업소 창원\n34) 조회된 위험물관리일지의 [사진] 버튼에 체크 표시를 확인하고 클릭한다. 기대: '사진' 화면으로 이동된다.\n35) 화면 `Picture` 위험물관리일지 > 사진: [점검] 탭을 클릭한다. 기대: [점검] 탭으로 이동된다.\n36) '저장된 파일'에 등록된 사진에 [휴지통] 버튼을 눌러 삭제 표시한다. 기대: 삭제 표시된 사진 항목의 [휴지통] 버튼의 색상이 빨간색으로 활성화 된다.\n* 우측 상단 [저장] 버튼을 눌렀을 때 실제로 삭제 작업이 진행된다.\n37) [불량], [조치완료] 탭을 클릭하여 [점검] 탭과 동일한 작업을 진행(표본이 여기서 끊김)\n\n## TE_PID_CC_1113: 건축물 긴급점검 시행 및 결과 확인\n\n건축물 긴급점검 시행 및 결과 확인 시나리오다. 이 표본은 원본 앞부분만 옮겨 머리 칸과 단계가 없다.\n\n- **사전 조건**: 미기재\n- **사후 조건**: 미기재\n- **관련 프로세스 ID**: 미기재\n- **관련 요구사항 ID**: 미기재\n- **시험 결과**: 미기재\n\n1. 단계\n미기재\n\n## TE_PID_CC_1114: 건축물 이력 조회\n\n건축물 이력 조회 시나리오다. 이 표본은 원본 앞부분만 옮겨 머리 칸과 단계가 없다.\n\n- **사전 조건**: 미기재\n- **사후 조건**: 미기재\n- **관련 프로세스 ID**: 미기재\n- **관련 요구사항 ID**: 미기재\n- **시험 결과**: 미기재\n\n1. 단계\n미기재\n\n\u003c!-- kmd:참고 · kmd 가 적고 고친다. 손으로 고치지 않는다 -->\n**참고**\n\n- (문서)\n  - 글 출처: NRC_TE_110 통합테스트계획서 현장지원 v0.9 (작성일자 2022.12.27) · 비밀구분 일반 · 원본 앞 22k\n  - 승인 이력: 작성 개발 사경진 2022-12-27 v0.7 · 검토 개발 PL 박재성 2022-12-27 v0.8 · 검토 PM 김덕기 2022-12-29 v0.9 · 승인 나라기업 김지현 v1.0\n  - 개정 이력: 1.0 · 전체 · 최초 작성 · 사경진 · 시행일자 없음\n  - 들일 때 고친 꼴: 엑셀 일련번호 날짜 44922 → 2022-12-27 · 44924 → 2022-12-29 · 모든 시나리오에 같은 머리 칸(시스템명 차세대 나라119 정보시스템 · 서브시스템명 현장지원 · 단계명 시험 · 작성자 사경진 · 작성일자 2022-12-27)은 문서 요약에 한 번 · 모두 빈 열(테스트 결과(결함번호) · 비고)은 옮기지 않음 · 목록 시트는 항목 차례로\n  - 옮기지 않은 시트: 표지\n\u003c!-- /kmd:참고 -->\n"},{"k":"D","l":"안 D 읽기 우선","t":"# 통합테스트계획서\n\n차세대 나라119 정보시스템 현장지원 서브시스템의 통합테스트 시나리오 넷(`TE_PID_CC_1111` ~ `TE_PID_CC_1114`)을 정한다. 시나리오마다 화면 순서대로 수행 절차 · 테스트 데이터 · 예상 결과를 둔다. 모든 시나리오의 사전 조건은 로그인 상태다.\n\n## 시나리오 목록\n\n현장지원 시나리오 넷이다. 시스템명은 모두 나라119정보시스템, 서브시스템명은 현장지원이다.\n\n\u003c!-- baseline: kmd 목록 · 항목에서 다시 만든다 -->\n| 시나리오 ID | 시나리오 개요 |\n|---|---|\n| [TE_PID_CC_1111](#TE_PID_CC_1111) | 건축물 점검 시행 및 결과 확인에 대한 시나리오 |\n| [TE_PID_CC_1112](#TE_PID_CC_1112) | 건축물 위험물안전관리 시행 및 결과 확인에 대한 시나리오 |\n| `TE_PID_CC_1113` | 건축물 긴급점검 시행 및 결과 확인에 대한 시나리오 |\n| `TE_PID_CC_1114` | 건축물 이력 조회에 대한 시나리오 |\n\u003c!-- /baseline -->\n\n## TE_PID_CC_1111: 건축물 점검 시행 및 결과 확인\n\n점검대상에서 점검표를 쓰고, 점검일지에서 수정 · 사진 · 서명을 등록하고 지운 뒤, 일지를 지우면 그 점검대상이 다시 조회되는지 확인한다. 단계 66개를 흐름 9개로 나눈다.\n\n- **사전 조건**: 로그인 상태이어야 한다.\n- **사후 조건**: -\n- **관련 요구사항 ID**: -\n- **관련 프로세스 ID**: -\n- **테스트 결과**: 칸 양식 `PASS/FAIL`. 단계별 「테스트 결과(결함번호)」 · 「비고」 칸은 모두 비어 있다\n- **단계 · 작성**: 시험 · 사경진 2022-12-27\n\n화면 칸의 「〃」 은 윗줄과 같은 화면이다.\n\n1. 점검대상 조회 (1 ~ 3)\n\n| No | 화면 | 수행 절차 | 테스트 데이터 | 예상 결과 |\n|---|---|---|---|---|\n| 1 | MIS101 점검대상 | '점검대상' 화면으로 이동한다. | - | '점검대상' 화면으로 이동된다. |\n| 2 | 〃 | '점검대상'은 '검색조건' 기준으로 자동 조회된다. | 기본값(년: 현재날짜의 년 · 월: 현재날짜의 월) | '검색조건'에 해당되는 '점검대상'이 조회된다. |\n| 3 | 〃 | '검색조건'에서 \"년\", \"월\", \"계약서\", \"사업소\"를 입력하여 '점검대상'을 조회한다. | 년: 2023년 · 월: 1월 · 계약서: 김해대학교 · 사업소: 김해 | '검색조건'에 해당되는 '점검대상'이 조회된다. |\n\n2. 점검표 작성 (4 ~ 11)\n\n| No | 화면 | 수행 절차 | 테스트 데이터 | 예상 결과 |\n|---|---|---|---|---|\n| 4 | MIS101 점검대상 | 점검을 진행 할 항목을 선정하고 [점검표 작성] 버튼을 클릭한다. | - | '점검표' 화면으로 이동된다. |\n| 5 | MIS101R1 점검대상 > 점검표 | '기본정보'에서 점검을 진행 할 대상의 정보를 확인한다. | - | 점검을 진행 할 대상의 정보가 표시된다. |\n| 6 | 〃 | 점검항목을 확인하고 점검한다. | - | - |\n| 7 | 〃 | [불러오기] 버튼을 눌러 최근에 작성한 점검표 결과를 불러와 기초 데이터로 활용한다. | - | 해당 점검 대상의 최근 점검내용을 불러온다. |\n| 8 | 〃 | 점검 결과를 기록한다. | 필수(담당자: 홍길동 · 점검일자: 2023-01-01) | - |\n| 9 | 〃 | [작성] 버튼을 눌러 점검표를 저장 작업을 진행한다. | - | '저장 확인' 팝업 창이 나타난다. |\n| 10 | 〃 | [확인] 버튼을 눌러 점검표를 저장한다. | - | '저장 완료 확인' 팝업 창이 나타난다. |\n| 11 | 〃 | [확인] 버튼을 눌러 점검표 저장을 완료한다. | - | '점검대상' 화면으로 이동된다. |\n\n3. 점검일지 조회 (12 ~ 13)\n\n| No | 화면 | 수행 절차 | 테스트 데이터 | 예상 결과 |\n|---|---|---|---|---|\n| 12 | MIS102 점검일지 | '점검일지' 화면으로 이동한다. | - | '점검일지' 화면으로 이동된다. |\n| 13 | 〃 | '점검
