<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메뉴 개편 목업</title>
<!--
  메뉴 개편 목업(N0) · 근거: docs/품질개선/KMD_메뉴개편_설계.md v2(3 설명 정책 · 4 이름 · 5 개인 메뉴 · 6 팀 메뉴 · 7 옆 메뉴 꼴 · 8 기초 세우기 · 12 시나리오)
  · 앞선 결정: KMD_지식관리_설계.md v2 · KMD_바탕세우기_설계.md v2(엔진은 그대로)

  실제 서비스처럼 눌러 보는 목업이다. 조종판은 없다. 오른쪽 아래 「목업」 알약 하나:
  개인 / 팀 바꾸기 · 사람(팀: 총괄 관리자 김지수 · 지식관리자 이도윤 · 쓰기 박서연 · 읽기 최민준) · 처음 상태로 · 라이트 / 다크 / 시스템
  · 시나리오 길잡이(누르면 그 시나리오의 처음 상태와 시작 화면) · 이 화면의 (!) 수 · 지금 폭.
  자료는 이 파일 안의 작은 상태(M)이고 이 브라우저에만 남는다(localStorage · 없어도 돈다). 주소(#/…)로 뒤로 가기가 된다.

  이 목업의 핵심: 화면에 보이는 글은 제목 · 칸 이름 · 단추 · 상태 · 숫자 · 오류 · 위험 경고만. 덧말은 모두 (!) 정보 단추(.tipb) 툴팁(.pop.tipp).
  누름 · Enter · Space 로 열고 Esc · 바깥 누름으로 닫는다(hover 로 열지 않음 · 닫히면 초점은 그 단추로 · 한 번에 하나).

  시나리오 길잡이(설계 12절)
   S1 개인 · 첫 실행: 옆 메뉴 「지식이 없다」 → [+ 새 지식] → 이름 · [저장소 붙이기 ▸] · 「가지 main ▸」 펼치기 → [생성]
      → 창이 다음 걸음 카드로 바뀜 → [기초 세우기](지식 메뉴 넷이 비활성 → 활성)
   S2 개인 · 기초 세우기 일곱 걸음: 지식(「문서 n」 칩 줄은 못 고름 · 설계노트 고름) → 재료 [고르기] D:\자료\온보딩 → [조사]
      → 거르기(비밀 의심 1 빠짐 · [모두 넣기]) → 구조안(Claude 안 / 폴더 그대로 · 이름 고침) → 짓기(처음 3 [승인] → [모두 짓기] → [연습 판])
      → 진단 → [넣기] → 끝 [지식 열기]
   S3 개인 · 수기수집: 본문 탭 수기수집 · 자동수집 · [파일] [폴더] [글] · 빈 지식 한 줄 · 진행(도는 일 · 끝난 일 · 살펴볼 일 · 앞에 다른 지식 일)
      · 줄 누르면 흐름 · 터미널 · [잠깐 멈춤] [그만두기]
   S4 개인 · 자동수집: [+ 더하기] → DB · GIT · 폴더 → 창(언제 「바뀔 때」 · 무엇을 (!)) → [더하기] → 줄 · [모두 수집]
   S5 개인 · 공유: 「팀 연결 없음」 [잇기] → [받을 곳 정하기] → 기록 · 문서 탭에서 고름 → 경고 한 줄 늘 보임 → [고른 n 보내기]
   S6 개인 · 문서: 옆 메뉴 보기 탭 「목차 · 항목 · 기록 · 그래프」 · 나무 · 연필 [구조] → 항목 끌기 / [옮기기] / 문서 둘 [합치기] → [저장]
      → 점검 탭 · 이력(이 지식 / 모든 지식 · 값 바뀜 [보기])
   S7 개인 · 모든 지식: 표(⋮⋮ 끌어 순서 · 저장소 칩 · 메뉴에서 뺌 · ⋯) · 지식 폴더 [복사] [동기화] [바꾸기] · 줄 누름 → 지식 상세
      › 저장소(주소 · 가지 접기 · [붙이기]) · [불러오기](주소 · 가지 · 이름) · 삭제(이름 다시 치기)
   S8 개인 · 설정 셋(지식백업 · Claude 연결 · 에이전트 설치) · 머리 줄 동그라미(화면 밝기 · 내 기기) · 찾기(Ctrl K) 안 「비슷한 글」
   S9 팀 · 총괄 관리자: 확인 3 배지 → 넣지 못함 [열기] → [다시 넣기] / [버리기] · 점검 · 승인 [승인해 넣기] → 설정 › 팀 일꾼 · 운영(오늘 › 부탁 링크)
   S10 팀 · 총괄 관리자 · 기초 세우기: 온보딩(테스트) 고름 → [폴더 올리기](한도 칩 · 원본이 팀 서버로 간다 경고) → 거르기
      → 구조안(비용 숫자 · 「팀 일꾼 없음」 칩 · 폴더 그대로만) → 짓기 → 진단(넣지 못함 n) → 넣기
   S11 팀 · 지식관리자: 생성 › 자동수집 머리 부탁 카드 [더하기] [거절] · 모든 지식 › 운영지식 › 저장소 보기만(주소 가림)
      · 권한 · 정책 바꿈 · 삭제 탭 · [불러오기] 없음 · 지식관리 › 사람 보기만
   S12 팀 · 쓰기: 수기수집 [폴더] D:\자료\계약서(25 파일) → 오류 줄 + [에이전트 설치] · 자동수집 [+ 부탁] · 확인 › 넣지 못함 내 것
      · 설정 › 서버 정보 › 로그인(비밀번호(10자 이상) · 내 설정 찾기 · 나가기). 알약에서 읽기로 → 확인 · 생성 숨김 · 모든 지식 정보 탭만
-->
<style>
/* kmd 화면 — 처음은 docs/kmd_목업_인터랙션.html 의 CSS 를 옮겼다(목업 조종판 규칙만 뺌).
   기준은 docs/kmd_디자인_컨벤션.md v0.2 — 색 · 글 크기 · 간격 · 모서리 · 그림자 · 층 · 폭은 아래 :root 토큰만 쓴다(1절).
   부품 견본: app/styleguide.html */
:root{
  --hit:24px;
  /* 면 · 선 */
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f7;--surface-3:#e6eaf0;--hover:#f5f7fa;
  --border:#e2e6ed;--border-strong:#c9d1dd;--border-input:#7d8799;
  /* 글 — --text-3 #646d7b: 흰 바탕 5.23:1 · --surface-2(#f1f3f7) 위 4.71:1(WCAG 상대 휘도로 잼 · 옛 #858e9d 는 3.31 · 2.98) */
  --text:#11151c;--text-2:#515a68;--text-3:#646d7b;--on-accent:#fff;
  /* 뜻 색 — 파랑=주 일 · 고른 것 / 초록=됨 · 켜짐 / 노랑=멈춤 · 값 바뀜 / 빨강=못 함 · 지우기 / 보라=기다림 · 받은 것 */
  --accent:#3358e6;--accent-hover:#2a4bd0;--accent-bg:#e9eeff;--accent-line:#c3d0fb;
  /* --ok #237a47: ok-bg 위 4.72 · 흰 바탕 5.32 · surface-2 위 4.79(옛 #2e9b5b 는 3.13 · 3.53 — 작은 굵은 글에 모자랐다) */
  --ok:#237a47;--ok-bg:#e6f5ec;--ok-line:#bfe3cc;
  --warn:#8c5c00;--warn-bg:#fcf3e0;--warn-line:#d39a2c;
  /* --danger #b8321f: danger-bg 위 5.23 · 흰 바탕 5.98(옛 #cb3a2c 는 danger-bg 위 4.39) */
  --danger:#b8321f;--danger-bg:#fdeceb;--danger-line:#efb7b1;
  --pending:#6247c4;--pending-bg:#efedfd;--pending-line:#d9d2fb;
  /* 그래프 점 종류(모양과 함께만 쓴다 · 색만으로 가르지 않는다) — 흰 바탕 대비: 문서 10.35 · 항목 5.71 · 기록 5.18 · 파랑 · 주황은 색각 이상에도 갈린다 */
  --k-doc:#334155;--k-item:#3358e6;--k-rec:#c2410c;
  --g-ring:#fff;
  /* 그래프 칸 어두운 바탕(그래프만 · .gwrap.dark 가 위 토큰을 갈아 끼운다) — 글 대비: 글 #e6ebf5 15.8 · 흐린 글 #8a97b3 6.5 · 문서 #cbd5e1 12.8 · 항목 #7c9cff 7.3 · 기록 #fb923c 8.4(바탕 #0b1020 위) */
  --gd-bg:#0b1020;--gd-surface:#121a2e;--gd-surface-2:#18223a;--gd-border:#253252;--gd-border-strong:#3a4a72;
  --gd-text:#e6ebf5;--gd-text-2:#b2bdd3;--gd-text-3:#8a97b3;--gd-k-doc:#cbd5e1;--gd-k-item:#7c9cff;--gd-k-rec:#fb923c;--gd-accent:#8aa4ff;--gd-accent-bg:#1f2a4d;--gd-warn-bg:#3a2e12;
  /* 진한 띠(토스트 · 툴팁 · 고른 띠 · 「나」 표지) · 터미널(7절) */
  --ink:#11151c;--ink-2:#262d3b;--ink-text:#e8ecf3;
  --term-bg:#0f141c;--term-text:#d7dde8;--term-dim:#7d8696;--term-tool:#8fb0ff;--term-ok:#7fd69a;--term-err:#ff8f86;
  /* 글 크기 */
  --fs-xs:11px;--fs-sm:11.5px;--fs-mono:12px;--fs:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;
  --lh-tight:1.25;--lh:1.55;--lh-read:1.7;
  /* 간격 — 카드 안 · 카드 사이 14 · 영역 사이 22 */
  --sp-1:2px;--sp-2:4px;--sp-3:6px;--sp-4:8px;--sp-5:10px;--sp-6:12px;--sp-7:14px;--sp-8:16px;--sp-9:22px;
  /* 모서리 — 표지 · 작은 칩 · 단추 · 칸(팝업 · 모달) · 카드 · 알약 */
  --r-xs:4px;--r-sm:5px;--r:7px;--r-md:10px;--r-lg:12px;--r-pill:999px;
  /* 그림자 — 카드 · 팝업과 모달 · 맨 위에 뜨는 것(찾기 창 · 서랍) · 키보드 초점 고리 */
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);
  --shadow-2:0 2px 6px -1px rgba(15,23,42,.08),0 14px 32px -8px rgba(15,23,42,.18);
  --shadow-3:0 18px 48px rgba(15,23,42,.28);
  --focus-ring:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
  /* 층 — 토스트는 모달 위 */
  --z-menu:20;--z-scrim:70;--z-pop:80;--z-toast:90;
  /* 화면 최대 폭(2절) · 옆 메뉴 · 오른쪽 칸 */
  --w-text:820px;--w-list:980px;--w-grid:1100px;--w-side:248px;--w-aside:300px;
  /* 접힌 옆 메뉴 · 오른쪽 칸(레일) · 너비 잡이 · 그래프 팝업 */
  --w-rail:48px;--w-grip:6px;--w-graph:400px;
  /* 글꼴 — 모노는 경로 · 주소 · 이름 · 시각에만 */
  --font:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono",D2Coding,"Malgun Gothic",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/var(--lh) var(--font);word-break:keep-all;overflow-wrap:break-word}
button,input,textarea,select{font:inherit}
a{color:var(--accent);cursor:pointer}


/* 아이콘 기본 크기(구체적인 규칙이 이긴다) */
:where(.app) svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
.search span{white-space:nowrap}
/* ── 앱 프레임 ── */
.app{background:var(--bg);display:flex;height:100vh;height:100dvh;min-height:0;position:relative;overflow:hidden}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.body{flex:1;display:flex;min-height:0;min-width:0}
.main{flex:1;padding:18px var(--sp-9);overflow:auto;min-width:0}
.aside{width:var(--aw,var(--w-aside));flex:none;position:relative;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.asc{flex:1;min-height:0;overflow:auto;padding:calc(var(--sp-9) * 2) var(--sp-7) var(--sp-7)}
.aside h4{margin:var(--sp-1) 0 var(--sp-5);font-size:var(--fs)}
.side{width:var(--sw,var(--w-side));flex:none;position:relative;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--sp-6) var(--sp-5)}
/* 옆 메뉴(컨벤션 5절 · A 층 합치기 2026-11-09) — 지식 고르기 줄 → 보기 탭 한 줄 → 찾기 + 도구 아이콘 → 목록 · 아래 관리 줄(아이콘) */
.sb-top{display:flex;align-items:center;gap:var(--sp-2);padding:0 0 var(--sp-3)}
.side.dim .sb-top{gap:var(--sp-4);padding:var(--sp-1) var(--sp-3) var(--sp-5)}
.sb-kn{position:relative;flex:1;min-width:0}
.sb-repo{display:flex;align-items:center;gap:var(--sp-4);width:100%;min-width:0;border:0;background:none;padding:var(--sp-3) var(--sp-4);border-radius:var(--r);font:inherit;color:var(--text);text-align:left;cursor:pointer}
.sb-repo:hover{background:var(--surface-2)}
.sb-repo .rk{font:700 var(--fs-xs) var(--mono);background:var(--accent-bg);color:var(--accent);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2);white-space:nowrap;flex:none}
.sb-repo .rn{flex:1;min-width:0;font-weight:700;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-repo .rn small{font:400 var(--fs-xs) var(--font);color:var(--text-3)}
.sb-repo .rc{color:var(--text-3);font-size:var(--fs-xs);flex:none}
.sb-top .busy{margin-left:0}
/* 관리 줄 — 아이콘만 · 이름은 title · aria-label · 수는 배지 */
.sb-mg{flex:none;display:flex;gap:var(--sp-1);border-top:1px solid var(--border);margin:var(--sp-3) calc(var(--sp-5) * -1) calc(var(--sp-6) * -1);padding:var(--sp-2) var(--sp-3)}
.sb-ic{position:relative;flex:1;min-width:0;height:36px;display:grid;place-items:center;border:0;background:none;border-radius:var(--r);padding:0;color:var(--text-2);cursor:pointer}
.app .sb-ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sb-ic:hover{background:var(--hover);color:var(--text)}
.sb-ic.on{background:var(--accent-bg);color:var(--accent)}
.sb-ic .bd{position:absolute;top:var(--sp-1);left:calc(50% + var(--sp-3));min-width:16px;padding:0 var(--sp-2);border-radius:var(--r-pill);background:var(--pending-bg);color:var(--pending);font-size:var(--fs-xs);font-weight:700;line-height:16px;text-align:center}
.sb-ic .bd.warn{background:var(--warn-bg);color:var(--warn)}
/* 머리 줄 오른쪽 — 들어온 사람(누르면 설정 · 단축키 · 나가기) */
.hav{width:28px;height:28px;flex:none;border-radius:50%;border:0;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:var(--fs-mono);cursor:pointer;display:grid;place-items:center;padding:0}
.hav:hover{box-shadow:0 0 0 2px var(--accent-line)}
.hav[aria-expanded=true]{background:var(--accent);color:var(--on-accent)}
.logo{width:22px;height:22px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-mono);flex:none}
.logo.me{background:var(--ink)}
.brand{font-weight:700;font-size:var(--fs-md)}
/* 지금 하는 일 — kmd 옆 점(일이 있으면 깜빡인다 · 수) */
.busy{margin-left:auto;display:flex;align-items:center;gap:5px;border:0;background:none;cursor:pointer;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-pill);font-size:var(--fs-xs);color:var(--text-3)}
.busy:hover,.busy.open{background:var(--surface-2)}
.busy i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}
.busy.on{color:var(--ok);font-weight:600}
.busy.on i{background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent);animation:busyBlink 1.4s ease-in-out infinite}
@keyframes busyBlink{0%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}50%{opacity:.35;box-shadow:0 0 0 5px transparent}100%{opacity:1;box-shadow:0 0 0 0 transparent}}
.pop .brow{white-space:normal;align-items:flex-start;min-width:280px}
.pop .brow .bd{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-top:var(--sp-3);flex:none;animation:busyBlink 1.4s ease-in-out infinite}
.pop .brow .bt{display:flex;flex-direction:column;min-width:0}.pop .brow .bt b{font-weight:600;overflow-wrap:anywhere}.pop .brow .bt small{margin:var(--sp-1) 0 0;padding:0;color:var(--text-3);font-size:var(--fs-xs)}
@media (prefers-reduced-motion:reduce){.busy.on i,.pop .brow .bd,.mini i.run,.st li.r::before{animation:none}}
.kmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:var(--sp-3);z-index:9}
.kmenu .mi{padding:var(--sp-3) var(--sp-4);border-radius:var(--r);display:flex;gap:var(--sp-3);align-items:center;font-size:var(--fs);cursor:pointer}
.kmenu .mi:hover{background:var(--surface-2)}
.hdr{height:46px;display:flex;align-items:center;gap:var(--sp-5);padding:0 var(--sp-7);background:var(--surface);border-bottom:1px solid var(--border)}
.crumb{font-size:var(--fs);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--text);font-weight:600}
.crumb .crumbk{font:inherit;color:var(--text-3);background:none;border:0;padding:0;cursor:pointer}.crumb .crumbk:hover{color:var(--accent);text-decoration:underline}
.search{margin-left:auto;flex:0 1 220px;min-width:110px;height:30px;border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;padding:0 var(--sp-5);color:var(--text-3);font-size:var(--fs-mono);cursor:text;background:var(--surface)}
.search:hover{border-color:var(--border-strong)}
.band{display:flex;align-items:center;gap:var(--sp-5);padding:var(--sp-3) var(--sp-7);font-size:var(--fs-mono);border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text-2);flex-wrap:wrap;row-gap:var(--sp-2)}
.band .who{font-weight:700;color:var(--text);display:flex;align-items:center;gap:var(--sp-3);white-space:nowrap}
.band .who i{width:8px;height:8px;border-radius:50%;background:var(--ink);display:inline-block}
.band.team .who i{background:var(--accent)}
.band .out{margin-left:auto;display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;justify-content:flex-end}
.status{height:26px;display:flex;align-items:center;gap:var(--sp-7);padding:0 var(--sp-6);font-size:var(--fs-sm);color:var(--text-2);background:var(--surface);border-top:1px solid var(--border)}
.status .r{margin-left:auto}

/* ── 부품 ── */
.chip{display:inline-flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-4);border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;vertical-align:1px}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-pend{background:var(--pending-bg);color:var(--pending)}
.c-mute{background:var(--surface-3);color:var(--text-2)}
.c-acc{background:var(--accent-bg);color:var(--accent)}
.c-danger{background:var(--danger-bg);color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:var(--r);border:1px solid var(--border-input);background:var(--surface);font-size:var(--fs-mono);cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover:where(:not([disabled])){background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover:where(:not([disabled])){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{height:24px;padding:0 var(--sp-4);font-size:var(--fs-sm)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);margin-bottom:var(--sp-7)}
.card .ch{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-5) var(--sp-7);border-bottom:1px solid var(--border);font-weight:700;flex-wrap:wrap}
.card .ch small{font-weight:400;color:var(--text-3)}
.card .ch .r{margin-left:auto;display:flex;gap:var(--sp-3);align-items:center}
.card .cb{padding:var(--sp-6) var(--sp-7)}
.card .cb.tight{padding:var(--sp-2) var(--sp-7)}
.card .cf{display:flex;align-items:center;gap:var(--sp-5);padding:9px var(--sp-7);border-top:1px solid var(--border);font-size:var(--fs-mono);color:var(--text-3);flex-wrap:wrap}
.row{display:flex;align-items:center;gap:var(--sp-4)}
.r{margin-left:auto}
.muted{color:var(--text-3)}
.small{font-size:var(--fs-sm)}
.mono{font-family:var(--mono)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--sp-3) var(--sp-5);font-size:var(--fs)}
.kv>*{min-width:0;overflow-wrap:anywhere}
.kv>span:nth-child(odd){color:var(--text-3)}
.kv small{display:block;color:var(--text-3);font-size:var(--fs-sm)}
table.t{border-collapse:collapse;width:100%;font-size:var(--fs);margin:var(--sp-2) 0}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:middle}
table.t th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:var(--fs-mono)}
table.t td small{display:block;color:var(--text-3);font-size:var(--fs-sm);font-weight:400}
code{font:var(--fs-mono) var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:var(--r-xs);color:var(--text)}
.tabs{display:flex;gap:var(--sp-1);border-bottom:1px solid var(--border);margin:-2px 0 var(--sp-6);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tabs>*{flex:none;white-space:nowrap}
.tabs span{padding:7px var(--sp-6);font-size:var(--fs);color:var(--text-2);border-bottom:2px solid transparent}
.tabs span[data-a]:hover,.tabs [role=tab]:hover{color:var(--text);background:var(--hover)}
.tabs span.off,.tabs [aria-disabled=true]{color:var(--text-3);cursor:not-allowed;background:none}
.tabs span.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .ord{margin-left:auto;font-size:var(--fs-mono);color:var(--text-3);border-bottom:0}
.field{margin-bottom:var(--sp-6)}
.field label{display:block;font-weight:600;font-size:var(--fs);margin-bottom:var(--sp-2)}
.field .hint{font-size:var(--fs-sm);color:var(--text-3);margin-top:3px}
.inp{width:100%;min-height:32px;border:1px solid var(--border-input);border-radius:var(--r);padding:5px var(--sp-5);font-size:var(--fs);background:var(--surface);color:var(--text)}
.inp:hover:not([disabled]):not([readonly]):not(:focus){border-color:var(--text-3)}
.inp:focus{outline:2px solid transparent;outline-offset:2px;border-color:var(--accent);box-shadow:var(--focus-ring)}
.inp[disabled],.inp[readonly]{background:var(--surface-2);color:var(--text-3)}
.inp[disabled]{cursor:not-allowed}
.inp.af{background:var(--accent-bg);border-color:var(--accent-line);font-family:var(--mono)}
.inp.mono{font-family:var(--mono)}
.callout{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:var(--r);padding:9px var(--sp-6);font-size:var(--fs);color:var(--accent-hover);margin:var(--sp-4) 0}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.callout.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger)}
.callout.pend{background:var(--pending-bg);border-color:var(--pending-line);color:var(--pending)}
.cfpre{white-space:pre-wrap;font:var(--fs-mono)/1.5 var(--mono);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r-xs);padding:var(--sp-3) var(--sp-4);margin:var(--sp-2) 0;max-height:14em;overflow:auto}
[data-t=edConflict] .row{display:flex;gap:var(--sp-4);margin-top:var(--sp-4)}
.callout.gray{background:var(--surface-2);border-color:var(--border);color:var(--text-2)}
.stop{display:flex;align-items:center;gap:var(--sp-5);margin:0 0 var(--sp-6)}
.stop i{width:8px;height:8px;border-radius:50%;background:var(--warn-line);flex:none}
.stop.gray i{background:var(--text-3)}
.stop .r{font-size:var(--fs-sm);opacity:.85;white-space:nowrap}
.paper{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-8) 20px;background:var(--surface)}
.paper h1{font-size:var(--fs-xl);margin:0 0 var(--sp-3)}
.paper h2{font-size:var(--fs-lg);margin:18px 0 var(--sp-3);display:flex;align-items:center;gap:var(--sp-4)}
.paper p{margin:var(--sp-3) 0;color:var(--text)}
.path{font:var(--fs-sm) var(--mono);color:var(--text-3);background:var(--surface-2);padding:5px var(--sp-5);border-radius:var(--r);display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap;overflow-wrap:anywhere;min-width:0}
.path>*{min-width:0}
.path .r{font-family:var(--font)}
.big{font-size:var(--fs-xl);font-weight:700;margin:var(--sp-1) 0 var(--sp-2)}
.lead{color:var(--text-2);margin:0 0 var(--sp-7)}
.kt{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);font-weight:600;border-radius:var(--r-sm);padding:1px var(--sp-3);white-space:nowrap}
.kt.me{background:var(--ink);color:var(--on-accent)}
.kt.team{background:var(--accent-bg);color:var(--accent)}
.kt.role{background:var(--surface);color:var(--text-2);border:1px solid var(--border-strong);font-weight:500}
.kt.gone{background:var(--surface-3);color:var(--text-2)}
.kt.src{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-2);font-weight:500}
.kn{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:1px var(--sp-4);white-space:nowrap}
.kn.none{color:var(--text-3);border-style:dashed}
.plain{list-style:none;margin:0;padding:0}
.plain li{display:flex;align-items:center;gap:var(--sp-5);padding:9px var(--sp-1);border-top:1px solid var(--border);font-size:var(--fs)}
.plain li:first-child{border-top:0}
.kebab{width:26px;height:26px;border-radius:var(--r);border:1px solid transparent;background:none;color:var(--text-2);font-size:var(--fs-lg);line-height:1;cursor:pointer;display:inline-grid;place-items:center;flex:none;position:relative}
.kebab:hover,.kebab.on{background:var(--surface-2);border-color:var(--border)}
.menu{position:absolute;z-index:var(--z-menu);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:var(--sp-3);min-width:220px;font-size:var(--fs);text-align:left;color:var(--text);font-weight:400;line-height:1.5}
.menu .mi{padding:7px var(--sp-5);border-radius:var(--r);display:flex;gap:var(--sp-4);align-items:center;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi small{margin-left:auto;color:var(--text-3);font-size:var(--fs-xs)}
.menu .mi.danger{color:var(--danger)}
.menu .mi.on{color:var(--accent);font-weight:600}
.menu .sep{border-top:1px solid var(--border);margin:var(--sp-2) var(--sp-1)}
.menu .gray{font-size:var(--fs-sm);color:var(--text-3);padding:var(--sp-3) var(--sp-5) var(--sp-2);white-space:normal;max-width:280px}
.menu input[type=time]{border:1px solid var(--border-input);border-radius:var(--r-sm);padding:0 var(--sp-2);font:var(--fs-mono) var(--mono)}
details.more{border-top:1px dashed var(--border-strong);margin-top:var(--sp-6);padding-top:var(--sp-4)}
details.more>summary{cursor:pointer;color:var(--text-3);font-size:var(--fs-mono);list-style:none}
details.more>summary::before{content:"▸ "}
details.more[open]>summary::before{content:"▾ "}
details.more>summary::-webkit-details-marker{display:none}
details.more>.in{padding:var(--sp-4) 0 var(--sp-1);font-size:var(--fs);color:var(--text-2)}
.sw{display:inline-block;width:34px;height:20px;border-radius:var(--r-pill);background:var(--border-strong);position:relative;flex:none;vertical-align:middle;cursor:pointer;border:0;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:16px}
.drop{border:2px dashed var(--border-strong);border-radius:var(--r-lg);padding:18px var(--sp-8);text-align:center;color:var(--text-2);background:var(--surface);font-size:var(--fs-mono);transition:background .1s}
.drop.over{background:var(--accent-bg);border-color:var(--accent)}
.drop b{display:block;font-size:var(--fs-md);color:var(--text);margin-bottom:var(--sp-2)}
.drop .lks{margin-top:var(--sp-3);font-size:var(--fs-mono)}
.drop .lks label{color:var(--accent);font-weight:600;cursor:pointer}
.drop input{display:none}
.lk{color:var(--accent);cursor:pointer;font-weight:600}
.lk.q{color:var(--text-3);font-weight:500}
.gl{font-size:var(--fs-sm);color:var(--text-3);margin:var(--sp-4) var(--sp-1) 0;line-height:1.7}
.hint{font-size:var(--fs-sm);color:var(--text-3);margin-top:var(--sp-4);line-height:1.7}

/* 토스트 · 대화 상자 */
/* 토스트 쌓기(Q48) — 자리는 #toastHost 가 잡고 토스트는 그 안에 아래로 쌓인다 */
#toastHost{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);z-index:var(--z-toast);max-width:calc(100vw - 32px);pointer-events:none}
#toastHost .toast{position:static;transform:none;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:var(--on-accent);border-radius:var(--r-md);padding:var(--sp-5) var(--sp-7);font-size:var(--fs);display:flex;gap:var(--sp-7);align-items:center;box-shadow:var(--shadow-2);z-index:var(--z-toast);max-width:calc(100vw - 32px)}
.toast a{color:var(--accent-line);font-weight:600}
.toast .tw small{display:block;margin-top:var(--sp-2);color:var(--on-accent);opacity:.8;font-size:var(--fs-sm);overflow-wrap:anywhere}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 32%,transparent);display:grid;place-items:center;z-index:var(--z-scrim)}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-2);width:min(520px,calc(100% - 24px));max-width:100%;overflow:hidden}
.win .tb{display:flex;align-items:center;gap:var(--sp-4);padding:7px var(--sp-4) 7px var(--sp-6);background:var(--surface-2);border-bottom:1px solid var(--border);font-size:var(--fs-mono);color:var(--text-2)}
.win .tb .logo{width:18px;height:18px;font-size:var(--fs-xs);border-radius:var(--r-xs)}
.win .tb b{color:var(--text)}
.win .tb .x{margin-left:auto;border:0;background:none;font-size:var(--fs-lg);color:var(--text-3);cursor:pointer;border-radius:var(--r-xs)}
.win .tb .x:hover{background:var(--hover);color:var(--text)}
.win .wb{padding:var(--sp-7) var(--sp-8);max-height:calc(100vh - 140px);max-height:calc(100dvh - 140px);overflow:auto}
.win .wf{display:flex;justify-content:flex-end;gap:var(--sp-4);padding:9px var(--sp-8);border-top:1px solid var(--border);flex-wrap:wrap}

/* 들어가기 */
.gatewrap{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.gate{width:min(450px,100%)}
.gate .cb{padding:24px 26px var(--sp-8)}
.gate .mk{width:38px;height:38px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;margin:0 0 var(--sp-6)}
.gate .mk svg{width:20px;height:20px;stroke:var(--text-2);fill:none;stroke-width:1.7}
.gate .btn.pri{width:100%;justify-content:center;height:38px;font-size:var(--fs)}
.gate .links{margin-top:var(--sp-7);padding-top:var(--sp-5);border-top:1px dashed var(--border-strong);font-size:var(--fs-mono);color:var(--text-3)}

/* 지식 목록 */
.top{display:flex;align-items:flex-start;gap:var(--sp-6);margin-bottom:var(--sp-6)}
.top .acts{margin-left:auto;display:flex;gap:var(--sp-4);margin-top:var(--sp-2)}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
.tl{display:flex;align-items:center;gap:var(--sp-8);margin:var(--sp-1) var(--sp-1) 0;font-size:var(--fs-mono);color:var(--text-3);flex-wrap:wrap}
.tl a{font-weight:600}

/* 문서 목록 */
.wait{display:flex;gap:var(--sp-4);align-items:center;font-size:var(--fs-mono);color:var(--pending);background:var(--pending-bg);border:1px solid var(--pending-line);border-radius:var(--r);padding:7px var(--sp-6);margin:0 0 var(--sp-5);flex-wrap:wrap}
.wait i{width:7px;height:7px;border-radius:50%;background:var(--pending);flex:none}
.dl li{padding:7px var(--sp-1);cursor:pointer}
.dl li:hover{background:var(--hover)}
.dl li .di{width:16px;height:16px;flex:none;fill:none;stroke:var(--text-3);stroke-width:1.6;stroke-linejoin:round}
.dl li .nm{flex:1;min-width:0;font-weight:500;display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap}
.dl li .nm small{color:var(--text-3);font-weight:400;font-size:var(--fs-sm)}
.dl li .chip{font-size:var(--fs-xs);padding:0 var(--sp-3)}
.dl li .when{width:84px;flex:none;color:var(--text-2);font-size:var(--fs-mono);text-align:right}
.dl li .when.td{color:var(--accent)}
.dl li.more{color:var(--accent);font-size:var(--fs-mono);justify-content:center;font-weight:600}

/* 읽기 · 고치기 */
.ttl{display:flex;align-items:center;gap:var(--sp-4);margin:0 0 var(--sp-4)}
.ttl .path{flex:1;min-width:0}
.found{display:flex;align-items:center;gap:var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--sp-3) var(--sp-6);font-size:var(--fs-mono);color:var(--text-2);margin:0 0 var(--sp-5);flex-wrap:wrap}
.found b{color:var(--text)}
.found a{margin-left:auto;white-space:nowrap}
.lit{position:relative;background:var(--accent-bg);border-radius:var(--r);padding:var(--sp-2) var(--sp-5);margin:0 -10px}
.lit .tag{position:absolute;right:8px;top:-9px;font-size:var(--fs-xs);background:var(--surface);border:1px solid var(--accent-line);color:var(--text-2);border-radius:var(--r-pill);padding:0 7px}
.hc{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;margin:var(--sp-2) 0 var(--sp-1);font-size:var(--fs-sm);color:var(--text-3)}
.hchip{display:inline-flex;align-items:center;gap:var(--sp-2);border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);border-radius:var(--r-pill);padding:1px 9px;font-size:var(--fs-sm);white-space:nowrap}
.hchip.tidy{color:var(--warn);border-color:var(--warn-line);background:var(--surface);font-weight:600}
.penrec{display:flex;gap:var(--sp-3);align-items:flex-start;margin:var(--sp-3) 0;padding:var(--sp-3) 9px;border-radius:var(--r);background:var(--pending-bg);color:var(--pending);font-size:var(--fs-mono)}
.penrec i{width:6px;height:6px;border-radius:50%;background:var(--pending);flex:none;margin-top:var(--sp-3)}
.auto{border:1.5px solid var(--border-strong);border-radius:var(--r);margin:var(--sp-4) 0;overflow-x:auto;background:var(--surface)}
.auto .ah{display:block;padding:5px var(--sp-5);background:var(--surface-2);border-bottom:1px solid var(--border);font-size:var(--fs-sm);color:var(--text-2)}
.auto .ah b{color:var(--text)}
.auto table.t{margin:0}
.auto table.t td,.auto table.t th{padding:var(--sp-2) var(--sp-5)}
.auto .lkl{display:flex;align-items:center;gap:var(--sp-3);padding:5px var(--sp-5);font-size:var(--fs-sm);color:var(--text-2);border-top:1px dashed var(--border-strong);background:var(--surface-3)}
.auto.lock{background:var(--surface-2);user-select:none}
.auto.lock table.t td{color:var(--text-3);background:var(--surface-2)}
.auto td.chg{background:var(--accent-bg)!important;color:var(--accent)!important;font-weight:600}
.ed{border:1px solid var(--accent-line);border-radius:var(--r-md);padding:var(--sp-5) var(--sp-6);margin:var(--sp-4) 0 var(--sp-2);background:var(--surface)}
.ed .lbl{font-size:var(--fs-mono);color:var(--text-3);margin:0 0 var(--sp-3)}
.ed .lbl b{color:var(--accent)}
.toolbar{display:flex;gap:var(--sp-2);padding:var(--sp-2);border:1px solid var(--border);border-bottom:0;border-radius:var(--r) var(--r) 0 0;background:var(--surface-2)}
.toolbar span{font-size:var(--fs-sm);padding:var(--sp-1) var(--sp-4);border-radius:var(--r-sm);color:var(--text-2)}
.ed textarea{width:100%;min-height:300px;border:1px solid var(--border-input);border-radius:0 0 var(--r) var(--r);padding:var(--sp-5) var(--sp-6);font:var(--fs)/1.7 var(--font);resize:vertical;background:var(--surface)}
.ed .lockh{font-size:var(--fs-sm);color:var(--text-3);margin:var(--sp-5) 0 var(--sp-1)}
.ed textarea:focus{outline:2px solid transparent;outline-offset:2px;border-color:var(--accent);box-shadow:var(--focus-ring)}

/* 찾기 */
.pscrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 16%,transparent);z-index:var(--z-scrim);display:flex;justify-content:center;align-items:flex-start;padding:52px var(--sp-8) var(--sp-8)}
.pal{width:min(682px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-3);font-size:var(--fs)}
.pal .pin{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-7);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.pal .pin svg{width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:1.8;flex:none}
.pal .pin input{flex:1;border:0;outline:0;font-size:var(--fs-md);padding:var(--sp-2) 0;min-width:0;background:transparent}
.pal .pin:focus-within{box-shadow:inset 0 -2px 0 var(--accent)} /* 칸의 outline 대신 머리 줄 밑선으로 초점 */
.pal .pin .r{font-size:var(--fs-sm);color:var(--text-3);white-space:nowrap}
.pal .g{padding:var(--sp-5) var(--sp-7) var(--sp-2);font-size:var(--fs-mono);font-weight:700;color:var(--text-2)}
.pal .hit{margin:var(--sp-2) var(--sp-5);padding:var(--sp-4) var(--sp-5);border-radius:var(--r);border:1px solid var(--border);cursor:pointer}
.pal .hit:hover,.pal .hit.sel{border-color:var(--accent-line);background:var(--accent-bg)}
.pal .ht{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.pal .ht b{font-weight:700}
.pal .ht .r{margin-left:auto;font-size:var(--fs-xs);color:var(--text-3)}
.tg{font-size:var(--fs-xs);font-weight:600;border-radius:var(--r-sm);padding:0 var(--sp-3);background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.tg.kmd{background:transparent;border:1px solid var(--text-3);color:var(--text);padding:0 5px}
.tg.nm{background:transparent;border:1px dashed var(--border-strong);color:var(--text-2);padding:0 5px}
.pal .tx{margin-top:var(--sp-2);font-size:var(--fs-mono);color:var(--text);line-height:1.6}
.pal mark{background:var(--warn-bg);color:inherit;border-radius:var(--r-xs);padding:0 1px}
.pal .ft{display:flex;align-items:center;gap:var(--sp-4);padding:9px var(--sp-7);border-top:1px solid var(--border);font-size:var(--fs-mono);color:var(--text-2);margin-top:var(--sp-3)}
.pal .empty{margin:var(--sp-6) var(--sp-7);padding:var(--sp-6) var(--sp-7);border-radius:var(--r);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-mono);line-height:1.7}
.pal .empty b{display:block;color:var(--text);font-size:var(--fs)}
.pal .empty a{font-weight:600;margin-right:var(--sp-6)}
.pal .tip{padding:var(--sp-6) var(--sp-7);color:var(--text-3);font-size:var(--fs-mono)}

/* 오늘 바뀐 것 */
.feed{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-bottom:var(--sp-7)}
.feed .fh{padding:9px var(--sp-7);font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--sp-4)}
.feed .fh small{font-weight:400;color:var(--text-3)}
.fi{border-top:1px solid var(--border);font-size:var(--fs)}
.feed .fh+.fi{border-top:0}
.fi .ln{display:flex;align-items:center;gap:var(--sp-5);padding:9px var(--sp-7)}
.fi .tm{font:var(--fs-sm)/1.35 var(--mono);color:var(--text-3);width:44px;flex:none}
.fi .dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none}
.fi .dot.acc{background:var(--accent)}.fi .dot.pend{background:var(--pending)}.fi .dot.warn{background:var(--warn-line)}.fi .dot.bad{background:var(--danger)}
.fi .tx{flex:1;min-width:0}
.fi .tx small{display:block;color:var(--text-3);font-size:var(--fs-sm)}
.fi .tx .kt{margin-right:3px;vertical-align:1px}
.fi .act{margin-left:auto;font-size:var(--fs-mono);color:var(--accent);white-space:nowrap;cursor:pointer;font-weight:600}
.fi.yl .tx b{color:var(--warn);font-weight:700}
.fi.yl .tm{color:var(--warn)}
.fi.done .tx b{color:var(--text-3)}
.fi ul.sub{list-style:none;margin:3px 0 0;padding:0}
.fi ul.sub li{padding-left:var(--sp-6);font-size:var(--fs-mono);color:var(--text-2);position:relative}
.fi ul.sub li::before{content:"·";position:absolute;left:3px}
.fi .open{padding:var(--sp-1) var(--sp-7) var(--sp-6) 78px}
.diff{border:1px solid var(--border);border-radius:var(--r);font:var(--fs-mono)/1.7 var(--font);overflow:hidden;background:var(--surface);margin:var(--sp-3) 0}
.diff .fh{background:var(--surface-2);padding:5px var(--sp-5);font:600 var(--fs-mono) var(--font);color:var(--text-2);border-bottom:1px solid var(--border)}
.diff .ln2{padding:0 var(--sp-5);white-space:pre-wrap}
.diff .ln2::before{content:" ";display:inline-block;width:14px;color:var(--text-3)}
.diff .add{background:var(--accent-bg)}
.diff .add::before{content:"+";color:var(--accent)}
.diff .del{background:var(--surface-2);color:var(--text-3);text-decoration:line-through}
.diff .del::before{content:"−"}

/* 정리 */
.go{display:flex;align-items:center;gap:var(--sp-6);padding:11px var(--sp-7);border:1px solid var(--accent-line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1);margin:0 0 var(--sp-6);flex-wrap:wrap}
.go .tx{font-size:var(--fs);color:var(--text-2);flex:1;min-width:0}
.go .tx b{color:var(--text)}
.go .tx small{display:block;color:var(--text-3);font-size:var(--fs-sm)}
.prog{display:flex;align-items:center;gap:var(--sp-4);color:var(--accent);font-weight:600;font-size:var(--fs)}
.prog i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sub{display:flex;gap:var(--sp-4);align-items:baseline;padding:9px var(--sp-7) var(--sp-1);border-top:1px solid var(--border);font-weight:700;font-size:var(--fs)}
.sub.first{border-top:0}
.sub small{font-weight:400;color:var(--text-3);font-size:var(--fs-sm)}
.to{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--accent);background:var(--accent-bg);border-radius:var(--r);padding:var(--sp-1) var(--sp-4);white-space:nowrap;flex:none;font-weight:600}
.to.mute{color:var(--text-3);background:var(--surface-2);font-weight:500}

/* 사람 · 설정 · 관리 */
.av2{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm);flex:none}
.av2.k{border-radius:var(--r);background:var(--accent);color:var(--on-accent)}
.av2.all{background:var(--accent-bg);color:var(--accent)}
.pl li{align-items:flex-start;padding:var(--sp-5) var(--sp-7)}
.pl li .nm{flex:1;min-width:0;font-weight:600}
.pl li .nm small{display:block;font-weight:400;color:var(--text-3);font-size:var(--fs-sm)}
.pk{border:1px solid var(--border-strong);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5) var(--sp-5);background:var(--surface);font-size:var(--fs-mono);margin:0 var(--sp-7) var(--sp-6)}
.pk .o{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3);border-top:1px solid var(--border);cursor:pointer;border-radius:var(--r)}
.pk .o:hover{background:var(--accent-bg)}
.pk .o.off{color:var(--text-3);cursor:default}
.pk .o.off:hover{background:none}
.set{display:flex;align-items:center;gap:var(--sp-6);padding:var(--sp-5) 0;border-top:1px solid var(--border)}
.set:first-child{border-top:0}
.set .tx{flex:1;min-width:0}
.set .tx b{display:block;font-weight:600}
.set .tx small{color:var(--text-3);font-size:var(--fs-mono)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-7);align-items:start}
.pl li.hot{background:var(--warn-bg);box-shadow:inset 3px 0 0 var(--warn-line)}
.pl li .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:var(--sp-3);background:var(--border-strong)}
.pl li .dot.warn{background:var(--warn-line)}
.pl li .dot.pu{background:var(--pending)}
.pl li .tx{flex:1;min-width:0}
.pl li .tx b{font-weight:600}
.pl li .tx small{display:block;color:var(--text-3);font-size:var(--fs-sm)}

/* 자료 가져오기 */
.paste{display:flex;gap:var(--sp-4);align-items:center}
.paste .inp{flex:1}
.heard{display:flex;gap:var(--sp-5);align-items:flex-start;padding:9px var(--sp-6);border-radius:var(--r-md);font-size:var(--fs);margin-top:var(--sp-4);background:var(--surface);border:1px solid var(--accent-line);border-left:3px solid var(--accent)}
.heard.bad{border-color:var(--border);border-left-color:var(--text-3);color:var(--text-2)}
.heard .sub2{display:block;color:var(--text-3);font-size:var(--fs-sm);margin-top:var(--sp-1)}
.heard b{font-weight:700}
td.go2{text-align:right;white-space:nowrap}
.ev{display:inline-flex;align-items:center;gap:var(--sp-2);white-space:nowrap;position:relative}
.ev .kebab{width:22px;height:22px}
.rh{font-weight:700;font-size:var(--fs);margin:var(--sp-7) var(--sp-1) var(--sp-1)}

.lp{flex:1 1 auto;min-height:0;overflow:auto;margin:var(--sp-4) -4px 0;border-top:1px solid var(--border);padding:var(--sp-4) var(--sp-1) 0}
.lh{font-size:var(--fs-sm);color:var(--text-3);margin:0 var(--sp-3) var(--sp-3);font-weight:600}
.tf{display:flex;align-items:center;gap:5px;padding:var(--sp-2) var(--sp-3);border-radius:var(--r);cursor:pointer;color:var(--text-2);font-weight:700;font-size:var(--fs-mono);user-select:none}
.tf:hover{background:var(--surface-2)}
.tf .ar{width:10px;color:var(--text-3);font-size:var(--fs-xs)}
.tf small{font-weight:400;color:var(--text-3)}
.tf .cnt{margin-left:auto;font-weight:400;color:var(--text-3);font-size:var(--fs-xs)}
.tn{display:flex;align-items:center;gap:var(--sp-3);padding:3px var(--sp-3) 3px calc(21px + var(--sp-5) * var(--dep, 0));border-radius:var(--r);cursor:pointer;white-space:nowrap;font-size:var(--fs);min-width:0}
.tn:hover{background:var(--surface-2)}
.tn.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.app .tn svg{width:13px;height:13px;color:var(--text-3)}
.tn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 항목 이름 = 값 + 설명(컨벤션 5절) — 값은 고정폭 · 굵게 · 설명은 흐림 · 한 줄 말줄임 */
.iv{font:600 var(--fs-mono) var(--mono);color:var(--text);white-space:nowrap}
.nm:has(> .iv){display:flex;align-items:baseline;gap:var(--sp-3)}
.nm > .iv{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.nm > .id{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-3);font-size:var(--fs-sm)}
.ih .iv{color:var(--text-2);background:var(--surface-2);border-radius:var(--r-xs);padding:1px var(--sp-3);overflow-wrap:anywhere;white-space:normal}
.tn .dt{font:var(--fs-xs) var(--mono);color:var(--text-3);flex:none}
.tn .rc,.alr .rc{font-size:var(--fs-xs);color:var(--text-3);background:var(--surface-2);border-radius:var(--r-pill);padding:0 var(--sp-3);flex:none}
.tn .nd{font-size:var(--fs-xs);color:var(--text-3);border:1px dashed var(--border-strong);border-radius:var(--r-xs);padding:0 var(--sp-2);flex:none}
.tn.dir{color:var(--text-2);font-weight:600;padding-left:calc(var(--sp-3) + var(--sp-5) * var(--dep, 0));gap:var(--sp-2)}
.tn.dir .ar{width:10px;flex:none;color:var(--text-3);font-size:var(--fs-xs)}
.tn.dir svg{flex:none}
/* 머리는 목록(.lp)의 위 · 옆 안쪽 여백까지 덮는다 — 굴린 줄이 머리 위 틈으로 비치지 않게 */
.lhead{position:sticky;top:calc(var(--sp-4) * -1);z-index:1;background:var(--surface);display:flex;flex-direction:column;gap:var(--sp-4);padding:var(--sp-4) calc(var(--sp-1) * 2) var(--sp-4);margin:calc(var(--sp-4) * -1) calc(var(--sp-1) * -1) var(--sp-2)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2)}
.tools .r{margin-left:auto}
.fbtn{display:inline-flex;align-items:center;gap:var(--sp-2);height:24px;padding:0 var(--sp-4);border:1px solid var(--border-input);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:var(--fs-sm);cursor:pointer;white-space:nowrap}
.fbtn:hover:not([disabled]){background:var(--hover)}
.fbtn[disabled]{color:var(--text-3);border-color:var(--border-strong);cursor:not-allowed}
.fbtn[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.app .fbtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fbtn .ck{display:none}
.fbtn[aria-pressed=true] .ck{display:block}
.fbtn .kd{width:8px;height:8px;border-radius:var(--r-pill);flex:none}
.vgrp{display:flex;gap:var(--sp-2)}
.gf .gfs{margin-top:var(--sp-4)}
.gf .gfs>.gh{margin:var(--sp-5) var(--sp-2) var(--sp-3)}
.gf .gfs .lhead{position:static;padding-top:0;padding-bottom:0}
.gf .gtip{margin:var(--sp-2) var(--sp-2) 0}
.gf .gfr{margin:0 var(--sp-2)}
.gf .gfr .fbtn{flex:1;justify-content:center;height:30px;min-width:0}
.vgrp .fbtn{flex:1;justify-content:center;height:30px}
.app .vgrp .fbtn svg{width:14px;height:14px;stroke-width:1.7}
.ktabs button:focus-visible,.sb-repo:focus-visible,.sb-ic:focus-visible,.hav:focus-visible,.fbtn:focus-visible{outline:0;box-shadow:var(--focus-ring)}
.tn.more{color:var(--accent);font-weight:600}
.hmore{display:flex;justify-content:center;padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--border)}
.tn.nc{cursor:default;font-size:var(--fs-sm)}
.pd{width:7px;height:7px;border-radius:50%;background:var(--pending);flex:none;display:inline-block}
.pd.hd{background:var(--warn)} /* 넣지 못함(S10) — 노랑 점 */
.nw{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;display:inline-block}
.lp .inp{min-height:28px;font-size:var(--fs-mono)}
.ig{font-size:var(--fs-sm);color:var(--text-2);font-weight:700;margin:var(--sp-3) var(--sp-3) var(--sp-2)}
.empty2{margin:var(--sp-4) var(--sp-2);padding:9px var(--sp-5);border-radius:var(--r);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-sm);line-height:1.6}
.empty2 b{display:block;color:var(--text);font-size:var(--fs-mono)}
.hist{display:flex;gap:var(--sp-1);flex:none}
.hb{width:24px;height:24px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font-size:var(--fs-md);line-height:1;padding:0}
.hb:hover:where(:not([disabled])){background:var(--hover);color:var(--text)}
.hb[disabled]{opacity:.35;cursor:not-allowed}
.qbtn{margin-left:auto;height:30px;border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5);font-size:var(--fs-mono);color:var(--text-2);cursor:pointer;white-space:nowrap;background:var(--surface);flex:none}
.qbtn:hover{border-color:var(--border-strong)}
.qbtn+.search{margin-left:0}
kbd{font:var(--fs-xs) var(--mono);color:var(--text-3);border:1px solid var(--border);border-radius:var(--r-xs);padding:0 var(--sp-2);background:var(--surface-2)}
.center{flex:1;min-width:0;display:flex;flex-direction:column}
.tabbar{display:flex;align-items:flex-end;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4) 0 var(--sp-5);background:var(--surface-2);border-bottom:1px solid var(--border);min-height:37px;flex:none;position:relative;z-index:5}
.tabs-s{display:flex;align-items:flex-end;gap:var(--sp-1);overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:thin}
.tb1{display:flex;align-items:center;gap:var(--sp-3);max-width:190px;padding:5px 5px var(--sp-3) var(--sp-5);border:1px solid transparent;border-bottom:0;border-radius:var(--r) var(--r) 0 0;font-size:var(--fs-mono);color:var(--text-2);cursor:pointer;white-space:nowrap;flex:none;position:relative;top:1px}
.tb1:hover{background:var(--surface-3)}
.tb1 .nm{overflow:hidden;text-overflow:ellipsis}
.tb1.on{background:var(--bg);border-color:var(--border);color:var(--text);font-weight:600}
.tb1.rt{box-shadow:inset 0 2px 0 var(--pending)}
.app .tb1 svg{width:12px;height:12px;color:var(--text-3)}
.tb1 .x{border:0;background:none;color:var(--text-3);cursor:pointer;font-size:var(--fs-md);line-height:1;padding:0 3px;border-radius:var(--r-xs)}
.tb1 .x:hover{background:var(--surface-3);color:var(--text)}
.tadd{border:0;background:none;color:var(--text-3);font-size:var(--fs-lg);cursor:pointer;padding:var(--sp-1) var(--sp-4) var(--sp-3);flex:none}
.tabbar .kebab{margin:0 0 var(--sp-2) auto}
.tabbar .none{font-size:var(--fs-sm);color:var(--text-3);padding:0 0 9px}
.panes{flex:1;display:flex;min-height:0;min-width:0}
.panes .main{flex:1 1 0}
.panes .main.rp{border-left:2px solid var(--pending-bg);background:var(--hover)}
.rph{display:flex;align-items:center;gap:var(--sp-4);margin:-6px 0 var(--sp-4);font-size:var(--fs-sm);color:var(--pending)}
.docw{max-width:none;min-width:0}
.dlink{color:var(--accent);cursor:pointer;font-weight:600}
.ilink{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.paper h2.flash,.paper h3.flash{animation:flash 1.4s}
.attph{border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:40px;text-align:center;color:var(--text-3);margin-top:var(--sp-5)}
.ap{margin-bottom:var(--sp-8)}
.ap h4{display:flex;align-items:baseline;gap:var(--sp-3);margin:0 0 var(--sp-3);font-size:var(--fs)}
.ap h4 small{font-weight:400;color:var(--text-3);font-size:var(--fs-xs)}
.olr{padding:3px var(--sp-4);border-radius:0 var(--r) var(--r) 0;cursor:pointer;font-size:var(--fs);display:flex;align-items:center;gap:var(--sp-3);border-left:2px solid var(--border)}
.olr:hover{background:var(--surface-2);border-left-color:var(--accent)}
.bg{font-size:var(--fs-sm);color:var(--text-2);margin:var(--sp-4) 0 var(--sp-1);font-weight:600}
.bg small{font-weight:400;color:var(--text-3)}
.alr{display:flex;align-items:center;gap:var(--sp-3);padding:3px var(--sp-3);border-radius:var(--r);cursor:pointer;font-size:var(--fs-mono);min-width:0}
.alr:hover{background:var(--surface-2)}
.alr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alr .nm small{color:var(--text-3);margin-left:var(--sp-2)}
.alr .dt{font:var(--fs-xs) var(--mono);color:var(--text-3);flex:none;width:34px}
.app .alr svg{width:12px;height:12px;color:var(--text-3)}
.alr.muted{cursor:default}
details.nb{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-5)}
details.nb>summary{cursor:pointer;font-weight:700;font-size:var(--fs);list-style:none}
details.nb>summary::before{content:"▸ ";color:var(--text-3)}
details.nb[open]>summary::before{content:"▾ "}
details.nb>summary::-webkit-details-marker{display:none}
details.nb summary small{font-weight:400;color:var(--text-3)}
.ih{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;margin:0 0 var(--sp-3)}
.ih h1{font-size:var(--fs-xl);margin:0}
.isec{margin:var(--sp-8) 0 0}
.isec>h3{display:flex;align-items:center;gap:var(--sp-4);font-size:var(--fs);margin:0 0 var(--sp-3)}
.isec>h3 small{font-weight:400;color:var(--text-3);font-size:var(--fs-sm)}
.paper.ip{padding:var(--sp-5) var(--sp-8)}
.rl{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.rl li{display:flex;gap:var(--sp-5);align-items:flex-start;padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border);cursor:pointer;font-size:var(--fs)}
.rl li:first-child{border-top:0}
.rl li:hover{background:var(--hover)}
.rl li.pend{background:var(--pending-bg)}
.rl li .dt{font:var(--fs-sm) var(--mono);color:var(--text-3);width:40px;flex:none;padding-top:1px}
.rl li .tx{flex:1;min-width:0}
.rl li .tx small{display:block;color:var(--text-3);font-size:var(--fs-sm)}
.main.full{padding:var(--sp-6)}
.gwrap{position:relative;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--hover);overflow:hidden;height:calc(100vh - 230px);height:calc(100dvh - 230px);min-height:440px;touch-action:none}
#gcv{width:100%;height:100%;display:block;cursor:grab;user-select:none;font-family:inherit}
.gz{position:absolute;right:10px;bottom:10px;display:flex;gap:var(--sp-2)}
.gtl{position:absolute;left:12px;top:10px;color:var(--text-3)}
.ghint{position:absolute;left:12px;bottom:12px;color:var(--text-3);right:190px}
/* 점 종류 모양(문서 둥근 사각 · 항목 원 · 기록 마름모 · 테이블 묶음 두 겹 원) — SVG(2D 표 · 범례 · 목록 · 팝업). 3D canvas 는 같은 토큰을 읽어 그린다 */
.gk-doc{fill:var(--k-doc)}.gk-item{fill:var(--k-item)}.gk-rec{fill:var(--k-rec)}.gk-bnd{fill:none;stroke:var(--k-item);stroke-width:2}
svg.gki{width:14px;height:14px;flex:none;overflow:visible;stroke:none;vertical-align:-2px}
/* 그래프 칸 안 — 왼쪽 위 수 · 범례 · 오른쪽 위 고른 점 카드(오른쪽 칸 없음) */
.glg{position:absolute;left:12px;top:32px;display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-6);color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--sp-1) var(--sp-4);max-width:calc(100% - 24px)}
.glg .lgr{padding:0;gap:var(--sp-3)}
.gov{position:absolute;right:12px;top:10px;z-index:1;width:min(300px,calc(100% - 24px));max-height:calc(100% - 70px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:var(--sp-5) var(--sp-6)}
.gov .row{display:flex;align-items:center;gap:var(--sp-3)}
.gov .r{margin-left:auto}
.gov .gn{font-weight:700;font-size:var(--fs-md);margin:var(--sp-2) 0 var(--sp-1)}
.gov .gfirst{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.gov [data-t=gCardRecs]{margin:var(--sp-2) 0 var(--sp-4)}
.gov .gcap{margin-top:var(--sp-4)}
/* 2D 표(ERD 처럼) — 문서 상자 · 항목 줄 · 기록 열 · 선 한 가지 */
.gwrap.erd{background:var(--surface);touch-action:auto}
.gwrap.dark{--hover:var(--gd-bg);--surface:var(--gd-surface);--surface-2:var(--gd-surface-2);--border:var(--gd-border);--border-strong:var(--gd-border-strong);--border-input:var(--gd-border-strong);--text:var(--gd-text);--text-2:var(--gd-text-2);--text-3:var(--gd-text-3);--k-doc:var(--gd-k-doc);--k-item:var(--gd-k-item);--k-rec:var(--gd-k-rec);--accent:var(--gd-accent);--accent-bg:var(--gd-accent-bg);--warn-bg:var(--gd-warn-bg);--g-ring:var(--gd-bg);background:var(--hover);color:var(--text);border-color:var(--border)}
.gwrap.dark.erd{background:var(--hover)}
/* 2D 표 — 칸 전체가 그림(스크롤 없음) · 수 · 범례 · 카드 · 확대 단추는 그 위에 뜬다 */
.gerdw{position:absolute;inset:0;overflow:hidden;cursor:grab;user-select:none;touch-action:none}
.gerdw.drag,.gwrap.grab .gerdw{cursor:grabbing}
.gerdw.drag .gbk{visibility:hidden}
.gerd .gbk{stroke:var(--text-3);stroke-opacity:.35;stroke-width:1}
svg.gki .gln{stroke:var(--text-3);stroke-opacity:.6}
.gwrap.erd .gtl,.gwrap.erd .glg,.gwrap.erd .gz,.gwrap.erd .ghint,.gwrap.erd .gov{z-index:2}
.gwrap.erd .gtl{background:var(--surface);padding:0 var(--sp-2);border-radius:var(--r-xs)}
.gwrap.grab #gcv{cursor:grab}
.gerd .gdot{fill:var(--accent)}
.gov .gtrail{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1) var(--sp-3);margin-top:var(--sp-4)}
/* 그래프 칸은 가운데 칸의 남은 높이를 다 쓴다 */
.main.full:has(>.gwrap){display:flex;flex-direction:column}
.main.full>.gwrap{flex:1 1 auto;height:auto;min-height:320px}
.gerd{display:block;stroke:none;width:100%;height:100%}
.gerd .gbx{fill:var(--surface);stroke:var(--border-strong)}
.gerd .ghr{fill:var(--surface-2);stroke:var(--border-strong)}
.gerd .grow{fill:transparent}
.gerd .grec{fill:var(--surface);stroke:var(--border-strong)}
.gerd .gt{font-size:var(--fs-mono);fill:var(--text)}
.gerd .gt.b{font-weight:700}
.gerd .gs{font-size:var(--fs-xs);fill:var(--text-3)}
.gerd .gln,svg.gki .gln{fill:none;stroke:var(--border-strong);stroke-width:1.4}
.gerd .gln{stroke-opacity:.7}
.gerd .gln.lit{stroke:var(--accent);stroke-width:2;stroke-opacity:.9}
.gerd .ge{cursor:pointer}
.gerd .ge.off{cursor:default}
.gerd .ge:not(.off):hover .grow,.gerd .ge:not(.off):hover .ghr,.gerd .ge:not(.off):hover .grec,.gerd .ge:focus .grow,.gerd .ge:focus .ghr,.gerd .ge:focus .grec,.gerd .ge.sel .grow,.gerd .ge.sel .ghr,.gerd .ge.sel .grec{fill:var(--accent-bg)}
.gerd .ge:focus{outline:none}
.gerd .ge.nb .grow,.gerd .ge.nb .ghr,.gerd .ge.nb .grec{fill:var(--accent-bg)}
.gerd .ge.nb .gt{font-weight:600}
.gerd .ge.on .grow,.gerd .ge.on .ghr,.gerd .ge.on .grec{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.5}
.gerd .ge.hit .grow,.gerd .ge.hit .ghr,.gerd .ge.hit .grec{fill:var(--warn-bg)}
.gh{font-size:var(--fs-sm);font-weight:700;color:var(--text-2);margin:var(--sp-6) var(--sp-2) var(--sp-2)}
.gh small{font-weight:400;color:var(--text-3)}
.gr{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-2) var(--sp-2);font-size:var(--fs-mono)}
.gr .tx{flex:1;min-width:0;display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.gr .tx small{flex-basis:100%;color:var(--text-3);font-size:var(--fs-xs)}
.kd{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden;margin:0 var(--sp-2)}
.seg button{flex:1;border:0;background:var(--surface);padding:3px 0;font-size:var(--fs-mono);cursor:pointer;border-left:1px solid var(--border)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button:hover:not([disabled]):not(.on){background:var(--hover)}
.seg button[disabled]{color:var(--text-3);cursor:not-allowed}
.gcard{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-5) var(--sp-6);margin-bottom:var(--sp-7);background:var(--surface)}
.gcard .gn{font-weight:700;font-size:var(--fs-md);margin:var(--sp-2) 0 var(--sp-1)}
.lgr{display:flex;align-items:center;gap:var(--sp-4);font-size:var(--fs-mono);padding:var(--sp-1) 0}
.lgr small{display:block;color:var(--text-3);font-size:var(--fs-xs)}
.qr{display:flex;align-items:center;gap:var(--sp-4);margin:var(--sp-1) var(--sp-4);padding:7px var(--sp-5);border-radius:var(--r);cursor:pointer;font-size:var(--fs)}
.qr:hover,.qr.sel{background:var(--accent-bg)}
.qr .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr .r{margin-left:auto;white-space:nowrap;padding-left:var(--sp-5)}
.qk{width:16px;display:grid;place-items:center;flex:none;color:var(--text-3)}
.pv{position:fixed;z-index:var(--z-pop);width:min(290px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:var(--sp-5) var(--sp-6);font-size:var(--fs-mono);pointer-events:none;line-height:1.55;color:var(--text)}
.pv svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.pv .ph{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2)}
.pv .ph b{font-size:var(--fs)}
.pv .pm{margin-top:var(--sp-3);color:var(--text-3);font-size:var(--fs-sm)}
.pv .kt{font-size:var(--fs-xs)}
.tabs span[data-a]{cursor:pointer}
.flow{border:1px solid var(--accent-line);border-radius:var(--r-md);padding:var(--sp-5) var(--sp-6);background:var(--surface);margin:var(--sp-2) 0 var(--sp-3)}
li.new{animation:flash 1.6s}


/* ── 프로그램 창 — 목업은 앱을 액자 안에 그렸다. 프로그램은 창 전체가 앱이다(.app 위에서 합쳤다) ── */
.col{min-height:0}
.body{overflow:hidden}
/* 탭 줄 — 탭의 top:1px 가 세로 넘침을 만들어 실제 브라우저에서 위아래 화살표가 보인다(목업 화면은 스크롤 막대를 감춘 채 찍었다) */
.tabs-s{overflow-y:hidden}
/* 지식 지우기 — 목업에 없는 단추(완전 삭제)의 위험 색 */
.btn.danger{background:var(--surface);border-color:var(--danger-line);color:var(--danger);font-weight:600}
.btn.danger:hover:where(:not([disabled])){background:var(--danger-bg);border-color:var(--danger)}

/* ── 옆 메뉴 두 영역 · 머리(정정 2026-10-23 — 리본을 걷었다) ── */
.sb-know{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
/* 보기 탭 한 줄 — 문서 n · 항목 n · 기록 n · 그래프(아이콘) · 밑줄 · 이름 + 흐린 수 */
.ktabs{display:flex;border-bottom:1px solid var(--border)}
.ktabs button{flex:1 1 0;min-width:0;border:0;background:none;padding:var(--sp-3) 0 var(--sp-4);display:flex;align-items:baseline;justify-content:center;gap:var(--sp-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:var(--fs);color:var(--text-2);cursor:pointer;white-space:nowrap;user-select:none}
.ktabs button.ic{flex:0 0 calc(var(--sp-9) + var(--sp-7));align-items:center}
.ktabs button em{font-style:normal;font-size:var(--fs-xs);color:var(--text-3)}
.app .ktabs svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ktabs button:hover{color:var(--text)}
.ktabs button[aria-selected=true]{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
.ktabs button[aria-selected=true] svg{color:var(--accent)}
.sb-know .lp{margin-top:0;border-top:0}
/* 찾기 칸 + 도구 아이콘(모두 펴기 · 내가 쓴 것만) */
.lfind{display:flex;gap:var(--sp-2);align-items:center}
.lfind .inp{flex:1;min-width:0}
.hb.ltool{width:28px;height:28px;display:grid;place-items:center;flex:none;background:none;border-color:transparent}
.hb.ltool:hover{background:var(--hover);color:var(--text)}
.hb.ltool[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.app .ltool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kmenu .sep{height:1px;background:var(--border);margin:var(--sp-2) 0}
.hdr .crumb{flex:1 1 0}
.hmid{flex:0 1 460px;display:flex;align-items:center;gap:var(--sp-3);min-width:0}
.hmid .qbtn{margin-left:0}
.hmid .search{flex:1 1 auto;margin-left:0}
.hright{flex:1 1 0;display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-7);min-width:0;white-space:nowrap}
.hlink{display:flex;align-items:center;gap:5px;font-size:var(--fs);color:var(--text-2);cursor:pointer;text-decoration:none}
.hlink:hover{color:var(--accent)}
.cchip .cdot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.cchip.ok .cdot{background:var(--ok)}.cchip.bad .cdot{background:var(--danger)}.cchip.off .cdot{background:transparent;border:1px solid var(--text-3)}
.cchip.bad{color:var(--danger)}
.cchip.err .cdot{background:var(--warn)}.cchip.err{color:var(--warn)}
.cwin .cst{display:flex;align-items:center;gap:var(--sp-4);margin:var(--sp-2) 0 var(--sp-5)}.cwin .cst .cdot{width:10px;height:10px}
.cwin ol{margin:var(--sp-3) 0 0;padding-left:20px}.cwin li{margin:var(--sp-1) 0}
.app .hlink svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hme{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs)}
.hme small{color:var(--text-3)}
.hme .av{width:22px;height:22px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-weight:700;font-size:var(--fs-xs);flex:none}
.hright{min-width:max-content}
.hmid .search{min-width:0;overflow:hidden}
.hmid{flex-basis:380px}

/* ── 이력(오늘 바뀐 것 + kmd 가 다룬 일 — 한 흐름) ── */
.hday{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-5) var(--sp-7) var(--sp-3);font-weight:700;font-size:var(--fs);color:var(--text);background:var(--surface-2);border-top:1px solid var(--border)}
.hday:first-child{border-top:0}
.hday small{font-weight:400;color:var(--text-3)}
.hrow{border-top:1px solid var(--border)}
.hday+.hrow{border-top:0}
.hrow .hl{display:flex;align-items:flex-start;gap:var(--sp-5);padding:9px var(--sp-7);cursor:pointer}
.hrow .hl:hover{background:var(--surface-2)}
.hrow .tm{font:var(--fs-sm) var(--mono);color:var(--text-3);width:42px;flex:none;padding-top:var(--sp-1)}
.hrow .tx{flex:1;min-width:0;font-size:var(--fs)}
.hrow .tx b{font-weight:600}
.hrow .tx small{display:block;color:var(--text-3);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .kn2{width:110px;flex:none;font-size:var(--fs-mono);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:var(--sp-1)}
.hrow .who{width:70px;flex:none;font-size:var(--fs-mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:var(--sp-1)}
.hrow .act{flex:none;font-size:var(--fs-mono);color:var(--accent);padding-top:var(--sp-1)}
.hrow.yl .tx b{color:var(--warn)}
.hrow.done .tx b{color:var(--text-3);text-decoration:line-through}
.hrow .open{padding:var(--sp-1) var(--sp-7) var(--sp-6) 66px}
/* 이력 — 팀 + 개인 한 흐름: 영역 칸 · 왼쪽 줄 색 · 위 요약 · 거르기 · 보낸 기록이 지나간 길 */
.hrow .ar{width:34px;flex:none;padding-top:1px}
.hrow.team .hl{box-shadow:inset 3px 0 0 var(--accent-line)}
.hrow.me .hl{box-shadow:inset 3px 0 0 var(--border-strong)}
.hday .r{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-5);margin-bottom:var(--sp-6)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:var(--sp-5) var(--sp-7);cursor:pointer}
.tile:hover{border-color:var(--border-strong)}
.tile .l{font-size:var(--fs-sm);color:var(--text-3)}
.tile .n{font-size:var(--fs-xl);font-weight:700;line-height:1.3}
.tile .s{font-size:var(--fs-sm);color:var(--text-2);display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.tile.w .n{color:var(--warn)}
.hfl{display:flex;align-items:center;gap:var(--sp-5);flex-wrap:wrap;margin:0 0 var(--sp-6)}
.hfl .tabs{margin:0;border:0;gap:var(--sp-3);flex-wrap:wrap}
.hfl .tabs span{padding:3px var(--sp-5);border:1px solid var(--border);border-radius:var(--r-pill);font-size:var(--fs-mono)}
.hfl .tabs span.on{border-color:var(--accent);background:var(--accent-bg)}
.hfl .r{margin-left:auto;display:flex;gap:var(--sp-4);align-items:center}
.hfl .seg{margin:0;flex:none}
.hfl .seg button{flex:none;padding:var(--sp-2) var(--sp-6)}
.hfl .vsep{width:1px;height:22px;background:var(--border-strong)}
/* 이력 — 저장 문이 넣은 항목(「옛 값 → 새 값」 · 항목마다 되돌리기 · S5) · 값이 길면 줄을 넘긴다(375 에서 가로 스크롤 없게) */
.hitems{list-style:none;margin:var(--sp-2) 0 var(--sp-4);padding:0}
.hitems li{display:flex;align-items:center;gap:var(--sp-2) var(--sp-4);flex-wrap:wrap;padding:var(--sp-2) 0;border-top:1px solid var(--border);font-size:var(--fs)}
.hitems li:first-child{border-top:0}
.hitems .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.hitems .vchg{white-space:normal;overflow-wrap:anywhere}
.hitems li.done .nm{color:var(--text-3);text-decoration:line-through}
.trace{list-style:none;margin:var(--sp-2) 0 var(--sp-4);padding:0}
.trace li{display:flex;gap:var(--sp-5);align-items:flex-start;padding:5px 0;font-size:var(--fs);position:relative}
.trace li::before{content:'';position:absolute;left:92px;top:24px;bottom:-6px;width:2px;background:var(--border)}
.trace li:last-child::before{display:none}
.trace .t{font:var(--fs-sm) var(--mono);color:var(--text-3);width:74px;flex:none;padding-top:1px}
.trace .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:var(--fs-xs);font-weight:700;background:var(--ok-bg);color:var(--ok);z-index:1}
.trace .dot.w{background:var(--pending-bg);color:var(--pending)}
.trace .dot.n{background:var(--surface-3);color:var(--text-3)}
.trace small{display:block;color:var(--text-3);font-size:var(--fs-sm)}

/* ── 문서 본문 — 가운데 영역을 다 쓰고, 넘치지 않는다(긴 줄은 접는다 · 표 · 그림은 종이 안에서) ── */
.paper{min-width:0;overflow-wrap:break-word;word-break:keep-all;font-size:var(--fs-md);line-height:var(--lh-read)}
.paper code,.paper pre,.paper td{overflow-wrap:anywhere}
.paper pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-width:100%;overflow-x:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:var(--sp-5) var(--sp-6);font-size:var(--fs);line-height:1.55}
.paper pre code{white-space:inherit;background:none;padding:0}
.paper table{max-width:100%}
.paper td,.paper th{overflow-wrap:anywhere}
.paper img{max-width:100%;height:auto}

/* ── 컨벤션 부품(docs/kmd_디자인_컨벤션.md) — 새 화면은 이것만으로 짓는다 ── */
.btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn.ghost:hover:where(:not([disabled])){background:var(--hover);color:var(--text)}
.btn.ghost[disabled]{color:var(--text-3)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pg-h{display:flex;align-items:flex-start;gap:var(--sp-6);margin-bottom:var(--sp-7)}
.pg-h .big{margin-top:0}
.pg-h .lead{margin:0}
.pg-h .acts{margin-left:auto;display:flex;gap:var(--sp-4);flex:none;padding-top:var(--sp-1)}
.sec-h{display:flex;align-items:center;gap:var(--sp-4);margin:var(--sp-9) 0 var(--sp-4);flex-wrap:wrap}
.sec-h b{font-size:var(--fs-md);font-weight:700}
.sec-h small{color:var(--text-3);font-size:var(--fs-mono)}
.sec-h .acts{margin-left:auto;display:flex;gap:var(--sp-4)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5) var(--sp-7)}
.fgrid .full{grid-column:1/-1}
.fgrid .field{margin:0}
/* 팝업 메뉴 — 화면 맨 위 층 · 누른 단추 자리에서 잰다(카드 · 스크롤 상자에 잘리지 않는다) */
.pop{position:fixed;z-index:var(--z-pop);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:var(--sp-3);min-width:200px;max-width:min(340px,calc(100vw - 16px));max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow-y:auto;font-size:var(--fs);color:var(--text);line-height:1.5}
.pop .mi{padding:7px var(--sp-5);border-radius:var(--r);display:flex;gap:var(--sp-4);align-items:center;cursor:pointer;white-space:normal;overflow-wrap:anywhere} /* 넓은 글은 상자 안에서 줄을 바꾼다 */
.pop .mi small{white-space:nowrap}
.pop .mi:hover{background:var(--surface-2)}
.pop .mi small{margin-left:auto;color:var(--text-3);font-size:var(--fs-xs);padding-left:var(--sp-5)}
.pop .mi.on{color:var(--accent);font-weight:600}
.pop .mi.dan{color:var(--danger)}
.pop .mi.off{color:var(--text-3);cursor:default}
.pop .mi.off:hover{background:none}
.pop .sep{border-top:1px solid var(--border);margin:var(--sp-2) var(--sp-1)}
.pop .gray{font-size:var(--fs-sm);color:var(--text-3);padding:var(--sp-3) var(--sp-5) var(--sp-2);white-space:normal}
/* 모달 짜임 */
.scrim.fix{position:fixed;z-index:var(--z-scrim)}
.modal.w420{width:min(420px,calc(100% - 24px))}.modal.w560{width:min(560px,calc(100% - 24px))}.modal.w760{width:min(760px,calc(100% - 24px))}.modal.w640{width:min(640px,calc(100% - 24px))}
/* 머리 띠의 경고 단추 · 경고 팝업 */
.stopbtn{gap:var(--sp-3);max-width:min(520px,100%);min-width:0;background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn);font-weight:600}
.stopbtn.bad{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.stopbtn span{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stopbtn:hover:not([disabled]){filter:brightness(.97);background:var(--warn-bg)}
.stopbtn.bad:hover:not([disabled]){background:var(--danger-bg)}
[data-t=stopWin] .stop{display:flex;gap:var(--sp-5);align-items:flex-start}
[data-t=stopWin] .stop small{display:block;margin-top:var(--sp-1);opacity:.8}
[data-t=stopWin] .stop .btn{margin-left:auto;flex:none}
.modal .mh{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-6) var(--sp-8);border-bottom:1px solid var(--border);font-weight:700;font-size:var(--fs-md)}
.modal .mh small{font-weight:400;color:var(--text-3);font-size:var(--fs-mono)}
.modal .mh .x{margin-left:auto;border:0;background:none;font-size:var(--fs-lg);line-height:1;color:var(--text-3);cursor:pointer;padding:var(--sp-1) var(--sp-2);border-radius:var(--r-xs)}
.modal .mh .x:hover{background:var(--hover);color:var(--text)}
.modal .mb{padding:var(--sp-7) var(--sp-8);max-height:calc(100vh - 180px);max-height:calc(100dvh - 180px);overflow:auto}
.modal .mf{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-5) var(--sp-8);border-top:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.modal .mf .l{font-size:var(--fs-sm);color:var(--text-3);min-width:0}
.modal .mf .acts{margin-left:auto;display:flex;gap:var(--sp-4);flex-wrap:wrap;justify-content:flex-end}
/* 지식 폴더 띠 */
.fbar{display:flex;align-items:center;gap:var(--sp-5);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:var(--sp-5) var(--sp-7);margin-bottom:var(--sp-8);flex-wrap:wrap}
.fbar .fl{font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:var(--sp-3)}
.fbar .fp{font:var(--fs-mono) var(--mono);color:var(--text-2);background:var(--surface-2);border-radius:var(--r);padding:var(--sp-2) 9px;min-width:0;flex:1 1 240px;overflow-wrap:anywhere}
.fbar .acts{display:flex;gap:var(--sp-3);margin-left:auto}
.fbar small{flex-basis:100%;color:var(--text-3);font-size:var(--fs-sm)}
/* 지식 그리드 */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--sp-6)}
.kcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:var(--sp-6) var(--sp-6) var(--sp-5) var(--sp-7);cursor:pointer;display:flex;flex-direction:column;gap:var(--sp-3);min-height:104px;transition:border-color .1s,box-shadow .1s}
.kcard:hover{border-color:var(--accent-line);box-shadow:var(--shadow-2)}
.kcard .kh{display:flex;align-items:flex-start;gap:var(--sp-4)}
.kcard .kn3{font-weight:700;font-size:var(--fs-md);line-height:1.35;min-width:0;overflow-wrap:anywhere;flex:1;border:0;background:none;padding:0;margin:0;text-align:left;color:var(--text);cursor:pointer;border-radius:var(--r-xs)}
.kcard .kn3:hover{color:var(--accent)}
.kcard .kebab{margin:-4px -4px 0 0}
.kcard .km{font-size:var(--fs-mono);color:var(--text-3)}
.kcard .kf{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:auto;align-items:center}
.kcard.dim{opacity:.5}
.kcard.hid{background:var(--surface-2);box-shadow:none;min-height:0}
.kcard.drag{opacity:.4}
.kcard.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-line)}
.kcard.add{border:1.5px dashed var(--border-strong);background:none;box-shadow:none;align-items:center;justify-content:center;color:var(--text-2);font-weight:600;gap:var(--sp-2)}
.kcard.add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.kcard.add.dim{opacity:.6}
.kcard.old{border-style:dashed}
.kcard.add .pl{font-size:var(--fs-xl);line-height:1;font-weight:400}
.kcard .grip{position:absolute;left:4px;top:50%;transform:translateY(-50%);color:var(--border-strong);font-size:var(--fs-xs);letter-spacing:-2px;cursor:grab;user-select:none}
/* 가져올 곳 줄 */
.slist{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.srow{display:flex;align-items:center;gap:var(--sp-6);padding:var(--sp-5) var(--sp-7);border-top:1px solid var(--border);cursor:pointer}
.srow:first-child{border-top:0}
.srow:hover{background:var(--hover)}
.srow .si{width:30px;height:30px;border-radius:var(--r);background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-2)}
.srow .si svg{width:16px;height:16px}
.srow .sn{min-width:0;flex:1 1 220px}
.srow .sn b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sn small{display:block;color:var(--text-3);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sc{flex:0 1 200px;min-width:0;font-size:var(--fs-mono);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sc small{display:block;color:var(--text-3);font-size:var(--fs-xs)}
.srow .ss{flex:none;display:flex;gap:var(--sp-3);align-items:center}
.srow .sa{flex:none;display:flex;gap:var(--sp-3);align-items:center}
.slist .none{padding:var(--sp-8) var(--sp-7);color:var(--text-3)}
/* 터미널 */
.term{background:var(--term-bg);color:var(--term-text);border-radius:var(--r-md);font:var(--fs-mono)/1.55 var(--mono);padding:var(--sp-5) var(--sp-6);max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.term .say{color:var(--ink-text)}
.term .tool{color:var(--term-tool)}
.term .ok{color:var(--term-ok)}
.term .err{color:var(--term-err)}
.term .sys,.term .cost{color:var(--term-dim)}
.term .tm{color:var(--term-dim);margin-right:var(--sp-4)}
.term-h{display:flex;align-items:center;gap:var(--sp-4);margin:var(--sp-4) 0 var(--sp-3);font-size:var(--fs-mono);color:var(--text-2)}
.term-h b{color:var(--text)}
.term .sg{display:inline-block;min-width:44px;color:var(--term-dim);margin-right:var(--sp-3)}
/* 가져오기 — 일 줄(목업 docs/kmd_가져오기_일줄_목업.html) */
.imp .tabs span{display:flex;gap:var(--sp-3);align-items:center;font-size:var(--fs);padding:var(--sp-4) var(--sp-7)}
.imp .tabs em{font-style:normal;font-size:var(--fs-xs);font-weight:700;background:var(--surface-3);color:var(--text-2);border-radius:var(--r-pill);padding:0 var(--sp-3)}
.imp .tabs span.on em{background:var(--accent-bg);color:var(--accent)}
.imp .tabs em.w{background:var(--warn-bg);color:var(--warn)}
.drop.bar{display:flex;align-items:center;gap:var(--sp-3) var(--sp-6);flex-wrap:wrap;text-align:left;padding:var(--sp-4) var(--sp-6);margin-bottom:var(--sp-6);border-radius:var(--r-md)}
.drop.bar b{display:inline;margin:0;font-size:var(--fs)}
.drop.bar .lks{margin:0 0 0 auto}
.drop.bar select{max-width:260px}
.drop.bar small{flex-basis:100%;color:var(--text-3);font-size:var(--fs-sm)}
/* 팀 화면 파일 넣기 — 「원본 파일도 첨부로 둔다」(기본 꺼짐 · S8) */
.drop.bar .impatt{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--text-2);cursor:pointer}
.drop.bar .impatt:hover{color:var(--text)}
.qbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-5)}
/* 정리할 팀 지식 줄 — 정리 화면 안에서 고른다 */
.kstrip{display:flex;gap:var(--sp-5);flex-wrap:wrap;margin:0 0 var(--sp-7)}
.kstrip .kc{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:var(--sp-4) var(--sp-6);min-width:180px;cursor:pointer;box-shadow:var(--shadow-1)}
.kstrip .kc:hover{border-color:var(--border-strong)}
.kstrip .kc.on{border-color:var(--accent);background:var(--accent-bg)}
.kstrip .kc b{display:flex;gap:var(--sp-3);align-items:center}
.kstrip .kc small{display:block;color:var(--text-3);font-size:var(--fs-sm)}
.qbar .r{margin-left:auto;display:flex;gap:var(--sp-4);align-items:center;font-size:var(--fs-mono);color:var(--text-3)}
.qbar .lead{font-size:var(--fs)}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:var(--sp-7);align-items:start}
.qlist{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
.qlist .none,.det .none{padding:var(--sp-9) var(--sp-7);color:var(--text-3);text-align:center}
.qg{padding:7px var(--sp-6);background:var(--surface-2);border-top:1px solid var(--border);font-size:var(--fs-sm);font-weight:700;color:var(--text-2)}
.qg:first-child{border-top:0}
.qg small{font-weight:400;color:var(--text-3);margin-left:var(--sp-2)}
.qrow{display:flex;align-items:center;gap:var(--sp-5);padding:9px var(--sp-6);border-top:1px solid var(--border);cursor:pointer;position:relative}
.qrow:hover{background:var(--hover)}
.qrow.sel{background:var(--accent-bg)}
.qrow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.qrow .ord{font:600 var(--fs-xs) var(--mono);color:var(--text-3);width:14px;text-align:right;flex:none}
.imp .ic{width:28px;height:28px;border-radius:var(--r);display:inline-grid;place-items:center;flex:none;background:var(--surface-2);color:var(--text-2);vertical-align:middle}
.imp .ic svg{width:15px;height:15px}
.imp .ic.o-file{background:var(--accent-bg);color:var(--accent)}.imp .ic.o-git{background:var(--pending-bg);color:var(--pending)}.imp .ic.o-docs{background:var(--ok-bg);color:var(--ok)}.imp .ic.o-db{background:var(--warn-bg);color:var(--warn)}
.qrow .tx{min-width:0;flex:1}
.qrow .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tx small{display:block;color:var(--text-3);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .el{font:var(--fs-xs) var(--mono);color:var(--text-3);width:40px;text-align:right;flex:none}
.qrow .ac{display:flex;gap:var(--sp-2);flex:none}
.imp .auto{font-size:var(--fs-xs);font-weight:700;color:var(--text-3);border:1px solid var(--border);border-radius:var(--r-xs);padding:0 var(--sp-2);margin-left:var(--sp-2)}
.qmini{display:flex;flex-direction:column;flex:none;width:76px}
.qmini small{font-size:var(--fs-xs);color:var(--text-3);margin-top:3px;white-space:nowrap}
.mini{display:flex;gap:var(--sp-1)}
.mini i{flex:1;height:6px;border-radius:var(--r-xs);background:var(--surface-3)}
.mini i.done{background:var(--ok)}.mini i.run{background:var(--accent);animation:busyBlink 1.4s ease-in-out infinite}
.mini i.pause,.mini i.check{background:var(--warn-line)}.mini i.fail{background:var(--danger)}
.c-ok{background:var(--ok-bg);color:var(--ok)}
/* 자세히 — 흐름 그림 · 터미널 */
.det{position:sticky;top:0;margin:0}
.det .dh{padding:var(--sp-6) var(--sp-7);border-bottom:1px solid var(--border);display:flex;gap:var(--sp-5);align-items:flex-start}
.det .dh .t{min-width:0;flex:1}.det .dh b{font-size:var(--fs-md);display:block;overflow-wrap:anywhere}.det .dh small{color:var(--text-3);font-size:var(--fs-mono)}
.det .ctl{display:flex;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-5) var(--sp-7);border-bottom:1px solid var(--border)}
.det .sec{padding:var(--sp-6) var(--sp-7);border-bottom:1px solid var(--border)}
.det .sec:last-child{border-bottom:0}
.det .sh{font-size:var(--fs-mono);font-weight:700;color:var(--text-2);margin-bottom:var(--sp-4);display:flex;gap:var(--sp-4);align-items:center}
.det .sh small{font-weight:400;color:var(--text-3)}
.det .sh .r{margin-left:auto;font-weight:400;font-size:var(--fs-xs);color:var(--text-3)}
.det .meta{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:var(--sp-2) var(--sp-6);font-size:var(--fs-mono);margin:0}
.det .meta dt{color:var(--text-3)}.det .meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.det .callout{margin:0 0 var(--sp-5)}
.det .term{max-height:280px;min-height:120px}
