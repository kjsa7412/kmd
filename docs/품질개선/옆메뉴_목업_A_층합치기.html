<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>옆 메뉴 목업 A</title>
<meta name="description" content="보기 탭과 갈래 탭을 한 줄로 · 관리는 아래 아이콘 한 줄 · 사람은 머리 줄 오른쪽">
<style>
/* 토큰 — app/kmd.css 의 :root 를 그대로 옮겼다(목업 만들 때 2026-11-08). 아래 규칙은 이 토큰만 쓴다 */
:root{
  --hit:24px;
  /* 면 · 선 */
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f7;--surface-3:#e6eaf0;--hover:#f5f7fa;
  --border:#e2e6ed;--border-strong:#c9d1dd;--border-input:#7d8799;
  /* 글 — --text-3 #646d7b: 흰 바탕 5.23:1 · --surface-2(#f1f3f7) 위 4.71:1(WCAG 상대 휘도로 잼 · 옛 #858e9d 는 3.31 · 2.98) */
  --text:#11151c;--text-2:#515a68;--text-3:#646d7b;--on-accent:#fff;
  /* 뜻 색 — 파랑=주 일 · 고른 것 / 초록=됨 · 켜짐 / 노랑=멈춤 · 값 바뀜 / 빨강=못 함 · 지우기 / 보라=기다림 · 받은 것 */
  --accent:#3358e6;--accent-hover:#2a4bd0;--accent-bg:#e9eeff;--accent-line:#c3d0fb;
  /* --ok #237a47: ok-bg 위 4.72 · 흰 바탕 5.32 · surface-2 위 4.79(옛 #2e9b5b 는 3.13 · 3.53 — 작은 굵은 글에 모자랐다) */
  --ok:#237a47;--ok-bg:#e6f5ec;--ok-line:#bfe3cc;
  --warn:#8c5c00;--warn-bg:#fcf3e0;--warn-line:#d39a2c;
  /* --danger #b8321f: danger-bg 위 5.23 · 흰 바탕 5.98(옛 #cb3a2c 는 danger-bg 위 4.39) */
  --danger:#b8321f;--danger-bg:#fdeceb;--danger-line:#efb7b1;
  --pending:#6247c4;--pending-bg:#efedfd;--pending-line:#d9d2fb;
  /* 그래프 점 종류(모양과 함께만 쓴다 · 색만으로 가르지 않는다) — 흰 바탕 대비: 문서 10.35 · 항목 5.71 · 기록 5.18 · 파랑 · 주황은 색각 이상에도 갈린다 */
  --k-doc:#334155;--k-item:#3358e6;--k-rec:#c2410c;
  --g-ring:#fff;
  /* 그래프 칸 어두운 바탕(그래프만 · .gwrap.dark 가 위 토큰을 갈아 끼운다) — 글 대비: 글 #e6ebf5 15.8 · 흐린 글 #8a97b3 6.5 · 문서 #cbd5e1 12.8 · 항목 #7c9cff 7.3 · 기록 #fb923c 8.4(바탕 #0b1020 위) */
  --gd-bg:#0b1020;--gd-surface:#121a2e;--gd-surface-2:#18223a;--gd-border:#253252;--gd-border-strong:#3a4a72;
  --gd-text:#e6ebf5;--gd-text-2:#b2bdd3;--gd-text-3:#8a97b3;--gd-k-doc:#cbd5e1;--gd-k-item:#7c9cff;--gd-k-rec:#fb923c;--gd-accent:#8aa4ff;--gd-accent-bg:#1f2a4d;--gd-warn-bg:#3a2e12;
  /* 진한 띠(토스트 · 툴팁 · 고른 띠 · 「나」 표지) · 터미널(7절) */
  --ink:#11151c;--ink-2:#262d3b;--ink-text:#e8ecf3;
  --term-bg:#0f141c;--term-text:#d7dde8;--term-dim:#7d8696;--term-tool:#8fb0ff;--term-ok:#7fd69a;--term-err:#ff8f86;
  /* 글 크기 */
  --fs-xs:11px;--fs-sm:11.5px;--fs-mono:12px;--fs:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;
  --lh-tight:1.25;--lh:1.55;--lh-read:1.7;
  /* 간격 — 카드 안 · 카드 사이 14 · 영역 사이 22 */
  --sp-1:2px;--sp-2:4px;--sp-3:6px;--sp-4:8px;--sp-5:10px;--sp-6:12px;--sp-7:14px;--sp-8:16px;--sp-9:22px;
  /* 모서리 — 표지 · 작은 칩 · 단추 · 칸(팝업 · 모달) · 카드 · 알약 */
  --r-xs:4px;--r-sm:5px;--r:7px;--r-md:10px;--r-lg:12px;--r-pill:999px;
  /* 그림자 — 카드 · 팝업과 모달 · 맨 위에 뜨는 것(찾기 창 · 서랍) · 키보드 초점 고리 */
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);
  --shadow-2:0 2px 6px -1px rgba(15,23,42,.08),0 14px 32px -8px rgba(15,23,42,.18);
  --shadow-3:0 18px 48px rgba(15,23,42,.28);
  --focus-ring:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
  /* 층 — 토스트는 모달 위 */
  --z-menu:20;--z-scrim:70;--z-pop:80;--z-toast:90;
  /* 화면 최대 폭(2절) · 옆 메뉴 · 오른쪽 칸 */
  --w-text:820px;--w-list:980px;--w-grid:1100px;--w-side:248px;--w-aside:300px;
  /* 접힌 옆 메뉴 · 오른쪽 칸(레일) · 너비 잡이 · 그래프 팝업 */
  --w-rail:48px;--w-grip:6px;--w-graph:400px;
  /* 글꼴 — 모노는 경로 · 주소 · 이름 · 시각에만 */
  --font:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono",D2Coding,"Malgun Gothic",monospace;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/var(--lh) var(--font);word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{height:46px;flex:none;display:flex;align-items:center;gap:var(--sp-5);padding:0 var(--sp-7);background:var(--surface);border-bottom:1px solid var(--border)}
.hb{width:28px;height:28px;display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text-2);cursor:pointer;flex:none;position:relative;padding:0}
.hb:hover{background:var(--hover);color:var(--text)}
.hb:focus-visible,.tb:focus-visible,.tn:focus-visible,.ab:focus-visible,.mb2:focus-visible,.kp:focus-visible{outline:0;box-shadow:var(--focus-ring)}
.crumb{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--text)}
.hmid{flex:1;display:flex;gap:var(--sp-4);justify-content:center;min-width:0}
.qbtn,.search{height:30px;display:flex;align-items:center;gap:var(--sp-3);border:1px solid var(--border-strong);border-radius:var(--r);padding:0 var(--sp-5);color:var(--text-2);background:var(--surface);white-space:nowrap}
.search{width:min(260px,100%)}
.hright{display:flex;align-items:center;gap:var(--sp-6);color:var(--text-2);white-space:nowrap}
.menu-btn,.aside-btn{display:none}
.band{height:30px;flex:none;display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-7);background:var(--accent-bg);color:var(--text);font-weight:600;font-size:var(--fs-sm)}
.band.me{background:var(--ok-bg)}
.band i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.band.me i{background:var(--ok)}
.body{flex:1;display:flex;min-height:0}
.main{flex:1;min-width:0;overflow:auto;padding:var(--sp-7) var(--sp-9)}
.paper{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-9);max-width:var(--w-text);box-shadow:var(--shadow-1)}
.paper h1{font-size:var(--fs-xl);margin:0 0 var(--sp-2)}
.paper h2{font-size:var(--fs-lg);margin:var(--sp-9) 0 var(--sp-4);padding-top:var(--sp-6);border-top:1px solid var(--border)}
.paper p{line-height:var(--lh-read);margin:0 0 var(--sp-5)}
.muted{color:var(--text-3)}.small{font-size:var(--fs-sm)}
.aside{width:var(--w-aside);flex:none;border-left:1px solid var(--border);background:var(--surface);padding:var(--sp-7);overflow:auto}
.aside .agh{display:flex;justify-content:space-between;padding:var(--sp-4) var(--sp-3);border-bottom:1px solid var(--border);font-weight:600}
.aside .agh span{color:var(--text-3);font-weight:400;font-size:var(--fs-xs)}
.drawer-scrim{display:none;position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 32%,transparent);z-index:calc(var(--z-scrim) - 2)}
/* 옆 메뉴 공통 부품 */
.side{flex:none;position:relative;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.inp{width:100%;height:30px;border:1px solid var(--border-input);border-radius:var(--r);padding:0 var(--sp-5);background:var(--surface);font-size:var(--fs)}
.inp:focus{outline:0;box-shadow:var(--focus-ring)}
.lp{flex:1;min-height:0;overflow:auto;padding:var(--sp-2) 0}
.tn{display:flex;align-items:center;gap:var(--sp-3);height:26px;padding:0 var(--sp-4);border-radius:var(--r);cursor:pointer;white-space:nowrap;color:var(--text);border:0;background:none;width:100%;text-align:left;font-size:var(--fs)}
.tn:hover{background:var(--hover)}
.tn.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tn svg{color:var(--text-3)}
.tn.on svg{color:var(--accent)}
.tn.dir{color:var(--text-2);font-weight:600}
.tn .ar{width:10px;color:var(--text-3);font-size:var(--fs-xs)}
.tn .rc{font-size:var(--fs-xs);color:var(--text-3);background:var(--surface-2);border-radius:var(--r-pill);padding:0 var(--sp-3)}
.tn .dt{font:var(--fs-xs) var(--mono);color:var(--text-3);width:40px;flex:none}
.tn .iv{font:600 var(--fs-mono) var(--mono)}
.pd{width:7px;height:7px;border-radius:50%;background:var(--warn-line);flex:none}
.bd{min-width:16px;height:16px;padding:0 var(--sp-2);border-radius:var(--r-pill);background:var(--warn-bg);color:var(--warn);font-size:var(--fs-xs);font-weight:700;display:inline-grid;place-items:center;line-height:1}
.gfs{padding:var(--sp-4) var(--sp-3)}
.gfs .gh{font-size:var(--fs-sm);color:var(--text-3);margin-bottom:var(--sp-3)}
.gfr{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.fbtn{height:24px;border:1px solid var(--border-input);border-radius:var(--r);background:var(--surface);padding:0 var(--sp-4);font-size:var(--fs-sm);cursor:pointer}
.fbtn[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.kp{display:flex;align-items:center;gap:var(--sp-4);min-width:0;border:0;background:none;padding:var(--sp-3) var(--sp-4);border-radius:var(--r);cursor:pointer;text-align:left}
.kp:hover{background:var(--surface-2)}
.kp .rk{font:700 var(--fs-xs) var(--mono);background:var(--accent-bg);color:var(--accent);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2)}
.band.me~* .kp .rk,.me-scr .kp .rk{background:var(--ok-bg);color:var(--ok)}
.kp .rn{flex:1;min-width:0;font-weight:700;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp .rc{color:var(--text-3);font-size:var(--fs-xs)}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-mono);flex:none}
.pop{position:absolute;z-index:var(--z-pop);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:var(--sp-2);min-width:200px}
.pop .mi{display:flex;align-items:center;gap:var(--sp-4);width:100%;border:0;background:none;padding:var(--sp-4) var(--sp-5);border-radius:var(--r);cursor:pointer;text-align:left;font-size:var(--fs)}
.pop .mi:hover{background:var(--hover)}
.pop .mi .bd{margin-left:auto}
.pop .sep{border-top:1px solid var(--border);margin:var(--sp-2) 0}
/* 목업 조종판(목업만) */
.mk{position:fixed;right:var(--sp-5);bottom:var(--sp-5);z-index:var(--z-toast);display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;background:var(--ink);color:var(--ink-text);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-xs);box-shadow:var(--shadow-3);max-width:calc(100vw - var(--sp-9))}
.mk b{margin-right:var(--sp-3)}
.mk button{border:1px solid var(--ink-2);background:var(--ink-2);color:var(--ink-text);border-radius:var(--r-xs);padding:var(--sp-1) var(--sp-4);cursor:pointer;font-size:var(--fs-xs)}
.mk button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.mk a{color:var(--accent-line)}
.mk .x{margin-left:var(--sp-2)}
.mk.mini{padding:var(--sp-2)}
@media (max-width:1024px){
  .aside{display:none}.aside-btn{display:inline-grid;width:auto;padding:0 var(--sp-4);font-size:var(--fs-sm)}
  .qbtn kbd,.search .sk{display:none}
}
@media (max-width:600px){
  .menu-btn{display:inline-grid}
  .hmid .qbtn{display:none}.search{width:30px;padding:0;justify-content:center}.search .sl{display:none}
  .hright .hl{display:none}
  .hdr{padding:0 var(--sp-5);gap:var(--sp-3)}
  .main{padding:var(--sp-5)}
  .paper{padding:var(--sp-7)}
  .side{position:fixed;top:0;left:0;bottom:0;z-index:calc(var(--z-scrim) - 1);box-shadow:var(--shadow-3);transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility .2s}
  .app.side-open .side{transform:none;visibility:visible}
  .app.side-open~.drawer-scrim{display:block}
  .mk:not(.mini){left:var(--sp-5);right:var(--sp-5);bottom:var(--sp-3)}
}

/* ── A 층 합치기 ── */

.side{width:var(--w-side);padding:var(--sp-5) var(--sp-4) 0}
.a-top{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.a-top .kp{flex:1}
.a-tabs{display:flex;border-bottom:1px solid var(--border);margin:0 0 var(--sp-4)}
.tb{flex:1;border:0;background:none;padding:var(--sp-3) 0 var(--sp-4);display:flex;align-items:center;justify-content:center;gap:var(--sp-2);color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:var(--fs)}
.tb em{font-style:normal;font-size:var(--fs-xs);color:var(--text-3)}
.tb:hover{color:var(--text)}
.tb[aria-selected=true]{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
.tb[aria-selected=true] svg{color:var(--accent)}
.a-find{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.a-find .hb{height:30px;width:30px}
.a-mg{flex:none;display:flex;border-top:1px solid var(--border);margin:0 calc(var(--sp-4) * -1);padding:var(--sp-2) var(--sp-2)}
.mb2{flex:1;min-width:0;height:36px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:var(--r);padding:0;cursor:pointer;color:var(--text-2);font-size:var(--fs-xs);position:relative;white-space:nowrap}
.mb2 svg{width:17px;height:17px}
.mb2:hover{background:var(--hover);color:var(--text)}
.mb2.on{background:var(--accent-bg);color:var(--accent);font-weight:700}
.mb2 .bd{position:absolute;top:var(--sp-1);left:calc(50% + var(--sp-3))}
.a-mg .who{flex:none;width:auto;padding:0 var(--sp-3)}
.mb2 .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 접힘(레일) — 같은 짜임의 아이콘만 */
.srail{display:none}
@media (min-width:601px){
  .app.side-rail .side{width:var(--w-rail);padding:var(--sp-5) 0;align-items:center}
  .app.side-rail .side>:not(.srail){display:none}
  .app.side-rail .srail{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);height:100%}
}
.srail .hb{border-color:transparent;background:none}
.srail .hb.on{background:var(--accent-bg);color:var(--accent)}
.srail .rsep{width:60%;border-top:1px solid var(--border);margin:var(--sp-2) 0}
.srail .hb .bd{position:absolute;top:calc(var(--sp-2) * -1);right:calc(var(--sp-2) * -1);min-width:14px;height:14px}
.srail .end{margin-top:auto;margin-bottom:var(--sp-5)}
@media (max-width:600px){.side{width:min(var(--w-side),calc(100vw - 48px))}.a-top .fold{display:none}}

</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="drawer-scrim" data-a="scrim"></div>
<div id="mk" class="mk" aria-label="목업 조종판"></div>
<script>
const VAR = 'A', PERSON_IN_HDR = true

const I = {
  doc:'M6 3h8l4 4v14H6zM14 3v4h4', tag:'M3 12V3h9l9 9-9 9zM7.5 7.5h.01', rec:'M5 4h14v16H5zM8 9h8M8 13h8M8 17h5',
  graph:'M7 7m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M17 7m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M12 18m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M9 9l2 6.5M15 9l-2 6.5M9.5 7h5',
  hour:'M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9', arrow:'M4 12h15M13 6l6 6-6 6',
  held:'M4 13l3-8h10l3 8v6H4zM4 13h5l1 2h4l1-2h5', folder:'M3 6h6l2 2h10v11H3z',
  gear:'M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
  send:'M4 12l16-8-6 16-2-7z', search:'M11 11m-6 0a6 6 0 1 0 12 0a6 6 0 1 0-12 0M20 20l-4.5-4.5', clip:'M8 12l6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l7-7',
  sideL:'M4 4h16v16H4zM9 4v16', filter:'M4 5h16l-6 8v6l-4-2v-4z', expand:'M7 9l5-5 5 5M7 15l5 5 5-5', book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM19 19v2H6', list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
}
const svg = (n) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + I[n] + '"/></svg>'
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
// 시험 지식(목업만) — 문서 31 · 기록 17 · 첨부 2 · 항목 26
const DOCS = [
  ['개요', 0], ['서버 목록', 0], ['용어 모음', 0], ['이슈 대장', 1],
  ['운영/', [['배포 절차', 0], ['배포 체크리스트', 0], ['롤백 절차', 0], ['릴리스 노트', 0], ['모니터링', 0], ['장애 대응', 0], ['점검 일정', 0]]],
