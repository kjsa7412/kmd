<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문서 화면 개편 목업</title>
<style>
/* 목업 — 토큰은 app/kmd.css :root 와 같은 값(컨벤션 1절). 새 토큰 후보는 --w-side-min 등 「새」 표시 */
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f7;--surface-3:#e6eaf0;--hover:#f5f7fa;
  --border:#e2e6ed;--border-strong:#c9d1dd;--border-input:#7d8799;
  --text:#11151c;--text-2:#515a68;--text-3:#646d7b;--on-accent:#fff;
  --accent:#3358e6;--accent-hover:#2a4bd0;--accent-bg:#e9eeff;--accent-line:#c3d0fb;
  --ok:#237a47;--ok-bg:#e6f5ec;--ok-line:#bfe3cc;
  --warn:#8c5c00;--warn-bg:#fcf3e0;--warn-line:#d39a2c;
  --danger:#b8321f;--danger-bg:#fdeceb;--danger-line:#efb7b1;
  --pending:#6247c4;--pending-bg:#efedfd;--pending-line:#d9d2fb;
  --ink:#11151c;--ink-2:#262d3b;--ink-text:#e8ecf3;
  --fs-xs:11px;--fs-sm:11.5px;--fs-mono:12px;--fs:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;
  --sp-1:2px;--sp-2:4px;--sp-3:6px;--sp-4:8px;--sp-5:10px;--sp-6:12px;--sp-7:14px;--sp-8:16px;--sp-9:22px;
  --r-xs:4px;--r-sm:5px;--r:7px;--r-md:10px;--r-lg:12px;--r-pill:999px;
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);
  --shadow-2:0 2px 6px -1px rgba(15,23,42,.08),0 14px 32px -8px rgba(15,23,42,.18);
  --shadow-3:0 18px 48px rgba(15,23,42,.28);
  --focus-ring:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
  --z-menu:20;--z-scrim:70;--z-pop:80;--z-toast:90;
  --w-text:820px;--w-side:248px;--w-aside:300px;
  /* 새 토큰 후보(개발 때 kmd.css 에 더한다) */
  --w-rail:48px;--w-side-min:200px;--w-side-max:420px;--w-aside-min:260px;--w-aside-max:560px;--w-grip:6px;--w-graph:400px;
  --font:Pretendard,-apple-system,"Segoe UI",system-ui,"Malgun Gothic",sans-serif;
  --mono:Consolas,"Cascadia Mono",D2Coding,"Malgun Gothic",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.55 var(--font)}
button{font:inherit;color:inherit}
svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* 목업 조종 띠(실제 화면에는 없다) */
.mk{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;background:var(--ink);color:var(--ink-text);padding:var(--sp-3) var(--sp-6);font-size:var(--fs-sm)}
.mk b{font-weight:700;margin-right:var(--sp-4)}
.mk button{background:var(--ink-2);border:1px solid var(--ink-2);color:var(--ink-text);border-radius:var(--r-pill);padding:var(--sp-1) var(--sp-6);cursor:pointer}
.mk button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mk .r{margin-left:auto;opacity:.75}

/* 앱 틀 */
.app{display:flex;height:calc(100dvh - 34px);overflow:hidden;position:relative}
.side{width:var(--sw,var(--w-side));flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;min-width:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-8);border-bottom:1px solid var(--border);background:var(--surface);min-height:44px}
.crumb{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--text)}
.hdr .r{margin-left:auto;display:flex;gap:var(--sp-3);align-items:center}
.body{flex:1;display:flex;min-height:0}
.center{flex:1;min-width:0;display:flex;flex-direction:column}
.tabbar{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-8) 0;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--bg)}
.tab{display:flex;align-items:center;gap:var(--sp-3);border:1px solid var(--border);border-bottom:0;background:var(--surface-2);border-radius:var(--r) var(--r) 0 0;padding:var(--sp-2) var(--sp-6);white-space:nowrap;cursor:pointer;color:var(--text-2)}
.tab.on{background:var(--surface);color:var(--text);font-weight:600}
.main{flex:1;overflow:auto;padding:var(--sp-8) var(--sp-9);min-width:0;position:relative}
.aside{width:var(--aw,var(--w-aside));flex:none;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;position:relative;min-width:0}

/* 단추 */
.btn{display:inline-flex;align-items:center;gap:var(--sp-3);border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r);padding:var(--sp-2) var(--sp-6);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:0 var(--sp-4);height:24px;font-size:var(--fs-sm)}
.btn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-line)}
.ib{width:28px;height:28px;display:grid;place-items:center;border:0;background:none;border-radius:var(--r);cursor:pointer;color:var(--text-2);flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.chip{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:0 var(--sp-4);font-size:var(--fs-xs);border:1px solid;line-height:18px;white-space:nowrap}
.c-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.c-mute{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.c-acc{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-line)}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.muted{color:var(--text-3)}.small{font-size:var(--fs-sm)}
.mono{font-family:var(--mono);font-size:var(--fs-mono)}

/* ── 1. 왼쪽 칸: 접기(레일) · 너비 조절 ── */
.sb-top{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-6) var(--sp-5) var(--sp-4)}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.who{min-width:0;flex:1}.who b{display:block}.who small{color:var(--text-3);font-size:var(--fs-xs)}
.kn{margin:0 var(--sp-5) var(--sp-4);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);display:flex;gap:var(--sp-4);align-items:center}
.kn .rk{font:700 var(--fs-xs) var(--mono);background:var(--accent-bg);color:var(--accent);border-radius:var(--r-sm);padding:var(--sp-1) 5px}
.kn .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;margin:0 var(--sp-5) var(--sp-4);background:var(--surface-2);border-radius:var(--r-md);padding:var(--sp-1)}
.seg button{flex:1;border:0;background:none;border-radius:var(--r);padding:var(--sp-2);cursor:pointer;color:var(--text-2);display:flex;gap:var(--sp-2);align-items:center;justify-content:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:var(--shadow-1)}
.tree{flex:1;overflow:auto;padding:0 var(--sp-3)}
.tf{font-weight:600;color:var(--text-2);padding:var(--sp-3) var(--sp-3);display:flex;gap:var(--sp-2);align-items:center}
.tf .cnt{margin-left:auto;color:var(--text-3);font-weight:400;font-size:var(--fs-xs)}
.tn{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-1) var(--sp-4) var(--sp-1) var(--sp-7);border-radius:var(--r);cursor:pointer;white-space:nowrap;overflow:hidden}
.tn:hover{background:var(--hover)}
.tn.on{background:var(--accent-bg);color:var(--accent)}
.tn span{overflow:hidden;text-overflow:ellipsis}
.nav{border-top:1px solid var(--border);padding:var(--sp-4) var(--sp-3)}
.nv{display:flex;gap:var(--sp-5);align-items:center;padding:var(--sp-3) var(--sp-4);border-radius:var(--r);cursor:pointer;white-space:nowrap;border:0;background:none;width:100%;text-align:left}
.nv:hover{background:var(--hover)}
.nv .n{margin-left:auto;background:var(--warn-bg);color:var(--warn);border-radius:var(--r-pill);padding:0 var(--sp-3);font-size:var(--fs-xs)}
.side .fold{position:absolute;top:var(--sp-6);right:var(--sp-3)}
/* 레일(접힘) */
.side.rail{width:var(--w-rail)}
.side.rail .who,.side.rail .kn,.side.rail .tree,.side.rail .seg,.side.rail .nv .t,.side.rail .nv .n,.side.rail .where{display:none}
.side.rail .sb-top{flex-direction:column;padding:var(--sp-6) 0 var(--sp-4)}
.side.rail .fold{position:static}
.rl{display:none;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-4) 0;flex:1}
.side.rail .rl{display:flex}
.side.rail .nav{padding:var(--sp-4) var(--sp-2)}
.side.rail .nv{justify-content:center;padding:var(--sp-3) 0;position:relative}
.side.rail .nv .dot{display:block}
.dot{display:none;position:absolute;top:4px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--warn-line)}
.rl .ib.on{background:var(--accent-bg);color:var(--accent)}
.where{font-size:var(--fs-xs);color:var(--text-3);padding:0 var(--sp-6) var(--sp-4)}
/* 잡이(너비 조절) */
.grip{position:absolute;top:0;bottom:0;width:var(--w-grip);cursor:col-resize;z-index:5;background:transparent;border:0;padding:0}
.grip:hover,.grip.drag,.grip:focus-visible{background:var(--accent-line)}
.side .grip{right:calc(var(--w-grip) / -2)}
.aside .grip{left:calc(var(--w-grip) / -2)}
.side.rail .grip,.aside.rail .grip{display:none}
.gtip{position:fixed;z-index:var(--z-toast);background:var(--ink);color:var(--ink-text);font:var(--fs-xs) var(--mono);padding:var(--sp-1) var(--sp-4);border-radius:var(--r-sm);pointer-events:none;display:none}

/* ── 3. 가운데: 문서 내용만 ── */
.tool{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-4);max-width:var(--w-text);margin:0 auto var(--sp-4)}
.tool .path{color:var(--text-3);font-size:var(--fs-sm);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 문서 폭: 기본(--w-text 820) · 넓게(가운데 칸 전체) */
.main.wide .tool,.main.wide .paper,.main.wide .gdock{max-width:none}
.wseg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.wseg button{border:0;background:none;padding:var(--sp-2) var(--sp-5);cursor:pointer;display:inline-flex;gap:var(--sp-2);align-items:center;color:var(--text-2);white-space:nowrap}
.wseg button+button{border-left:1px solid var(--border-strong)}
.wseg button:hover{background:var(--hover)}
.wseg button[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.paper{max-width:var(--w-text);margin:0 auto;border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-9) 28px;background:var(--surface);position:relative}
.paper h1{font-size:var(--fs-xl);margin:0 0 var(--sp-4)}
.paper h2{font-size:var(--fs-lg);margin:28px 0 var(--sp-4);scroll-margin-top:var(--sp-8)}
.paper h2 .iv{font:700 var(--fs-md) var(--mono);color:var(--text-2);margin-right:var(--sp-4)}
.paper .lead{color:var(--text-2);margin:0 0 var(--sp-6)}
.paper p{margin:var(--sp-3) 0}
.paper code{font-family:var(--mono);font-size:var(--fs-mono);background:var(--surface-2);border-radius:var(--r-xs);padding:0 var(--sp-2)}
.paper table{border-collapse:collapse;width:100%;margin:var(--sp-4) 0;font-size:var(--fs)}
.paper th,.paper td{border:1px solid var(--border);padding:var(--sp-3) var(--sp-5);text-align:left;vertical-align:top}
.paper th{background:var(--surface-2)}
.tblwrap{overflow-x:auto}
.paper pre{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:var(--sp-5) var(--sp-6);white-space:pre-wrap;font:var(--fs-mono)/1.55 var(--mono);margin:var(--sp-4) 0}
.ilink{color:var(--accent);text-decoration:underline dotted;cursor:pointer}
.ih{display:flex;align-items:baseline;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-6)}
.ih .kt{font-size:var(--fs-xs);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 var(--sp-3);color:var(--text-2)}
.ih .iv{font:700 var(--fs-sm) var(--mono);color:var(--text-2)}
.ih h1{margin:0;flex-basis:100%}

/* ── 5. 수준 표시 줄(들여쓰지 않고 쓴 것을 화면이 매달아 보인다) ── */
/* 들여쓰지 않는다: 모든 줄이 맨 왼쪽에서 시작 · 수준은 표시(번호 · 줄표 · 점)와 글 무게로만 */
.lv{display:flex;gap:var(--sp-2);margin:var(--sp-1) 0}
.lv .m{flex:none;color:var(--text-2);font-variant-numeric:tabular-nums}
.lv .x{flex:1;min-width:0}
.lv.l1{margin-top:var(--sp-6);font-weight:700;font-size:var(--fs-md)}
.lv.l2{margin-top:var(--sp-4);font-weight:600}
.lv.l3{font-weight:600}
.lv.l1 .m,.lv.l2 .m,.lv.l3 .m{color:var(--accent)}

/* ── 4. 그래프: 본문 오른쪽 위 접힌 팝업 ── */
.gdock{position:sticky;top:0;z-index:var(--z-menu);max-width:var(--w-text);margin:0 auto;height:0;display:flex;justify-content:flex-end}
.gbtn{transform:translateY(var(--sp-7))}
.paper>h1,.paper>.ih{padding-right:120px}
.gbtn{position:relative;right:var(--sp-7);border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-pill);padding:var(--sp-1) var(--sp-6);display:flex;gap:var(--sp-3);align-items:center;cursor:pointer;box-shadow:var(--shadow-1);height:28px}
.gbtn:hover{background:var(--hover)}
.gbtn[aria-expanded=true]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-line)}
.gpop{position:absolute;top:calc(var(--sp-7) + 34px);right:var(--sp-7);width:min(var(--w-graph),calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-2);display:none}
.gpop.open{display:block}
.gpop .gh{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-6);border-bottom:1px solid var(--border)}
.gpop .gh b{flex:1}
.gpop svg.g{width:100%;height:auto;display:block}
.gpop .gf{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border);font-size:var(--fs-sm);color:var(--text-3)}
.gpop .gf .r{margin-left:auto}
.nd{cursor:pointer}
.nd circle{stroke-width:1.5}
.nd text{font:var(--fs-xs) var(--font);fill:var(--text-2);stroke:none}
.nd:hover circle,.nd:focus circle{stroke:var(--accent);stroke-width:2.5}
.nd:focus{outline:none}
.nd.me circle{fill:var(--accent);stroke:var(--accent)}
.nd.doc circle{fill:var(--surface);stroke:var(--border-input)}
.nd.item circle{fill:var(--accent-bg);stroke:var(--accent-line)}
.nd.rec circle{fill:var(--pending-bg);stroke:var(--pending-line)}
.eg{stroke:var(--border-strong);stroke-width:1.2}
.lg{display:flex;gap:var(--sp-5);align-items:center}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:var(--sp-2);vertical-align:-1px;border:1px solid}

/* ── 2 · 4. 오른쪽 칸: 접기(레일) · 너비 조절 · 묶음 기본 접힘 ── */
.ah{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-5) var(--sp-5) var(--sp-4) var(--sp-7);border-bottom:1px solid var(--border)}
.ah b{flex:1}
.ascroll{flex:1;overflow:auto;padding:var(--sp-3) var(--sp-4) var(--sp-8)}
.grp{border-bottom:1px solid var(--border)}
.grp>button.gs{width:100%;display:flex;align-items:center;gap:var(--sp-3);border:0;background:none;padding:var(--sp-4) var(--sp-3);cursor:pointer;text-align:left;border-radius:var(--r)}
.grp>button.gs:hover{background:var(--hover)}
.grp .ar{width:12px;color:var(--text-3);transition:transform .15s}
.grp.open .ar{transform:rotate(90deg)}
.grp .gt{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gn{font-size:var(--fs-xs);color:var(--text-3);font-variant-numeric:tabular-nums}
.grp .gn.w{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);border-radius:var(--r-pill);padding:0 var(--sp-3)}
.grp .gb{display:none;padding:0 var(--sp-2) var(--sp-5)}
.grp.open .gb{display:block}
.grp.now{background:var(--surface-2);border-radius:var(--r);border-bottom:0;margin-bottom:var(--sp-3)}
.grp.now .gt small{font-weight:400;color:var(--text-3);margin-left:var(--sp-2)}
.alr{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-2) var(--sp-3);border-radius:var(--r);cursor:pointer;font-size:var(--fs-mono);border:0;background:none;width:100%;text-align:left}
.alr:hover{background:var(--hover)}
.alr .dt{font:var(--fs-xs) var(--mono);color:var(--text-3);flex:none;width:38px;padding-top:var(--sp-1)}
.alr .nm{flex:1;min-width:0}
.alr .nm small{display:block;color:var(--text-3);font-size:var(--fs-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alr .rc{font-size:var(--fs-xs);color:var(--text-3)}
.alr.cur{background:var(--accent-bg);cursor:default}
.alr.cur .nm{color:var(--accent);font-weight:600}
.alr>.chip{flex:none;margin-top:var(--sp-1)}
.lv[id]{scroll-margin-top:var(--sp-8)}
.sub{font-size:var(--fs-xs);color:var(--text-3);padding:var(--sp-3) var(--sp-3) var(--sp-1);font-weight:600}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:var(--sp-2) var(--sp-5);font-size:var(--fs-mono);padding:var(--sp-2) var(--sp-3)}
.kv span:nth-child(odd){color:var(--text-3)}
.ol{font-size:var(--fs-mono)}
.ol .alr.on{background:var(--accent-bg);color:var(--accent)}
.vch{font-size:var(--fs-xs);color:var(--warn);background:var(--warn-bg);border-radius:var(--r-xs);padding:0 var(--sp-2);margin-top:var(--sp-1);display:inline-block}
/* 레일(접힘) */
.aside.rail{width:var(--w-rail)}
.aside.rail .ah b,.aside.rail .ascroll{display:none}
.aside.rail .ah{flex-direction:column;border:0;padding:var(--sp-6) 0 var(--sp-3)}
.arl{display:none;flex-direction:column;align-items:center;gap:var(--sp-2)}
.aside.rail .arl{display:flex}
.arl .ib{position:relative}
.arl .ib i{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--warn-line)}
.tip{position:fixed;z-index:var(--z-toast);background:var(--ink);color:var(--ink-text);font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-4);border-radius:var(--r-sm);pointer-events:none;display:none;white-space:nowrap}

/* 검토 화면 */
.review{max-width:980px;margin:0 auto;padding:var(--sp-9) var(--sp-8) 60px}
.review h1{font-size:var(--fs-xl);margin:0 0 var(--sp-3)}

    body: () => `<h1>게이트웨이운영설계서</h1>
<p class="lead">연계 게이트웨이를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한 문서다. 원격 작업이 불가해 설치 · 패치 · 장애 대응은 현장 방문으로 한다.</p>
<h2 id="s-목적"><span class="iv">목적</span>목적 · 전제</h2>
<p>연계 게이트웨이(<code>dpms_gateway</code>)를 상황실 제어망 PC 에 설치하고, 현장 값을 넣고, 운영 · 갱신 · 점검하는 방식을 정한다.</p>
${lv(`1. 원격 작업 불가

3. 폐쇄망(상황실 제어망)
- Java · 라이브러리를 현장에서 받지 않는다. 전용 JRE 를 패키지에 넣는다.`)}

${lv(`1. 준비
1) 설치 PC 에 PostgreSQL 이 설치 · 기동돼 있고 <code>127.0.0.1</code> 로만 받는다.
1.1) 판 · 설치 주체는 회신을 받아 정한다(${il('DPMS-ISS-03')}).
2) 패키지 zip 을 반입 절차대로 들여와 풀고, <code>checksums.txt</code> 로 파일을 확인한다.
3) 관리자 권한 PowerShell 을 연다.
2. 단계
1) 복사: 설치 폴더와 <code>config</code> · <code>data</code> · <code>logs</code> 를 만든다.
- 서비스가 돌고 있으면 멈춘다.
- 이미 jar 가 있으면 <code>prev\\dpms-gateway.jar</code> 로 남긴다.
2) 설정: <code>config\\application.yml</code> 을 매개변수로 만든다.
* 있으면 그대로 둔다(손으로 고친 값을 지키기 위해).
3) 비밀값: <code>jwt.key</code> 와 두 클라이언트 비밀값을 무작위로 만든다.
- 클라이언트 비밀값은 화면에 한 번만 나온다.
3. 서비스 내리기
1) <code>uninstall.ps1</code>: 서비스와 방화벽 규칙만 지운다.
2) 설치 폴더와 DB <code>dpms_gw</code> 는 남긴다.`)}
<div class="tblwrap"><table><tr><th>매개변수</th><th>기본값</th><th>뜻</th></tr>

<p><b>PLC 의 상태를 감시하고 데이터를 수집하며, 필요하면 PLC 에 명령을 전달하는 상위 시스템.</b></p>

    body: () => `<h1>PLC와 CIMON SCADA의 구조 및 데이터 흐름</h1>
<p class="lead">PLC, SCADA, CimonD, CimonX, SCADA_VIEWER 의 역할과 데이터가 흐르는 구조를 정리했다.</p>

const LV = [[/^(\d+\.\d+\.\d+\.)\s+/, 3], [/^(\d+\.\d+\.)\s+/, 2], [/^(\d+\.)\s+/, 1], [/^(\d+\.\d+\.\d+\))\s+/, 6], [/^(\d+\.\d+\))\s+/, 5], [/^(\d+\))\s+/, 4], [/^(-)\s+/, 7], [/^(\*)\s+/, 8]]
// 들이지 않는다 — 줄마다 맨 왼쪽 · 표시는 쓴 그대로(번호를 다시 매기지 않는다)
function lv(src) {
  return src.split('\n').map((line) => {
    for (const [re, n] of LV) {
      const m = line.match(re)
      if (m) return `<div class="lv l${n}"${n === 1 ? ` id="v-${esc(line.slice(m[0].length).replace(/<[^>]+>/g, ''))}"` : ''}><span class="m">${m[1]}</span><span class="x">${line.slice(m[0].length)}</span></div>`
    }
    return `<p>${line}</p>`
  }).join('')
}

function drawGraph(g) {

  return `<svg class="g" viewBox="0 0 ${W} ${H}" role="group" aria-label="한 겹 이웃">${pts.map((p) => `<line class="eg" x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}"/>`).join('')}

  ${pts.map((p) => `<g class="nd ${p.n[1]}" tabindex="0" role="button" data-open="${p.n[1]}" aria-label="${esc(p.n[0])} 열기"><circle cx="${p.x}" cy="${p.y}" r="7"/><text x="${p.x}" y="${p.y + 19}" text-anchor="middle">${esc(p.n[0])}</text></g>`).join('')}</svg>`
}

// ── 지금 보는 항목(스크롤 따라) ──
function spy() {
  const m = $('#main'), hs = [...m.querySelectorAll('.paper h2[id]')]
  if (!hs.length) return
  const top = m.getBoundingClientRect().top + 60
  let cur = hs[0]
  for (const h of hs) if (h.getBoundingClientRect().top <= top) cur = h
  if (m.scrollTop + m.clientHeight >= m.scrollHeight - 2) cur = hs[hs.length - 1] // 맨 아래면 마지막 항목
  const name = cur.id.slice(2)
  if (name !== nowSec && view === 'doc') { nowSec = name; drawAside() } // 개요 · 항목의 「지금」 · 속성의 지금 보는 항목이 따라 바뀐다
}
$('#main').addEventListener('scroll', spy)

// ── 누름 ──
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-open],[data-tab],.tn')
  if (!t) { if (gOpen && !e.target.closest('#gpop')) { gOpen = false; draw() } return }
  if (t.closest('.mk') && t.dataset.v) { view = t.dataset.v; gOpen = false; $('#main').scrollTop = 0; draw(); return }
  if (t.dataset.tab) { view = t.dataset.tab; gOpen = false; $('#main').scrollTop = 0; nowSec = '목적'; draw(); return }
  if (t.dataset.open) { const to = t.dataset.open; if (V[to]) { view = to; gOpen = false; $('#main').scrollTop = 0; nowSec = '목적'; closeDrawers(); draw() } return }
  if (t.dataset.w) { L.wide = t.dataset.w === '1'; save(); draw(); return }
  if (t.id === 'gbtn') { gOpen = !gOpen; draw(); if (gOpen) $('#gpop .nd:not(.me)')?.focus(); return }
  if (t.id === 'gclose') { gOpen = false; draw(); $('#gbtn').focus(); return }
  if (t.id === 'sideFold') { L.sideRail = !L.sideRail; save(); draw(); return }
  if (t.id === 'asideFold') { L.asideRail = !L.asideRail; save(); draw(); return }
  if (t.dataset.rail) { L.asideRail = false; L.open[view + ':' + t.dataset.rail] = true; save(); draw(); $(`#ascroll [data-g=${t.dataset.rail}]`)?.scrollIntoView({ block: 'nearest' }); return }
  if (t.classList.contains('gs')) { const g = t.parentElement.dataset.g, k = view + ':' + g; L.open[k] = !t.parentElement.classList.contains('open'); save(); t.parentElement.classList.toggle('open', L.open[k]); t.setAttribute('aria-expanded', L.open[k]); return }
  if (t.id === 'allFold') { for (const g of V[view].aside()) L.open[view + ':' + g.id] = false; save(); draw(); return }
  if (t.dataset.go) { const h = document.getElementById(t.dataset.go); h && h.scrollIntoView({ behavior: 'smooth', block: 'start' }); return }
  if (t.id === 'menuBtn') { $('#app').classList.add('side-open'); return }
  if (t.id === 'asideBtn') { $('#app').classList.add('aside-open'); return }
  if (t.id === 'asideClose') { closeDrawers(); return }
})
$('#scrim').addEventListener('click', closeDrawers)
function closeDrawers() { $('#app').classList.remove('side-open', 'aside-open') }
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (gOpen) { gOpen = false; draw(); $('#gbtn')?.focus() } closeDrawers() }
  if (e.ctrlKey && e.key === '[') { e.preventDefault(); L.sideRail = !L.sideRail; save(); draw() }
  if (e.ctrlKey && e.key === ']') { e.preventDefault(); L.asideRail = !L.asideRail; save(); draw() }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.nd[data-open]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })) }
})

function grip(el, which) {
  const lim = which === 'side' ? [200, 420, 248] : [260, 560, 300]
  const set = (w) => { L[which] = Math.round(Math.min(lim[1], Math.max(lim[0], w))); el.setAttribute('aria-valuenow', L[which]); (which === 'side' ? $('#side') : $('#aside')).style.setProperty(which === 'side' ? '--sw' : '--aw', L[which] + 'px'); showTip(el, L[which] + 'px') }
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag')
    const x0 = e.clientX, w0 = L[which]
    const mv = (ev) => set(which === 'side' ? w0 + (ev.clientX - x0) : w0 - (ev.clientX - x0))
    const up = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); save(); $('#gtip').style.display = 'none' }
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up)
  })
  el.addEventListener('dblclick', () => { set(lim[2]); save(); setTimeout(() => ($('#gtip').style.display = 'none'), 600) })
  el.addEventListener('keydown', (e) => {
    const s = e.shiftKey ? 40 : 10, dir = which === 'side' ? 1 : -1
    if (e.key === 'ArrowRight') { e.preventDefault(); set(L[which] + s * dir); save() }
    if (e.key === 'ArrowLeft') { e.preventDefault(); set(L[which] - s * dir); save() }
  })
  el.addEventListener('blur', () => ($('#gtip').style.display = 'none'))
}
function showTip(el, txt) { const r = el.getBoundingClientRect(), g = $('#gtip'); g.textContent = txt; g.style.display = 'block'; g.style.left = r.left + 10 + 'px'; g.style.top = r.top + 60 + 'px' }
grip($('#sideGrip'), 'side'); grip($('#asideGrip'), 'aside')

// 툴팁(레일 아이콘)
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]'), tip = $('#tip')
  if (!t || !(t.closest('.rail') || t.closest('.afold') || t.closest('.fold'))) { tip.style.display = 'none'; return }
  const r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.style.display = 'block'
  const left = t.closest('.aside') ? r.left - tip.offsetWidth - 8 : r.right + 8
  tip.style.left = Math.max(4, left) + 'px'; tip.style.top = r.top + 4 + 'px'
})

draw()
</script>
</body>
