<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>허브 퍼뜨림 3D 목업</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#ffffff;--surface-2:#f1f4f9;--border:#e2e8f0;--border-strong:#cbd5e1;
  --text:#0f172a;--text-2:#475569;--text-3:#64748b;--accent:#3358e6;--accent-bg:#eef2ff;
  --k-doc:#334155;--k-item:#3358e6;--k-rec:#c2410c;--edge:51,65,85;--ring:#ffffff;--label-halo:rgba(245,247,251,.92);
}
.dark{
  --bg:#0b1020;--surface:#121a2e;--surface-2:#18223a;--border:#253252;--border-strong:#3a4a72;
  --text:#e6ebf5;--text-2:#b2bdd3;--text-3:#8a97b3;--accent:#8aa4ff;--accent-bg:#1f2a4d;
  --k-doc:#cbd5e1;--k-item:#7c9cff;--k-rec:#fb923c;--edge:178,189,211;--ring:#0b1020;--label-halo:rgba(11,16,32,.9);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
body{background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:268px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
header h1{font-size:15px;margin:0}
header .sub{color:var(--text-3);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--text-2);padding:5px 11px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.met{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--text-2)}
.met b{color:var(--text);font-variant-numeric:tabular-nums}
.met .was{color:var(--text-3);text-decoration:line-through;margin-right:2px}
aside{border-right:1px solid var(--border);background:var(--surface);overflow:auto;padding:12px 14px 20px}
.gh{font-size:11px;color:var(--text-3);font-weight:600;margin:14px 0 6px}
.gh:first-child{margin-top:0}
input[type=search]{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:6px 9px;font:inherit}
label.ck{display:inline-flex;align-items:center;gap:5px;color:var(--text-2);cursor:pointer;margin:0 10px 4px 0}
.note{color:var(--text-3);font-size:12px;margin:2px 0 6px}
.hl{list-style:none;margin:0;padding:0}
.hl li{display:grid;grid-template-columns:16px 1fr auto;gap:2px 6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.hl li:hover{background:var(--surface-2)}
.hl li.on{background:var(--accent-bg)}
.hl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .ct{color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.hl .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--k-item);opacity:.5}
main{position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
canvas.pan{cursor:move}
.ov{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;box-shadow:0 4px 16px rgba(15,23,42,.08)}
.legend{left:12px;bottom:12px;font-size:12px;color:var(--text-2);display:grid;gap:3px}
.zoom{right:12px;bottom:12px;display:flex;gap:4px;padding:4px}
.zoom button{background:transparent;border:1px solid var(--border-strong);color:var(--text);border-radius:6px;min-width:30px;height:28px;cursor:pointer;font:inherit}
.zoom span{color:var(--text-3);font-size:11px;align-self:center;min-width:42px;text-align:center}
.card{right:12px;top:12px;width:310px;max-height:calc(100% - 80px);overflow:auto;display:none}
.card.on{display:block}
.card h3{margin:0;font-size:14px;padding-right:18px}
.card .k{font-size:11px;color:var(--text-3)}
.card .x{position:absolute;right:8px;top:5px;background:none;border:0;color:var(--text-3);font-size:17px;cursor:pointer}
.card table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.card td{padding:2px 0;color:var(--text-2)}
.card td:last-child{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chips button{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text-2);font:inherit;font-size:12px;padding:1px 7px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.trail{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-bottom:6px;font-size:11px;color:var(--text-3)}
.trail button{background:none;border:0;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:3px 8px;font-size:12px;display:none;white-space:nowrap;box-shadow:0 2px 8px rgba(15,23,42,.1)}
.hint{left:12px;top:12px;font-size:12px;color:var(--text-2)}
svg.gl{vertical-align:-2px;margin-right:3px}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>그래프 3D 전체</h1><span class="sub">허브 퍼뜨림 배치 · 목업</span>
    <div class="seg" id="kn"></div>
    <div class="seg" id="lay"><button data-v="now">지금 배치</button><button data-v="b1" class="on">제안: 퍼뜨림</button><button data-v="b3">제안: 더 퍼뜨림</button></div>
    <div class="met" id="met"></div>
  </header>
  <aside>
    <div class="gh">찾기</div>
    <input type="search" id="q" placeholder="이름 찾기 · Enter">
    <div class="gh">보기</div>
    <div><label class="ck"><input type="checkbox" id="oLine" checked>선</label><label class="ck"><input type="checkbox" id="oLab" checked>제목</label><label class="ck"><input type="checkbox" id="oRot" checked>회전</label></div>
    <div class="gh">선 보기</div>
    <div class="seg" id="lineMode"><button data-v="hub" class="on">허브 선만</button><button data-v="all">모두</button></div>
    <div class="gh">종류</div>
    <div id="kinds"></div>
    <div class="gh">바탕</div>
    <div class="seg" id="theme"><button data-v="light" class="on">밝게</button><button data-v="dark">어둡게</button></div>
    <div class="gh">중요한 지식 (연결 수 상위 20)</div>
    <p class="note">누르면 그 점으로 갑니다. 화면에서 큰 점, 이름이 보이는 점이 이 목록입니다.</p>
    <ul class="hl" id="hl"></ul>
  </aside>
  <main id="main">
    <canvas id="cv"></canvas>
    <div class="ov hint" id="hint">끌기: 돌리기 · Space + 끌기 또는 오른쪽 끌기: 옮기기 · 휠: 확대 · 점 누르기: 이웃 보기 · Esc: 닫기</div>
    <div class="ov legend" id="legend"></div>
    <div class="ov zoom"><button id="zo" title="축소">−</button><span id="zv">100%</span><button id="zi" title="확대">+</button><button id="zf" title="전체 맞춤">맞춤</button></div>
    <div class="ov card" id="card"></div>
    <div class="tip" id="tip"></div>
  </main>
</div>

  for (const i of order) {
    const x = SX[i], y = SY[i]
    if (x < -40 || y < -40 || x > W + 40 || y > H + 40) continue
    const r = rad(i) * zs(i) * Math.sqrt(S.zoom), on = shown(i), n = ns[i]
    c.beginPath(); glyph(c, n.k, x, y, r)
    const depth = Math.max(0.35, Math.min(1, 1.35 - (SZ[i] - CAMD + 300) / 900))
    c.globalAlpha = on ? depth : 0.07
    c.fillStyle = T['k-' + n.k]; c.fill()
    if (on && (i === sel || i === S.hover || (hubSet.has(i) && sel < 0))) { c.globalAlpha = 1; c.lineWidth = i === sel ? 2.5 : 1.2; c.strokeStyle = i === sel ? T.accent : T.ring; c.stroke() }
    c.globalAlpha = 1
  }
  // 이름: 상위 허브(가까운 것 먼저) · 고르면 고른 점과 이웃
  if (S.lab) {
    const taken = [], fits = (x, y, ww, hh) => { for (const t of taken) if (x < t[0] + t[2] && x + ww > t[0] && y < t[1] + t[3] && y + hh > t[1]) return false; taken.push([x, y, ww, hh]); return true }
    let cand
    if (sel >= 0) cand = [sel, ...[...selN].filter(visK).sort((a, b) => w[b] - w[a])]
    else cand = hubs.filter(visK).slice(0, Math.round(24 * Math.sqrt(S.zoom))).sort((a, b) => SZ[a] - SZ[b] || w[b] - w[a])
    c.textBaseline = 'middle'
    for (const i of cand.slice(0, 80)) {
      const x = SX[i], y = SY[i]; if (x < 0 || y < 0 || x > W || y > H) continue
      const big = i === sel || (sel < 0 && rank[i] <= 8)
      c.font = (big ? '600 13px' : '12px') + ' Pretendard,"Malgun Gothic",sans-serif'
      const t = ns[i].l.length > 20 ? ns[i].l.slice(0, 19) + '…' : ns[i].l, tw = c.measureText(t).width, r = rad(i) * zs(i) * Math.sqrt(S.zoom)
      if (!fits(x + r + 3, y - 8, tw + 4, 16)) continue
      c.lineWidth = 3.5; c.strokeStyle = T['label-halo']; c.strokeText(t, x + r + 4, y); c.fillStyle = big ? T.text : T['text-2']; c.fillText(t, x + r + 4, y)
    }
  }
  document.getElementById('zv').textContent = Math.round(S.zoom * 100) + '%'
}

function hit(mx, my) {
  let best = -1, bz = Infinity
  const sel = S.sel, selN = sel >= 0 ? new Set(nb[sel]) : null
  for (let i = 0; i < D.nodes.length; i++) {
    if (!visK(i) || (sel >= 0 && i !== sel && !selN.has(i))) continue
    const r = rad(i) * Math.max(0.45, Math.min(2.4, SF[i] / (FOC() / CAMD))) * Math.sqrt(S.zoom) + 3
    if (Math.abs(SX[i] - mx) < r && Math.abs(SY[i] - my) < r && SZ[i] < bz) { bz = SZ[i]; best = i }
  }
  return best
}

let pivA = null
function goTo(i, zoom) {
  const b = i >= 0 ? [pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]] : [0, 0, 0]
  pivA = { a: S.pivot.slice(), b, px: S.panX, py: S.panY, za: S.zoom, zb: zoom ?? S.zoom, t: performance.now() }
}
function select(i, how) {
  if (i < 0) { S.sel = -1; S.trail = []; goTo(-1, 1) }
  else {
    if (how === 'back') S.trail = S.trail.slice(0, S.trail.indexOf(i))
    else if (S.sel >= 0 && how !== 'jump') S.trail.push(S.sel)
    else if (how === 'jump') S.trail = []
    S.sel = i; goTo(i, Math.max(S.zoom, 1.6))
  }
  document.querySelectorAll('#hl li').forEach((li) => li.classList.toggle('on', +li.dataset.i === S.sel))
  card()
}
function card() {
  const el = document.getElementById('card'), i = S.sel
  if (i < 0) { el.classList.remove('on'); return }
  el.classList.add('on')
  const n = D.nodes[i], by = { doc: [], item: [], rec: [] }
  for (const j of nb[i]) by[D.nodes[j].k].push(j)
  for (const k in by) by[k].sort((a, b) => w[b] - w[a])
  const nbHubs = nb[i].filter((j) => hubSet.has(j)).length
  el.innerHTML = `<button class="x" data-act="close" title="닫기 (Esc)">×</button>
    ${S.trail.length ? `<div class="trail">지나온 점: ${S.trail.map((t) => `<button data-back="${t}">${esc(D.nodes[t].l)}</button>`).join(' › ')}</div>` : ''}
    <div class="k">${glyphSvg(n.k)}${KN[n.k]}${hubSet.has(i) ? ' · 허브' : ''}</div><h3>${esc(n.l)}</h3><div class="k">${esc(n.nm)}</div>
    <table><tr><td>연결 수</td><td>${nb[i].length}</td></tr><tr><td>중요도 순위</td><td>${rank[i]}위 / ${D.nodes.length}</td></tr><tr><td>이웃 중 허브</td><td>${nbHubs}</td></tr>${n.t ? `<tr><td>날짜</td><td>${n.t}</td></tr>` : ''}${n.doc ? `<tr><td>문서</td><td>${esc(n.doc)}</td></tr>` : ''}</table>
    ${['doc', 'item', 'rec'].filter((k) => by[k].length).map((k) => `<div class="k" style="margin-top:8px">${glyphSvg(k)}${KN[k]} ${by[k].length}</div><div class="chips">${by[k].slice(0, 16).map((j) => `<button data-n="${j}" title="${esc(D.nodes[j].nm)}">${esc(D.nodes[j].l)}</button>`).join('')}${by[k].length > 16 ? `<span class="k">외 ${by[k].length - 16}</span>` : ''}</div>`).join('')}`
}

// 조작
let drag = null, moved = false, space = false
cv.addEventListener('contextmenu', (e) => e.preventDefault())
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, pan: space || e.button === 2 || e.shiftKey, yaw: S.yaw, pitch: S.pitch, px: S.panX, py: S.panY }; moved = false; cv.setPointerCapture(e.pointerId); pivA = null })
cv.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, tip = document.getElementById('tip')
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y
    if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; cv.classList.add(drag.pan ? 'pan' : 'drag') }
    if (moved) { if (drag.pan) { S.panX = drag.px + dx; S.panY = drag.py + dy } else { S.yaw = drag.yaw + dx * 0.006; S.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + dy * 0.006)) } }
    tip.style.display = 'none'; return
  }
  const h = hit(mx, my); S.hover = h
  if (h >= 0) { const n = D.nodes[h]; tip.style.display = 'block'; tip.textContent = `${KN[n.k]} · ${n.l} · 연결 ${nb[h].length} · ${rank[h]}위`; tip.style.left = Math.min(mx + 14, W - 300) + 'px'; tip.style.top = my + 14 + 'px' } else tip.style.display = 'none'
})
cv.addEventListener('pointerup', (e) => {
  cv.classList.remove('drag', 'pan'); const was = drag; drag = null
  if (!was || moved) return
  const r = cv.getBoundingClientRect(), h = hit(e.clientX - r.left, e.clientY - r.top)
  if (h >= 0) { if (h !== S.sel) select(h) } else if (S.sel >= 0) select(-1)
})
cv.addEventListener('pointerleave', () => { document.getElementById('tip').style.display = 'none'; S.hover = -1 })
cv.addEventListener('wheel', (e) => {
  e.preventDefault(); pivA = null
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left - W / 2, my = e.clientY - r.top - H / 2
  const f = Math.exp(-e.deltaY * 0.0015), z = Math.min(12, Math.max(0.35, S.zoom * f)), k = z / S.zoom
  // 마우스 자리를 기준으로 확대
  S.panX = mx - (mx - S.panX) * k; S.panY = my - (my - S.panY) * k; S.zoom = z
}, { passive: false })
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) { space = true; cv.classList.add('pan'); e.preventDefault() }
  if (e.key === 'Escape') select(-1)
})
window.addEventListener('keyup', (e) => { if (e.code === 'Space') { space = false; cv.classList.remove('pan') } })
const zoomBy = (f) => { pivA = null; const z = Math.min(12, Math.max(0.35, S.zoom * f)); S.panX *= z / S.zoom; S.panY *= z / S.zoom; S.zoom = z }
document.getElementById('zi').onclick = () => zoomBy(1.35)
document.getElementById('zo').onclick = () => zoomBy(1 / 1.35)
document.getElementById('zf').onclick = () => { S.sel >= 0 ? select(-1) : goTo(-1, 1) }
document.getElementById('kn').onclick = (e) => { const b = e.target.closest('button'); if (b) load(b.dataset.v) }
document.getElementById('lay').onclick = (e) => { const b = e.target.closest('button'); if (b && b.dataset.v !== S.lay) setLay(b.dataset.v) }
document.getElementById('lineMode').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.lineMode = b.dataset.v; document.querySelectorAll('#lineMode button').forEach((x) => x.classList.toggle('on', x === b)) }
document.getElementById('theme').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.dark = b.dataset.v === 'dark'; document.getElementById('app').classList.toggle('dark', S.dark); document.body.style.background = S.dark ? '#0b1020' : ''; document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b)); tok() }
document.getElementById('oLine').onchange = (e) => (S.line = e.target.checked)
document.getElementById('oLab').onchange = (e) => (S.lab = e.target.checked)
document.getElementById('oRot').onchange = (e) => (S.rot = e.target.checked)
document.getElementById('kinds').onchange = (e) => { const k = e.target.dataset.k; if (k) S.kinds[k] = e.target.checked }
document.getElementById('hl').onclick = (e) => { const li = e.target.closest('li'); if (li) select(+li.dataset.i, 'jump') }
document.getElementById('card').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.act === 'close') select(-1); else if (b.dataset.n) select(+b.dataset.n); else if (b.dataset.back) select(+b.dataset.back, 'back') }
document.getElementById('q').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return
  const q = e.target.value.trim().toLowerCase(); if (!q) return
  const m = D.nodes.map((n, i) => i).filter((i) => (D.nodes[i].l + ' ' + D.nodes[i].nm).toLowerCase().includes(q)).sort((a, b) => w[b] - w[a])
  if (m.length) select(m[0], 'jump')
})
window.addEventListener('resize', resize)
tok(); resize(); load('DPMS'); requestAnimationFrame(frame)
setTimeout(() => { const h = document.getElementById('hint'); if (h) { h.style.transition = 'opacity .6s'; h.style.opacity = '0'; setTimeout(() => h.remove(), 700) } }, 10000)
</script>
</body>
</html>
